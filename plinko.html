<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Plinko — TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="shared.js"></script>
<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})()</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
:root{--bg:#0E0E0E;--card:rgba(18,18,18,.94);--border:rgba(255,255,255,0.11);--border2:rgba(255,255,255,0.16);--white:#F2F2F2;--text:#F2F2F2;--muted:#9B9B9B;--muted2:#9B9B9B;--gold:#FFC94D;--green:#4ADE80;--red:#FF6B7F;--fd:'Nunito',sans-serif;--fu:'Nunito',sans-serif;--fm:'Nunito',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:linear-gradient(175deg,#000000 0%,#050505 28%,#0A0A0A 55%,#0E0E0E 100%) fixed;color:var(--text);font-family:'Nunito',sans-serif;min-height:100%;overflow-x:hidden}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;background:rgba(14,14,14,0.97);box-shadow:0 2px 14px rgba(0,0,0,0.33);border-bottom:1px solid rgba(0,0,0,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.fp-back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.13);display:flex;align-items:center;justify-content:center;color:#F2F2F2;font-size:22px;cursor:pointer;font-weight:700}
.fp-title{font-size:16px;font-weight:900;color:#F2F2F2;letter-spacing:1px;text-transform:uppercase}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(14,14,14,0.97);border:2px solid #FFD028;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:800;color:#FFC94D}
.toast{position:fixed;top:80px;left:14px;right:14px;z-index:500;background:rgba(14,14,14,0.97);border:1.5px solid rgba(255,255,255,0.11);color:#F2F2F2;box-shadow:0 6px 24px rgba(0,0,0,0.45);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-80px);opacity:0;transition:transform .28s,opacity .28s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{color:#4ADE80;border-color:rgba(26,154,80,.30)}
.toast.err{color:#FF6B7F;border-color:rgba(208,40,64,.30)}
.toast.info{color:#7DB8FF;border-color:rgba(32,96,176,.22)}
.page{position:relative;z-index:1;padding:12px 14px 40px;max-width:520px;margin:0 auto}
#board-wrap{width:100%;border-radius:26px;overflow:hidden;border:3px solid rgba(255,255,255,.13);box-shadow:0 10px 30px rgba(0,0,0,0.54),inset 0 0 0 1px rgba(255,255,255,0.07);margin-bottom:14px;background:#1A1A1A;line-height:0}
#pc{display:block;margin:0 auto}
.setup-card{background:rgba(14,14,14,0.96);border:2px solid rgba(255,255,255,.13);border-radius:22px;box-shadow:0 5px 20px rgba(0,0,0,0.33);padding:14px;margin-bottom:12px}
.stag{font-size:11px;font-weight:800;color:#9B9B9B;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.bet-inp{background:rgba(14,14,14,0.92);border:1.5px solid rgba(255,255,255,0.14);border-radius:12px;padding:10px 14px;color:#F2F2F2;font-family:inherit;font-weight:800;font-size:18px;outline:none;text-align:center;width:100%;margin-bottom:10px}
.bet-inp:focus{border-color:rgba(40,100,220,.40)}
.qb-row{display:flex;gap:6px;flex-wrap:wrap}
.qb{padding:7px 12px;background:rgba(14,14,14,0.89);border:1.5px solid rgba(255,255,255,0.13);color:#F2F2F2;font-weight:700;font-size:11px;border-radius:10px;cursor:pointer}
.qb:active{background:rgba(255,255,255,0.11)}
.live-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.ls{background:rgba(14,14,14,0.92);border:1.5px solid rgba(255,255,255,0.11);border-radius:14px;padding:10px 8px;text-align:center}
.ls-l{color:#9B9B9B;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.ls-v{font-size:16px;font-weight:800;color:#F2F2F2}
.drop-btn{width:100%;padding:16px;background:linear-gradient(180deg,#5AAEF2 0%,#2F6FD6 100%);color:#fff;font-family:inherit;font-size:24px;font-weight:900;letter-spacing:1px;border-radius:18px;border:none;border-bottom:4px solid #1F4FA8;box-shadow:0 8px 20px rgba(40,80,200,.30);cursor:pointer;text-shadow:0 1px 0 rgba(0,0,60,.25);transition:transform .08s,border-bottom-width .08s}
.drop-btn:active{transform:translateY(3px);border-bottom-width:1px}
</style>
<script src="coin.js" defer></script>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="topbar">
  <button class="fp-back" onclick="location.href='main.html?tab=games'">‹</button>
  <div class="fp-title">PLINKO</div>
  <div class="bal-chip"><img src="../textures/coin.webp" width="20" height="20" alt="" style="vertical-align:middle;margin-right:2px"> <span id="r-bal">—</span></div>
</div>
<div class="page">
  <div id="board-wrap"><canvas id="pc"></canvas></div>
  <div class="setup-card">
    <div class="stag">// ставка за шар</div>
    <input class="bet-inp" id="bet-inp" type="number" value="20" min="1" inputmode="numeric"/>
    <div class="qb-row">
      <div class="qb" onclick="sb(10)">10</div><div class="qb" onclick="sb(25)">25</div>
      <div class="qb" onclick="sb(50)">50</div><div class="qb" onclick="sb(100)">100</div>
      <div class="qb" onclick="hb()">½</div><div class="qb" onclick="db()">×2</div>
    </div>
  </div>
  <div class="live-stats">
    <div class="ls"><div class="ls-l">Ставка</div><div class="ls-v" id="s-bet">—</div></div>
    <div class="ls"><div class="ls-l">Итог</div><div class="ls-v" id="s-win">—</div></div>
    <div class="ls"><div class="ls-l">Множитель</div><div class="ls-v" id="s-mult">—</div></div>
  </div>
  <button class="drop-btn" id="drop-btn" onclick="dropBalls()">БРОСИТЬ ШАР</button>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
const UID=tg?.initDataUnsafe?.user?.id||0;
TL_startBanPoll(UID);

/* ── Настройки ── 9 слотов, 8 рядов колышков. Слот k = число "вправо" среди 8 отскоков. */
let MULTS=[12,2.5,0.6,1.1,0.3,1.1,0.6,2.5,12];
const ROWS=8, NSLOTS=9, SEG=0.28;          // SEG — секунд на один отскок

async function loadMults(){
  try{
    const r=await fetch('/api/plinko_mults').then(r=>r.json());
    if(Array.isArray(r.mults)&&r.mults.length===NSLOTS)MULTS=r.mults.map(Number);
  }catch(e){}
}
function multColor(m){
  if(m>=5)return'#FFB300';
  if(m>=2)return'#00B8D9';
  if(m>=1.1)return'#7C6CFF';
  if(m>=1)return'#8890C8';
  return'#E0455A';
}

/* ── ВИРТУАЛЬНАЯ геометрия: доска всегда W×H "юнитов", окно влияет только на масштаб картинки ── */
const W=400, H=440;
const SP=W/NSLOTS, PEG_R=4.6, BALL_R=7.6, SLOT_H=40;
const TOP=34, BOT=H-SLOT_H-26;
function rowY(r){return TOP+r*((BOT-TOP)/(ROWS-1));}
function pegPos(r,i){return{x:W/2+(i-r/2)*SP,y:rowY(r)};}

let bal=0,animId=null,balls=[],lastT=0;
let slotFlash=new Array(NSLOTS).fill(0);
const pegFlash=Array.from({length:ROWS},(_,r)=>new Array(r+1).fill(0));
let parts=[],floats=[];
const canvas=document.getElementById('pc');
const ctx=canvas.getContext('2d');

function toast(m,t='info'){
  const el=document.getElementById('toast');
  el.textContent=m;el.className='toast '+t+' show';
  setTimeout(()=>el.classList.remove('show'),2800);
}
async function loadUser(){
  if(!UID)return;
  const u=await fetch('/api/user/'+UID).then(r=>r.json()).catch(()=>null);
  if(!u)return;
  if(TL_guardBanned(u))return;
  bal=u.balance??0;
  document.getElementById('r-bal').textContent=bal;
}
function sb(v){document.getElementById('bet-inp').value=v;}
function hb(){const v=+document.getElementById('bet-inp').value||0;document.getElementById('bet-inp').value=Math.max(1,Math.floor(v/2));}
function db(){const v=+document.getElementById('bet-inp').value||0;document.getElementById('bet-inp').value=v*2;}

/* Меняется только масштаб картинки. Физика/траектории/результат от размера окна не зависят. */
function resizeCanvas(){
  const w=Math.min(canvas.parentElement.offsetWidth||320,460);
  const cssH=Math.round(w*H/W);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(cssH*dpr);
  canvas.style.width=w+'px';canvas.style.height=cssH+'px';
  ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
}

function drawBoard(){
  ctx.clearRect(0,0,W,H);
  // фон
  const bgG=ctx.createLinearGradient(0,0,0,H);
  bgG.addColorStop(0,'#0F0F12');bgG.addColorStop(.6,'#0A0A0C');bgG.addColorStop(1,'#050506');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
  const glow=ctx.createRadialGradient(W/2,H*.35,10,W/2,H*.35,W*.7);
  glow.addColorStop(0,'rgba(255,255,255,.07)');glow.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  // мягкая "воронка" за колышками
  ctx.save();ctx.beginPath();
  ctx.moveTo(W/2-10,6);ctx.lineTo(W/2+10,6);
  ctx.lineTo(W/2+(ROWS/2)*SP+SP*.5,BOT+8);ctx.lineTo(W/2-(ROWS/2)*SP-SP*.5,BOT+8);ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,.035)';ctx.fill();ctx.restore();

  // колышки
  for(let r=0;r<ROWS;r++)for(let i=0;i<=r;i++){
    const p=pegPos(r,i),f=pegFlash[r][i];
    if(f>0){
      ctx.beginPath();ctx.arc(p.x,p.y,PEG_R+f*9,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,190,40,${f*.55})`;ctx.lineWidth=2;ctx.stroke();
    }
    ctx.save();ctx.shadowColor='rgba(150,90,0,.40)';ctx.shadowBlur=5;ctx.shadowOffsetY=2;
    const R=PEG_R*(1+f*.25);
    const g=ctx.createRadialGradient(p.x-R*.25,p.y-R*.25,0,p.x,p.y,R);
    g.addColorStop(0,'#FFF8B0');g.addColorStop(.4,'#FFD428');g.addColorStop(.8,'#E0A000');g.addColorStop(1,'#B07800');
    ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.restore();
    ctx.beginPath();ctx.arc(p.x-R*.28,p.y-R*.30,R*.3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,230,.8)';ctx.fill();
  }

  // слоты
  const sy=H-SLOT_H;
  for(let i=0;i<NSLOTS;i++){
    const sx=i*SP,m=MULTS[i],col=multColor(m),fl=slotFlash[i]||0;
    const dy=fl*4;
    ctx.save();
    ctx.shadowColor=col;ctx.shadowBlur=fl>0?22*fl:6;ctx.shadowOffsetY=fl>0?0:3;
    const sg=ctx.createLinearGradient(0,sy,0,sy+SLOT_H);
    sg.addColorStop(0,col);sg.addColorStop(1,col+'B8');
    ctx.fillStyle=sg;
    ctx.beginPath();ctx.roundRect(sx+3,sy+4+dy,SP-6,SLOT_H-8,9);ctx.fill();
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.30)';
    ctx.beginPath();ctx.roundRect(sx+5,sy+6+dy,SP-10,(SLOT_H-8)*.36,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,40,.35)';ctx.shadowBlur=3;
    ctx.font="900 14px 'Nunito',sans-serif";
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(m+'x',sx+SP/2,sy+SLOT_H/2+dy);
    ctx.shadowBlur=0;
  }
  ctx.textAlign='start';

  // шары
  for(const b of balls){
    for(let i=0;i<b.trail.length;i++){
      const f=(i+1)/b.trail.length;
      ctx.beginPath();ctx.arc(b.trail[i].x,b.trail[i].y,BALL_R*f*.7,0,Math.PI*2);
      ctx.fillStyle=`rgba(100,70,230,${f*.20})`;ctx.fill();
    }
    ctx.save();ctx.shadowColor='rgba(80,50,220,.6)';ctx.shadowBlur=14;ctx.shadowOffsetY=3;
    const bg=ctx.createRadialGradient(b.x-BALL_R*.3,b.y-BALL_R*.3,BALL_R*.1,b.x,b.y,BALL_R);
    bg.addColorStop(0,'#D6F2FF');bg.addColorStop(.35,'#7A6AF0');bg.addColorStop(.75,'#4533CF');bg.addColorStop(1,'#1E10A0');
    ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
    ctx.beginPath();ctx.arc(b.x-BALL_R*.28,b.y-BALL_R*.32,BALL_R*.3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.6)';ctx.fill();
    ctx.restore();
  }

  // частицы и всплывающий текст
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.life*1.6);
    ctx.font="900 17px 'Nunito',sans-serif";ctx.textAlign='center';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.9)';ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.col;ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='start';
}

/* Косметический рандом (дрожание траектории). Результат броска приходит ТОЛЬКО с сервера. */
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}

function buildWaypoints(dirs){
  const off=PEG_R+BALL_R*.55,pts=[{x:W/2+(rnd()-.5)*6,y:-BALL_R,peg:null}];
  let k=0;
  for(let r=0;r<ROWS;r++){
    const p=pegPos(r,k);
    pts.push({x:p.x+(rnd()-.5)*PEG_R*.9,y:p.y-off,peg:[r,k]});
    k+=dirs[r];
  }
  pts.push({x:(k+.5)*SP+(rnd()-.5)*SP*.25,y:H-SLOT_H-BALL_R,peg:null});
  return pts;
}

function createBall(r){
  // r — ответ сервера: path (8 бросков 0/1), slot, mult, payout, profit
  const wp=buildWaypoints(r.path);
  return{x:wp[0].x,y:wp[0].y,wp,seg:0,t:0,trail:[],done:false,slot:r.slot,res:r,_bet:r.payout-r.profit,_landTime:0};
}

function burst(x,y,col){
  for(let i=0;i<18;i++){
    const a=-Math.PI*(.1+.8*rnd()),v=60+rnd()*140;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1.6+rnd()*2.4,life:1,col});
  }
}

function stepBall(b,dt){
  if(b.done)return;
  b.t+=dt/SEG;
  while(b.t>=1&&!b.done){
    b.t-=1;b.seg++;
    const hit=b.wp[b.seg];
    if(b.seg>=b.wp.length-1){
      b.x=hit.x;b.y=hit.y;b.done=true;b._landTime=performance.now();
      slotFlash[b.slot]=1;
      burst(hit.x,H-SLOT_H,multColor(MULTS[b.slot]));
      const m=MULTS[b.slot],pr=Math.round(b._bet*m)-b._bet;
      floats.push({x:hit.x,y:H-SLOT_H-18,text:m+'x',col:multColor(m),life:1});
      resolveBall(b);return;
    }
    if(hit.peg)pegFlash[hit.peg[0]][hit.peg[1]]=1;
  }
  const a=b.wp[b.seg],c=b.wp[b.seg+1],t=b.t;
  // горизонталь — равномерно (как у снаряда), вертикаль — дуга: подскок от колышка и падение на следующий
  const dy=c.y-a.y;
  const hop=b.seg===0?0:Math.min(18,Math.abs(dy)*.55);
  b.x=a.x+(c.x-a.x)*t;
  b.y=b.seg===0?a.y+dy*t*t:a.y+dy*t*t-hop*4*t*(1-t)*(1-t*.3);
  b.trail.push({x:b.x,y:b.y});
  if(b.trail.length>10)b.trail.shift();
}

function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;
  for(const b of balls)stepBall(b,dt);
  for(let i=0;i<NSLOTS;i++)if(slotFlash[i]>0)slotFlash[i]=Math.max(0,slotFlash[i]-dt*2.7);
  for(const r of pegFlash)for(let i=0;i<r.length;i++)if(r[i]>0)r[i]=Math.max(0,r[i]-dt*4);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt*1.4;}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.y-=26*dt;f.life-=dt*.9;}
  floats=floats.filter(f=>f.life>0);
  const n=performance.now();
  balls=balls.filter(b=>!b.done||n-b._landTime<900);
  drawBoard();
  if(balls.length||parts.length||floats.length)animId=requestAnimationFrame(loop);else animId=null;
}

function resolveBall(b){
  const r=b.res, mult=r.mult, profit=r.profit;
  document.getElementById('s-mult').textContent=mult.toFixed(2)+'x';
  document.getElementById('s-win').textContent=(profit>=0?'+':'')+profit;
  document.getElementById('s-win').style.color=profit>=0?'var(--green)':'var(--red)';
  bal+=r.payout;                                   // ставка списана при броске, выплату показываем при приземлении
  document.getElementById('r-bal').textContent=bal;
  toast(mult.toFixed(2)+'x  '+(profit>=0?'+':'')+profit+' \u{1FA99}',profit>=0?'ok':'err');
}

let _dropBusy=0;
async function dropBalls(){
  const bet=Math.floor(+document.getElementById('bet-inp').value||0);
  if(bet<1){toast('Введите ставку','err');return;}
  if(bet>bal){toast('Недостаточно монет','err');return;}
  if(_dropBusy>=5){return;}
  bal-=bet; _dropBusy++;
  document.getElementById('r-bal').textContent=bal;
  document.getElementById('s-bet').textContent=bet;
  const r=await fetch('/api/plinko/drop',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({bet})}).then(x=>x.json()).catch(()=>null);
  _dropBusy--;
  if(!r||r.error||!Array.isArray(r.path)){
    bal+=bet; document.getElementById('r-bal').textContent=bal;
    toast(r?.error||'Ошибка сервера','err'); return;
  }
  balls.push(createBall(r));
  if(!animId){lastT=performance.now();animId=requestAnimationFrame(loop);}
}

window.addEventListener('load',()=>{
  requestAnimationFrame(()=>requestAnimationFrame(async()=>{
    await loadMults();
    resizeCanvas();
    drawBoard();
    loadUser();
  }));
});
// ресайз безопасен и во время игры: геометрия виртуальная, меняется только масштаб
window.addEventListener('resize',()=>{resizeCanvas();if(!animId)drawBoard();});
</script>
</body>
</html>
