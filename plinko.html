<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Plinko — TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="shared.js"></script>
<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})()</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
:root{--bg:#C0E4F8;--card:rgba(255,255,255,.90);--border:rgba(20,40,90,.10);--border2:rgba(20,40,90,.16);--white:#1A2040;--text:#1A2040;--muted:#7A8AAA;--muted2:#9AABCC;--gold:#B88000;--green:#1A9A50;--red:#D02840;--fd:'Nunito',sans-serif;--fu:'Nunito',sans-serif;--fm:'Nunito',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:linear-gradient(175deg,#60B2DC 0%,#80C4E8 28%,#9FD2F0 55%,#C0E4F8 100%) fixed;color:var(--text);font-family:'Nunito',sans-serif;min-height:100%;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:url('../textures/sky.svg');background-size:100% auto;background-position:top center;background-repeat:no-repeat;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);box-shadow:0 2px 14px rgba(0,30,80,.11);border-bottom:1px solid rgba(0,0,0,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.fp-back{width:38px;height:38px;border-radius:12px;background:rgba(20,40,90,.06);border:1.5px solid rgba(20,40,90,.12);display:flex;align-items:center;justify-content:center;color:#1A2040;font-size:22px;cursor:pointer;font-weight:700;}
.fp-title{font-size:16px;font-weight:900;color:#1A2040;letter-spacing:1px;text-transform:uppercase;}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.96);border:2px solid #FFD028;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:800;color:#A07800;}
.toast{position:fixed;top:80px;left:14px;right:14px;z-index:500;background:rgba(255,255,255,.97);border:1.5px solid rgba(20,40,90,.10);color:#1A2040;box-shadow:0 6px 24px rgba(0,30,80,.15);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-80px);opacity:0;transition:transform .28s,opacity .28s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{color:#1A9A50;border-color:rgba(26,154,80,.30);}
.toast.err{color:#D02840;border-color:rgba(208,40,64,.30);}
.toast.info{color:#2060B0;border-color:rgba(32,96,176,.22);}
.page{position:relative;z-index:1;padding:12px 14px 40px;max-width:520px;margin:0 auto;}
#board-wrap{width:100%;border-radius:22px;overflow:hidden;border:2px solid rgba(255,255,255,.8);box-shadow:0 5px 20px rgba(0,30,80,.11);margin-bottom:14px;background:#E8F4FF;}
#pc{display:block;margin:0 auto;}
.setup-card{background:rgba(255,255,255,.92);border:2px solid rgba(255,255,255,.8);border-radius:22px;box-shadow:0 5px 20px rgba(0,30,80,.11);padding:14px;margin-bottom:12px;}
.stag{font-size:11px;font-weight:800;color:#7A8AAA;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
.bet-inp{background:rgba(255,255,255,.88);border:1.5px solid rgba(20,40,90,.13);border-radius:12px;padding:10px 14px;color:#1A2040;font-family:inherit;font-weight:800;font-size:18px;outline:none;text-align:center;width:100%;margin-bottom:10px;}
.bet-inp:focus{border-color:rgba(40,100,220,.40);}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;}
.qb{padding:7px 12px;background:rgba(255,255,255,.85);border:1.5px solid rgba(20,40,90,.12);color:#1A2040;font-weight:700;font-size:11px;border-radius:10px;cursor:pointer;}
.qb:active{background:rgba(20,40,90,.1);}
.live-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.ls{background:rgba(255,255,255,.88);border:1.5px solid rgba(20,40,90,.10);border-radius:14px;padding:10px 8px;text-align:center;}
.ls-l{color:#7A8AAA;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.ls-v{font-size:16px;font-weight:800;color:#1A2040;}
.drop-btn{width:100%;padding:16px;background:linear-gradient(135deg,#4898E0 0%,#2060C0 100%);color:#fff;font-family:inherit;font-size:26px;font-weight:700;border-radius:18px;border:none;box-shadow:0 5px 18px rgba(40,80,200,.30);cursor:pointer;}
.drop-btn:active{transform:scale(.97);}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="topbar">
  <button class="fp-back" onclick="location.href='main.html?tab=games'">‹</button>
  <div class="fp-title">PLINKO</div>
  <div class="bal-chip"><img src="../textures/coin.svg" width="20" height="20" alt="" style="vertical-align:middle;margin-right:2px"> <span id="r-bal">—</span></div>
</div>
<div class="page">
  <div id="board-wrap"><canvas id="pc"></canvas></div>
  <div class="setup-card">
    <div class="stag">// ставка за шар</div>
    <input class="bet-inp" id="bet-inp" type="number" value="20" min="1" inputmode="numeric"/>
    <div class="qb-row">
      <div class="qb" onclick="sb(10)">10</div><div class="qb" onclick="sb(25)">25</div>
      <div class="qb" onclick="sb(50)">50</div><div class="qb" onclick="sb(100)">100</div>
      <div class="qb" onclick="hb()">½</div><div class="qb" onclick="db()">×2</div>
    </div>
  </div>
  <div class="live-stats">
    <div class="ls"><div class="ls-l">Ставка</div><div class="ls-v" id="s-bet">—</div></div>
    <div class="ls"><div class="ls-l">Итог</div><div class="ls-v" id="s-win">—</div></div>
    <div class="ls"><div class="ls-l">Множитель</div><div class="ls-v" id="s-mult">—</div></div>
  </div>
  <button class="drop-btn" id="drop-btn" onclick="dropBalls()">БРОСИТЬ ШАР</button>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
const UID=tg?.initDataUnsafe?.user?.id||0;
TL_startBanPoll(UID);

/* ── Настройки ── 9 слотов, 8 рядов колышков.
   Слот k = число "вправо" среди 8 отскоков (0..8). */
let MULTS=[5,2,1.1,1,0.5,1,1.1,2,5];
const ROWS=8, NSLOTS=9, SEG=0.30;      // SEG — секунд на один отскок (не зависит от FPS)
const BINOM=[1,8,28,56,70,56,28,8,1];
async function loadMults(){
  try{
    const r=await fetch('/api/plinko_mults').then(r=>r.json());
    // сервер сейчас хранит 15 слотов — их игнорируем; принимаем только 9
    if(Array.isArray(r.mults)&&r.mults.length===NSLOTS)MULTS=r.mults.map(Number);
  }catch(e){}
}
function multColor(m){
  if(m>=5)return'#FFB300';
  if(m>=2)return'#00B8D9';
  if(m>=1.1)return'#7C6CFF';
  if(m>=1)return'#8890C8';
  return'#E0455A';
}

let bal=0,userLuck=50,animId=null,balls=[],lastT=0;
let slotFlash=new Array(NSLOTS).fill(0);
const canvas=document.getElementById('pc');
const ctx=canvas.getContext('2d');
let cW=0,cH=0,slotH=34,pegR=4,ballR=6,sp=40;

function toast(m,t='info'){
  const el=document.getElementById('toast');
  el.textContent=m;el.className='toast '+t+' show';
  setTimeout(()=>el.classList.remove('show'),2800);
}
async function loadUser(){
  if(!UID)return;
  const u=await fetch('/api/user/'+UID).then(r=>r.json()).catch(()=>null);
  if(!u)return;
  if(TL_guardBanned(u))return;
  bal=u.balance??0;
  userLuck=u.luck??50;
  document.getElementById('r-bal').textContent=bal;
}
function sb(v){document.getElementById('bet-inp').value=v;}
function hb(){const v=+document.getElementById('bet-inp').value||0;document.getElementById('bet-inp').value=Math.max(1,Math.floor(v/2));}
function db(){const v=+document.getElementById('bet-inp').value||0;document.getElementById('bet-inp').value=v*2;}

/* Одинаковая геометрия на всех устройствах: ширина ограничена, всё считается от неё */
function resizeCanvas(){
  const w=canvas.parentElement.offsetWidth||320;
  cW=Math.min(w,460);
  cH=Math.round(cW*1.0);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=cW*dpr;canvas.height=cH*dpr;
  canvas.style.width=cW+'px';canvas.style.height=cH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  sp=cW/NSLOTS;
  pegR=Math.max(3.5,sp*.12);
  ballR=Math.max(5,sp*.19);
  slotH=Math.max(28,cH*.09);
}
function rowY(r){const top=cH*.07,bot=cH-slotH-cH*.06;return top+r*((bot-top)/(ROWS-1));}
function pegPos(r,i){return{x:cW/2+(i-r/2)*sp,y:rowY(r)};}

function drawBoard(){
  if(!cW||!cH)return;
  ctx.clearRect(0,0,cW,cH);
  const bgG=ctx.createLinearGradient(0,0,0,cH);
  bgG.addColorStop(0,'#E8F4FF');bgG.addColorStop(1,'#C8E8FF');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,cW,cH);
  for(let r=0;r<ROWS;r++)for(let i=0;i<=r;i++){
    const p=pegPos(r,i);
    ctx.save();ctx.shadowColor='rgba(160,100,0,.45)';ctx.shadowBlur=4;ctx.shadowOffsetY=2;
    const g=ctx.createRadialGradient(p.x-pegR*.25,p.y-pegR*.25,0,p.x,p.y,pegR);
    g.addColorStop(0,'#FFF5A0');g.addColorStop(.35,'#FFD428');g.addColorStop(.75,'#E0A000');g.addColorStop(1,'#B07800');
    ctx.beginPath();ctx.arc(p.x,p.y,pegR,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.restore();
    ctx.beginPath();ctx.arc(p.x-pegR*.28,p.y-pegR*.30,pegR*.32,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,220,.75)';ctx.fill();
  }
  const sy=cH-slotH;
  for(let i=0;i<NSLOTS;i++){
    const sx=i*sp,m=MULTS[i],col=multColor(m),fl=slotFlash[i]||0;
    ctx.save();
    if(fl>0){ctx.shadowColor=col;ctx.shadowBlur=20*fl;}
    ctx.fillStyle=fl>0?col:col+'EE';
    ctx.beginPath();ctx.roundRect(sx+2,sy+3,sp-4,slotH-6,6);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.28)';
    ctx.beginPath();ctx.roundRect(sx+2,sy+3,sp-4,(slotH-6)*.38,6);ctx.fill();
    ctx.restore();
    ctx.fillStyle=fl>0?'#000':'#fff';
    ctx.font=`bold ${sp>34?13:11}px 'Nunito',sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(m+'x',sx+sp/2,sy+slotH/2);
  }
  ctx.textAlign='start';
  for(const b of balls){
    for(let i=0;i<b.trail.length;i++){
      const f=i/b.trail.length;
      ctx.beginPath();ctx.arc(b.trail[i].x,b.trail[i].y,Math.max(.5,ballR*f*.5),0,Math.PI*2);
      ctx.fillStyle=`rgba(100,60,220,${f*.22})`;ctx.fill();
    }
    ctx.save();ctx.shadowColor='rgba(80,50,220,.55)';ctx.shadowBlur=10;ctx.shadowOffsetY=3;
    const bg=ctx.createRadialGradient(b.x-ballR*.3,b.y-ballR*.3,ballR*.1,b.x,b.y,ballR);
    bg.addColorStop(0,'#C8EEFF');bg.addColorStop(.35,'#7060E8');bg.addColorStop(.75,'#4030C8');bg.addColorStop(1,'#1E10A0');
    ctx.beginPath();ctx.arc(b.x,b.y,ballR,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
    ctx.beginPath();ctx.arc(b.x-ballR*.28,b.y-ballR*.30,ballR*.30,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();
    ctx.restore();
  }
}

/* ── Честный RNG ── */
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}

/* Итоговый слот выбирается ДО анимации по вероятностям (биномиальное распределение
   + смещение от удачи). Анимация лишь показывает результат — от устройства не зависит.
   luck=50 — обычная игра (RTP ≈ 98%); >50 — больше шанс на края; <50 — на центр;
   luck>=100 — гарантированно крайний слот (5x или 2x). */
function pickSlot(luck){
  if(luck>=100){const e=[0,1,7,8];return e[Math.floor(rnd()*e.length)];}
  const tilt=Math.max(-1,Math.min(1,(luck-50)/50))*0.6;
  const w=BINOM.map((c,k)=>c*Math.exp(tilt*Math.abs(k-4)));
  let s=w.reduce((a,b)=>a+b,0)*rnd();
  for(let k=0;k<NSLOTS;k++){s-=w[k];if(s<=0)return k;}
  return 4;
}
/* Случайный путь из 8 отскоков, в сумме дающий нужный слот */
function makePath(slot){
  const d=[];for(let i=0;i<ROWS;i++)d.push(i<slot?1:0);
  for(let i=d.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
  return d;
}
/* Ключевые точки траектории (центр шара) */
function buildWaypoints(dirs){
  const off=pegR+ballR*.55,pts=[{x:cW/2,y:-ballR}];
  let k=0;
  for(let r=0;r<ROWS;r++){
    const p=pegPos(r,k);pts.push({x:p.x,y:p.y-off});
    k+=dirs[r];
  }
  pts.push({x:(k+.5)*sp,y:cH-slotH-ballR});
  return pts;
}

function createBall(bet){
  const slot=pickSlot(userLuck);
  const wp=buildWaypoints(makePath(slot));
  return{x:wp[0].x,y:wp[0].y,wp,seg:0,t:0,trail:[],done:false,slot,_bet:bet,_landTime:0};
}

function stepBall(b,dt){
  if(b.done)return;
  b.t+=dt/SEG;
  while(b.t>=1&&!b.done){
    b.t-=1;b.seg++;
    if(b.seg>=b.wp.length-1){
      const e=b.wp[b.wp.length-1];b.x=e.x;b.y=e.y;b.done=true;b._landTime=performance.now();
      slotFlash[b.slot]=1;resolveBall(b);return;
    }
  }
  const a=b.wp[b.seg],c=b.wp[b.seg+1],t=b.t;
  const ease=t*t*(3-2*t);
  const hop=(b.seg===0?0:(c.y-a.y)*.22)*4*t*(1-t);
  b.x=a.x+(c.x-a.x)*(b.seg===0?t:ease);
  b.y=a.y+(c.y-a.y)*t*t-hop;
  b.trail.push({x:b.x,y:b.y});
  if(b.trail.length>9)b.trail.shift();
}

function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;   // время, а не кадры
  for(const b of balls)stepBall(b,dt);
  for(let i=0;i<NSLOTS;i++)if(slotFlash[i]>0)slotFlash[i]=Math.max(0,slotFlash[i]-dt*2.7);
  const n=performance.now();
  balls=balls.filter(b=>!b.done||n-b._landTime<1400);
  drawBoard();
  if(balls.length>0)animId=requestAnimationFrame(loop);else animId=null;
}

async function resolveBall(b){
  const mult=MULTS[b.slot];
  const profit=Math.round(b._bet*mult)-b._bet;
  document.getElementById('s-mult').textContent=mult.toFixed(2)+'x';
  document.getElementById('s-win').textContent=(profit>=0?'+':'')+profit;
  document.getElementById('s-win').style.color=profit>=0?'var(--green)':'var(--red)';
  const res=await fetch('/api/game/play',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user_id:UID,game:'Plinko',bet:b._bet,won:mult>=1.0,multiplier:mult,
      detail:'Plinko x'+mult.toFixed(2)+' ('+(profit>=0?'+':'')+profit+')'})
  }).then(r=>r.json()).catch(()=>null);
  if(res?.new_balance!=null){bal=res.new_balance;document.getElementById('r-bal').textContent=bal;}
  const coin='\u{1FA99}';
  toast(mult.toFixed(2)+'x  '+(profit>=0?'+':'')+profit+' '+coin,profit>=0?'ok':'err');
}

async function dropBalls(){
  const bet=Math.floor(+document.getElementById('bet-inp').value||0);
  if(bet<1){toast('Введите ставку','err');return;}
  if(bet>bal){toast('Недостаточно монет','err');return;}
  bal-=bet;
  document.getElementById('r-bal').textContent=bal;
  document.getElementById('s-bet').textContent=bet;
  balls.push(createBall(bet));
  if(!animId){lastT=performance.now();animId=requestAnimationFrame(loop);}
}

window.addEventListener('load',()=>{
  requestAnimationFrame(()=>requestAnimationFrame(async()=>{
    await loadMults();
    resizeCanvas();
    drawBoard();
    loadUser();
  }));
});
window.addEventListener('resize',()=>{if(!animId){resizeCanvas();drawBoard();}});
</script>
</body>
</html>
