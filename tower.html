<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Башня — TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})()</script>
<script>(function(){const tg=window.Telegram?.WebApp;if(!tg?.initDataUnsafe?.user?.id)window.location.replace('not_telegram.html');})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#90C8E8;--bg2:#F4F8FF;--bg3:#EAF2FF;
  --text:#1A2040;--muted:#8090B0;--muted2:#A0AABC;
  --card:rgba(255,255,255,0.88);--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.14);
  --green:#1A9A50;--red:#D8284A;--gold:#A87800;
  --white:#1A2040;--font-display:'Caveat',cursive;
  --fd:'Caveat',cursive;--fu:'Nunito',sans-serif;--fm:'Nunito',sans-serif;
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  background:linear-gradient(175deg,#60B2DC 0%,#80C4E8 28%,#9FD2F0 55%,#C0E4F8 100%) fixed;
  color:var(--text);font-family:var(--fu);min-height:100%;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url('../textures/sky.svg');
  background-size:100% auto;background-position:top center;background-repeat:no-repeat;
}
/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));
  background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,0.07);box-shadow:0 2px 12px rgba(0,30,70,0.10);
}
.fp-back{
  width:38px;height:38px;border-radius:12px;
  background:rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.10);
  display:flex;align-items:center;justify-content:center;
  color:var(--text);font-size:22px;cursor:pointer;font-weight:700;
}
.fp-title{font-family:'Caveat',cursive;font-size:22px;font-weight:700;color:var(--text);letter-spacing:0;}
.bal-chip{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.95);border:2px solid #FFD028;
  border-radius:14px;padding:7px 12px;
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#A87800;
}
/* ── TOAST ── */
.toast{
  position:fixed;top:80px;left:14px;right:14px;z-index:500;
  background:rgba(255,255,255,0.97);border:1.5px solid rgba(0,0,0,0.09);
  backdrop-filter:blur(20px);border-radius:16px;padding:12px 18px;
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;text-align:center;
  transform:translateY(-80px);opacity:0;
  transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;pointer-events:none;
  box-shadow:0 6px 24px rgba(0,30,70,0.14);color:var(--text);
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{color:#1A9A50;border-color:rgba(26,154,80,.3);}
.toast.err{color:#D8284A;border-color:rgba(216,40,74,.3);}
.toast.info{color:#1068A0;border-color:rgba(16,104,160,.2);}
/* ── PAGE ── */
.page{position:relative;z-index:1;padding-bottom:30px;}
/* ── SETUP CARD ── */
.setup-card{
  margin:14px;background:rgba(255,255,255,0.90);
  border:2px solid rgba(255,255,255,0.75);border-radius:22px;
  padding:18px 16px;box-shadow:0 5px 18px rgba(0,30,70,0.10);
}
.stag{
  font-family:'Caveat',cursive;font-size:20px;font-weight:700;
  color:var(--muted);margin-bottom:10px;letter-spacing:0;
}
.bet-inp{
  width:100%;background:rgba(255,255,255,0.88);
  border:1.5px solid rgba(0,0,0,0.12);border-radius:14px;
  padding:12px 14px;color:var(--text);
  font-family:'Nunito',sans-serif;font-size:20px;font-weight:800;
  outline:none;text-align:center;margin-bottom:10px;
}
.bet-inp:focus{border-color:rgba(60,90,200,0.40);}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.qb{
  background:rgba(255,255,255,0.82);border:1.5px solid rgba(0,0,0,0.10);
  border-radius:10px;padding:7px 13px;color:var(--text);
  font-size:12px;font-weight:800;cursor:pointer;
  font-family:'Nunito',sans-serif;transition:all .12s;
}
.qb:active{background:rgba(0,0,0,0.08);}
.start-btn{
  width:100%;padding:16px;background:#1A2040;border:none;border-radius:16px;
  color:#fff;font-family:'Caveat',cursive;font-size:24px;font-weight:700;
  cursor:pointer;box-shadow:0 4px 18px rgba(20,30,80,.28);letter-spacing:0;
}
.start-btn:active{opacity:.85;}
/* ── TOWER GRID ── */
.tower-card{
  margin:14px;background:rgba(255,255,255,0.90);
  border:2px solid rgba(255,255,255,0.75);border-radius:22px;
  padding:16px;box-shadow:0 5px 18px rgba(0,30,70,0.10);display:none;
}
.tower-card.active{display:block;}
.tinfo{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.tinfo-left{font-family:'Nunito',sans-serif;font-size:13px;color:var(--muted);font-weight:700;}
.tmult{font-family:'Caveat',cursive;font-size:32px;color:var(--text);font-weight:700;}
.tmult.gr{color:#1A9A50;}
.tower-floors{display:flex;flex-direction:column-reverse;gap:7px;margin-bottom:16px;}
.floor{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.tcell{
  aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:28px;cursor:pointer;
  background:rgba(255,255,255,0.82);border:1.5px solid rgba(0,0,0,0.10);
  transition:transform .1s,box-shadow .1s;
  box-shadow:0 2px 8px rgba(0,30,70,0.08);
}
.tcell:active:not(.open){transform:scale(.94);}
.tcell.done.safe{background:linear-gradient(135deg,#E8F6FF,#CCE8FF);border-color:rgba(30,120,220,0.25);}
.tcell.done.bomb{background:linear-gradient(135deg,#FFE8EC,#FFCCD4);border-color:rgba(216,40,74,0.25);}
.tcell.locked{opacity:0.45;pointer-events:none;}
.tcell.active-floor{box-shadow:0 0 0 2px #FFD028,0 2px 8px rgba(0,30,70,0.12);}
.cashout-btn{
  width:100%;padding:15px;background:#1A9A50;border:none;border-radius:16px;
  color:#fff;font-family:'Caveat',cursive;font-size:24px;font-weight:700;
  cursor:pointer;box-shadow:0 4px 14px rgba(26,154,80,.30);letter-spacing:0;
}
.cashout-btn:disabled{opacity:.35;cursor:not-allowed;}
/* ── RESULT ── */
.result-card{
  margin:14px;background:rgba(255,255,255,0.90);
  border:2px solid rgba(255,255,255,0.75);border-radius:22px;
  padding:24px 16px;box-shadow:0 5px 18px rgba(0,30,70,0.10);
  text-align:center;display:none;
}
.result-card.active{display:block;}
.result-title{font-family:'Caveat',cursive;font-size:42px;font-weight:700;margin-bottom:8px;}
.result-title.win{color:#1A9A50;} .result-title.lose{color:#D8284A;}
.result-sub{font-family:'Nunito',sans-serif;font-size:14px;color:var(--muted);font-weight:700;margin-bottom:20px;}
.result-btn{
  width:100%;padding:15px;background:#1A2040;border:none;border-radius:16px;
  color:#fff;font-family:'Caveat',cursive;font-size:22px;font-weight:700;
  cursor:pointer;box-shadow:0 4px 14px rgba(20,30,80,.22);letter-spacing:0;
}
.back-link{
  display:block;margin:8px 14px 20px;padding:13px;text-align:center;
  background:rgba(255,255,255,0.82);border:1.5px solid rgba(0,0,0,0.10);
  border-radius:16px;color:var(--muted);font-family:'Nunito',sans-serif;
  font-size:13px;font-weight:700;text-decoration:none;
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="topbar">
  <button class="fp-back" onclick="goBack()">‹</button>
  <div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">🗼</span><span class="fp-title">БАШНЯ</span></div>
  <div class="bal-chip"><img src="../textures/coin.svg" width="20" height="20" alt="" style="vertical-align:middle"> <span id="r-bal">—</span></div>
</div>
<div class="page">

  <!-- SETUP -->
  <div class="setup-card" id="setup-card">
    <div class="stag">// ставка</div>
    <input class="bet-inp" id="bet-inp" type="number" min="10" value="50" inputmode="numeric">
    <div class="qb-row">
      <div class="qb" onclick="sb(10)">10</div><div class="qb" onclick="sb(25)">25</div>
      <div class="qb" onclick="sb(50)">50</div><div class="qb" onclick="sb(100)">100</div>
      <div class="qb" onclick="sbAll()">MAX</div><div class="qb" onclick="sbHalf()">½</div>
    </div>
    <div class="stag">// множители по этажам</div>
    <div class="mp-grid" id="mp-grid"></div>
    <button class="start-btn" id="start-btn" onclick="startGame()">🗼 НАЧАТЬ ИГРУ</button>
  </div>

  <!-- GAME -->
  <div class="game-area" id="game-area">
    <div class="live-stats">
      <div class="ls"><div class="ls-l">Ставка</div><div class="ls-v" style="color:var(--gold)" id="live-bet">—</div></div>
      <div class="ls"><div class="ls-l">Этаж</div><div class="ls-v" style="color:var(--white)" id="live-floor">1/10</div></div>
      <div class="ls"><div class="ls-l">Выиграть</div><div class="ls-v" style="color:var(--green)" id="live-win">0 🪙</div></div>
    </div>
    <div class="tower-wrap" id="tower"></div>
    <button class="cashout-btn" id="cashout-btn" onclick="cashout()" disabled>
      💰 КЕШАУТ — <span id="cashout-lbl">0</span> 🪙
    </button>
    <div class="act-row">
      <button class="act-btn" onclick="newGame()">🔄 Новая игра</button>
      <button class="act-btn" onclick="goBack()">← Назад</button>
    </div>
  </div>

</div>

<!-- RESULT -->
<div class="res-overlay" id="res-overlay">
  <div class="res-card">
    <span class="res-ico" id="res-ico">🏆</span>
    <div class="res-title win" id="res-title">КЕШАУТ!</div>
    <div class="res-sub" id="res-sub">Этаж 5 · ×2.49</div>
    <div class="res-amt win" id="res-amt">+124 🪙</div>
    <button class="res-close" onclick="closeResult()">🔄 Играть снова</button>
    <a href="main.html?tab=games" style="display:block;margin-top:8px;color:rgba(255,255,255,.4);font-size:13px;text-decoration:none;text-align:center">← В меню игр</a>
  </div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
const UID=tg?.initDataUnsafe?.user?.id||0;
const CELLS=3,MAX_FLOORS=10,HOUSE=0.97;

function floorMult(f){if(f<=0)return 1;const raw=1+f*.28-f*(f-1)*.01;return parseFloat((HOUSE*Math.max(1,raw)).toFixed(2));}

let userData=null,currentBet=0,currentFloor=0,gameActive=false,pending=false,builtFloors=0;

function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className='toast '+t+' show';setTimeout(()=>el.classList.remove('show'),2800);}
async function get(url){return fetch(url).then(r=>r.json());}
async function post(url,d){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json());}
async function loadUser(){const u=await get(`/api/user/${UID}`).catch(()=>null);if(!u)return;userData=u;document.getElementById('r-bal').textContent=u.balance??0;}
function sb(v){document.getElementById('bet-inp').value=v;}
function sbAll(){if(userData)sb(userData.balance);}
function sbHalf(){if(userData)sb(Math.floor((userData.balance||0)/2));}

function buildMpGrid(){
  const g=document.getElementById('mp-grid');g.innerHTML='';
  for(let f=1;f<=MAX_FLOORS;f++){
    const d=document.createElement('div');d.className='mp';
    d.innerHTML=`<div class="mp-k">Эт. ${f}</div><div class="mp-v">×${floorMult(f).toFixed(2)}</div>`;
    g.appendChild(d);
  }
}

function ensureFloors(upto){
  const cont=document.getElementById('tower');
  const need=Math.min(upto+3,MAX_FLOORS);
  if(builtFloors===0)cont.innerHTML='';
  for(let f=builtFloors+1;f<=need;f++){
    const row=document.createElement('div');row.className='floor future';row.id=`fr-${f}`;
    const num=document.createElement('div');num.className='fl-num';num.textContent=f;row.appendChild(num);
    for(let c=0;c<CELLS;c++){
      const cell=document.createElement('div');cell.className='tcell disabled';cell.id=`tc-${f}-${c}`;
      cell.innerHTML='<span style="opacity:.12;font-size:14px">?</span>';cell.onclick=()=>pickCell(f,c);
      row.appendChild(cell);
    }
    const mult=document.createElement('div');mult.className='fl-mult';mult.textContent='×'+floorMult(f).toFixed(2);
    row.appendChild(mult);cont.appendChild(row);
  }
  builtFloors=Math.max(builtFloors,need);
  // Sort desc
  const rows=[...cont.querySelectorAll('.floor')];
  rows.sort((a,b)=>parseInt(b.id.split('-')[1])-parseInt(a.id.split('-')[1]));
  cont.innerHTML='';rows.forEach(r=>cont.appendChild(r));
}

function activateFloor(f){
  ensureFloors(f);
  for(let i=1;i<=builtFloors;i++){
    const row=document.getElementById(`fr-${i}`);if(!row)continue;
    row.className='floor '+(i<f?'past':i===f?'current':'future');
    for(let c=0;c<CELLS;c++){
      const cell=document.getElementById(`tc-${i}-${c}`);if(!cell)continue;
      if(i===f){cell.classList.remove('disabled');cell.style.pointerEvents='';}
      else{cell.classList.add('disabled');cell.style.pointerEvents='none';}
    }
  }
  const row=document.getElementById(`fr-${f}`);
  if(row)setTimeout(()=>row.scrollIntoView({behavior:'smooth',block:'center'}),100);
  document.getElementById('live-floor').textContent=`${f}/${MAX_FLOORS}`;
  document.getElementById('cashout-btn').disabled=f<=1;
}

async function startGame(){
  const bet=parseInt(document.getElementById('bet-inp').value)||0;
  if(bet<10){toast('Минимум 10 🪙','err');return;}
  if(!userData||bet>userData.balance){toast('Недостаточно монет','err');return;}
  document.getElementById('start-btn').disabled=true;
  const res=await post('/api/tower/start',{user_id:UID,bet}).catch(()=>null);
  document.getElementById('start-btn').disabled=false;
  if(!res||res.error){toast(res?.error||'Ошибка','err');return;}
  currentBet=bet;currentFloor=1;gameActive=true;builtFloors=0;
  if(userData)userData.balance=res.new_balance;
  document.getElementById('r-bal').textContent=res.new_balance;
  document.getElementById('live-bet').textContent=bet;
  document.getElementById('live-win').textContent='0 🪙';
  document.getElementById('cashout-lbl').textContent='0';
  document.getElementById('cashout-btn').disabled=true;
  document.getElementById('setup-card').classList.add('hidden');
  document.getElementById('game-area').classList.add('on');
  activateFloor(1);
}

async function pickCell(floor,ci){
  if(!gameActive||pending||floor!==currentFloor)return;
  pending=true;
  for(let c=0;c<CELLS;c++){const el=document.getElementById(`tc-${floor}-${c}`);if(el)el.style.pointerEvents='none';}
  const res=await post('/api/tower/step',{user_id:UID,floor,cell:ci}).catch(()=>null);
  pending=false;
  if(!res||res.error){
    toast(res?.error||'Ошибка','err');
    for(let c=0;c<CELLS;c++){const el=document.getElementById(`tc-${floor}-${c}`);if(el)el.style.pointerEvents='';}
    return;
  }
  const chosen=document.getElementById(`tc-${floor}-${ci}`);
  let bombIdx=res.bomb_cell;
  if(bombIdx===-1&&!res.is_bomb){const others=[0,1,2].filter(c=>c!==ci);bombIdx=others[Math.floor(Math.random()*others.length)];}
  if(res.is_bomb){
    chosen.className='tcell bomb disabled';chosen.innerHTML='💣';
    setTimeout(()=>{
      for(let c=0;c<CELLS;c++){
        if(c===ci)continue;
        const el=document.getElementById(`tc-${floor}-${c}`);if(!el)continue;
        if(c===bombIdx){el.className='tcell bomb disabled';el.innerHTML='💣';el.style.opacity='.65';}
        else{el.className='tcell safe disabled';el.innerHTML='💎';}
      }
    },300);
    gameActive=false;
    setTimeout(()=>showResult(false,currentBet,floorMult(floor-1)||1,0,floor),600);
  }else{
    chosen.className='tcell safe disabled';chosen.innerHTML='💎';
    for(let c=0;c<CELLS;c++){
      if(c===ci)continue;
      const el=document.getElementById(`tc-${floor}-${c}`);if(!el)continue;
      if(c===bombIdx){el.className='tcell bomb-hidden disabled';el.innerHTML='💣';el.style.opacity='.35';}
      else{el.className='tcell disabled';el.style.opacity='.3';el.innerHTML='<span style="font-size:14px;opacity:.3">—</span>';}
    }
    document.getElementById('live-win').textContent=res.current_win+' 🪙';
    document.getElementById('cashout-lbl').textContent=res.current_win;
    if(res.reached_top){
      gameActive=false;if(userData)userData.balance=res.new_balance;document.getElementById('r-bal').textContent=res.new_balance;
      setTimeout(()=>showResult(true,currentBet,res.mult,res.current_win,floor,true),600);
    }else{
      currentFloor=floor+1;setTimeout(()=>activateFloor(currentFloor),350);
      document.getElementById('cashout-btn').disabled=false;
    }
  }
}

async function cashout(){
  if(!gameActive||pending)return;
  document.getElementById('cashout-btn').disabled=true;
  const res=await post('/api/tower/cashout',{user_id:UID}).catch(()=>null);
  if(!res||res.error){toast(res?.error||'Ошибка','err');document.getElementById('cashout-btn').disabled=false;return;}
  gameActive=false;if(userData)userData.balance=res.new_balance;document.getElementById('r-bal').textContent=res.new_balance;
  showResult(true,currentBet,res.mult,res.won,currentFloor-1);
}

function showResult(won,bet,mult,amount,floor,top=false){
  document.getElementById('res-ico').textContent=won?'🏆':'💥';
  document.getElementById('res-title').textContent=won?(top?'БАШНЯ ПОКОРЕНА!':'КЕШАУТ!'):'ВЗРЫВ!';
  document.getElementById('res-title').className='res-title '+(won?'win':'lose');
  document.getElementById('res-sub').textContent=`Этаж ${floor} · ×${parseFloat(mult||1).toFixed(2)}`;
  document.getElementById('res-amt').textContent=won?`+${amount} 🪙`:`-${bet} 🪙`;
  document.getElementById('res-amt').className='res-amt '+(won?'win':'lose');
  document.getElementById('res-overlay').classList.add('show');
}
function closeResult(){document.getElementById('res-overlay').classList.remove('show');newGame();}
function newGame(){gameActive=false;currentFloor=1;builtFloors=0;document.getElementById('game-area').classList.remove('on');document.getElementById('setup-card').classList.remove('hidden');loadUser();}
function goBack(){if(gameActive&&currentFloor>1)cashout().then(()=>location.href='main.html?tab=games');else location.href='main.html?tab=games';}

buildMpGrid();loadUser();
</script>
<script>(function(){let x=null;function c(){if(!x)x=new(window.AudioContext||window.webkitAudioContext)();return x;}function on(){try{return localStorage.getItem("topluck_sounds")==="1";}catch(e){return false;}}window.SND={play:function(t){if(!on())return;try{const ctx=c(),g=ctx.createGain(),o=ctx.createOscillator();g.connect(ctx.destination);o.connect(g);const s=ctx.currentTime;if(t==="win"){o.type="sine";[523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,s+i*.1));g.gain.setValueAtTime(.22,s);g.gain.exponentialRampToValueAtTime(.001,s+.75);o.start(s);o.stop(s+.75);}else if(t==="lose"){o.type="sawtooth";o.frequency.setValueAtTime(280,s);o.frequency.exponentialRampToValueAtTime(70,s+.5);g.gain.setValueAtTime(.2,s);g.gain.exponentialRampToValueAtTime(.001,s+.6);o.start(s);o.stop(s+.6);}else if(t==="step"||t==="coin"){o.type="sine";o.frequency.setValueAtTime(900,s);g.gain.setValueAtTime(.12,s);g.gain.exponentialRampToValueAtTime(.001,s+.18);o.start(s);o.stop(s+.18);}else if(t==="bomb"){o.type="sawtooth";o.frequency.setValueAtTime(120,s);o.frequency.exponentialRampToValueAtTime(20,s+.6);g.gain.setValueAtTime(.28,s);g.gain.exponentialRampToValueAtTime(.001,s+.7);o.start(s);o.stop(s+.7);}}catch(e){}}};})();</script>

</body>
</html>
