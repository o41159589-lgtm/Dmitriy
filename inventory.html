<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Инвентарь — TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  try{
    var _devUid = localStorage.getItem("__tl_dev_uid__");
    if(!_devUid) return;
    var _uid = parseInt(_devUid);
    if(!_uid) return;
    var tg = window.Telegram && window.Telegram.WebApp;
    if(!tg) return;
    if(!tg.initDataUnsafe)      tg.initDataUnsafe = {};
    if(!tg.initDataUnsafe.user) tg.initDataUnsafe.user = {};
    tg.initDataUnsafe.user.id = _uid;
  } catch(e){}
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--bg:#141414;--bg2:#1C1C1C;--bg3:#111125;--lime:#FFFFFF;--lime2:#E0E0E0;--pink:#FF2D6B;--cyan:#6BAAB8;--purple:#9977CC;--gold:#D9AC5A;--gold2:#E8C000;--green:#5DD98C;--red:#E07878;--blue:#00C8FF;--text:#F0EFFF;--muted:#848484;--muted2:#636363;--glass-bg:rgba(255,255,255,0.035);--glass-border:rgba(255,255,255,0.09);--border:rgba(255,255,255,0.12);--nav-h:70px;--font-display:'Bebas Neue',sans-serif;--font-ui:'Exo 2',sans-serif;--font-mono:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:16px;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}
.liquid-bg{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse 55% 35% at 10% 5%,rgba(155,93,255,0.08) 0%,transparent 65%),radial-gradient(ellipse 40% 45% at 90% 90%,rgba(0,229,255,0.06) 0%,transparent 65%);}
.toast{position:fixed;top:14px;left:14px;right:14px;z-index:500;background:rgba(12,12,28,0.95);border:1px solid var(--glass-border);backdrop-filter:blur(20px);border-radius:16px;padding:13px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-80px);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.toast.show{transform:translateY(0);}
.toast.ok{color:var(--green);border-color:rgba(93,217,140,.25);}
.toast.err{color:var(--red);border-color:rgba(224,120,120,.25);}
.toast.info{color:var(--cyan);border-color:rgba(0,229,255,0.3);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;position:sticky;top:0;z-index:50;background:rgba(6,6,15,0.88);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.08);}
.fp-back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:22px;cursor:pointer;font-weight:700;}
.fp-title{font-family:var(--font-display);font-size:20px;color:var(--white);letter-spacing:1px;}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(255,214,0,0.1);border:1px solid rgba(255,214,0,0.25);border-radius:12px;padding:7px 12px;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--gold);}
.card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px;overflow:hidden;margin-bottom:12px;}
.card-head{padding:12px 16px;font-family:var(--font-mono);font-size:11px;color:var(--white);letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.08);}
.card-body{padding:14px 16px;}
.irow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.irow:last-child{border-bottom:none;}
.irow-l{font-size:13px;color:var(--muted2);}
.irow-r{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--text);}

.page-content{padding:16px;}
.inv-tabs{display:flex;gap:8px;margin-bottom:16px;}
.inv-tab{flex:1;padding:10px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;color:var(--muted2);font-weight:700;font-size:13px;cursor:pointer;text-align:center;transition:all .2s;}
.inv-tab.active{background:var(--white);color:#000;border-color:var(--white);}
.inv-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.istat{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:12px 8px;text-align:center;}
.istat-val{font-family:var(--font-mono);font-size:20px;color:var(--white);font-weight:700;}
.istat-lbl{font-size:11px;color:var(--muted2);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}
.inv-item{display:flex;align-items:center;gap:14px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;padding:14px;margin-bottom:10px;transition:border-color .2s;}
.inv-item:hover{border-color:rgba(255,255,255,.2);}
.inv-icon{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.inv-info{flex:1;}
.inv-name{font-weight:700;font-size:15px;margin-bottom:3px;}
.inv-meta{font-size:12px;color:var(--muted2);}
.inv-qty{font-family:var(--font-mono);font-size:16px;color:var(--white);font-weight:700;white-space:nowrap;}
.empty{text-align:center;padding:48px 20px;color:var(--muted2);}
.empty-i{font-size:60px;margin-bottom:14px;display:block;}
.empty p{font-size:15px;line-height:1.6;}
.empty a{color:var(--white);text-decoration:none;}
.hist-section{margin-top:8px;}
.hi{display:flex;align-items:center;gap:12px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:12px 14px;margin-bottom:8px;}
.hi-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.hi-ic.win{background:rgba(93,217,140,.1);}.hi-ic.lose{background:rgba(224,120,120,.1);}.hi-ic.deposit{background:rgba(107,170,184,.1);}.hi-ic.gift{background:rgba(255,255,255,.1);}
.hi-b{flex:1;}
.hi-t{font-weight:600;font-size:14px;}
.hi-s{font-size:12px;color:var(--muted2);margin-top:2px;}
.hi-a{font-family:var(--font-mono);font-size:14px;font-weight:700;}
.hi-a.p{color:var(--green);}.hi-a.n{color:var(--red);}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="liquid-bg"></div>

<div class="topbar">
  <button class="fp-back" onclick="history.back()">‹</button>
  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-size:20px">🎒</span>
    <span class="fp-title">ИНВЕНТАРЬ</span>
  </div>
  <div class="bal-chip">🪙 <span id="r-bal">—</span></div>
</div>

<div class="page-content">

  <div class="inv-stats">
    <div class="istat"><div class="istat-val" id="stat-spins">—</div><div class="istat-lbl">Игр</div></div>
    <div class="istat"><div class="istat-val" id="stat-wins">—</div><div class="istat-lbl">Побед</div></div>
    <div class="istat"><div class="istat-val" id="stat-won">—</div><div class="istat-lbl">Выиграно</div></div>
  </div>

  <div class="inv-tabs">
    <div class="inv-tab active" onclick="switchTab('items',this)">🎁 Предметы</div>
    <div class="inv-tab" onclick="switchTab('history',this)">📋 История</div>
  </div>

  <!-- ITEMS TAB -->
  <div id="tab-items">
    <div id="items-list">
      <div class="empty">
        <div class="empty-i">📭</div>
        <p>Инвентарь пуст.<br>Купи что-нибудь в <a href="shop.html">Магазине</a>!</p>
      </div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div id="tab-history" style="display:none">
    <div class="card">
      <div class="card-head">📊 Статистика</div>
      <div class="card-body" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="text-align:center">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">ВЫИГРАНО</div>
          <div style="font-family:var(--font-mono);font-size:18px;color:var(--green)" id="hs-won">0</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">ПРОИГРАНО</div>
          <div style="font-family:var(--font-mono);font-size:18px;color:var(--red)" id="hs-lost">0</div>
        </div>
      </div>
    </div>
    <div class="hist-section" id="hist-list">
      <div class="empty"><div class="empty-i">📭</div><p>История пуста</p></div>
    </div>
  </div>

</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
const UID = tg?.initDataUnsafe?.user?.id || 0;

let userData = null;
let historyData = [];

function toast(m,t='info'){
  const el=document.getElementById('toast');
  el.textContent=m;el.className='toast '+t;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}
async function get(url){const r=await fetch(url);return r.json();}

function switchTab(tab, el){
  document.querySelectorAll('.inv-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-items').style.display = tab==='items'?'':'none';
  document.getElementById('tab-history').style.display = tab==='history'?'':'none';
  if(tab==='history') renderHistory();
}

async function loadUser(){
  if(!UID)return;
  userData = await get(`/api/user/${UID}`).catch(()=>null);
  if(!userData)return;
  if(TL_guardBanned(userData))return;
  document.getElementById('r-bal').textContent   = userData.balance??0;
  document.getElementById('stat-spins').textContent = userData.spins??0;
  document.getElementById('stat-wins').textContent  = userData.wins??0;
  document.getElementById('stat-won').textContent   = userData.total_won??0;
}

async function loadItems(){
  // Gifts in inventory from history type='gift_received'
  const hist = await get(`/api/history/${UID}`).catch(()=>[]);
  historyData = hist;
  const gifts = hist.filter(h=>h.type==='gift_received'||h.type==='gift');
  const list = document.getElementById('items-list');
  if(!gifts.length){
    list.innerHTML=`<div class="empty"><div class="empty-i">📭</div><p>Инвентарь пуст.<br>Купи что-нибудь в <a href="shop.html">Магазине</a>!</p></div>`;
    return;
  }
  const grouped = {};
  gifts.forEach(g=>{
    const key = g.detail||'Подарок';
    if(!grouped[key]) grouped[key]={name:key,count:0,date:g.created_at};
    grouped[key].count++;
  });
  list.innerHTML = Object.values(grouped).map(item=>`
    <div class="inv-item">
      <div class="inv-icon">🎁</div>
      <div class="inv-info">
        <div class="inv-name">${item.name}</div>
        <div class="inv-meta">Получен ${new Date(item.date*1000).toLocaleDateString('ru',{day:'numeric',month:'short'})}</div>
      </div>
      <div style="text-align:right">
        <div class="inv-qty">×${item.count}</div>
      </div>
    </div>`).join('');
}

async function renderHistory(){
  const ICONS={win:'🏆',lose:'💀',deposit:'💳',ref:'🔗',gift_received:'🎁',gift:'🎁'};
  const TITLES={win:'Выигрыш',lose:'Проигрыш',deposit:'Пополнение',ref:'Реферал',gift_received:'Подарок получен',gift:'Подарок'};
  let won=0,lost=0;
  historyData.forEach(i=>{
    if(['win','deposit','ref','gift_received'].includes(i.type))won+=i.amount;
    if(['lose'].includes(i.type))lost+=i.amount;
  });
  document.getElementById('hs-won').textContent=won;
  document.getElementById('hs-lost').textContent=lost;
  const list=document.getElementById('hist-list');
  if(!historyData.length){
    list.innerHTML='<div class="empty"><div class="empty-i">📭</div><p>История пуста</p></div>';return;
  }
  list.innerHTML=historyData.slice(0,50).map(i=>{
    const d=new Date(i.created_at*1000);
    const dt=d.toLocaleDateString('ru',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
    const pos=['win','deposit','ref','gift_received'].includes(i.type);
    return `<div class="hi">
      <div class="hi-ic ${i.type}">${ICONS[i.type]||'•'}</div>
      <div class="hi-b"><div class="hi-t">${TITLES[i.type]||i.type}</div><div class="hi-s">${i.detail||''} · ${dt}</div></div>
      <div class="hi-a ${pos?'p':'n'}">${pos?'+':'-'}${i.amount}</div>
    </div>`;
  }).join('');
}


loadUser();
loadItems();
</script>
</body>
</html>
