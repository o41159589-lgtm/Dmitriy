<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  background:#06060F;color:#F0EFFF;font-family:'Exo 2',sans-serif;
  min-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.bg-orbs{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 18% 8%,rgba(100,40,220,0.14) 0%,transparent 60%),
    radial-gradient(ellipse 55% 45% at 85% 80%,rgba(0,200,240,0.09) 0%,transparent 60%);
  animation:orbP 6s ease-in-out infinite alternate;}
@keyframes orbP{from{opacity:.6;}to{opacity:1;}}

.splash{
  display:flex;flex-direction:column;align-items:center;
  position:relative;z-index:2;
  animation:splIn .5s cubic-bezier(.4,0,.2,1) both;
}
@keyframes splIn{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}

/* Pepe area */
.pepe-area{
  width:160px;height:160px;position:relative;margin-bottom:26px;
  display:flex;align-items:center;justify-content:center;
}
/* Spinning ring */
.pepe-ring{
  position:absolute;inset:0;border-radius:50%;
  border:2.5px solid rgba(155,93,255,0.15);
  border-top-color:rgba(155,93,255,0.75);
  border-right-color:rgba(0,200,240,0.5);
  animation:ringA 1.1s linear infinite;
}
.pepe-ring2{
  position:absolute;inset:12px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.05);
  border-bottom-color:rgba(255,255,255,0.25);
  animation:ringA 1.8s linear infinite reverse;
}
@keyframes ringA{to{transform:rotate(360deg);}}

/* Pepe image — телеграм стикер пепе */
.pepe-img{
  width:120px;height:120px;object-fit:contain;
  position:relative;z-index:2;
  animation:pepeIn .7s cubic-bezier(.34,1.56,.64,1) both, pepeFloat 3.5s 0.7s ease-in-out infinite;
  filter:drop-shadow(0 4px 24px rgba(155,93,255,0.45)) drop-shadow(0 0 8px rgba(0,200,240,0.3));
}
@keyframes pepeIn{
  from{transform:scale(0) rotate(-25deg);opacity:0;}
  to{transform:scale(1) rotate(0deg);opacity:1;}
}
@keyframes pepeFloat{
  0%,100%{transform:translateY(0) rotate(-2deg);}
  50%{transform:translateY(-8px) rotate(2deg);}
}

/* Error bubbles */
.err{
  position:absolute;background:rgba(6,6,20,0.9);border-radius:8px;
  padding:4px 8px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  white-space:nowrap;opacity:0;pointer-events:none;
}
.e1{top:5px;left:-15px;color:#FF3B55;border:1px solid rgba(255,59,85,0.4);animation:errF 3.5s 1.2s ease-in-out infinite;}
.e2{bottom:15px;right:-20px;color:#FFD600;border:1px solid rgba(255,214,0,0.4);animation:errF 4s 2.3s ease-in-out infinite;}
.e3{bottom:2px;left:-10px;color:#9B5DFF;border:1px solid rgba(155,93,255,0.35);animation:errF 3s 3.1s ease-in-out infinite;}
@keyframes errF{0%,100%{opacity:0;transform:translateY(0);}15%,85%{opacity:1;}50%{transform:translateY(-5px);}}

/* Brand */
.brand{
  font-family:'Bebas Neue',sans-serif;font-size:54px;letter-spacing:8px;
  color:#fff;margin-bottom:4px;line-height:1;
  text-shadow:0 0 40px rgba(155,93,255,0.4),0 0 80px rgba(155,93,255,0.1);
}
.tag{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:rgba(255,255,255,0.28);letter-spacing:3px;margin-bottom:42px;
}
.tag span{color:rgba(155,93,255,0.55);}

/* Progress */
.bar-wrap{width:220px;margin-bottom:12px;}
.bar-track{width:100%;height:3px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;position:relative;}
.bar-fill{height:100%;width:0%;border-radius:2px;transition:width .08s linear;
  background:linear-gradient(90deg,rgba(155,93,255,0.8),#fff 60%,rgba(0,200,240,0.9));
  box-shadow:0 0 12px rgba(155,93,255,0.6);}
.bar-shim{position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);animation:shim 1.3s ease-in-out infinite;}
@keyframes shim{to{left:140%;}}
.bar-txt{font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,0.3);font-size:10px;text-align:center;margin-top:9px;letter-spacing:1px;}
.bar-txt::before{content:'> ';color:rgba(155,93,255,0.6);}

/* Particles */
.pts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.pt{position:absolute;border-radius:50%;opacity:0;animation:ptF var(--d,5s) var(--dl,0s) ease-in-out infinite;}
@keyframes ptF{0%{opacity:0;transform:translateY(100vh) scale(0);}10%{opacity:.5;}90%{opacity:.1;}100%{opacity:0;transform:translateY(-20px) scale(1);}}

.ver{position:fixed;bottom:18px;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.12);letter-spacing:2px;}
</style>
</head>
<body>
<div class="bg-orbs"></div>
<div class="pts" id="pts"></div>

<div class="splash">
  <!-- Pepe -->
  <div class="pepe-area">
    <div class="pepe-ring"></div>
    <div class="pepe-ring2"></div>
    <!-- Telegram Plush Pepe sticker — тот самый из стикер-пака -->
    <img class="pepe-img" id="pepe-img"
      src="https://tlgrm.eu/_/stickers/b13/50d/b1350d19-c0dd-3d13-a39e-a90e28e6e5e7/1.webp"
      alt="Pepe"
      onerror="this.src='PlushPepeSkins_AgADEWUAAlKuQEs.png';this.onerror=function(){this.style.display='none';document.getElementById('pepe-fallback').style.display='flex';}">
    <div id="pepe-fallback" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:80px;">🐸</div>
    <div class="err e1">ERR_LUCK</div>
    <div class="err e2">loading...</div>
    <div class="err e3">0x4C55434B</div>
  </div>

  <div class="brand">TOPLUCK</div>
  <div class="tag"><span>//</span> испытай удачу <span>//</span></div>

  <div class="bar-wrap">
    <div class="bar-track">
      <div class="bar-fill" id="bfill"></div>
      <div class="bar-shim"></div>
    </div>
    <div class="bar-txt" id="btxt">init</div>
  </div>
</div>

<div class="ver">TOPLUCK v3.0</div>

<script>
// Dev impersonation
(function(){
  try{
    const d=localStorage.getItem('__tl_dev_uid__');if(!d)return;
    const uid=parseInt(d);if(!uid)return;
    const tg=window.Telegram?.WebApp;if(!tg)return;
    if(!tg.initDataUnsafe)tg.initDataUnsafe={};
    if(!tg.initDataUnsafe.user)tg.initDataUnsafe.user={};
    tg.initDataUnsafe.user.id=uid;
  }catch(_){}
})();

const tgApp=window.Telegram?.WebApp;
if(tgApp){tgApp.expand();tgApp.ready();}
const _u=tgApp?.initDataUnsafe?.user;
const _real=tgApp?.initData&&tgApp.initData.length>0;
if(_real){try{localStorage.removeItem('__tl_dev_uid__');localStorage.removeItem('__tl_dev_debug__');}catch(_){}}
if(!_u||!_u.id)window.location.replace('not_telegram.html');
try{if(_u?.id)sessionStorage.setItem('__tl_uid__',String(_u.id));}catch(_){}

// Particles
const pts=document.getElementById('pts');
['#9B5DFF','#00C8FF','#FF2D6B','#FFD600','#ffffff'].forEach((col,i)=>{
  for(let j=0;j<6;j++){
    const p=document.createElement('div');p.className='pt';
    const s=.8+Math.random()*2.5;
    p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${col};--d:${3+Math.random()*5}s;--dl:${Math.random()*6}s`;
    pts.appendChild(p);
  }
});

// Loader
const fill=document.getElementById('bfill');
const txt=document.getElementById('btxt');
const msgs=['connecting','verifying luck','loading assets','почти готово','welcome!'];
let pct=0,mi=0;
const iv=setInterval(()=>{
  pct=Math.min(100,pct+Math.random()*12+4);
  fill.style.width=pct+'%';
  const m=Math.floor(pct/22);
  if(m<msgs.length&&m>mi){mi=m;txt.textContent=msgs[m];}
  if(pct>=100){clearInterval(iv);setTimeout(()=>{window.location.href='main.html';},420);}
},160);
</script>
</body>
</html>
