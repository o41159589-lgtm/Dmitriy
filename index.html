<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  background:#07071A;color:#F0EFFF;
  font-family:'Exo 2',sans-serif;
  min-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

/* BG */
.bg-orbs{
  position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(120,60,255,0.14) 0%,transparent 60%),
    radial-gradient(ellipse 50% 45% at 80% 85%, rgba(0,220,255,0.10) 0%,transparent 60%);
  animation:orbPulse 5s ease-in-out infinite alternate;
}
@keyframes orbPulse{from{opacity:.6;}to{opacity:1;}}

/* MAIN CARD */
.splash{
  display:flex;flex-direction:column;align-items:center;gap:0;
  position:relative;z-index:2;
  animation:splashIn .5s cubic-bezier(.4,0,.2,1) both;
}
@keyframes splashIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}

/* Pepe container */
.pepe-wrap{
  width:140px;height:140px;
  position:relative;
  margin-bottom:28px;
}

/* Pepe sticker image */
.pepe-img{
  width:130px;height:130px;
  object-fit:contain;
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 20px rgba(155,93,255,0.4));
  animation:pepeSpin 0.6s ease-out both, pepeIdle 3s 0.6s ease-in-out infinite;
}
@keyframes pepeSpin{
  from{transform:translate(-50%,-50%) scale(0) rotate(-180deg);}
  to{transform:translate(-50%,-50%) scale(1) rotate(0deg);}
}
@keyframes pepeIdle{
  0%,100%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);}
  50%{transform:translate(-50%,-60%) scale(1.04) rotate(2deg);}
}

/* Glitch bars behind pepe */
.glitch-bar{
  position:absolute;border-radius:2px;
  background:rgba(155,93,255,0.6);
  opacity:0;
}
.gb1{width:60px;height:3px;top:20px;left:-10px;animation:glitch1 2s 1s ease-in-out infinite;}
.gb2{width:40px;height:2px;bottom:30px;right:-5px;animation:glitch2 2.5s 1.5s ease-in-out infinite;background:rgba(0,220,255,0.6);}
.gb3{width:25px;height:2px;bottom:10px;left:10px;animation:glitch1 1.8s 0.8s ease-in-out infinite;background:rgba(255,50,100,0.5);}
@keyframes glitch1{0%,90%,100%{opacity:0;transform:translateX(0);}91%{opacity:1;transform:translateX(-8px);}94%{opacity:1;transform:translateX(5px);}97%{opacity:0;}}
@keyframes glitch2{0%,85%,100%{opacity:0;transform:translateX(0);}86%{opacity:1;transform:translateX(6px);}90%{opacity:1;transform:translateX(-3px);}93%{opacity:0;}}

/* Loading ring around pepe */
.pepe-ring{
  position:absolute;inset:-8px;border-radius:50%;
  border:2px solid rgba(155,93,255,0.2);
  border-top-color:rgba(155,93,255,0.7);
  animation:ringSpinFast 0.7s linear 3, ringSpinSlow 3s 2.1s linear infinite;
}
@keyframes ringSpinFast{to{transform:rotate(360deg);}}
@keyframes ringSpinSlow{to{transform:rotate(360deg);}}

/* ERROR / STATUS messages floating around pepe */
.err-msg{
  position:absolute;
  background:rgba(0,0,0,0.8);border:1px solid;border-radius:8px;
  padding:4px 9px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  white-space:nowrap;opacity:0;pointer-events:none;
}
.em1{top:-8px;left:-60px;color:#FF3B55;border-color:rgba(255,59,85,0.4);animation:errFloat1 4s 1.5s ease-in-out infinite;}
.em2{bottom:0px;right:-55px;color:#FFD600;border-color:rgba(255,214,0,0.4);animation:errFloat2 3.5s 2.5s ease-in-out infinite;}
.em3{bottom:-10px;left:-45px;color:#9B5DFF;border-color:rgba(155,93,255,0.4);animation:errFloat1 4.5s 3s ease-in-out infinite;}
@keyframes errFloat1{0%,100%{opacity:0;transform:translateY(0);}20%,80%{opacity:1;}50%{transform:translateY(-6px);}}
@keyframes errFloat2{0%,100%{opacity:0;transform:translateY(0);}20%,80%{opacity:1;}50%{transform:translateY(5px);}}

/* Brand */
.brand{
  font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:8px;
  color:#fff;
  text-shadow:0 0 40px rgba(155,93,255,0.5),0 0 80px rgba(155,93,255,0.15);
  margin-bottom:6px;line-height:1;
}
.tagline{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,0.3);
  letter-spacing:3px;text-transform:uppercase;margin-bottom:44px;
}
.tagline span{color:rgba(155,93,255,0.6);}

/* Progress bar */
.loader-wrap{width:220px;margin-bottom:12px;}
.loader-track{width:100%;height:3px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;position:relative;}
.loader-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,rgba(155,93,255,0.8),#fff,rgba(0,220,255,0.9));
  border-radius:2px;transition:width .08s linear;
  box-shadow:0 0 12px rgba(155,93,255,0.7);
}
.loader-shimmer{position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);animation:shimmer 1.2s ease-in-out infinite;}
@keyframes shimmer{to{left:140%;}}
.loader-text{font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,0.3);font-size:10px;text-align:center;margin-top:10px;letter-spacing:1px;}
.loader-text::before{content:'> ';color:rgba(155,93,255,0.7);}

/* Particles */
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.p{position:absolute;border-radius:50%;opacity:0;animation:pFloat var(--d,5s) var(--dl,0s) ease-in-out infinite;}
@keyframes pFloat{0%{opacity:0;transform:translateY(100vh) scale(0);}10%{opacity:.6;}90%{opacity:.1;}100%{opacity:0;transform:translateY(-30px) scale(1);}}

.version{position:fixed;bottom:20px;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.15);letter-spacing:2px;}
</style>
</head>
<body>
<div class="bg-orbs"></div>
<div class="particles" id="particles"></div>

<div class="splash">
  <div class="pepe-wrap">
    <div class="glitch-bar gb1"></div>
    <div class="glitch-bar gb2"></div>
    <div class="glitch-bar gb3"></div>
    <div class="pepe-ring"></div>
    <img class="pepe-img" src="PlushPepeSkins_AgADEWUAAlKuQEs.png"
      alt="Pepe"
      onerror="this.style.display='none';document.querySelector('.pepe-fallback').style.display='flex'">
    <div class="pepe-fallback" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:70px;">🐸</div>
    <div class="err-msg em1">ERR_LUCK</div>
    <div class="err-msg em2">loading...</div>
    <div class="err-msg em3">0x4C55434B</div>
  </div>

  <div class="brand">TOPLUCK</div>
  <div class="tagline"><span>//</span> испытай удачу <span>//</span></div>

  <div class="loader-wrap">
    <div class="loader-track">
      <div class="loader-bar" id="lbar"></div>
      <div class="loader-shimmer"></div>
    </div>
    <div class="loader-text" id="ltxt">init</div>
  </div>
</div>

<div class="version">TOPLUCK v3.0</div>

<script>
(function(){
  try{
    const d=localStorage.getItem('__tl_dev_uid__');
    if(!d)return;
    const uid=parseInt(d);if(!uid)return;
    const tg=window.Telegram?.WebApp;if(!tg)return;
    if(!tg.initDataUnsafe)tg.initDataUnsafe={};
    if(!tg.initDataUnsafe.user)tg.initDataUnsafe.user={};
    tg.initDataUnsafe.user.id=uid;
  }catch(_){}
})();

const tgApp=window.Telegram?.WebApp;
if(tgApp){tgApp.expand();tgApp.ready();}
const _tgUser=tgApp?.initDataUnsafe?.user;
const _hasRealInitData=tgApp?.initData&&tgApp.initData.length>0;
if(_hasRealInitData){try{localStorage.removeItem('__tl_dev_uid__');localStorage.removeItem('__tl_dev_debug__');}catch(_){}}
if(!_tgUser||!_tgUser.id)window.location.replace('not_telegram.html');
try{if(_tgUser?.id)sessionStorage.setItem('__tl_uid__',String(_tgUser.id));}catch(_){}

// Particles
const pc=document.getElementById('particles');
const cols=['#9B5DFF','#00E5FF','#FF2D6B','#FFD600','#ffffff'];
for(let i=0;i<30;i++){
  const p=document.createElement('div');p.className='p';
  const s=1+Math.random()*2.5;
  p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${cols[i%cols.length]};--d:${3+Math.random()*5}s;--dl:${Math.random()*5}s`;
  pc.appendChild(p);
}

// Loader
const bar=document.getElementById('lbar');
const txt=document.getElementById('ltxt');
const msgs=['connecting','verifying luck','loading assets','almost there','welcome!'];
let pct=0,msgI=0;
const iv=setInterval(()=>{
  pct+=Math.random()*12+4;
  if(pct>=100){pct=100;clearInterval(iv);}
  bar.style.width=pct+'%';
  const mIdx=Math.floor(pct/22);
  if(mIdx<msgs.length&&mIdx>msgI){msgI=mIdx;txt.textContent=msgs[mIdx];}
  if(pct>=100)setTimeout(()=>{window.location.href='main.html';},450);
},160);
</script>
</body>
</html>
