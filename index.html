<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#141414;color:#F0F0F0;font-family:'Exo 2',sans-serif;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.splash{display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;animation:splIn .45s cubic-bezier(.4,0,.2,1) both;}
@keyframes splIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
.pepe-area{width:190px;height:190px;position:relative;margin-bottom:24px;display:flex;align-items:center;justify-content:center;}
#lottie-pepe{width:100%;height:100%;}
#pepe-fallback{display:none;font-size:100px;position:absolute;inset:0;align-items:center;justify-content:center;}
.brand{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:7px;color:#fff;margin-bottom:5px;line-height:1;}
.tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.22);letter-spacing:3px;margin-bottom:44px;}
.bar-wrap{width:210px;}
.bar-track{width:100%;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;position:relative;}
.bar-fill{height:100%;width:0%;border-radius:2px;transition:width .1s linear;background:#fff;}
.bar-shim{position:absolute;top:0;left:-60%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shim 1.4s ease-in-out infinite;}
@keyframes shim{to{left:140%;}}
.bar-txt{font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.2);font-size:10px;text-align:center;margin-top:10px;letter-spacing:2px;}
.ver{position:fixed;bottom:20px;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.08);letter-spacing:2px;}
</style>
</head>
<body>
<div class="splash">
  <div class="pepe-area">
    <div id="lottie-pepe"></div>
    <div id="pepe-fallback">🐸</div>
  </div>
  <div class="brand">TOPLUCK</div>
  <div class="tag">// испытай удачу //</div>
  <div class="bar-wrap">
    <div class="bar-track">
      <div class="bar-fill" id="bfill"></div>
      <div class="bar-shim"></div>
    </div>
    <div class="bar-txt" id="btxt">loading...</div>
  </div>
</div>
<div class="ver">v3.0</div>
<script>
(function(){try{const d=localStorage.getItem('__tl_dev_uid__');if(!d)return;const uid=parseInt(d);if(!uid)return;const tg=window.Telegram?.WebApp;if(!tg)return;if(!tg.initDataUnsafe)tg.initDataUnsafe={};if(!tg.initDataUnsafe.user)tg.initDataUnsafe.user={};tg.initDataUnsafe.user.id=uid;}catch(_){}})();
const tgApp=window.Telegram?.WebApp;
if(tgApp){tgApp.expand();tgApp.ready();}
const _u=tgApp?.initDataUnsafe?.user;
const _real=tgApp?.initData&&tgApp.initData.length>0;
if(_real){try{localStorage.removeItem('__tl_dev_uid__');localStorage.removeItem('__tl_dev_debug__');}catch(_){}}
if(!_u||!_u.id)window.location.replace('not_telegram.html');
try{if(_u?.id)sessionStorage.setItem('__tl_uid__',String(_u.id));}catch(_){}
try{
  lottie.loadAnimation({
    container:document.getElementById('lottie-pepe'),
    renderer:'svg',loop:true,autoplay:true,
    path:'AnimatedSticker.tgs'
  });
}catch(e){
  document.getElementById('lottie-pepe').style.display='none';
  document.getElementById('pepe-fallback').style.display='flex';
}
const fill=document.getElementById('bfill');
const txt=document.getElementById('btxt');
const msgs=['connecting...','verifying...','loading assets...','почти готово...','welcome!'];
let pct=0,mi=0;
const iv=setInterval(()=>{
  pct=Math.min(100,pct+Math.random()*11+4);
  fill.style.width=pct+'%';
  const m=Math.floor(pct/22);
  if(m<msgs.length&&m>mi){mi=m;txt.textContent=msgs[m];}
  if(pct>=100){clearInterval(iv);txt.textContent='ready!';setTimeout(()=>{window.location.href='main.html';},380);}
},170);
</script>
</body>
</html>
