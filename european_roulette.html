<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Европейская рулетка — TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})()</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{
  --bg:#06060F;--bg2:#0C0C1A;--bg3:#12122A;
  --white:#FFF;--gray1:#E0E0E0;--gray2:#AAA;
  --green:#00FF88;--red:#FF3B55;--gold:#FFD600;
  --purple:#9B5DFF;--cyan:#00E5FF;--pink:#FF2D6B;
  --text:#F0EFFF;--muted:#52527A;--muted2:#7A7AAA;
  --card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --font-d:'Bebas Neue',sans-serif;--font-ui:'Exo 2',sans-serif;--font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse 60% 40% at 50% -10%,rgba(155,93,255,.1) 0%,transparent 60%),
             radial-gradient(ellipse 40% 30% at 90% 90%,rgba(0,229,255,.06) 0%,transparent 60%);}

/* TOPBAR — убираем чёрную полоску */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top));
  position:sticky;top:0;z-index:50;
  background:rgba(6,6,15,.92);backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.fp-back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:22px;cursor:pointer;font-weight:700;}
.fp-title{font-family:var(--font-d);font-size:18px;color:var(--white);letter-spacing:2px;}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(255,214,0,.1);border:1px solid rgba(255,214,0,.25);border-radius:12px;padding:7px 12px;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--gold);}

/* TOAST */
.toast{position:fixed;top:80px;left:14px;right:14px;z-index:500;background:rgba(12,12,26,.97);border:1px solid var(--border2);backdrop-filter:blur(20px);border-radius:16px;padding:13px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-120px);opacity:0;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{color:var(--green);border-color:rgba(0,255,136,.3);}
.toast.err{color:var(--red);border-color:rgba(255,59,85,.3);}
.toast.info{color:var(--cyan);border-color:rgba(0,229,255,.3);}

/* WHEEL HERO */
.wheel-hero{
  background:linear-gradient(180deg,#06050F 0%,#0D0B1F 50%,#06050F 100%);
  padding:20px 0 16px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  border-bottom:1px solid rgba(255,255,255,.06);
  position:relative;overflow:hidden;
}
.wheel-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(155,93,255,.06) 0%,transparent 65%);}

/* Outer decorative ring */
.wheel-frame{
  position:relative;width:280px;height:280px;
  filter:drop-shadow(0 0 30px rgba(155,93,255,.2));
}
.wheel-frame::before{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,#9B5DFF33,#00E5FF33,#FFD60033,#FF2D6B33,#9B5DFF33);
  animation:ring-spin 8s linear infinite;
  mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));
}
@keyframes ring-spin{to{transform:rotate(360deg);}}
.wheel-frame::after{
  content:'';position:absolute;inset:-10px;border-radius:50%;
  background:conic-gradient(from 180deg,#9B5DFF22,#00E5FF22,#FFD60022,#FF2D6B22,#9B5DFF22);
  animation:ring-spin 14s linear infinite reverse;
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
}

#wheel-canvas{position:absolute;inset:0;border-radius:50%;width:280px;height:280px;}

/* Pointer (triangle) at TOP */
.wheel-pointer{
  position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:10px solid transparent;border-right:10px solid transparent;
  border-top:22px solid var(--gold);
  filter:drop-shadow(0 0 8px rgba(255,214,0,.9));
  z-index:10;
}

/* RESULT BAND */
.result-band{
  display:flex;align-items:center;gap:16px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;padding:12px 24px;
  min-width:220px;justify-content:center;
}
.res-number{font-family:var(--font-mono);font-size:48px;font-weight:700;line-height:1;transition:all .3s;}
.res-number.red{color:var(--red);text-shadow:0 0 24px rgba(255,59,85,.6);}
.res-number.black{color:#ccc;text-shadow:0 0 16px rgba(200,200,220,.3);}
.res-number.green{color:var(--green);text-shadow:0 0 24px rgba(0,255,136,.6);}
.res-label{font-size:14px;font-weight:600;color:var(--muted2);line-height:1.4;}
.res-label b{display:block;font-size:20px;color:var(--text);}

/* BET SECTION */
.bet-section{padding:14px;}
.section-tag{font-family:var(--font-mono);font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}

.bet-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.bet-lbl{color:var(--muted2);font-size:12px;white-space:nowrap;font-weight:600;font-family:var(--font-mono);}
.bet-inp{
  flex:1;background:rgba(0,0,0,.5);border:1px solid var(--border2);
  border-radius:12px;padding:10px 12px;color:var(--white);
  font-family:var(--font-mono);font-size:18px;outline:none;text-align:center;width:0;
}
.bet-inp:focus{border-color:rgba(155,93,255,.5);box-shadow:0 0 0 2px rgba(155,93,255,.12);}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.qb{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:9px;padding:7px 12px;color:var(--gray2);font-size:11px;font-weight:700;
  cursor:pointer;font-family:var(--font-mono);transition:all .12s;
}
.qb:active{background:rgba(155,93,255,.2);border-color:rgba(155,93,255,.4);color:var(--white);}

/* BET TYPE GRID */
.btypes{display:grid;gap:8px;margin-bottom:10px;}
.btypes.cols3{grid-template-columns:repeat(3,1fr);}
.btypes.cols2{grid-template-columns:repeat(2,1fr);}
.bt{
  border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;
  font-size:13px;font-weight:700;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);
  color:var(--text);transition:all .15s;user-select:none;position:relative;overflow:hidden;
}
.bt::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .15s;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.08),transparent 70%);}
.bt:active::before{opacity:1;}
.bt-s{font-size:10px;color:var(--muted2);margin-top:4px;font-family:var(--font-mono);}

.bt.r{border-color:rgba(255,59,85,.2);}
.bt.r.sel{background:rgba(255,59,85,.15);border-color:rgba(255,59,85,.6);color:#ff6b7a;box-shadow:0 0 14px rgba(255,59,85,.15);}
.bt.bl{border-color:rgba(200,200,220,.1);}
.bt.bl.sel{background:rgba(200,200,220,.08);border-color:rgba(200,200,220,.3);color:#ddd;box-shadow:0 0 14px rgba(200,200,220,.1);}
.bt.g{border-color:rgba(0,255,136,.15);}
.bt.g.sel{background:rgba(0,255,136,.1);border-color:rgba(0,255,136,.45);color:#00FF88;box-shadow:0 0 14px rgba(0,255,136,.12);}
.bt.o{border-color:rgba(155,93,255,.15);}
.bt.o.sel{background:rgba(155,93,255,.12);border-color:rgba(155,93,255,.45);color:#bf99ff;box-shadow:0 0 14px rgba(155,93,255,.12);}

/* SPIN BTN */
.spin-btn{
  width:100%;padding:17px;
  background:linear-gradient(135deg,#9B5DFF,#7B3DDF);
  border:none;border-radius:16px;
  color:#fff;font-family:var(--font-d);font-size:22px;letter-spacing:2px;
  cursor:pointer;
  box-shadow:0 4px 24px rgba(155,93,255,.35),inset 0 1px 0 rgba(255,255,255,.2);
  transition:opacity .15s,transform .1s,box-shadow .15s;
}
.spin-btn:active{transform:scale(.98);opacity:.9;}
.spin-btn:disabled{opacity:.3;cursor:not-allowed;}
.spin-btn:not(:disabled):hover{box-shadow:0 6px 32px rgba(155,93,255,.5);}

/* HISTORY PILLS */
.hist-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 14px;}
.hp{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:11px;font-weight:700;
  flex-shrink:0;animation:hp-in .25s cubic-bezier(.34,1.5,.64,1) both;
}
@keyframes hp-in{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.hp.red{background:rgba(255,59,85,.2);border:1px solid rgba(255,59,85,.4);color:#FF3B55;}
.hp.black{background:rgba(180,180,200,.1);border:1px solid rgba(180,180,200,.2);color:#bbb;}
.hp.green{background:rgba(0,255,136,.12);border:1px solid rgba(0,255,136,.35);color:#00FF88;}

/* PAYOUT TABLE */
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;}
.pay-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
.pay-name{font-size:12px;color:var(--muted2);margin-bottom:3px;}
.pay-val{font-family:var(--font-mono);font-size:15px;color:var(--gray1);font-weight:700;}
.sec-head{font-family:var(--font-mono);font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;padding:0 14px 8px;}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="toast" id="toast"></div>

<div class="topbar">
  <button class="fp-back" onclick="location.href='main.html?tab=games'">‹</button>
  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-size:18px">🎰</span>
    <span class="fp-title">ЕВРОП. РУЛЕТКА</span>
  </div>
  <div class="bal-chip">🪙 <span id="r-bal">—</span></div>
</div>

<!-- WHEEL HERO -->
<div class="wheel-hero">
  <div class="wheel-frame">
    <div class="wheel-pointer"></div>
    <canvas id="wheel-canvas" width="280" height="280"></canvas>
  </div>
  <div class="result-band">
    <div class="res-number" id="res-num" style="color:var(--muted)">—</div>
    <div class="res-label" id="res-lbl">Крутите<br>колесо!</div>
  </div>
</div>

<!-- HISTORY -->
<div class="hist-row" id="hist-row"></div>

<!-- BET -->
<div class="bet-section">
  <div class="section-tag">// ставка</div>
  <div class="bet-row">
    <span class="bet-lbl">🪙</span>
    <input class="bet-inp" id="bet-inp" type="number" min="1" value="10" inputmode="numeric">
  </div>
  <div class="qb-row">
    <div class="qb" onclick="sb(10)">10</div>
    <div class="qb" onclick="sb(25)">25</div>
    <div class="qb" onclick="sb(50)">50</div>
    <div class="qb" onclick="sb(100)">100</div>
    <div class="qb" onclick="sbAll()">MAX</div>
    <div class="qb" onclick="sbHalf()">½</div>
  </div>

  <div class="section-tag">// тип ставки</div>
  <div class="btypes cols3" style="margin-bottom:8px">
    <div class="bt r" data-bet="red" onclick="selBet(this)">🔴 Красное<div class="bt-s">×2</div></div>
    <div class="bt bl" data-bet="black" onclick="selBet(this)">⚫ Чёрное<div class="bt-s">×2</div></div>
    <div class="bt g" data-bet="green" onclick="selBet(this)">🟢 Зеро<div class="bt-s">×14</div></div>
  </div>
  <div class="btypes cols2" style="margin-bottom:8px">
    <div class="bt o" data-bet="even" onclick="selBet(this)">Чётное<div class="bt-s">×2</div></div>
    <div class="bt o" data-bet="odd" onclick="selBet(this)">Нечётное<div class="bt-s">×2</div></div>
  </div>
  <div class="btypes cols2" style="margin-bottom:8px">
    <div class="bt o" data-bet="low" onclick="selBet(this)">1–18<div class="bt-s">×2</div></div>
    <div class="bt o" data-bet="high" onclick="selBet(this)">19–36<div class="bt-s">×2</div></div>
  </div>
  <div class="btypes cols2" style="margin-bottom:16px">
    <div class="bt o" data-bet="dozen1" onclick="selBet(this)">1–12<div class="bt-s">×3</div></div>
    <div class="bt o" data-bet="dozen2" onclick="selBet(this)">13–24<div class="bt-s">×3</div></div>
  </div>

  <button class="spin-btn" id="spin-btn" onclick="spinEuro()">🎰 КРУТИТЬ</button>
</div>

<!-- PAYOUTS -->
<div class="sec-head" style="margin-top:8px">// выплаты</div>
<div class="pay-grid">
  <div class="pay-item"><div class="pay-name">Красное / Чёрное</div><div class="pay-val">×2</div></div>
  <div class="pay-item"><div class="pay-name">Чётное / Нечётное</div><div class="pay-val">×2</div></div>
  <div class="pay-item"><div class="pay-name">1–18 / 19–36</div><div class="pay-val">×2</div></div>
  <div class="pay-item"><div class="pay-name">1–12 / 13–24</div><div class="pay-val">×3</div></div>
  <div class="pay-item"><div class="pay-name">Зеро</div><div class="pay-val">×14</div></div>
  <div class="pay-item"><div class="pay-name">Преимущество казино</div><div class="pay-val">2.7%</div></div>
</div>
<div style="height:40px"></div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
const UID=tg?.initDataUnsafe?.user?.id||0;

// ── ROULETTE NUMBERS (European order) ──
const NUMS=[
  {n:0,c:'green'},{n:32,c:'red'},{n:15,c:'black'},{n:19,c:'red'},{n:4,c:'black'},
  {n:21,c:'red'},{n:2,c:'black'},{n:25,c:'red'},{n:17,c:'black'},{n:34,c:'red'},
  {n:6,c:'black'},{n:27,c:'red'},{n:13,c:'black'},{n:36,c:'red'},{n:11,c:'black'},
  {n:30,c:'red'},{n:8,c:'black'},{n:23,c:'red'},{n:10,c:'black'},{n:5,c:'red'},
  {n:24,c:'black'},{n:16,c:'red'},{n:33,c:'black'},{n:1,c:'red'},{n:20,c:'black'},
  {n:14,c:'red'},{n:31,c:'black'},{n:9,c:'red'},{n:22,c:'black'},{n:18,c:'red'},
  {n:29,c:'black'},{n:7,c:'red'},{n:28,c:'black'},{n:12,c:'red'},{n:35,c:'black'},
  {n:3,c:'red'},{n:26,c:'black'}
];
const N=NUMS.length;
const SLICE=(Math.PI*2)/N;

function sectorUnderPointer(angle){
  const TAU=Math.PI*2;
  const norm=((-angle)%TAU+TAU)%TAU;
  return Math.floor(norm/SLICE)%N;
}

let userData=null,selBetType=null,spinning=false;
let wheelAngle=0,idleReq=null,animReq=null;
let history=[];

function toast(m,t='info'){
  const el=document.getElementById('toast');
  el.textContent=m;el.className='toast '+t;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}
async function get(url){const r=await fetch(url);return r.json();}
async function post(url,d){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return r.json();}

async function initUser(){
  if(!UID)return;
  const _isDevMode=!!localStorage.getItem('__tl_dev_uid__');
  try{
    if(_isDevMode){userData=await get(`/api/user/${UID}`).catch(()=>null);}
    else{const tgO=window.Telegram?.WebApp;userData=await post('/api/ensure_user',{user_id:UID,username:tgO?.initDataUnsafe?.user?.username||'',first_name:tgO?.initDataUnsafe?.user?.first_name||''});}
  }catch(e){userData=await get(`/api/user/${UID}`).catch(()=>null);}
  if(userData)document.getElementById('r-bal').textContent=userData.balance??0;
}

function addHistory(n,c){
  history.unshift({n,c});
  if(history.length>16)history=history.slice(0,16);
  const row=document.getElementById('hist-row');
  row.innerHTML=history.map(h=>`<div class="hp ${h.c}">${h.n}</div>`).join('');
}

// ── DRAW WHEEL ──
function drawWheel(angle,winIdx=-1){
  const canvas=document.getElementById('wheel-canvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,r=W/2-2;
  ctx.clearRect(0,0,W,H);

  // Dark base
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='#07060F';ctx.fill();

  // Draw sectors
  for(let i=0;i<N;i++){
    const sa=angle+i*SLICE-Math.PI/2;
    const ea=sa+SLICE;
    const{n,c}=NUMS[i];
    const isWin=(i===winIdx);

    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r-2,sa,ea);ctx.closePath();

    if(isWin){
      const ma=sa+SLICE/2;
      const gx=cx+Math.cos(ma)*(r*.5),gy=cy+Math.sin(ma)*(r*.5);
      const grad=ctx.createRadialGradient(gx,gy,0,gx,gy,r*.7);
      if(c==='red'){grad.addColorStop(0,'#FF5566');grad.addColorStop(1,'#C0131E');}
      else if(c==='black'){grad.addColorStop(0,'#6655CC');grad.addColorStop(1,'#1A1535');}
      else{grad.addColorStop(0,'#00FF88');grad.addColorStop(1,'#0D7040');}
      ctx.fillStyle=grad;
    }else{
      if(c==='red')ctx.fillStyle='#A80F18';
      else if(c==='black')ctx.fillStyle='#141226';
      else ctx.fillStyle='#0B6035';
    }
    ctx.fill();

    // Winner glow
    if(isWin){
      ctx.save();
      ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;
      ctx.shadowColor='rgba(255,255,255,.7)';ctx.shadowBlur=12;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r-2,sa,ea);ctx.closePath();ctx.stroke();
      ctx.restore();
    }else{
      ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=.8;ctx.stroke();
    }

    // Gold divider
    ctx.save();ctx.strokeStyle='rgba(255,214,0,.25)';ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(sa)*(r*.52),cy+Math.sin(sa)*(r*.52));
    ctx.lineTo(cx+Math.cos(sa)*(r-2),cy+Math.sin(sa)*(r-2));ctx.stroke();ctx.restore();

    // Number
    const ma=sa+SLICE/2;const tr=r*.74;
    ctx.save();
    ctx.translate(cx+Math.cos(ma)*tr,cy+Math.sin(ma)*tr);ctx.rotate(ma+Math.PI/2);
    ctx.fillStyle=isWin?'#fff':'rgba(255,255,255,.85)';
    ctx.font=`bold ${n===0?11:9}px 'JetBrains Mono',monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(isWin){ctx.shadowColor='rgba(255,255,200,1)';ctx.shadowBlur=8;}
    ctx.fillText(n,0,0);ctx.restore();
  }

  // Outer ring
  ctx.beginPath();ctx.arc(cx,cy,r-1,0,Math.PI*2);
  ctx.strokeStyle='rgba(155,93,255,.5)';ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle='rgba(255,214,0,.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy,r-3,0,Math.PI*2);ctx.stroke();

  // Hub
  const hubR=r*.14;
  const hg=ctx.createRadialGradient(cx,cy,0,cx,cy,hubR);
  hg.addColorStop(0,'#9B5DFF');hg.addColorStop(.5,'#5B2DBF');hg.addColorStop(1,'#1A0A40');
  ctx.beginPath();ctx.arc(cx,cy,hubR,0,Math.PI*2);ctx.fillStyle=hg;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.arc(cx-hubR*.25,cy-hubR*.3,hubR*.2,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.fill();

  // Spokes
  for(let i=0;i<12;i++){
    const a=angle+i*Math.PI/6;
    ctx.save();ctx.strokeStyle='rgba(155,93,255,.15)';ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*hubR*1.4,cy+Math.sin(a)*hubR*1.4);
    ctx.lineTo(cx+Math.cos(a)*(r*.52),cy+Math.sin(a)*(r*.52));ctx.stroke();ctx.restore();
  }
}

function startIdleAnim(){
  function frame(){wheelAngle+=.002;drawWheel(wheelAngle);idleReq=requestAnimationFrame(frame);}
  idleReq=requestAnimationFrame(frame);
}
function stopIdleAnim(){if(idleReq){cancelAnimationFrame(idleReq);idleReq=null;}}

function selBet(el){
  document.querySelectorAll('.bt').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');selBetType=el.dataset.bet;
}
function sb(v){document.getElementById('bet-inp').value=v;}
function sbAll(){document.getElementById('bet-inp').value=userData?.balance||0;}
function sbHalf(){document.getElementById('bet-inp').value=Math.max(1,Math.floor((userData?.balance||0)/2));}

async function spinEuro(){
  if(spinning)return;
  if(!selBetType){toast('Выберите тип ставки!','err');return;}
  const bet=parseInt(document.getElementById('bet-inp').value)||0;
  if(bet<1){toast('Введите ставку!','err');return;}
  if(bet>(userData?.balance||0)){toast('Недостаточно монет!','err');return;}
  if(typeof SND!=='undefined')SND.play('spin');

  spinning=true;stopIdleAnim();
  document.getElementById('spin-btn').disabled=true;
  document.getElementById('res-num').textContent='…';
  document.getElementById('res-num').style.color='var(--muted)';
  document.getElementById('res-lbl').innerHTML='🎰 Вращается...';

  const res=await post('/api/spin',{user_id:UID,bet,bet_type:selBetType}).catch(()=>null);
  if(!res||res.error){
    toast(res?.error||'Ошибка сервера','err');
    spinning=false;document.getElementById('spin-btn').disabled=false;
    startIdleAnim();return;
  }

  const targetIdx=res.result_index;
  const PI2=Math.PI*2;const SPIN_DURATION=5500;
  const startA=wheelAngle;
  const exactTarget=-targetIdx*SLICE-SLICE/2;
  const jitter=(Math.random()-.5)*SLICE*.65;
  const targetA=exactTarget+jitter;
  let travel=startA-targetA;
  travel=((travel%PI2)+PI2)%PI2;
  travel+=8*PI2;
  const finalA=startA-travel;
  const t0=performance.now();

  function easeOut(t){return 1-Math.pow(1-t,4.5);}

  function frame(now){
    const elapsed=now-t0;
    const t=Math.min(1,elapsed/SPIN_DURATION);
    const eT=easeOut(t);
    const wA=startA+(finalA-startA)*eT;

    drawWheel(wA,t>=.94?targetIdx:-1);

    // Live number display
    const liveIdx=sectorUnderPointer(wA);
    const live=NUMS[liveIdx];
    const numEl=document.getElementById('res-num');
    numEl.textContent=live.n;
    numEl.className='res-number '+live.c;
    const ico=live.c==='green'?'🟢':live.c==='red'?'🔴':'⚫';
    if(t<.94){
      document.getElementById('res-lbl').innerHTML=`${ico}<br>${live.c==='green'?'Зеро':live.c==='red'?'Красное':'Чёрное'}`;
    }

    if(t<1){animReq=requestAnimationFrame(frame);return;}

    // Finished
    wheelAngle=wA%PI2;
    drawWheel(wheelAngle,targetIdx);
    const ico2=res.result_c==='green'?'🟢':res.result_c==='red'?'🔴':'⚫';
    numEl.textContent=res.result_n;
    numEl.className='res-number '+res.result_c;

    const colorName=res.result_c==='green'?'Зеро':res.result_c==='red'?'Красное':'Чёрное';

    if(res.won){
      if(typeof SND!=='undefined')SND.play('win');
      document.getElementById('res-lbl').innerHTML=`${ico2}<br><b style="color:var(--green)">+${res.gain} 🪙</b>`;
      toast(`${ico2} ${res.result_n} — +${res.gain} монет!`,'ok');
    }else{
      if(typeof SND!=='undefined')SND.play('lose');
      document.getElementById('res-lbl').innerHTML=`${ico2} ${colorName}<br><b style="color:var(--red)">-${bet} 🪙</b>`;
      toast(`${ico2} ${res.result_n} ${colorName} — Проигрыш`,'err');
    }

    if(userData)userData.balance=res.new_balance;
    document.getElementById('r-bal').textContent=res.new_balance??0;
    addHistory(res.result_n,res.result_c);

    spinning=false;document.getElementById('spin-btn').disabled=false;
    setTimeout(()=>{
      document.getElementById('res-lbl').innerHTML=`${ico2}<br>${colorName}`;
      startIdleAnim();
    },3000);
  }
  animReq=requestAnimationFrame(frame);
}

initUser();
drawWheel(0);
startIdleAnim();
</script>

(function(){let _ctx=null;function _c(){if(!_ctx)_ctx=new(window.AudioContext||window.webkitAudioContext)();return _ctx;}function _on(){try{return localStorage.getItem("topluck_sounds")==="1";}catch(e){return false;}}window.SND={play:function(type){if(!_on())return;try{const ctx=_c(),g=ctx.createGain(),o=ctx.createOscillator();g.connect(ctx.destination);o.connect(g);const t=ctx.currentTime;if(type==="win"){o.type="sine";[523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.1));g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.75);o.start(t);o.stop(t+.75);}else if(type==="lose"){o.type="sawtooth";o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(70,t+.45);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);}else if(type==="spin"){o.type="sine";o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(600,t+1.5);g.gain.setValueAtTime(.1,t);g.gain.linearRampToValueAtTime(.05,t+1.4);g.gain.exponentialRampToValueAtTime(.001,t+2);o.start(t);o.stop(t+2);}}catch(e){}}};})();
