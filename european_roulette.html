<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Европейская рулетка — TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})()</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{
  --bg:#06060F;--bg2:#0C0C1A;
  --white:#FFF;--gray1:#E0E0E0;--gray2:#AAA;--gray3:#555;
  --green:#00FF88;--red:#FF3B55;--gold:#FFD600;--purple:#9B5DFF;--cyan:#00E5FF;
  --text:#F0EFFF;--muted:#52527A;--muted2:#7A7AAA;
  --card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.13);
  --fd:'Bebas Neue',sans-serif;--fu:'Exo 2',sans-serif;--fm:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--fu);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}
.amb{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse 50% 35% at 50% 0%,rgba(255,255,255,.03) 0%,transparent 60%);}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;background:rgba(6,6,15,.94);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.fp-back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:22px;cursor:pointer;font-weight:700;}
.fp-title{font-family:var(--fd);font-size:18px;color:var(--white);letter-spacing:2px;}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(255,214,0,.1);border:1px solid rgba(255,214,0,.25);border-radius:12px;padding:7px 12px;font-family:var(--fm);font-size:13px;font-weight:700;color:var(--gold);}
/* ── TOAST ── */
.toast{position:fixed;top:80px;left:14px;right:14px;z-index:500;background:rgba(6,6,15,.97);border:1px solid var(--border2);backdrop-filter:blur(20px);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-80px);opacity:0;transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{color:var(--green);border-color:rgba(0,255,136,.3);}
.toast.err{color:var(--red);border-color:rgba(255,59,85,.3);}
.toast.info{color:var(--cyan);border-color:rgba(0,229,255,.3);}

/* ── WHEEL SECTION ── */
.wheel-section{background:rgba(0,0,0,.35);padding:20px 0 18px;display:flex;flex-direction:column;align-items:center;gap:14px;border-bottom:1px solid var(--border);position:relative;}
.wheel-frame{position:relative;width:272px;height:272px;}
#wc{position:absolute;inset:0;border-radius:50%;}
/* Gold pointer — same triangle as GTA */
.w-ptr{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:22px solid var(--gold);filter:drop-shadow(0 0 8px rgba(255,214,0,.9));z-index:10;}

/* Result band */
.res-band{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:11px 22px;min-width:200px;justify-content:center;}
.res-num{font-family:var(--fm);font-size:46px;font-weight:700;line-height:1;min-width:60px;text-align:center;transition:color .2s;}
.res-num.red{color:var(--red);text-shadow:0 0 20px rgba(255,59,85,.5);}
.res-num.black{color:#ccc;text-shadow:0 0 14px rgba(180,180,200,.3);}
.res-num.green{color:var(--green);text-shadow:0 0 20px rgba(0,255,136,.5);}
.res-lbl{font-size:13px;font-weight:600;color:var(--muted2);line-height:1.5;text-align:left;}

/* History pills */
.hist{display:flex;gap:5px;flex-wrap:wrap;padding:0 14px 4px;min-height:18px;}
.hp{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:10px;font-weight:700;flex-shrink:0;animation:hpin .2s cubic-bezier(.34,1.5,.64,1) both;}
@keyframes hpin{from{transform:scale(0);}to{transform:scale(1);}}
.hp.red{background:rgba(255,59,85,.15);border:1px solid rgba(255,59,85,.35);color:var(--red);}
.hp.black{background:rgba(180,180,200,.08);border:1px solid rgba(180,180,200,.2);color:#bbb;}
.hp.green{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.3);color:var(--green);}

/* ── BET SECTION ── */
.bet-wrap{padding:14px;}
.stag{font-family:var(--fm);font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.bet-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.bet-lbl{color:var(--muted2);font-size:12px;font-weight:600;font-family:var(--fm);white-space:nowrap;}
.bet-inp{flex:1;background:rgba(0,0,0,.5);border:1px solid var(--border2);border-radius:12px;padding:10px 12px;color:var(--white);font-family:var(--fm);font-size:18px;outline:none;text-align:center;width:0;}
.bet-inp:focus{border-color:rgba(255,255,255,.3);}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.qb{background:var(--card);border:1px solid var(--border2);border-radius:9px;padding:7px 12px;color:var(--gray1);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--fm);transition:all .12s;}
.qb:active{background:rgba(255,255,255,.12);color:var(--white);}

/* Bet type buttons */
.btypes{display:grid;gap:8px;margin-bottom:10px;}
.btypes.c3{grid-template-columns:repeat(3,1fr);}
.btypes.c2{grid-template-columns:repeat(2,1fr);}
.bt{border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--text);transition:all .15s;user-select:none;}
.bt-s{font-size:10px;color:var(--muted2);margin-top:4px;font-family:var(--fm);}
.bt.r{border-color:rgba(255,59,85,.2);}
.bt.r.sel{background:rgba(255,59,85,.14);border-color:rgba(255,59,85,.55);color:#ff7080;}
.bt.bl{border-color:rgba(180,180,200,.12);}
.bt.bl.sel{background:rgba(180,180,200,.08);border-color:rgba(180,180,200,.3);color:#ddd;}
.bt.g{border-color:rgba(0,255,136,.14);}
.bt.g.sel{background:rgba(0,255,136,.09);border-color:rgba(0,255,136,.4);color:#00FF88;}
.bt.o{border-color:rgba(255,255,255,.1);}
.bt.o.sel{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:var(--white);}

/* Spin button */
.spin-btn{width:100%;padding:16px;background:var(--white);border:none;border-radius:14px;color:#000;font-family:var(--fd);font-size:22px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 20px rgba(255,255,255,.12);transition:opacity .15s,transform .1s;}
.spin-btn:active{transform:scale(.98);}
.spin-btn:disabled{opacity:.35;cursor:not-allowed;}
</style>
</head>
<body>
<div class="amb"></div>
<div class="toast" id="toast"></div>
<div class="topbar">
  <button class="fp-back" onclick="location.href='main.html?tab=games'">‹</button>
  <div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">🎰</span><span class="fp-title">ЕВРОП. РУЛЕТКА</span></div>
  <div class="bal-chip">🪙 <span id="r-bal">—</span></div>
</div>

<div class="wheel-section">
  <div class="wheel-frame">
    <div class="w-ptr"></div>
    <canvas id="wc" width="272" height="272"></canvas>
  </div>
  <div class="res-band">
    <div class="res-num" id="res-num" style="color:var(--muted)">—</div>
    <div class="res-lbl" id="res-lbl">Выберите<br>ставку</div>
  </div>
</div>
<div class="hist" id="hist"></div>

<div class="bet-wrap">
  <div class="stag">// ставка</div>
  <div class="bet-row">
    <span class="bet-lbl">🪙</span>
    <input class="bet-inp" id="bet-inp" type="number" min="1" value="10" inputmode="numeric">
  </div>
  <div class="qb-row">
    <div class="qb" onclick="sb(10)">10</div><div class="qb" onclick="sb(25)">25</div>
    <div class="qb" onclick="sb(50)">50</div><div class="qb" onclick="sb(100)">100</div>
    <div class="qb" onclick="sbAll()">MAX</div><div class="qb" onclick="sbHalf()">½</div>
  </div>
  <div class="stag">// тип ставки</div>
  <div class="btypes c3" style="margin-bottom:8px">
    <div class="bt r" data-bet="red" onclick="selBet(this)">🔴 Красное<div class="bt-s">×2</div></div>
    <div class="bt bl" data-bet="black" onclick="selBet(this)">⚫ Чёрное<div class="bt-s">×2</div></div>
    <div class="bt g" data-bet="green" onclick="selBet(this)">🟢 Зеро<div class="bt-s">×14</div></div>
  </div>
  <div class="btypes c2" style="margin-bottom:8px">
    <div class="bt o" data-bet="even" onclick="selBet(this)">Чётное<div class="bt-s">×2</div></div>
    <div class="bt o" data-bet="odd" onclick="selBet(this)">Нечётное<div class="bt-s">×2</div></div>
  </div>
  <div class="btypes c2" style="margin-bottom:8px">
    <div class="bt o" data-bet="low" onclick="selBet(this)">1–18<div class="bt-s">×2</div></div>
    <div class="bt o" data-bet="high" onclick="selBet(this)">19–36<div class="bt-s">×2</div></div>
  </div>
  <div class="btypes c2" style="margin-bottom:16px">
    <div class="bt o" data-bet="dozen1" onclick="selBet(this)">1–12<div class="bt-s">×3</div></div>
    <div class="bt o" data-bet="dozen2" onclick="selBet(this)">13–24<div class="bt-s">×3</div></div>
  </div>
  <button class="spin-btn" id="spin-btn" onclick="spinEuro()">🎰 КРУТИТЬ</button>
</div>
<div style="height:30px"></div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
const UID=tg?.initDataUnsafe?.user?.id||0;

const NUMS=[
  {n:0,c:'green'},{n:32,c:'red'},{n:15,c:'black'},{n:19,c:'red'},{n:4,c:'black'},
  {n:21,c:'red'},{n:2,c:'black'},{n:25,c:'red'},{n:17,c:'black'},{n:34,c:'red'},
  {n:6,c:'black'},{n:27,c:'red'},{n:13,c:'black'},{n:36,c:'red'},{n:11,c:'black'},
  {n:30,c:'red'},{n:8,c:'black'},{n:23,c:'red'},{n:10,c:'black'},{n:5,c:'red'},
  {n:24,c:'black'},{n:16,c:'red'},{n:33,c:'black'},{n:1,c:'red'},{n:20,c:'black'},
  {n:14,c:'red'},{n:31,c:'black'},{n:9,c:'red'},{n:22,c:'black'},{n:18,c:'red'},
  {n:29,c:'black'},{n:7,c:'red'},{n:28,c:'black'},{n:12,c:'red'},{n:35,c:'black'},
  {n:3,c:'red'},{n:26,c:'black'}
];
const N=NUMS.length,SLICE=Math.PI*2/N;
const canvas=document.getElementById('wc');
const ctx=canvas.getContext('2d');
const W=272,cx=W/2,cy=W/2,R=W/2-2;

let userData=null,selBetType=null,spinning=false;
let wheelAngle=0,idleReq=null,animReq=null,hist=[];

function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className='toast '+t+' show';setTimeout(()=>el.classList.remove('show'),2800);}
async function get(url){return fetch(url).then(r=>r.json());}
async function post(url,d){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json());}

async function initUser(){
  if(!UID)return;
  try{
    if(localStorage.getItem('__tl_dev_uid__'))userData=await get(`/api/user/${UID}`).catch(()=>null);
    else{const o=tg.initDataUnsafe.user;userData=await post('/api/ensure_user',{user_id:UID,username:o?.username||'',first_name:o?.first_name||''});}
  }catch(e){userData=await get(`/api/user/${UID}`).catch(()=>null);}
  if(userData)document.getElementById('r-bal').textContent=userData.balance??0;
}

function sectorUnder(a){const norm=((-a)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);return Math.floor(norm/SLICE)%N;}

function drawWheel(angle,winIdx=-1){
  ctx.clearRect(0,0,W,W);
  // Base
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle='#080812';ctx.fill();

  for(let i=0;i<N;i++){
    const sa=angle+i*SLICE-Math.PI/2,ea=sa+SLICE;
    const{n,c}=NUMS[i],win=(i===winIdx);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R-2,sa,ea);ctx.closePath();
    if(win){
      const ma=sa+SLICE/2,gx=cx+Math.cos(ma)*(R*.5),gy=cy+Math.sin(ma)*(R*.5);
      const g=ctx.createRadialGradient(gx,gy,0,gx,gy,R*.7);
      if(c==='red'){g.addColorStop(0,'#FF5566');g.addColorStop(1,'#B01020');}
      else if(c==='black'){g.addColorStop(0,'#6655CC');g.addColorStop(1,'#181530');}
      else{g.addColorStop(0,'#00FF88');g.addColorStop(1,'#0A6030');}
      ctx.fillStyle=g;
    }else{
      ctx.fillStyle=c==='red'?'#9A0E18':c==='black'?'#101025':'#0A5028';
    }
    ctx.fill();
    // Divider
    ctx.save();ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(sa)*(R*.5),cy+Math.sin(sa)*(R*.5));
    ctx.lineTo(cx+Math.cos(sa)*(R-2),cy+Math.sin(sa)*(R-2));ctx.stroke();ctx.restore();
    // Win border
    if(win){
      ctx.save();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.shadowColor='rgba(255,255,255,.6)';ctx.shadowBlur=10;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R-2,sa,ea);ctx.closePath();ctx.stroke();ctx.restore();
    }
    // Number
    const ma=sa+SLICE/2,tr=R*.73;
    ctx.save();ctx.translate(cx+Math.cos(ma)*tr,cy+Math.sin(ma)*tr);ctx.rotate(ma+Math.PI/2);
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font=`bold ${n===0?10:8}px 'JetBrains Mono',monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(win){ctx.shadowColor='rgba(255,255,200,1)';ctx.shadowBlur=7;}
    ctx.fillText(n,0,0);ctx.restore();
  }

  // Gold outer ring
  ctx.beginPath();ctx.arc(cx,cy,R-1,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,214,0,.4)';ctx.lineWidth=2;ctx.stroke();

  // Hub
  const hr=R*.13;
  const hg=ctx.createRadialGradient(cx,cy,0,cx,cy,hr);
  hg.addColorStop(0,'#555');hg.addColorStop(.5,'#222');hg.addColorStop(1,'#111');
  ctx.beginPath();ctx.arc(cx,cy,hr,0,Math.PI*2);ctx.fillStyle=hg;ctx.fill();
  ctx.strokeStyle='rgba(255,214,0,.4)';ctx.lineWidth=1;ctx.stroke();
  // Hub shine
  ctx.beginPath();ctx.arc(cx-hr*.25,cy-hr*.3,hr*.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();
}

function startIdle(){if(idleReq)return;(function frame(){wheelAngle+=.002;drawWheel(wheelAngle);idleReq=requestAnimationFrame(frame);})();}
function stopIdle(){if(idleReq){cancelAnimationFrame(idleReq);idleReq=null;}}

function addHist(n,c){
  hist.unshift({n,c});if(hist.length>16)hist=hist.slice(0,16);
  document.getElementById('hist').innerHTML=hist.map(h=>`<div class="hp ${h.c}">${h.n}</div>`).join('');
}
function selBet(el){document.querySelectorAll('.bt').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');selBetType=el.dataset.bet;}
function sb(v){document.getElementById('bet-inp').value=v;}
function sbAll(){sb(userData?.balance||0);}
function sbHalf(){sb(Math.max(1,Math.floor((userData?.balance||0)/2)));}

async function spinEuro(){
  if(spinning)return;
  if(!selBetType){toast('Выберите тип ставки!','err');return;}
  const bet=parseInt(document.getElementById('bet-inp').value)||0;
  if(bet<1){toast('Введите ставку!','err');return;}
  if(bet>(userData?.balance||0)){toast('Недостаточно монет!','err');return;}

  spinning=true;stopIdle();
  if(animReq){cancelAnimationFrame(animReq);animReq=null;}
  document.getElementById('spin-btn').disabled=true;
  document.getElementById('res-num').textContent='…';
  document.getElementById('res-num').style.color='var(--muted)';
  document.getElementById('res-lbl').innerHTML='🎰 Крутится...';

  const res=await post('/api/spin',{user_id:UID,bet,bet_type:selBetType}).catch(()=>null);
  if(!res||res.error){
    toast(res?.error||'Ошибка сервера','err');
    spinning=false;document.getElementById('spin-btn').disabled=false;startIdle();return;
  }

  const targetIdx=res.result_index;
  const PI2=Math.PI*2,DUR=5500;
  const startA=wheelAngle;
  // Place targetIdx sector center under pointer
  const exactTarget=-targetIdx*SLICE-SLICE/2;
  const jitter=(Math.random()-.5)*SLICE*.6;
  const targetA=exactTarget+jitter;
  let travel=startA-targetA;
  travel=((travel%PI2)+PI2)%PI2;
  travel+=8*PI2;
  const finalA=startA-travel;
  const t0=performance.now();
  function ease(t){return 1-Math.pow(1-t,4.5);}

  function frame(now){
    const elapsed=now-t0,t=Math.min(1,elapsed/DUR);
    const wA=startA+(finalA-startA)*ease(t);

    // During spin: show live sector
    const liveIdx=sectorUnderPointer(wA);
    const live=NUMS[liveIdx];
    const numEl=document.getElementById('res-num');
    numEl.textContent=live.n;
    numEl.className='res-num '+live.c;
    const ico=live.c==='green'?'🟢':live.c==='red'?'🔴':'⚫';
    if(t<.93)document.getElementById('res-lbl').innerHTML=`${ico}<br>`;

    drawWheel(wA,t>=.93?targetIdx:-1);

    if(t<1){animReq=requestAnimationFrame(frame);return;}

    // Done
    wheelAngle=wA%(PI2);animReq=null;
    drawWheel(wheelAngle,targetIdx);
    const ico2=res.result_c==='green'?'🟢':res.result_c==='red'?'🔴':'⚫';
    const cname=res.result_c==='green'?'Зеро':res.result_c==='red'?'Красное':'Чёрное';
    numEl.textContent=res.result_n;numEl.className='res-num '+res.result_c;
    if(res.won){
      document.getElementById('res-lbl').innerHTML=`${ico2}<br><b style="color:var(--green)">+${res.gain} 🪙</b>`;
      toast(`${ico2} ${res.result_n} — +${res.gain} 🪙`,'ok');
    }else{
      document.getElementById('res-lbl').innerHTML=`${ico2} ${cname}<br><b style="color:var(--red)">-${bet} 🪙</b>`;
      toast(`${ico2} ${res.result_n} ${cname} — проигрыш`,'err');
    }
    if(userData)userData.balance=res.new_balance;
    document.getElementById('r-bal').textContent=res.new_balance??0;
    addHist(res.result_n,res.result_c);
    spinning=false;document.getElementById('spin-btn').disabled=false;
    setTimeout(()=>{
      document.getElementById('res-lbl').innerHTML=`${ico2}<br>${cname}`;
      startIdle();
    },3000);
  }
  animReq=requestAnimationFrame(frame);
}

function sectorUnderPointer(a){const norm=((-a)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);return Math.floor(norm/SLICE)%N;}

initUser();drawWheel(0);startIdle();
</script>
