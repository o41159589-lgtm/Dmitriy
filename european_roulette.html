<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Европейская рулетка — TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="shared.js"></script>
<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── Keep original JS-referenced vars ── */
:root{
  --bg:#90C8E8;--bg2:#F4F8FF;
  --white:#1A2040;--gray1:#445080;--gray2:#8090B0;--gray3:#C0C8D8;
  --green:#1A9A50;--red:#D8284A;--gold:#A87800;--purple:#6030B0;--cyan:#1068A0;
  --text:#1A2040;--muted:#8090B0;--muted2:#A0AAB8;
  --card:rgba(255,255,255,0.88);--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.14);
  --fd:'Caveat',cursive;--fu:'Nunito',sans-serif;--fm:'Nunito',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  background:linear-gradient(175deg,#5AB0DC 0%,#7EC4E8 30%,#A0D4F0 60%,#C2E8F8 100%) fixed;
  color:var(--text);font-family:var(--fu);min-height:100vh;overflow-x:hidden;
}

/* Sky background fixed layer */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url('../textures/sky.svg');
  background-size:cover;background-position:top center;
}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,0.07);
  box-shadow:0 2px 12px rgba(0,30,70,0.10);
}
.fp-back{
  width:38px;height:38px;border-radius:12px;
  background:rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.10);
  display:flex;align-items:center;justify-content:center;
  color:var(--text);font-size:22px;cursor:pointer;font-weight:700;
}
.fp-title{
  font-family:'Nunito',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.5px;font-size:22px;font-weight:700;
  color:var(--text);letter-spacing:0;
}
.bal-chip{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.95);border:2px solid #FFD028;
  border-radius:14px;padding:7px 12px;
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#A87800;
}

/* ── TOAST ── */
.toast{
  position:fixed;top:80px;left:14px;right:14px;z-index:500;
  background:rgba(255,255,255,0.97);border:1.5px solid rgba(0,0,0,0.09);
  backdrop-filter:blur(20px);border-radius:16px;padding:12px 18px;
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;text-align:center;
  transform:translateY(-80px);opacity:0;
  transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;pointer-events:none;
  box-shadow:0 6px 24px rgba(0,30,70,0.14);color:var(--text);
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{color:#1A9A50;border-color:rgba(26,154,80,.3);}
.toast.err{color:#D8284A;border-color:rgba(216,40,74,.3);}
.toast.info{color:#1068A0;border-color:rgba(16,104,160,.2);}

/* ── WHEEL SECTION ── */
.wheel-section{
  background:rgba(255,255,255,0.55);
  padding:20px 0 18px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  border-bottom:1px solid rgba(0,0,0,0.07);
  position:relative;z-index:1;
  backdrop-filter:blur(8px);
}
.wheel-frame{position:relative;width:272px;height:272px;}
#wc{position:absolute;inset:0;border-radius:50%;filter:drop-shadow(0 8px 24px rgba(0,30,70,0.20));
  will-change:transform;transform:translateZ(0);backface-visibility:hidden;}
.w-ptr{
  position:absolute;top:-2px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:10px solid transparent;border-right:10px solid transparent;
  border-top:22px solid #FFD028;
  filter:drop-shadow(0 0 8px rgba(255,210,40,.9));z-index:10;
}

/* Result band */
.res-band{
  display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,0.92);border:2px solid rgba(255,255,255,0.80);
  border-radius:20px;padding:12px 24px;min-width:200px;justify-content:center;
  box-shadow:0 5px 18px rgba(0,30,80,0.11);
}
.res-num{font-style:normal;
  font-family:'Caveat',cursive;font-style:normal;font-size:52px;font-weight:700;line-height:1;
  min-width:60px;text-align:center;transition:color .2s;color:var(--muted2);
}
.res-num.red{color:#D8284A;text-shadow:0 0 20px rgba(216,40,74,0.35);}
.res-num.black{color:#2A2A3A;text-shadow:0 0 10px rgba(40,40,60,0.2);}
.res-num.green{color:#1A9A50;text-shadow:0 0 20px rgba(26,154,80,0.35);}
.res-lbl{font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--muted);line-height:1.5;text-align:left;}

/* History pills */
.hist{display:flex;gap:5px;flex-wrap:wrap;padding:10px 14px 4px;min-height:18px;position:relative;z-index:1;}
.hp{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Nunito',sans-serif;font-size:10px;font-weight:800;flex-shrink:0;
  animation:hpin .2s cubic-bezier(.34,1.5,.64,1) both;
}
@keyframes hpin{from{transform:scale(0);}to{transform:scale(1);}}
.hp.red{background:rgba(216,40,74,0.12);border:1.5px solid rgba(216,40,74,.30);color:#D8284A;}
.hp.black{background:rgba(40,40,60,0.08);border:1.5px solid rgba(40,40,60,.18);color:#2A2A3A;}
.hp.green{background:rgba(26,154,80,0.10);border:1.5px solid rgba(26,154,80,.28);color:#1A9A50;}

/* ── BET SECTION ── */
.bet-wrap{padding:14px;position:relative;z-index:1;}
.stag{font-style:normal;
  font-family:'Nunito',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.8px;font-size:18px;font-weight:700;
  color:var(--muted);margin-bottom:10px;
}
.bet-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.bet-lbl{color:var(--muted);font-size:14px;font-weight:700;font-family:'Nunito',sans-serif;white-space:nowrap;}
.bet-inp{
  flex:1;background:rgba(255,255,255,0.88);
  border:1.5px solid rgba(0,0,0,0.12);border-radius:14px;
  padding:11px 14px;color:var(--text);
  font-family:'Nunito',sans-serif;font-size:18px;font-weight:800;
  outline:none;text-align:center;width:0;
}
.bet-inp:focus{border-color:rgba(60,90,200,0.40);}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.qb{
  background:rgba(255,255,255,0.82);border:1.5px solid rgba(0,0,0,0.10);
  border-radius:10px;padding:7px 13px;color:var(--text);
  font-size:12px;font-weight:800;cursor:pointer;
  font-family:'Nunito',sans-serif;transition:all .12s;
}
.qb:active{background:rgba(0,0,0,0.08);}

/* Bet type buttons */
.btypes{display:grid;gap:8px;margin-bottom:10px;}
.btypes.c3{grid-template-columns:repeat(3,1fr);}
.btypes.c2{grid-template-columns:repeat(2,1fr);}
.btypes.c1{grid-template-columns:1fr;}
.bt{
  border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;
  font-size:13px;font-weight:800;border:1.5px solid;
  background:rgba(255,255,255,0.80);color:var(--text);
  font-family:'Nunito',sans-serif;transition:all .15s;user-select:none;
}
.bt-s{font-size:10px;color:var(--muted);margin-top:5px;font-family:'Nunito',sans-serif;font-weight:700;opacity:.75;display:block;}
.bt.r{border-color:rgba(216,40,74,.22);}
.bt.r.sel{background:rgba(216,40,74,.14);border-color:rgba(216,40,74,.60);color:#C02035;box-shadow:0 0 0 2px rgba(216,40,74,.15);}
.bt.bl{border-color:rgba(40,40,60,.14);}
.bt.bl.sel{background:rgba(40,40,60,.10);border-color:rgba(40,40,60,.40);color:#1A1A2E;box-shadow:0 0 0 2px rgba(40,40,60,.12);}
.bt.g{border-color:rgba(26,154,80,.16);}
.bt.g.sel{background:rgba(26,154,80,.12);border-color:rgba(26,154,80,.55);color:#157840;box-shadow:0 0 0 2px rgba(26,154,80,.15);}
.bt.o{border-color:rgba(0,0,0,.10);}
.bt.o.sel{background:rgba(40,80,200,.08);border-color:rgba(40,80,200,.30);color:#2050B0;box-shadow:0 0 0 2px rgba(40,80,200,.12);}

/* Spin button */
.spin-btn{
  width:100%;padding:16px;
  background:linear-gradient(135deg,#4898E0 0%,#2060C0 100%);border:none;border-radius:16px;
  color:#fff;font-family:'Caveat',cursive;font-style:normal;font-size:24px;font-weight:700;
  cursor:pointer;box-shadow:0 5px 18px rgba(40,80,200,0.30);
  transition:opacity .15s,transform .1s;letter-spacing:0;
}
.spin-btn:active{transform:scale(.98);}
.spin-btn:disabled{opacity:.35;cursor:not-allowed;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="topbar">
  <button class="fp-back" onclick="location.href='main.html?tab=games'">‹</button>
  <div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">🎡</span><span class="fp-title">ЕВРОП. РУЛЕТКА</span></div>
  <div class="bal-chip"><img src="../textures/coin.svg" width="20" height="20" alt="🪙" style="vertical-align:middle"> <span id="r-bal">—</span></div>
</div>

<div class="wheel-section">
  <div class="wheel-frame">
    <div class="w-ptr"></div>
    <canvas id="wc" width="272" height="272"></canvas>
  </div>
  <div class="res-band">
    <div class="res-num" id="res-num" style="color:var(--muted2)">—</div>
    <div class="res-lbl" id="res-lbl">Выберите<br>ставку</div>
  </div>
</div>
<div class="hist" id="hist"></div>

<div class="bet-wrap">
  <div class="stag">Ставка</div>
  <div class="bet-row">
    <span class="bet-lbl"><img src="../textures/coin.svg" width="22" height="22" alt="" style="vertical-align:middle"></span>
    <input class="bet-inp" id="bet-inp" type="number" min="1" value="10" inputmode="numeric" oninput="updateBetSummary()">
  </div>
  <div class="qb-row">
    <div class="qb" onclick="sb(10)">10</div><div class="qb" onclick="sb(25)">25</div>
    <div class="qb" onclick="sb(50)">50</div><div class="qb" onclick="sb(100)">100</div>
    <div class="qb" onclick="sbAll()">MAX</div><div class="qb" onclick="sbHalf()">½</div>
  </div>
  <div class="stag">Тип ставки</div>
  <div style="font-size:11px;color:var(--muted);margin:-6px 0 10px;font-family:'Nunito',sans-serif;">Можно выбрать сразу несколько типов — например «Чёрное» + «Чётное» + «1–18»</div>
  <div class="btypes c3" style="margin-bottom:8px">
    <div class="bt r" data-bet="red" onclick="selBet(this)">🔴 Красное<div class="bt-s">×2</div></div>
    <div class="bt bl" data-bet="black" onclick="selBet(this)">⚫ Чёрное<div class="bt-s">×2</div></div>
    <div class="bt g" data-bet="green" onclick="selBet(this)">🟢 Зеро<div class="bt-s">×14</div></div>
  </div>
  <div class="btypes c2" style="margin-bottom:8px">
    <div class="bt o" data-bet="even" onclick="selBet(this)">Чётное<div class="bt-s">×2</div></div>
    <div class="bt o" data-bet="odd" onclick="selBet(this)">Нечётное<div class="bt-s">×2</div></div>
  </div>
  <div class="btypes c2" style="margin-bottom:8px">
    <div class="bt o" data-bet="low" onclick="selBet(this)">1–18<div class="bt-s">×2</div></div>
    <div class="bt o" data-bet="high" onclick="selBet(this)">19–36<div class="bt-s">×2</div></div>
  </div>
  <div class="btypes c2" style="margin-bottom:8px">
    <div class="bt o" data-bet="dozen1" onclick="selBet(this)">1–12<div class="bt-s">×3</div></div>
    <div class="bt o" data-bet="dozen2" onclick="selBet(this)">13–24<div class="bt-s">×3</div></div>
  </div>
  <div class="btypes c1" style="margin-bottom:8px">
    <div class="bt o" data-bet="dozen3" onclick="selBet(this)">25–36<div class="bt-s">×3</div></div>
  </div>
  <div class="stag" style="margin-top:4px">Колонны</div>
  <div class="btypes c3" style="margin-bottom:16px">
    <div class="bt o" data-bet="col1" onclick="selBet(this)">Колонна 1<div class="bt-s">×3</div></div>
    <div class="bt o" data-bet="col2" onclick="selBet(this)">Колонна 2<div class="bt-s">×3</div></div>
    <div class="bt o" data-bet="col3" onclick="selBet(this)">Колонна 3<div class="bt-s">×3</div></div>
  </div>
  <div id="bet-summary" style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:10px;font-family:'Nunito',sans-serif;font-weight:700;min-height:16px"></div>
  <button class="spin-btn" id="spin-btn" onclick="spinEuro()">🎡 КРУТИТЬ</button>
</div>
<div style="height:30px"></div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
const UID=tg?.initDataUnsafe?.user?.id||0;
TL_startBanPoll(UID);

const NUMS=[
  {n:0,c:'green'},{n:32,c:'red'},{n:15,c:'black'},{n:19,c:'red'},{n:4,c:'black'},
  {n:21,c:'red'},{n:2,c:'black'},{n:25,c:'red'},{n:17,c:'black'},{n:34,c:'red'},
  {n:6,c:'black'},{n:27,c:'red'},{n:13,c:'black'},{n:36,c:'red'},{n:11,c:'black'},
  {n:30,c:'red'},{n:8,c:'black'},{n:23,c:'red'},{n:10,c:'black'},{n:5,c:'red'},
  {n:24,c:'black'},{n:16,c:'red'},{n:33,c:'black'},{n:1,c:'red'},{n:20,c:'black'},
  {n:14,c:'red'},{n:31,c:'black'},{n:9,c:'red'},{n:22,c:'black'},{n:18,c:'red'},
  {n:29,c:'black'},{n:7,c:'red'},{n:28,c:'black'},{n:12,c:'red'},{n:35,c:'black'},
  {n:3,c:'red'},{n:26,c:'black'}
];
const N=NUMS.length,SLICE=Math.PI*2/N;
const BET_LABELS={red:'Красное',black:'Чёрное',green:'Зеро',even:'Чётное',odd:'Нечётное',
  low:'1–18',high:'19–36',dozen1:'1–12',dozen2:'13–24',dozen3:'25–36',
  col1:'Колонна 1',col2:'Колонна 2',col3:'Колонна 3'};
const canvas=document.getElementById('wc');
const ctx=canvas.getContext('2d');
const W=272,cx=W/2,cy=W/2,R=W/2-2;

let userData=null,selectedBets=new Set(),spinning=false;
let wheelAngle=0,idleReq=null,animReq=null,hist=[];

function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className='toast '+t+' show';setTimeout(()=>el.classList.remove('show'),2800);}
async function get(url){return fetch(url).then(r=>r.json());}
async function post(url,d){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json());}

async function initUser(){
  if(!UID)return;
  try{
    if(localStorage.getItem('__tl_dev_uid__'))userData=await get(`/api/user/${UID}`).catch(()=>null);
    else{const o=tg.initDataUnsafe.user;userData=await post('/api/ensure_user',{user_id:UID,username:o?.username||'',first_name:o?.first_name||''});}
  }catch(e){userData=await get(`/api/user/${UID}`).catch(()=>null);}
  if(TL_guardBanned(userData))return;
  if(userData)document.getElementById('r-bal').textContent=userData.balance??0;
}

function sectorUnder(a){const norm=((-a)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);return Math.floor(norm/SLICE)%N;}

function drawWheel(angle,winIdx=-1){
  ctx.clearRect(0,0,W,W);
  // Base
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle='#080812';ctx.fill();

  for(let i=0;i<N;i++){
    const sa=angle+i*SLICE-Math.PI/2,ea=sa+SLICE;
    const{n,c}=NUMS[i],win=(i===winIdx);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R-2,sa,ea);ctx.closePath();
    if(win){
      const ma=sa+SLICE/2,gx=cx+Math.cos(ma)*(R*.5),gy=cy+Math.sin(ma)*(R*.5);
      const g=ctx.createRadialGradient(gx,gy,0,gx,gy,R*.7);
      if(c==='red'){g.addColorStop(0,'#FF5566');g.addColorStop(1,'#B01020');}
      else if(c==='black'){g.addColorStop(0,'#6655CC');g.addColorStop(1,'#181530');}
      else{g.addColorStop(0,'#00FF88');g.addColorStop(1,'#0A6030');}
      ctx.fillStyle=g;
    }else{
      ctx.fillStyle=c==='red'?'#E83050':c==='black'?'#2A2A44':'#18A050';
    }
    ctx.fill();
    // Divider
    ctx.save();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(sa)*(R*.5),cy+Math.sin(sa)*(R*.5));
    ctx.lineTo(cx+Math.cos(sa)*(R-2),cy+Math.sin(sa)*(R-2));ctx.stroke();ctx.restore();
    // Win border
    if(win){
      ctx.save();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.shadowColor='rgba(255,255,255,.6)';ctx.shadowBlur=10;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R-2,sa,ea);ctx.closePath();ctx.stroke();ctx.restore();
    }
    // Number
    const ma=sa+SLICE/2,tr=R*.73;
    ctx.save();ctx.translate(cx+Math.cos(ma)*tr,cy+Math.sin(ma)*tr);ctx.rotate(ma+Math.PI/2);
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font=`bold ${n===0?10:8}px 'JetBrains Mono',monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(win){ctx.shadowColor='rgba(255,255,200,1)';ctx.shadowBlur=7;}
    ctx.fillText(n,0,0);ctx.restore();
  }

  // Gold outer ring
  ctx.beginPath();ctx.arc(cx,cy,R-1,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,214,0,.7)';ctx.lineWidth=2.5;ctx.stroke();
  // Decorative inner ring
  ctx.beginPath();ctx.arc(cx,cy,R-14,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;ctx.strokeStyle='rgba(255,214,0,.25)';ctx.stroke();

  // Hub
  const hr=R*.13;
  const hg=ctx.createRadialGradient(cx-hr*.2,cy-hr*.25,0,cx,cy,hr);
  hg.addColorStop(0,'#FFE878');hg.addColorStop(.5,'#FFD028');hg.addColorStop(1,'#C09000');
  ctx.beginPath();ctx.arc(cx,cy,hr,0,Math.PI*2);ctx.fillStyle=hg;ctx.fill();
  ctx.strokeStyle='rgba(255,214,0,.4)';ctx.lineWidth=1;ctx.stroke();
  // Hub shine
  ctx.beginPath();ctx.arc(cx-hr*.25,cy-hr*.3,hr*.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();
}

function startIdle(){if(idleReq)return;(function frame(){wheelAngle+=.002;drawWheel(wheelAngle);idleReq=requestAnimationFrame(frame);})();}
function stopIdle(){if(idleReq){cancelAnimationFrame(idleReq);idleReq=null;}}

function addHist(n,c){
  hist.unshift({n,c});if(hist.length>16)hist=hist.slice(0,16);
  document.getElementById('hist').innerHTML=hist.map(h=>`<div class="hp ${h.c}">${h.n}</div>`).join('');
}
function selBet(el){
  el.classList.toggle('sel');
  const t=el.dataset.bet;
  if(el.classList.contains('sel'))selectedBets.add(t);else selectedBets.delete(t);
  updateBetSummary();
}
function updateBetSummary(){
  const el=document.getElementById('bet-summary');
  if(!el)return;
  const n=selectedBets.size;
  if(n===0){el.textContent='';return;}
  const per=parseInt(document.getElementById('bet-inp').value)||0;
  el.textContent=`Выбрано типов: ${n} · Общая ставка: ${per*n} 🪙`;
}
function sb(v){document.getElementById('bet-inp').value=v;updateBetSummary();}
function sbAll(){const n=Math.max(1,selectedBets.size);sb(Math.max(1,Math.floor((userData?.balance||0)/n)));}
function sbHalf(){const n=Math.max(1,selectedBets.size);sb(Math.max(1,Math.floor((userData?.balance||0)/2/n)));}

async function spinEuro(){
  if(spinning)return;
  if(selectedBets.size===0){toast('Выберите тип ставки!','err');return;}
  const per=parseInt(document.getElementById('bet-inp').value)||0;
  if(per<1){toast('Введите ставку!','err');return;}
  const bets=[...selectedBets].map(type=>({type,amount:per}));
  const totalCost=per*bets.length;
  if(totalCost>(userData?.balance||0)){toast('Недостаточно монет!','err');return;}

  // Jump to the wheel first so a fast bottom→top scroll can't collide with the spin animation
  window.scrollTo({top:0,behavior:'smooth'});

  spinning=true;stopIdle();
  if(animReq){cancelAnimationFrame(animReq);animReq=null;}
  document.getElementById('spin-btn').disabled=true;
  document.getElementById('res-num').textContent='…';
  document.getElementById('res-num').style.color='var(--muted)';
  document.getElementById('res-lbl').innerHTML='🎰 Крутится...';

  const res=await post('/api/spin',{user_id:UID,bets}).catch(()=>null);
  if(!res||res.error){
    toast(res?.error||'Ошибка сервера','err');
    spinning=false;document.getElementById('spin-btn').disabled=false;startIdle();
    return;
  }

  const targetIdx=res.result_index;
  const PI2=Math.PI*2,DUR=5500;
  const startA=wheelAngle;
  // Place targetIdx sector center under pointer
  const exactTarget=-targetIdx*SLICE-SLICE/2;
  const jitter=(Math.random()-.5)*SLICE*.6;
  const targetA=exactTarget+jitter;
  let travel=startA-targetA;
  travel=((travel%PI2)+PI2)%PI2;
  travel+=8*PI2;
  const finalA=startA-travel;
  const t0=performance.now();
  function ease(t){return 1-Math.pow(1-t,4.5);}

  function frame(now){
    const numEl=document.getElementById('res-num');
    try{
      const elapsed=now-t0,t=Math.min(1,elapsed/DUR);
      const wA=startA+(finalA-startA)*ease(t);

      // During spin: show live sector
      const liveIdx=sectorUnderPointer(wA);
      const live=NUMS[liveIdx];
      numEl.textContent=live.n;
      numEl.className='res-num '+live.c;
      const ico=live.c==='green'?'🟢':live.c==='red'?'🔴':'⚫';
      if(t<.93)document.getElementById('res-lbl').innerHTML=`${ico}<br>`;

      drawWheel(wA,t>=.93?targetIdx:-1);

      if(t<1){animReq=requestAnimationFrame(frame);return;}
      wheelAngle=wA%(PI2);
    }catch(e){
      // Recover from any transient render glitch instead of freezing the wheel silently
      wheelAngle=finalA%(Math.PI*2);
    }
    animReq=null;
    drawWheel(wheelAngle,targetIdx);
    const ico2=res.result_c==='green'?'🟢':res.result_c==='red'?'🔴':'⚫';
    const cname=res.result_c==='green'?'Зеро':res.result_c==='red'?'Красное':'Чёрное';
    numEl.textContent=res.result_n;numEl.className='res-num '+res.result_c;
    const wonTypes=(res.bets||[]).filter(b=>b.won).map(b=>BET_LABELS[b.type]||b.type);
    if(res.won){
      const sub=wonTypes.length?wonTypes.join(', '):'';
      document.getElementById('res-lbl').innerHTML=`${ico2} ${sub}<br><b style="color:var(--green)">+${res.profit} 🪙</b>`;
      toast(`${ico2} ${res.result_n} — +${res.profit} 🪙`,'ok');
    }else{
      document.getElementById('res-lbl').innerHTML=`${ico2} ${cname}<br><b style="color:var(--red)">${res.profit} 🪙</b>`;
      toast(`${ico2} ${res.result_n} ${cname} — проигрыш`,'err');
    }
    if(userData)userData.balance=res.new_balance;
    document.getElementById('r-bal').textContent=res.new_balance??0;
    addHist(res.result_n,res.result_c);
    spinning=false;document.getElementById('spin-btn').disabled=false;
    setTimeout(()=>{
      document.getElementById('res-lbl').innerHTML=`${ico2}<br>${cname}`;
      startIdle();
    },3000);
  }
  animReq=requestAnimationFrame(frame);
}

function sectorUnderPointer(a){const norm=((-a)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);return Math.floor(norm/SLICE)%N;}

initUser();drawWheel(0);startIdle();
</script>
<script>(function(){let x=null;function c(){if(!x)x=new(window.AudioContext||window.webkitAudioContext)();return x;}function on(){try{return localStorage.getItem("topluck_sounds")==="1";}catch(e){return false;}}window.SND={play:function(t){if(!on())return;try{const ctx=c(),g=ctx.createGain(),o=ctx.createOscillator();g.connect(ctx.destination);o.connect(g);const s=ctx.currentTime;if(t==="win"){o.type="sine";[523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,s+i*.1));g.gain.setValueAtTime(.22,s);g.gain.exponentialRampToValueAtTime(.001,s+.75);o.start(s);o.stop(s+.75);}else if(t==="lose"){o.type="sawtooth";o.frequency.setValueAtTime(280,s);o.frequency.exponentialRampToValueAtTime(70,s+.45);g.gain.setValueAtTime(.18,s);g.gain.exponentialRampToValueAtTime(.001,s+.5);o.start(s);o.stop(s+.5);}else if(t==="spin"){o.type="sine";o.frequency.setValueAtTime(200,s);o.frequency.linearRampToValueAtTime(600,s+1.5);g.gain.setValueAtTime(.1,s);g.gain.linearRampToValueAtTime(.05,s+1.4);g.gain.exponentialRampToValueAtTime(.001,s+2);o.start(s);o.stop(s+2);}}catch(e){}}};})();</script>
