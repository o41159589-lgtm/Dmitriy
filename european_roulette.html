<style>
.page-content{padding:0 0 24px;}

/* ── WHEEL SECTION ── */
.wheel-section{
  background:linear-gradient(180deg,#0a0a18 0%,#0e0e1a 100%);
  padding:20px 0 24px;
  display:flex;flex-direction:column;align-items:center;
  border-bottom:1px solid var(--border);
  position:relative;overflow:hidden;
}
.wheel-section::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(245,197,66,0.07) 0%, transparent 60%);
  pointer-events:none;
}
.wheel-outer{
  position:relative;
  width:280px;height:280px;
  margin:0 auto;
}
/* Outer ring */
.wheel-ring{
  position:absolute;inset:-8px;
  border-radius:50%;
  background:conic-gradient(from 0deg,#2a1a00,#5a3e00,#f5c542,#5a3e00,#2a1a00,#5a3e00,#f5c542,#5a3e00,#2a1a00);
  box-shadow:0 0 40px rgba(245,197,66,0.3),inset 0 0 20px rgba(0,0,0,0.6);
}
.wheel-ring::after{
  content:'';position:absolute;inset:4px;border-radius:50%;
  background:#0a0a14;
}
.wheel-canvas{
  position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 30px rgba(0,0,0,0.8);
}

/* Pointer at top */
.wheel-pointer{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:20px solid var(--gold);
  filter:drop-shadow(0 0 6px var(--gold));
  z-index:10;
}

/* Result display */
.result-display{
  margin-top:20px;
  min-height:50px;
  display:flex;align-items:center;justify-content:center;
  gap:12px;
}
.result-number{
  font-family:'Orbitron',monospace;font-size:42px;font-weight:900;
  line-height:1;
  transition:all .3s;
}
.result-number.red{color:var(--red);text-shadow:0 0 20px rgba(230,57,70,.5);}
.result-number.black{color:#ddd;text-shadow:0 0 20px rgba(200,200,220,.3);}
.result-number.green{color:var(--green);text-shadow:0 0 20px rgba(45,198,83,.5);}
.result-label{font-size:16px;font-weight:600;color:var(--muted);}

/* ── BET SECTION ── */

.bet-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.bet-lbl{color:var(--muted);font-size:13px;white-space:nowrap;font-weight:600;}
.bet-inp{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;color:var(--text);font-family:'Orbitron',monospace;font-size:16px;
  outline:none;text-align:center;width:0;}
.bet-inp:focus{border-color:var(--gold);}

.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.qb{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:6px 12px;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;

.qb:active,.qb.a{background:var(--gold);color:#000;border-color:var(--gold);}

/* Bet type grid */
.btypes{display:grid;gap:8px;margin-bottom:10px;}
.btypes.cols3{grid-template-columns:repeat(3,1fr);}
.btypes.cols2{grid-template-columns:repeat(2,1fr);}
.btypes.cols6{grid-template-columns:repeat(3,1fr);}

/* Number grid */
.num-grid-wrap{margin-bottom:10px;}

  border:1px solid rgba(255,255,255,.08);font-weight:700;font-size:11px;

.ng.r{color:#ff9090;border-color:rgba(230,57,70,.25);}

.res-box{background:var(--bg3);border:1px solid var(--border);border-radius:12px;
  padding:13px;text-align:center;margin-bottom:12px;min-height:50px;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;}

.spin-btn{width:100%;padding:16px;

.spin-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* Payouts */
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pay-item{background:var(--bg3);border-radius:10px;padding:10px;
  border:1px solid rgba(255,255,255,.05);}
.pay-name{font-size:12px;color:var(--muted);margin-bottom:3px;}
.pay-val{font-family:'Orbitron',monospace;font-size:15px;color:var(--gold);font-weight:700;}

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
const UID = tg?.initDataUnsafe?.user?.id || 0;
const API = '';

// ── ROULETTE NUMBERS (European order) ──
const NUMS = [
  {n:0,c:'green'},{n:32,c:'red'},{n:15,c:'black'},{n:19,c:'red'},{n:4,c:'black'},
  {n:21,c:'red'},{n:2,c:'black'},{n:25,c:'red'},{n:17,c:'black'},{n:34,c:'red'},
  {n:6,c:'black'},{n:27,c:'red'},{n:13,c:'black'},{n:36,c:'red'},{n:11,c:'black'},
  {n:30,c:'red'},{n:8,c:'black'},{n:23,c:'red'},{n:10,c:'black'},{n:5,c:'red'},
  {n:24,c:'black'},{n:16,c:'red'},{n:33,c:'black'},{n:1,c:'red'},{n:20,c:'black'},
  {n:14,c:'red'},{n:31,c:'black'},{n:9,c:'red'},{n:22,c:'black'},{n:18,c:'red'},
  {n:29,c:'black'},{n:7,c:'red'},{n:28,c:'black'},{n:12,c:'red'},{n:35,c:'black'},
  {n:3,c:'red'},{n:26,c:'black'}
];
const N = NUMS.length;
const SLICE = (Math.PI*2) / N;

// ── ANGLE SYSTEM ──
// Sector i is drawn from: angle + i*SLICE - PI/2  to  angle + i*SLICE - PI/2 + SLICE
// The POINTER is fixed at the TOP = angle -PI/2 on the canvas = the 12 o'clock position.
// Sector i sits under the pointer when its range includes -PI/2:
//   angle + i*SLICE - PI/2  <=  -PI/2  <  angle + i*SLICE - PI/2 + SLICE
//   =>  0  <=  -angle + ... hmm, let's simplify:
//   Sector i center angle = angle + i*SLICE - PI/2 + SLICE/2
//   Center under pointer (-PI/2) when: angle + i*SLICE - PI/2 + SLICE/2 = -PI/2 (mod 2PI)
//   => angle = -i*SLICE - SLICE/2  (mod 2PI)
//
// For sectorUnderPointer(angle): which i satisfies center closest to -PI/2?
//   center_i = angle + i*SLICE + SLICE/2 - PI/2
//   We want center_i ≡ -PI/2 (mod 2PI)  => angle + i*SLICE + SLICE/2 ≡ 0 (mod 2PI)
//   => i*SLICE ≡ -(angle + SLICE/2) (mod 2PI)
//   => i = floor( (-(angle + SLICE/2) % 2PI + 2PI) % 2PI / SLICE ) % N

function sectorUnderPointer(angle) {
  // Sector i starts at: angle + i*SLICE - PI/2
  // Pointer at top = -PI/2. Sector i is under pointer when:
  //   angle + i*SLICE in (-SLICE, 0]  =>  center when angle + i*SLICE = -SLICE/2
  // => i = floor(-angle / TAU * N) = floor((-angle % TAU) / SLICE)
  const TAU = Math.PI * 2;
  const norm = ((-angle) % TAU + TAU) % TAU;
  return Math.floor(norm / SLICE) % N;
}

function liveSectorLabel(angle) {
  const idx = sectorUnderPointer(angle);
  const {n, c} = NUMS[idx];
  const ico = c==='green' ? '🟢' : c==='red' ? '🔴' : '⚫';
  return `${ico} ${n}`;
}


let userData = null;
let selBetType = null;
let spinning = false;
let wheelAngle = 0;
let animReq = null;

// ── TOAST ──
function toast(m,t='info'){
  const el=document.getElementById('toast');
  el.textContent=m;el.className='toast '+t;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}

// ── API ──
async function get(url){const r=await fetch(url);return r.json();}
async function post(url,d){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  return r.json();
}

async function loadUser(){
  if(!UID)return;
  userData = await get(`/api/user/${UID}`).catch(()=>null);
  if(userData) document.getElementById('r-bal').textContent = userData.balance??0;
}

async function initUser(){
  if(!UID)return;
  const tg = window.Telegram?.WebApp;
  const username   = tg?.initDataUnsafe?.user?.username || '';
  const first_name = tg?.initDataUnsafe?.user?.first_name || '';
  try {
    userData = await post('/api/ensure_user',{user_id:UID,username,first_name});
  } catch(e) {
    userData = await get(`/api/user/${UID}`).catch(()=>null);
  }
  if(userData) document.getElementById('r-bal').textContent = userData.balance??0;
}

// ── DRAW WHEEL ──
// winIdx = index of winning sector to highlight (-1 = none)
function drawWheel(angle, winIdx = -1){
  const canvas = document.getElementById('wheel-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, r = W/2 - 2;

  ctx.clearRect(0,0,W,H);

  // Outer dark border
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='#0a0812';ctx.fill();

  // Draw sectors
  for(let i=0;i<N;i++){
    const startA = angle + i*SLICE - Math.PI/2;
    const endA   = startA + SLICE;
    const {n,c} = NUMS[i];
    const isWin  = (i === winIdx);

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r-2,startA,endA);
    ctx.closePath();

    // Sector fill — brighter if winner
    if(isWin){
      // Bright gradient highlight for winner
      const midA = startA + SLICE/2;
      const gx = cx + Math.cos(midA)*(r*0.5), gy = cy + Math.sin(midA)*(r*0.5);
      const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, r*0.7);
      if(c==='red'){      grad.addColorStop(0,'#ff4455');grad.addColorStop(1,'#c0131e');}
      else if(c==='black'){grad.addColorStop(0,'#5555aa');grad.addColorStop(1,'#151520');}
      else{                grad.addColorStop(0,'#00ff88');grad.addColorStop(1,'#0d7040');}
      ctx.fillStyle=grad;
    } else {
      if(c==='red')        ctx.fillStyle='#c0131e';
      else if(c==='black') ctx.fillStyle='#151520';
      else                 ctx.fillStyle='#0d7040';
    }
    ctx.fill();

    // Winner glow border
    if(isWin){
      ctx.save();
      ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2.5;
      ctx.shadowColor='rgba(255,255,255,0.8)';ctx.shadowBlur=14;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r-2,startA,endA);ctx.closePath();ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=1;
      ctx.stroke();
    }

    // Number
    const ma = startA + SLICE/2;
    const tr = r*0.76;
    ctx.save();
    ctx.translate(cx + Math.cos(ma)*tr, cy + Math.sin(ma)*tr);
    ctx.rotate(ma + Math.PI/2);
    ctx.fillStyle = isWin ? '#fff' : '#fff';
    ctx.font = n===0 ? 'bold 10px Orbitron,monospace' : 'bold 9px Orbitron,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor= isWin ? 'rgba(255,255,200,1)' : 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = isWin ? 8 : 3;
    ctx.fillText(n,0,0);
    ctx.restore();

    // Divider line at sector edge
    ctx.save();
    ctx.strokeStyle='rgba(245,197,66,0.3)';ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(startA)*(r*0.55), cy + Math.sin(startA)*(r*0.55));
    ctx.lineTo(cx + Math.cos(startA)*(r-2), cy + Math.sin(startA)*(r-2));
    ctx.stroke();
    ctx.restore();
  }

  // Outer gold ring
  ctx.beginPath();ctx.arc(cx,cy,r-1,0,Math.PI*2);
  ctx.strokeStyle='rgba(245,197,66,0.5)';ctx.lineWidth=2;ctx.stroke();

  // Inner circle (hub)
  const hubR = r*0.14;
  const hubGrad = ctx.createRadialGradient(cx,cy,0,cx,cy,hubR);
  hubGrad.addColorStop(0,'#f5c542');
  hubGrad.addColorStop(0.5,'#b8860b');
  hubGrad.addColorStop(1,'#4a3500');
  ctx.beginPath();ctx.arc(cx,cy,hubR,0,Math.PI*2);
  ctx.fillStyle=hubGrad;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.stroke();

  // Hub shine dot
  ctx.beginPath();ctx.arc(cx - hubR*0.25, cy - hubR*0.3, hubR*0.2, 0, Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fill();

  // Spokes
  for(let i=0;i<12;i++){
    const a = angle + i*Math.PI/6;
    ctx.save();
    ctx.strokeStyle='rgba(180,130,0,0.25)';ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*hubR*1.4, cy + Math.sin(a)*hubR*1.4);
    ctx.lineTo(cx + Math.cos(a)*(r*0.55), cy + Math.sin(a)*(r*0.55));
    ctx.stroke();
    ctx.restore();
  }
}

// ── IDLE ANIMATION (slow wheel rotation) ──
let idleAngle = 0;
let idleReq = null;
function startIdleAnim(){
  if(spinning) return;
  function frame(){
    idleAngle += 0.002;
    drawWheel(idleAngle);
    idleReq = requestAnimationFrame(frame);
  }
  idleReq = requestAnimationFrame(frame);
}
function stopIdleAnim(){
  if(idleReq){cancelAnimationFrame(idleReq);idleReq=null;}
}

// ── BET CONTROLS ──
function selBet(el){
  document.querySelectorAll('.bt').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  selBetType = el.dataset.bet;
}
function sb(v){document.getElementById('bet-inp').value=v;}
function sbAll(){document.getElementById('bet-inp').value=userData?.balance||0;}
function sbHalf(){document.getElementById('bet-inp').value=Math.max(1,Math.floor((userData?.balance||0)/2));}

// ── SPIN ──
async function spinEuro(){ SND.play('spin');
  if(spinning) return;
  if(!selBetType){toast('Выберите ставку!','err');return;}
  const bet = parseInt(document.getElementById('bet-inp').value)||0;
  if(bet<1){toast('Введите ставку!','err');return;}
  if(bet>(userData?.balance||0)){toast('Недостаточно монет!','err');return;}

  spinning = true;
  stopIdleAnim();
  document.getElementById('spin-btn').disabled = true;
  // res-box removed — use a no-op stub so existing rb.* calls don't throw
  const rb = { className:'', textContent:'' };
  document.getElementById('res-num').textContent='';
  document.getElementById('res-num').style.color='var(--muted)';
  document.getElementById('res-lbl').textContent='🎰 Вращается...';

  const res = await post('/api/spin',{user_id:UID,bet,bet_type:selBetType}).catch(()=>null);
  if(!res||res.error){
    toast(res?.error||'Ошибка сервера','err');
    spinning=false;document.getElementById('spin-btn').disabled=false;
    startIdleAnim();
    return;
  }

  // Calculate target angle for winning number
  const targetIdx = res.result_index;
  const SPIN_DURATION = 5500;
  const startWheelAngle = idleAngle;

  // ── TARGET ANGLE CALCULATION ──
  // Sector idx is under pointer when: angle = SLICE/2 - idx*SLICE  (exact center)
  // (Derived: sector i is drawn from angle + i*SLICE - PI/2;
  //  pointer at -PI/2 is in sector i when angle + i*SLICE ∈ [0, SLICE);
  //  center = SLICE/2, so angle = SLICE/2 - i*SLICE)
  const PI2 = Math.PI * 2;
  const minSpins = 8;

  // Exact angle that places sector center under pointer:
    // target: angle + targetIdx*SLICE = -SLICE/2 => angle = -targetIdx*SLICE - SLICE/2
  const exactTarget = -targetIdx * SLICE - SLICE/2;
  // Random jitter: ±35% of sector width so it never lands on edge
  const jitter = (Math.random() - 0.5) * SLICE * 0.7;
  const targetWheelAngle = exactTarget + jitter;

  // CW travel (negative direction): start → target, at least minSpins rotations
  let totalTravel = startWheelAngle - targetWheelAngle;
  totalTravel = ((totalTravel % PI2) + PI2) % PI2; // normalise to [0, 2PI)
  totalTravel += minSpins * PI2;                   // ensure enough full rotations
  const finalWheelAngle = startWheelAngle - totalTravel;

  const t0 = performance.now();

  function easeOutSpin(t){
    // Smooth casino-style deceleration
    return 1 - Math.pow(1 - t, 4.5);
  }

  function animFrame(now){
    const elapsed = now - t0;
    const t = Math.min(1, elapsed / SPIN_DURATION);
    const eT = easeOutSpin(t);
    const wA = startWheelAngle + (finalWheelAngle - startWheelAngle) * eT;

    // Show winning highlight only in the last 5% of animation
    drawWheel(wA, t >= 0.95 ? targetIdx : -1);
    if(t < 0.95){
      // Show live sector under the wheel (in result-display area, not res-box)
      const liveIdx = sectorUnderPointer(wA);
      const liveNum = NUMS[liveIdx];
      const liveIco = liveNum.c==='green'?'🟢':liveNum.c==='red'?'🔴':'⚫';
      // Show number in big display, color in label — no "—" prefix
      const numEl2 = document.getElementById('res-num');
      numEl2.textContent = liveNum.n;
      numEl2.style.color = liveNum.c==='green'?'var(--green)':liveNum.c==='red'?'var(--red)':'#ccc';
      document.getElementById('res-lbl').textContent = liveIco;
      // res-box: compact live readout
      rb.textContent = liveIco + ' ' + liveNum.n;
      rb.className = 'res-box';
    }

    if(t < 1){
      animReq = requestAnimationFrame(animFrame);
    } else {
      idleAngle = wA % PI2;
      drawWheel(idleAngle, targetIdx);

      const ico = res.result_c==='green'?'🟢':res.result_c==='red'?'🔴':'⚫';
      const numEl = document.getElementById('res-num');
      numEl.textContent = res.result_n;
      numEl.className = 'result-number ' + res.result_c;
      document.getElementById('res-lbl').textContent = res.won ? '🎉 Выигрыш!' : '😢 Проигрыш';
      // Clear the live pointer label from res-box (now shows actual result)

      if(res.won){ SND.play('win');
        rb.className='res-box win';
        rb.textContent=`${ico} ${res.result_n} — Выигрыш! +${res.gain} 🪙`;
        toast(`+${res.gain} монет! 🎉`,'ok');
      } else {
        rb.className='res-box lose';
        SND.play('lose'); rb.textContent=`${ico} ${res.result_n} — Проигрыш -${bet} 🪙`;
        toast(`-${bet} монет 😢`,'err');
      }
      if(userData) userData.balance = res.new_balance;
      document.getElementById('r-bal').textContent = res.new_balance ?? 0;

      spinning = false;
      document.getElementById('spin-btn').disabled = false;

      // Keep highlight 2s then resume idle
      setTimeout(() => {
        document.getElementById('res-lbl').textContent = '';
        startIdleAnim();
      }, 2000);
    }
  }

  animReq = requestAnimationFrame(animFrame);
}

// Init
initUser();
drawWheel(0);
startIdleAnim();
</script>
<script>
// ── SOUND ENGINE (shared, reads localStorage topluck_sounds) ──
(function(){
  let _ctx=null;
  function _c(){ if(!_ctx) _ctx=new (window.AudioContext||window.webkitAudioContext)(); return _ctx; }
  function _on(){ try{return localStorage.getItem("topluck_sounds")==="1";}catch(e){return false;} }
  window.SND={
    play:function(type){
      if(!_on()) return;
      try{
        const ctx=_c(),g=ctx.createGain(),o=ctx.createOscillator();
        g.connect(ctx.destination); o.connect(g);
        const t=ctx.currentTime;
        if(type==="win"){
          o.type="sine";
          [523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.1));
          g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.001,t+.75);
          o.start(t); o.stop(t+.75);
        } else if(type==="lose"){
          o.type="sawtooth";
          o.frequency.setValueAtTime(280,t); o.frequency.exponentialRampToValueAtTime(70,t+.45);
          g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.5);
          o.start(t); o.stop(t+.5);
        } else if(type==="tick"){
          o.type="sine"; o.frequency.setValueAtTime(660,t);
          g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+.07);
          o.start(t); o.stop(t+.07);
        } else if(type==="coin"){
          o.type="sine";
          o.frequency.setValueAtTime(900,t); o.frequency.setValueAtTime(1200,t+.06);
          g.gain.setValueAtTime(.14,t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
          o.start(t); o.stop(t+.22);
        } else if(type==="step"){
          o.type="sine"; o.frequency.setValueAtTime(440+200*(Math.random()),t);
          g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.18);
          o.start(t); o.stop(t+.18);
        } else if(type==="bomb"){
          o.type="sawtooth";
          o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(20,t+.6);
          g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.7);
          // Add noise-like crackle via second oscillator
          const o2=ctx.createOscillator(),g2=ctx.createGain();
          o2.connect(g2); g2.connect(ctx.destination);
          o2.type="square"; o2.frequency.setValueAtTime(60,t);
          g2.gain.setValueAtTime(.2,t); g2.gain.exponentialRampToValueAtTime(.001,t+.5);
          o2.start(t); o2.stop(t+.5);
          o.start(t); o.stop(t+.7);
        } else if(type==="spin"){
          // Spinning wheel sound - rising frequency
          o.type="sine";
          o.frequency.setValueAtTime(200,t); o.frequency.linearRampToValueAtTime(600,t+1.5);
          g.gain.setValueAtTime(.1,t); g.gain.linearRampToValueAtTime(.05,t+1.4);
          g.gain.exponentialRampToValueAtTime(.001,t+2);
          o.start(t); o.stop(t+2);
        } else if(type==="bet"){
          o.type="sine"; o.frequency.setValueAtTime(523,t);
          g.gain.setValueAtTime(.1,t); g.gain.exponentialRampToValueAtTime(.001,t+.15);
          o.start(t); o.stop(t+.15);
        }
      }catch(e){}
    }
  };
})();

</script>
