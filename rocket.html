<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ракета — TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})();</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--bg:#0A0A0A;--bg2:#111;--white:#FFF;--gray1:#E0E0E0;--gray2:#AAA;--gray3:#555;--green:#22C55E;--red:#EF4444;--gold:#F59E0B;--blue:#3B82F6;--text:#F0F0F0;--muted:#777;--muted2:#999;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.12);--font-display:'Bebas Neue',sans-serif;--font-ui:'Exo 2',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --d:2s;--dl:0s;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}
.lbg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 50% 40% at 50% 20%,rgba(59,130,246,.05) 0%,transparent 60%);}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;position:sticky;top:0;z-index:50;background:rgba(10,10,10,.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.fp-back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:22px;cursor:pointer;}
.fp-title{font-family:var(--font-display);font-size:20px;color:var(--white);letter-spacing:1px;}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);border-radius:12px;padding:7px 12px;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--gold);}
.toast{position:fixed;top:14px;left:14px;right:14px;z-index:500;background:rgba(20,20,20,.97);border:1px solid var(--border2);backdrop-filter:blur(20px);border-radius:16px;padding:13px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-80px);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.toast.show{transform:translateY(0);}
.toast.ok{color:var(--green);border-color:rgba(34,197,94,.3);}
.toast.err{color:var(--red);border-color:rgba(239,68,68,.3);}

.page-wrap{padding:12px 14px 32px;}

/* CANVAS AREA */
.rocket-stage{
  background:linear-gradient(180deg,#000510,#000A1A,#000D20);
  border:1px solid rgba(59,130,246,.15);
  border-radius:20px;
  height:260px;
  margin-bottom:12px;
  position:relative;
  overflow:hidden;
}
.stars{position:absolute;inset:0;pointer-events:none;}
.star{position:absolute;background:#fff;border-radius:50%;--d:2s;--dl:0s;animation:twinkle var(--d) var(--dl) ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.6;}50%{opacity:.1;}}

/* rocket SVG */
.rocket-wrap{
  position:absolute;
  transition:bottom .05s linear, left .05s linear;
  z-index:5;
}
.rocket-svg{filter:drop-shadow(0 0 12px rgba(59,130,246,.8));}
.exhaust{
  position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
  width:12px;height:20px;
  background:linear-gradient(180deg,rgba(255,140,0,.9),rgba(255,50,0,.6),transparent);
  border-radius:0 0 8px 8px;
  animation:exhaust-flicker .15s ease-in-out infinite;
}
@keyframes exhaust-flicker{0%,100%{height:20px;opacity:1;}50%{height:14px;opacity:.7;}}
.exhaust-glow{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,120,0,.5) 0%,transparent 70%);
  animation:exhaust-flicker .15s ease-in-out infinite;
}

/* trail canvas */
#trail-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

/* MULTIPLIER DISPLAY */
.mult-display{
  position:absolute;top:16px;left:0;right:0;
  text-align:center;z-index:10;
}
.mult-val{
  font-family:var(--font-mono);font-size:52px;font-weight:700;
  color:var(--white);line-height:1;
  text-shadow:0 0 30px rgba(59,130,246,.6);
  transition:color .1s;
}
.mult-val.crashed{color:var(--red);text-shadow:0 0 30px rgba(239,68,68,.6);}
.mult-val.safe{color:var(--green);text-shadow:0 0 30px rgba(34,197,94,.6);}
.mult-status{font-family:var(--font-mono);font-size:11px;color:var(--muted2);letter-spacing:2px;margin-top:2px;}

/* CONTROLS */
.controls-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;}
.bet-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.bet-inp{background:rgba(0,0,0,.4);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;color:var(--white);font-family:var(--font-mono);font-size:18px;flex:1;outline:none;text-align:center;}
.bet-inp:focus{border-color:rgba(255,255,255,.3);}
.qb-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.qb{padding:7px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;font-size:11px;color:var(--gray2);font-weight:700;cursor:pointer;font-family:var(--font-mono);}
.qb:active{background:rgba(255,255,255,.12);color:var(--white);}

/* auto cashout row */
.ac-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.ac-lbl{font-size:12px;color:var(--muted2);font-family:var(--font-mono);white-space:nowrap;}
.ac-inp{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--white);font-family:var(--font-mono);font-size:14px;width:80px;outline:none;text-align:center;}
.ac-inp:focus{border-color:rgba(255,255,255,.3);}
.ac-hint{font-size:11px;color:var(--muted);font-family:var(--font-mono);}

/* BIG BUTTON */
.launch-btn{width:100%;padding:16px;background:var(--white);border:none;border-radius:14px;color:#000;font-family:var(--font-display);font-size:22px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 20px rgba(255,255,255,.12);transition:opacity .15s,transform .1s;}
.launch-btn:active{transform:scale(.98);}
.launch-btn:disabled{opacity:.35;cursor:not-allowed;}
.cashout-btn{background:var(--green);color:#000;box-shadow:0 4px 20px rgba(34,197,94,.3);animation:cashout-pulse 1s ease-in-out infinite;}
@keyframes cashout-pulse{0%,100%{box-shadow:0 4px 20px rgba(34,197,94,.3);}50%{box-shadow:0 4px 30px rgba(34,197,94,.6),0 0 0 3px rgba(34,197,94,.1);}}

/* LIVE STATS */
.live-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.ls{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;}
.ls-l{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-family:var(--font-mono);}
.ls-v{font-family:var(--font-mono);font-size:15px;font-weight:700;}

/* HISTORY */
.hist-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.hr-chip{padding:4px 10px;border-radius:8px;font-family:var(--font-mono);font-size:11px;font-weight:700;}
.hr-chip.win{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2);}
.hr-chip.crash{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="lbg"></div>

<div class="topbar">
  <button class="fp-back" onclick="history.back()">‹</button>
  <div class="fp-title">РАКЕТА</div>
  <div class="bal-chip">🪙 <span id="r-bal">—</span></div>
</div>

<div class="page-wrap">
  <!-- STAGE -->
  <div class="rocket-stage" id="stage">
    <div class="stars" id="stars"></div>
    <canvas id="trail-canvas"></canvas>

    <div class="mult-display">
      <div class="mult-val" id="mult-display">1.00×</div>
      <div class="mult-status" id="mult-status">WAITING</div>
    </div>

    <div class="rocket-wrap" id="rocket-wrap" style="bottom:30px;left:calc(50% - 18px)">
      <div class="exhaust-glow"></div>
      <div class="exhaust" id="exhaust" style="display:none"></div>
      <svg class="rocket-svg" width="36" height="52" viewBox="0 0 36 52">
        <ellipse cx="18" cy="24" rx="10" ry="18" fill="#E0E0E0"/>
        <path d="M8 30 L0 46 L18 40 L36 46 L28 30 Z" fill="#AAAAAA"/>
        <ellipse cx="18" cy="22" rx="6" ry="10" fill="#3B82F6" opacity=".7"/>
        <circle cx="18" cy="20" r="4" fill="#60A5FA" opacity=".9"/>
        <path d="M0 46 L8 36 Z" fill="#888" stroke="#888" stroke-width="1"/>
        <path d="M36 46 L28 36 Z" fill="#888" stroke="#888" stroke-width="1"/>
      </svg>
    </div>
  </div>

  <!-- HISTORY CHIPS -->
  <div class="hist-row" id="hist-row"></div>

  <!-- CONTROLS -->
  <div class="controls-card">
    <div class="bet-row">
      <input class="bet-inp" id="bet-inp" type="number" value="50" min="1"/>
    </div>
    <div class="qb-row">
      <div class="qb" onclick="setBet(10)">10</div>
      <div class="qb" onclick="setBet(25)">25</div>
      <div class="qb" onclick="setBet(50)">50</div>
      <div class="qb" onclick="setBet(100)">100</div>
      <div class="qb" onclick="setBet(250)">250</div>
      <div class="qb" onclick="halfBet()">½</div>
      <div class="qb" onclick="doubleBet()">×2</div>
    </div>
    <div class="ac-row">
      <span class="ac-lbl">Авто-кешаут:</span>
      <input class="ac-inp" id="ac-inp" type="number" value="" placeholder="—" min="1.1" step="0.1"/>
      <span class="ac-hint">× (пусто = выкл)</span>
    </div>
  </div>

  <div class="live-stats">
    <div class="ls"><div class="ls-l">Ставка</div><div class="ls-v" id="st-bet">—</div></div>
    <div class="ls"><div class="ls-l">Текущий</div><div class="ls-v" style="color:var(--green)" id="st-curr">—</div></div>
    <div class="ls"><div class="ls-l">Кешаут</div><div class="ls-v" style="color:var(--gold)" id="st-cashout">—</div></div>
  </div>

  <button class="launch-btn" id="main-btn" onclick="mainAction()">🚀 ЗАПУСТИТЬ</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(!tg?.initDataUnsafe?.user?.id) window.location.replace('not_telegram.html');
const UID = tg?.initDataUnsafe?.user?.id || 0;

let balance = 0, currentBet = 0, gamePhase = 'idle';
// idle | running | crashed | cashed
let crashPoint = 1, currentMult = 1, animFrame = null, startTime = null;
let cashedOut = false, autoCashout = 0;
let trailPoints = [], rocketX = 0, rocketY = 0;
const history = [];

const canvas = document.getElementById('trail-canvas');
const ctx = canvas.getContext('2d');

function toast(m,t='info'){
  const el=document.getElementById('toast');
  el.textContent=m;el.className='toast '+t;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}
async function loadUser(){
  const u = await fetch(`/api/user/${UID}`).then(r=>r.json()).catch(()=>null);
  if(!u) return;
  balance = u.balance ?? 0;
  document.getElementById('r-bal').textContent = balance;
}
function setBet(v){ document.getElementById('bet-inp').value = v; }
function halfBet(){ const v=parseInt(document.getElementById('bet-inp').value)||0; document.getElementById('bet-inp').value=Math.max(1,Math.floor(v/2)); }
function doubleBet(){ const v=parseInt(document.getElementById('bet-inp').value)||0; document.getElementById('bet-inp').value=v*2; }

// Generate crash point: exponential distribution weighted low
function genCrash(){
  // ~30% chance < 1.5x, ~50% chance < 3x, rare big values
  const r = Math.random();
  if(r < 0.03) return 1.00; // 3% instant
  const crash = 1 / (1 - r * 0.97);
  return Math.min(crash, 100);
}

function resizeCanvas(){
  const stage = document.getElementById('stage');
  canvas.width = stage.offsetWidth;
  canvas.height = stage.offsetHeight;
}

function drawTrail(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(trailPoints.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(trailPoints[0].x, trailPoints[0].y);
  for(let i=1;i<trailPoints.length;i++){
    ctx.lineTo(trailPoints[i].x, trailPoints[i].y);
  }
  ctx.strokeStyle = gamePhase==='crashed' ? 'rgba(239,68,68,0.6)' : 'rgba(59,130,246,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Glow
  ctx.beginPath();
  ctx.moveTo(trailPoints[0].x, trailPoints[0].y);
  for(let i=1;i<trailPoints.length;i++) ctx.lineTo(trailPoints[i].x, trailPoints[i].y);
  ctx.strokeStyle = gamePhase==='crashed' ? 'rgba(239,68,68,0.2)' : 'rgba(59,130,246,0.2)';
  ctx.lineWidth = 6;
  ctx.stroke();
}

function multToPos(mult){
  const stageH = canvas.height || 260;
  const stageW = canvas.width || 360;
  const progress = Math.min((mult - 1) / (crashPoint - 1), 1);
  const x = 30 + progress * (stageW - 80);
  const y = stageH - 30 - progress * (stageH - 80);
  return {x, y};
}

function animate(ts){
  if(!startTime) startTime = ts;
  const elapsed = (ts - startTime) / 1000;
  // Exponential growth: mult = e^(elapsed * growth_rate)
  const growthRate = 0.08;
  currentMult = Math.pow(Math.E, elapsed * growthRate * crashPoint);
  currentMult = Math.min(currentMult, crashPoint * 1.001);
  currentMult = Math.round(currentMult * 100) / 100;

  // Update display
  const mEl = document.getElementById('mult-display');
  mEl.textContent = currentMult.toFixed(2) + '×';
  mEl.className = 'mult-val safe';
  document.getElementById('st-curr').textContent = currentMult.toFixed(2) + '×';

  // Move rocket
  const pos = multToPos(currentMult);
  const rocket = document.getElementById('rocket-wrap');
  const stageH = canvas.height || 260;
  rocket.style.bottom = (stageH - pos.y - 26) + 'px';
  rocket.style.left = (pos.x - 18) + 'px';
  trailPoints.push({x:pos.x, y:pos.y});
  if(trailPoints.length > 200) trailPoints.shift();
  drawTrail();

  // Check auto cashout
  const ac = parseFloat(document.getElementById('ac-inp').value);
  if(ac >= 1.01 && currentMult >= ac && !cashedOut){ doCashout(); return; }

  // Check crash
  if(currentMult >= crashPoint){ doCrash(); return; }
  animFrame = requestAnimationFrame(animate);
}

async function mainAction(){
  if(gamePhase === 'idle'){ launchRocket(); }
  else if(gamePhase === 'running'){ doCashout(); }
}

async function launchRocket(){
  const bet = parseInt(document.getElementById('bet-inp').value)||0;
  if(bet < 1){ toast('Введите ставку','err'); return; }
  if(bet > balance){ toast('Недостаточно монет','err'); return; }
  currentBet = bet; cashedOut = false;
  crashPoint = genCrash();
  trailPoints = []; startTime = null;
  gamePhase = 'running';

  resizeCanvas();
  document.getElementById('exhaust').style.display = '';
  document.getElementById('mult-status').textContent = 'ПОЛЁТ...';
  document.getElementById('st-bet').textContent = currentBet;
  document.getElementById('st-curr').textContent = '1.00×';
  document.getElementById('st-cashout').textContent = '—';

  // Move rocket to start
  const rocket = document.getElementById('rocket-wrap');
  rocket.style.bottom = '30px';
  rocket.style.left = 'calc(50% - 18px)';

  const btn = document.getElementById('main-btn');
  btn.textContent = '💰 КЕШАУТ';
  btn.className = 'launch-btn cashout-btn';

  animFrame = requestAnimationFrame(animate);
}

function doCrash(){
  if(animFrame) cancelAnimationFrame(animFrame);
  gamePhase = 'crashed';
  document.getElementById('exhaust').style.display = 'none';
  const mEl = document.getElementById('mult-display');
  mEl.textContent = crashPoint.toFixed(2) + '×';
  mEl.className = 'mult-val crashed';
  document.getElementById('mult-status').textContent = '💥 CRASHED';

  if(!cashedOut){
    history.unshift({mult:crashPoint.toFixed(2), won:false});
    renderHistory();
    // Submit loss
    fetch('/api/game/play',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:UID,game:'Ракета',bet:currentBet,won:false,detail:`Ракета: крэш ${crashPoint.toFixed(2)}×`})
    }).then(r=>r.json()).then(res=>{
      if(res?.new_balance != null){ balance=res.new_balance; document.getElementById('r-bal').textContent=balance; }
    }).catch(()=>{});
    toast(`💥 Крэш на ${crashPoint.toFixed(2)}× — потеряно ${currentBet}🪙`,'err');
  }

  const btn = document.getElementById('main-btn');
  btn.textContent = '🚀 ЗАПУСТИТЬ СНОВА';
  btn.className = 'launch-btn';
  gamePhase = 'idle';
}

async function doCashout(){
  if(gamePhase !== 'running' || cashedOut) return;
  cashedOut = true;
  const mult = currentMult;
  const won = Math.round(currentBet * mult);
  const profit = won - currentBet;

  document.getElementById('st-cashout').textContent = mult.toFixed(2) + '×';

  const res = await fetch('/api/game/play',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user_id:UID,game:'Ракета',bet:currentBet,won:true,multiplier:mult,detail:`Ракета: кешаут ${mult.toFixed(2)}× (+${profit}🪙)`})
  }).then(r=>r.json()).catch(()=>null);

  if(res?.new_balance != null){ balance=res.new_balance; document.getElementById('r-bal').textContent=balance; }
  history.unshift({mult:mult.toFixed(2), won:true});
  renderHistory();
  toast(`💰 Кешаут ${mult.toFixed(2)}× · +${profit}🪙`,'ok');
}

function renderHistory(){
  const row = document.getElementById('hist-row');
  row.innerHTML = history.slice(0,12).map(h=>
    `<div class="hr-chip ${h.won?'win':'crash'}">${h.mult}×</div>`
  ).join('');
}

// Stars
function initStars(){
  const s = document.getElementById('stars');
  for(let i=0;i<40;i++){
    const d = document.createElement('div');
    d.className = 'star';
    const sz = Math.random()*2+1;
    d.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*3}s;--dl:${Math.random()*3}s`;
    s.appendChild(d);
  }
}
initStars();
loadUser();
</script>
</body>
</html>
