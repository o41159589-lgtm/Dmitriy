<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ракета — TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="shared.js"></script>
<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})();</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--text:#F2F2F2;--muted:#9B9B9B;--green:#4ADE80;--red:#FF6B7F;--gold:#FFC94D}
html,body{background:linear-gradient(175deg,#000000 0%,#050505 28%,#0A0A0A 55%,#0E0E0E 100%) fixed;color:var(--text);font-family:'Nunito',sans-serif;min-height:100%;overflow-x:hidden}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;background:rgba(14,14,14,0.97);box-shadow:0 2px 14px rgba(0,0,0,0.33)}
.fp-back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.13);display:flex;align-items:center;justify-content:center;color:#F2F2F2;font-size:22px;cursor:pointer;font-weight:700}
.fp-title{font-size:16px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(14,14,14,0.97);border:2px solid #FFD028;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:800;color:#FFC94D}
.toast{position:fixed;top:80px;left:14px;right:14px;z-index:500;background:rgba(14,14,14,0.97);border:1.5px solid rgba(255,255,255,0.11);box-shadow:0 6px 24px rgba(0,0,0,0.45);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-140%);opacity:0;transition:.3s}
.toast.show{transform:none;opacity:1}.toast.ok{color:var(--green)}.toast.err{color:var(--red)}
.page{position:relative;z-index:1;padding:12px 14px 40px;max-width:520px;margin:0 auto}

/* ── сцена ── */
#stage{position:relative;height:310px;border-radius:26px;overflow:hidden;border:3px solid rgba(255,255,255,.13);
  box-shadow:0 10px 30px rgba(0,0,0,0.66);margin-bottom:12px;
  background:radial-gradient(120% 90% at 20% 100%,#242424 0%,#0F0F0F 45%,#030303 100%)}
#stars{position:absolute;inset:0}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#141414;opacity:.7;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
#cv{position:absolute;inset:0;width:100%;height:100%}
.mult{position:absolute;top:16px;left:0;right:0;text-align:center;pointer-events:none;z-index:3}
.mult-val{font-size:56px;font-weight:900;line-height:1;color:#fff;text-shadow:0 4px 24px rgba(120,160,255,.55);transition:color .2s}
.mult-val.safe{color:#7CF5B0;text-shadow:0 4px 26px rgba(60,220,140,.55)}
.mult-val.crashed{color:#FF6B7A;text-shadow:0 4px 26px rgba(255,60,80,.6)}
.mult-val.cashed{color:#FFD84D;text-shadow:0 4px 26px rgba(255,200,40,.6)}
.mult-status{margin-top:6px;font-size:12px;font-weight:800;letter-spacing:2.5px;color:rgba(255,255,255,.65)}

/* ── ракета: анимированный стикер, сконвертированный в WebP (нос стикера смотрит на 45°, поворачиваем по касательной к графику) ── */
#rocket{position:absolute;left:0;top:0;width:64px;height:64px;z-index:4;will-change:transform;transform-origin:50% 50%;pointer-events:none}
#rocket img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
#rocket.away{transition:transform .9s cubic-bezier(.5,0,1,.6),opacity .9s;opacity:0}
#boom{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;z-index:5;pointer-events:none;display:none}
#boom.go{display:block}
#boom i{position:absolute;inset:0;border-radius:50%;border:3px solid #FFB347;animation:ring .7s ease-out forwards}
#boom i:nth-child(2){border-color:#FF5A5A;animation-delay:.08s}
#boom b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;animation:pop .6s ease-out forwards}
@keyframes ring{from{transform:scale(.1);opacity:1}to{transform:scale(1.5);opacity:0}}
@keyframes pop{0%{transform:scale(.2)}40%{transform:scale(1.25)}100%{transform:scale(1);opacity:.0}}

/* ── история ── */
#hist{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
#hist::-webkit-scrollbar{display:none}
.hc{flex:0 0 auto;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:900;background:rgba(14,14,14,0.94);border:1.5px solid rgba(255,255,255,0.11)}
.hc.low{color:#FF6B7F}.hc.mid{color:#7DB8FF}.hc.high{color:#FFC94D;border-color:#FFD028}.hc.won{box-shadow:inset 0 0 0 2px rgba(26,154,80,.45)}

/* ── управление ── */
.card{background:rgba(14,14,14,0.96);border:2px solid rgba(255,255,255,.13);border-radius:22px;box-shadow:0 5px 20px rgba(0,0,0,0.33);padding:14px;margin-bottom:12px}
.stag{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.bet-inp{background:rgba(14,14,14,0.92);border:1.5px solid rgba(255,255,255,0.14);border-radius:12px;padding:10px 14px;color:#F2F2F2;font-family:inherit;font-weight:800;font-size:18px;outline:none;text-align:center;width:100%;margin-bottom:10px}
.bet-inp:focus{border-color:rgba(40,100,220,.4)}
.qb-row{display:flex;gap:6px;flex-wrap:wrap}
.qb{padding:7px 12px;background:rgba(14,14,14,0.89);border:1.5px solid rgba(255,255,255,0.13);font-weight:700;font-size:11px;border-radius:10px;cursor:pointer}
.qb:active{background:rgba(255,255,255,0.11)}
.ac-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;font-weight:700;color:var(--muted)}
.ac-inp{width:84px;background:rgba(14,14,14,0.92);border:1.5px solid rgba(255,255,255,0.14);border-radius:10px;padding:7px 10px;font-family:inherit;font-weight:800;font-size:14px;color:#F2F2F2;text-align:center;outline:none}
.go-btn{width:100%;padding:16px;font-family:inherit;font-size:22px;font-weight:900;letter-spacing:.5px;border-radius:18px;border:none;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#46D98A 0%,#1FA75C 100%);border-bottom:4px solid #137A42;box-shadow:0 8px 20px rgba(20,150,80,.35);transition:transform .08s}
.go-btn:active{transform:translateY(3px);border-bottom-width:1px}
.go-btn.cash{background:linear-gradient(180deg,#FFD84D 0%,#F2A900 100%);border-bottom-color:#B87A00;color:#3A2A00;box-shadow:0 8px 20px rgba(230,160,0,.4)}
.go-btn:disabled{opacity:.6}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="topbar">
  <button class="fp-back" onclick="location.href='main.html?tab=games'">‹</button>
  <div class="fp-title">Ракета</div>
  <div class="bal-chip"><img src="textures/coin.svg" width="20" height="20" alt="" style="vertical-align:middle;margin-right:2px"> <span id="r-bal">—</span></div>
</div>

<div class="page">
  <div id="stage">
    <div id="stars"></div>
    <canvas id="cv"></canvas>
    <div class="mult"><div class="mult-val" id="mv">1.00×</div><div class="mult-status" id="ms">ОЖИДАНИЕ</div></div>
    <div id="rocket" class="idle"><img src="rocket.webp" width="64" height="64" alt="" draggable="false"></div>
    <div id="boom"><i></i><i></i><b>💥</b></div>
  </div>

  <div id="hist"></div>

  <div class="card">
    <div class="stag">// ставка</div>
    <input class="bet-inp" id="bet-inp" type="number" value="50" min="1" inputmode="numeric"/>
    <div class="qb-row">
      <div class="qb" onclick="setBet(10)">10</div><div class="qb" onclick="setBet(25)">25</div>
      <div class="qb" onclick="setBet(50)">50</div><div class="qb" onclick="setBet(100)">100</div>
      <div class="qb" onclick="setBet(250)">250</div><div class="qb" onclick="halfBet()">½</div><div class="qb" onclick="doubleBet()">×2</div>
    </div>
    <div class="ac-row"><span>Авто-кешаут:</span><input class="ac-inp" id="ac-inp" type="number" placeholder="—" min="1.1" step="0.1" inputmode="decimal"/><span>× (пусто = выкл)</span></div>
  </div>

  <button class="go-btn" id="main-btn" onclick="mainAction()">🚀 ЗАПУСТИТЬ</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
if(!tg?.initDataUnsafe?.user?.id) window.location.replace('not_telegram.html');
const UID = tg?.initDataUnsafe?.user?.id || 0;

let balance=0, currentBet=0, phase='idle';          // idle | running
let RATE=0.15, startTime=0, animFrame=null, pollTimer=null, autoMult=0;
let flying=false, crashKnown=null, cashedMult=null;   // после кешаута ракета летит дальше до настоящего крэша
let hist=[], lastAngle=63, curMult=1, curT=0;
const MAXM=100;
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'), stage=$('stage'), rocket=$('rocket');
let W=360,H=310;
const PL=38,PR=22,PT=78,PB=26;     // PT — запас под крупный множитель

/* звёзды */
(function(){const s=$('stars');for(let i=0;i<46;i++){const e=document.createElement('i');e.className='star';
  e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';e.style.animationDelay=(Math.random()*3)+'s';
  e.style.transform='scale('+(.6+Math.random()*1.2)+')';s.appendChild(e);}})();

function toast(m,t='info'){const el=$('toast');el.textContent=m;el.className='toast '+t+' show';setTimeout(()=>el.classList.remove('show'),2800);}
async function loadUser(){
  const u=await fetch('/api/user/'+UID).then(r=>r.json()).catch(()=>null);
  if(!u) return; balance=u.balance??0; $('r-bal').textContent=balance;
}
function setBet(v){$('bet-inp').value=v;}
function halfBet(){const v=parseInt($('bet-inp').value)||0;$('bet-inp').value=Math.max(1,Math.floor(v/2));}
function doubleBet(){const v=parseInt($('bet-inp').value)||0;$('bet-inp').value=v*2;}

/* ── геометрия графика: окно масштабируется вместе с полётом ── */
function viewFor(t,m){return {Tv:Math.max(6,t*1.15), Mv:Math.max(2,m*1.15)};}
function pt(t,m,v){
  return {x:PL+(t/v.Tv)*(W-PL-PR), y:H-PB-((m-1)/(v.Mv-1))*(H-PT-PB)};
}
function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  W=stage.clientWidth;H=stage.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  frame(curT,curMult,true);
}
window.addEventListener('resize',resize);

function niceStep(range){for(const s of [.25,.5,1,2,5,10,20,50])if(range/s<=5)return s;return 100;}
function drawGrid(v){
  ctx.font='700 10px Nunito,sans-serif';ctx.textBaseline='middle';
  const step=niceStep(v.Mv-1);
  for(let m=1;m<=v.Mv;m+=step){
    const y=pt(0,m,v).y; if(y<PT-30) break;
    ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillText((Math.round(m*100)/100)+'×',6,y);
  }
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(PL,PT-30);ctx.lineTo(PL,H-PB);ctx.lineTo(W-PR,H-PB);ctx.stroke();
}
function colorFor(state){return state==='crashed'?['#FF4D5E','rgba(255,77,94,'] : state==='cashed'?['#FFC83D','rgba(255,200,61,'] : ['#35E08C','rgba(53,224,140,'];}
let state='idle';
function frame(t,m,redrawOnly){
  ctx.clearRect(0,0,W,H);
  const v=viewFor(t,m); drawGrid(v);
  if(autoMult>1 && state==='running'){
    const y=pt(0,autoMult,v).y; if(y>PT-34){ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(255,216,77,.7)';ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#FFD84D';ctx.fillText('авто '+autoMult+'×',W-PR-56,y-8);}
  }
  let tip=pt(0,1,v), ang=lastAngle;
  if(hist.length>1){
    const [c,rgba]=colorFor(state);
    ctx.beginPath();hist.forEach((p,i)=>{const q=pt(p.t,p.m,v);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});
    tip=pt(hist[hist.length-1].t,hist[hist.length-1].m,v);
    const area=new Path2D();                       // заливка под кривой
    hist.forEach((p,i)=>{const q=pt(p.t,p.m,v);i?area.lineTo(q.x,q.y):area.moveTo(q.x,q.y);});
    area.lineTo(tip.x,H-PB);area.lineTo(PL,H-PB);area.closePath();
    const g=ctx.createLinearGradient(0,tip.y,0,H-PB);g.addColorStop(0,rgba+'.28)');g.addColorStop(1,rgba+'0)');
    ctx.fillStyle=g;ctx.fill(area);
    ctx.lineJoin='round';ctx.lineCap='round';
    ctx.strokeStyle=rgba+'.25)';ctx.lineWidth=9;ctx.stroke();
    ctx.strokeStyle=c;ctx.lineWidth=3;ctx.stroke();
  }
  if(state==='running'||state==='idle'||state==='cashed'){
    // касательная к кривой в текущей точке → нос ракеты смотрит туда же, куда идёт график
    const dx=(W-PL-PR)/v.Tv, dyUp=(H-PT-PB)*RATE*Math.max(1,m)/(v.Mv-1);
    const target=Math.atan2(dx,dyUp)*180/Math.PI;
    lastAngle += (target-lastAngle)*(redrawOnly?1:.18); ang=lastAngle;
    rocket.style.transform=`translate(${tip.x-32}px,${tip.y-32}px) rotate(${ang-45}deg)`;
  }
  return {tip,ang};
}
function placeIdle(){
  state='idle';hist=[];curT=0;curMult=1;lastAngle=63;
  rocket.className='idle';rocket.style.opacity=1;rocket.style.transition='none';
  $('boom').className='';frame(0,1,true);
}

function animate(){
  if(!flying) return;
  const t=(performance.now()-startTime)/1000;
  const raw=Math.exp(t*RATE);
  if(crashKnown!=null && raw>=crashKnown){ finishCrash(crashKnown); return; }
  curT=t; curMult=Math.min(MAXM,Math.floor(raw*100)/100);
  if(!hist.length||t>hist[hist.length-1].t+.04) hist.push({t,m:raw});
  if(hist.length>700) hist.splice(1,2);
  const mEl=$('mv');mEl.textContent=curMult.toFixed(2)+'×';
  mEl.className='mult-val '+(cashedMult!=null?'cashed':'safe');
  if(phase==='running'){
    
    $('main-btn').textContent='💰 ЗАБРАТЬ '+Math.floor(currentBet*curMult);
  }
  frame(t,raw);
  animFrame=requestAnimationFrame(animate);
}

async function api(path,method,body){
  const o={method:method||'GET',headers:{'Content-Type':'application/json'}};
  if(body)o.body=JSON.stringify(body);
  const r=await fetch(path,o);let j=null;try{j=await r.json();}catch(e){}
  return j||{error:'Ошибка сервера'};
}
async function mainAction(){ if(phase==='idle')launchRocket(); else if(phase==='running')doCashout(); }

async function launchRocket(){
  const bet=parseInt($('bet-inp').value)||0;
  if(bet<1){toast('Введите ставку','err');return;}
  if(bet>balance){toast('Недостаточно монет','err');return;}
  const ac=parseFloat($('ac-inp').value)||0;
  const btn=$('main-btn');btn.disabled=true;
  const r=await api('/api/rocket/start','POST',{bet,auto:ac>=1.01?ac:0});
  btn.disabled=false;
  if(r.error){toast(r.error,'err');return;}
  // если предыдущая ракета ещё долетала — закрываем её визуально
  if(flying&&crashKnown!=null) addHist(crashKnown,cashedMult!=null);
  cancelAnimationFrame(animFrame);
  RATE=r.rate||RATE;balance=r.new_balance;$('r-bal').textContent=balance;
  currentBet=bet;autoMult=ac>=1.01?ac:0;phase='running';state='running';
  flying=true;crashKnown=null;cashedMult=null;
  hist=[];curT=0;curMult=1;startTime=performance.now();lastAngle=63;
  rocket.className='';rocket.style.opacity=1;rocket.style.transition='none';$('boom').className='';
  $('ms').textContent='ПОЛЁТ';
  btn.className='go-btn cash';
  animFrame=requestAnimationFrame(animate);
  clearInterval(pollTimer);pollTimer=setInterval(pollState,200);
}
async function pollState(){
  if(phase!=='running')return;
  const r=await api('/api/rocket/state');
  if(phase!=='running')return;
  if(r.status==='running'){startTime=performance.now()-r.t*1000;}
  else if(r.status==='crashed'||r.status==='cashed'){endRound(r);}
  else if(r.status==='idle'){endRound({status:'crashed',crash:Math.max(1,curMult)});}
}

function addHist(m,won){
  const arr=JSON.parse(sessionStorage.getItem('rk_hist')||'[]');arr.unshift({m,won});arr.length=Math.min(arr.length,20);
  sessionStorage.setItem('rk_hist',JSON.stringify(arr));renderHist();
}
function renderHist(){
  const arr=JSON.parse(sessionStorage.getItem('rk_hist')||'[]');
  $('hist').innerHTML=arr.map(h=>`<div class="hc ${h.m<2?'low':h.m<10?'mid':'high'} ${h.won?'won':''}">${(+h.m).toFixed(2)}×</div>`).join('');
}

// настоящий крэш: взрыв ракеты (после кешаута тоже — ракета долетает до точки краха)
function finishCrash(c){
  flying=false;cancelAnimationFrame(animFrame);
  state='crashed';
  const mEl=$('mv');mEl.textContent=c.toFixed(2)+'×';mEl.className='mult-val crashed';
  $('ms').textContent=cashedMult!=null?('КРЭШ · вы забрали '+cashedMult.toFixed(2)+'×'):'КРЭШ';
  hist.push({t:Math.max(curT,hist.length?hist[hist.length-1].t:0)+.01,m:Math.max(1,c)});
  const {tip}=frame(curT,Math.max(1,c),true);
  rocket.style.opacity=0;
  const b=$('boom');b.style.left=tip.x+'px';b.style.top=tip.y+'px';b.className='go';
  addHist(c,cashedMult!=null);
  crashKnown=null;
}

function endRound(r){
  if(phase!=='running')return;
  clearInterval(pollTimer);pollTimer=null;
  if(r.new_balance!=null){balance=r.new_balance;$('r-bal').textContent=balance;}
  phase='idle';
  const btn=$('main-btn');btn.className='go-btn';btn.textContent='🚀 ЗАПУСТИТЬ СНОВА';btn.disabled=false;
  if(r.status==='cashed'){
    cashedMult=r.mult;state='cashed';
    
    toast(`💰 ${r.mult.toFixed(2)}× · ${r.profit>=0?'+':''}${r.profit}`,'ok');
    if(flying){                         // ракета продолжает лететь до крэша
      crashKnown=r.crash;
      $('ms').textContent='КЕШАУТ  +'+r.profit;
    }else{                              // вернулись в приложение уже после авто-кешаута
      const mEl=$('mv');mEl.textContent=(r.crash||r.mult).toFixed(2)+'×';mEl.className='mult-val cashed';
      $('ms').textContent='КЕШАУТ  +'+r.profit;
    }
  }else{
    cashedMult=null;
    toast(`💥 Крэш на ${r.crash.toFixed(2)}× · −${currentBet}`,'err');
    flying=true;finishCrash(r.crash);
  }
}
async function doCashout(){
  if(phase!=='running')return;
  const btn=$('main-btn');btn.disabled=true;
  const r=await api('/api/rocket/cashout','POST',{});
  btn.disabled=false;
  if(r.error){toast(r.error,'err');return;}
  endRound(r);
}
async function resumeRound(){
  const r=await api('/api/rocket/state');
  if(r.status==='running'){
    RATE=r.rate||RATE;currentBet=r.bet;autoMult=r.auto||0;phase='running';state='running';flying=true;
    startTime=performance.now()-r.t*1000;hist=[];
    rocket.className='';$('ms').textContent='ПОЛЁТ';
    $('main-btn').className='go-btn cash';
    animFrame=requestAnimationFrame(animate);pollTimer=setInterval(pollState,200);
  }else if(r.status==='crashed'||r.status==='cashed'){phase='running';endRound(r);}
}
resize();placeIdle();renderHist();
loadUser().then(resumeRound);
</script>
</body>
</html>
