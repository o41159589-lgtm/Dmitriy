<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 148">
<defs>
  <radialGradient id="boardBg" cx="50%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#E8F4FF"/>
    <stop offset="100%" stop-color="#C8E4FF"/>
  </radialGradient>
  <radialGradient id="pegG" cx="35%" cy="28%" r="65%">
    <stop offset="0%"  stop-color="#FFF5A0"/>
    <stop offset="35%" stop-color="#FFD428"/>
    <stop offset="75%" stop-color="#E0A000"/>
    <stop offset="100%" stop-color="#B87800"/>
  </radialGradient>
  <radialGradient id="pegShine" cx="30%" cy="22%" r="50%">
    <stop offset="0%" stop-color="rgba(255,255,230,0.85)"/>
    <stop offset="100%" stop-color="rgba(255,255,230,0)"/>
  </radialGradient>
  <radialGradient id="ballG" cx="32%" cy="26%" r="68%">
    <stop offset="0%"  stop-color="#C8EEFF"/>
    <stop offset="35%" stop-color="#7060E8"/>
    <stop offset="75%" stop-color="#4030C8"/>
    <stop offset="100%" stop-color="#1E10A0"/>
  </radialGradient>
  <radialGradient id="ballShine" cx="28%" cy="22%" r="48%">
    <stop offset="0%" stop-color="rgba(255,255,255,0.65)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
  </radialGradient>
  <filter id="pegShadow">
    <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="rgba(160,100,0,0.40)"/>
  </filter>
  <filter id="ballShadow">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(60,40,180,0.50)"/>
  </filter>
  <filter id="boardShadow">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(20,60,140,0.18)"/>
  </filter>
  <filter id="bucketGlow">
    <feGaussianBlur stdDeviation="1" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Board background -->
<rect x="4" y="4" width="132" height="140" rx="16" fill="url(#boardBg)" stroke="#90C4F0" stroke-width="2" filter="url(#boardShadow)"/>
<rect x="7" y="7" width="126" height="134" rx="13" fill="none" stroke="rgba(100,160,220,0.22)" stroke-width="1"/>

<!-- Macro: 3D golden peg at cx,cy r=6.5 -->
<!-- Row 1: 3 pegs (y=22) -->
<g filter="url(#pegShadow)">
  <circle cx="40" cy="22" r="7" fill="url(#pegG)"/><circle cx="40" cy="22" r="7" fill="url(#pegShine)"/><circle cx="40" cy="22" r="7" fill="none" stroke="rgba(180,110,0,0.40)" stroke-width="1"/>
  <circle cx="70" cy="22" r="7" fill="url(#pegG)"/><circle cx="70" cy="22" r="7" fill="url(#pegShine)"/><circle cx="70" cy="22" r="7" fill="none" stroke="rgba(180,110,0,0.40)" stroke-width="1"/>
  <circle cx="100" cy="22" r="7" fill="url(#pegG)"/><circle cx="100" cy="22" r="7" fill="url(#pegShine)"/><circle cx="100" cy="22" r="7" fill="none" stroke="rgba(180,110,0,0.40)" stroke-width="1"/>
</g>
<!-- Row 2: 4 pegs (y=42) -->
<g filter="url(#pegShadow)">
  <circle cx="25" cy="42" r="7" fill="url(#pegG)"/><circle cx="25" cy="42" r="7" fill="url(#pegShine)"/><circle cx="25" cy="42" r="7" fill="none" stroke="rgba(180,110,0,0.40)" stroke-width="1"/>
  <circle cx="55" cy="42" r="7" fill="url(#pegG)"/><circle cx="55" cy="42" r="7" fill="url(#pegShine)"/><circle cx="55" cy="42" r="7" fill="none" stroke="rgba(180,110,0,0.40)" stroke-width="1"/>
  <circle cx="85" cy="42" r="7" fill="url(#pegG)"/><circle cx="85" cy="42" r="7" fill="url(#pegShine)"/><circle cx="85" cy="42" r="7" fill="none" stroke="rgba(180,110,0,0.40)" stroke-width="1"/>
  <circle cx="115" cy="42" r="7" fill="url(#pegG)"/><circle cx="115" cy="42" r="7" fill="url(#pegShine)"/><circle cx="115" cy="42" r="7" fill="none" stroke="rgba(180,110,0,0.40)" stroke-width="1"/>
</g>
<!-- Row 3: 3 pegs (y=62) -->
<g filter="url(#pegShadow)">
  <circle cx="40" cy="62" r="7" fill="url(#pegG)"/><circle cx="40" cy="62" r="7" fill="url(#pegShine)"/>
  <circle cx="70" cy="62" r="7" fill="url(#pegG)"/><circle cx="70" cy="62" r="7" fill="url(#pegShine)"/>
  <circle cx="100" cy="62" r="7" fill="url(#pegG)"/><circle cx="100" cy="62" r="7" fill="url(#pegShine)"/>
</g>
<!-- Row 4: 4 pegs (y=82) -->
<g filter="url(#pegShadow)">
  <circle cx="25" cy="82" r="7" fill="url(#pegG)"/><circle cx="25" cy="82" r="7" fill="url(#pegShine)"/>
  <circle cx="55" cy="82" r="7" fill="url(#pegG)"/><circle cx="55" cy="82" r="7" fill="url(#pegShine)"/>
  <circle cx="85" cy="82" r="7" fill="url(#pegG)"/><circle cx="85" cy="82" r="7" fill="url(#pegShine)"/>
  <circle cx="115" cy="82" r="7" fill="url(#pegG)"/><circle cx="115" cy="82" r="7" fill="url(#pegShine)"/>
</g>

<!-- Ball trail (fading) -->
<ellipse cx="70" cy="72" rx="5" ry="7" fill="rgba(70,50,220,0.15)"/>
<ellipse cx="70" cy="60" rx="4" ry="5.5" fill="rgba(70,50,220,0.10)"/>
<ellipse cx="70" cy="50" rx="3" ry="4" fill="rgba(70,50,220,0.06)"/>
<!-- Ball -->
<circle cx="70" cy="42" r="11" fill="url(#ballG)" filter="url(#ballShadow)"/>
<circle cx="70" cy="42" r="11" fill="url(#ballShine)"/>
<circle cx="70" cy="42" r="11" fill="none" stroke="rgba(80,60,200,0.35)" stroke-width="1"/>
<!-- Ball inner highlight -->
<circle cx="66" cy="38" r="4" fill="rgba(255,255,255,0.50)"/>
<circle cx="65" cy="37" r="1.8" fill="rgba(255,255,255,0.75)"/>

<!-- Multiplier buckets -->
<g font-family="'Nunito',Arial,sans-serif" font-size="9" font-weight="800" text-anchor="middle">
  <!-- 10x purple -->
  <rect x="5"  y="100" width="21" height="28" rx="6" fill="#7028D8" filter="url(#bucketGlow)"/>
  <rect x="5"  y="100" width="21" height="9"  rx="6" fill="rgba(255,255,255,0.25)"/>
  <text x="15.5" y="119" fill="white" font-size="8.5">10x</text>
  <!-- 3x blue -->
  <rect x="28" y="104" width="18" height="24" rx="5" fill="#3868E0"/>
  <rect x="28" y="104" width="18" height="8"  rx="5" fill="rgba(255,255,255,0.20)"/>
  <text x="37" y="120" fill="white" font-size="8.5">3x</text>
  <!-- 1x green -->
  <rect x="48" y="107" width="16" height="21" rx="4" fill="#20A068"/>
  <rect x="48" y="107" width="16" height="7"  rx="4" fill="rgba(255,255,255,0.18)"/>
  <text x="56" y="121" fill="white" font-size="8.5">1x</text>
  <!-- 1x green -->
  <rect x="66" y="107" width="16" height="21" rx="4" fill="#20A068"/>
  <rect x="66" y="107" width="16" height="7"  rx="4" fill="rgba(255,255,255,0.18)"/>
  <text x="74" y="121" fill="white" font-size="8.5">1x</text>
  <!-- 3x blue -->
  <rect x="84" y="104" width="18" height="24" rx="5" fill="#3868E0"/>
  <rect x="84" y="104" width="18" height="8"  rx="5" fill="rgba(255,255,255,0.20)"/>
  <text x="93" y="120" fill="white" font-size="8.5">3x</text>
  <!-- 10x purple -->
  <rect x="104" y="100" width="21" height="28" rx="6" fill="#7028D8" filter="url(#bucketGlow)"/>
  <rect x="104" y="100" width="21" height="9"  rx="6" fill="rgba(255,255,255,0.25)"/>
  <text x="114.5" y="119" fill="white" font-size="8.5">10x</text>
</g>

<!-- Corner decoration stars -->
<text x="8"  y="20" font-size="12" fill="rgba(70,70,220,0.55)" font-family="serif">★</text>
<text x="118" y="20" font-size="10" fill="rgba(70,70,220,0.45)" font-family="serif">★</text>
</svg>