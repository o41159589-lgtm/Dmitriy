<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<defs>
  <radialGradient id="gGlow" cx="50%" cy="50%" r="55%">
    <stop offset="55%" stop-color="rgba(180,60,255,0)"/>
    <stop offset="80%" stop-color="rgba(180,60,255,0.55)"/>
    <stop offset="100%" stop-color="rgba(180,60,255,0)"/>
  </radialGradient>
  <linearGradient id="rimOuter" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFE870"/>
    <stop offset="50%" stop-color="#FFC200"/>
    <stop offset="100%" stop-color="#B87800"/>
  </linearGradient>
  <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFA840"/>
    <stop offset="100%" stop-color="#E86800"/>
  </linearGradient>
  <linearGradient id="faceBottom" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D85800"/>
    <stop offset="100%" stop-color="#A03C00"/>
  </linearGradient>
  <linearGradient id="sideFacet" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFE050"/>
    <stop offset="100%" stop-color="#D89000"/>
  </linearGradient>
  <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Neon glow ring behind coin -->
<circle cx="32" cy="32" r="27" fill="url(#gGlow)"/>

<g filter="url(#neonGlow)">
  <!-- Octagon outer rim (dark gold edge) -->
  <polygon points="32,4 47,9 58,20 58,44 47,55 32,60 17,55 6,44 6,20 17,9"
    fill="url(#rimOuter)"/>

  <!-- Bevel facets: top edge lighter, bottom edge darker -->
  <polygon points="32,4 47,9 43,15 21,15 17,9" fill="#FFF2A0"/>
  <polygon points="58,20 58,44 51,40 51,24" fill="url(#sideFacet)"/>
  <polygon points="47,55 32,60 32,52 43,49" fill="#8C5800"/>
  <polygon points="17,55 6,44 13,40 21,49" fill="#6E4200"/>
  <polygon points="6,20 6,44 13,40 13,24" fill="#B87800"/>
  <polygon points="17,9 6,20 13,24 21,15" fill="#FFD860"/>
  <polygon points="47,9 58,20 51,24 43,15" fill="#E8A400"/>
  <polygon points="32,60 17,55 21,49 43,49" fill="#7A4C00"/>

  <!-- Inner beveled face -->
  <polygon points="32,10 44,14.5 53,23 53,41 44,49.5 32,54 20,49.5 11,41 11,23 20,14.5"
    fill="url(#faceTop)"/>
  <polygon points="32,10 44,14.5 53,23 32,32" fill="url(#faceTop)"/>
  <polygon points="53,23 53,41 44,49.5 32,32" fill="url(#faceBottom)" opacity="0.85"/>
  <polygon points="44,49.5 32,54 20,49.5 32,32" fill="url(#faceBottom)"/>
  <polygon points="20,49.5 11,41 11,23 32,32" fill="url(#faceTop)" opacity="0.9"/>
  <polygon points="11,23 20,14.5 32,10 32,32" fill="url(#faceTop)"/>

  <!-- Inner face rim -->
  <polygon points="32,10 44,14.5 53,23 53,41 44,49.5 32,54 20,49.5 11,41 11,23 20,14.5"
    fill="none" stroke="#FFDE7A" stroke-width="1.3" opacity="0.7"/>

  <!-- Dollar sign -->
  <line x1="32" y1="19" x2="32" y2="45" stroke="#4A2200" stroke-width="3.4" stroke-linecap="round" opacity="0.85"/>
  <path d="M 39 25 Q 39 20.5 32 20.5 Q 25 20.5 25 25 Q 25 29.5 32 29.5 Q 39 29.5 39 34.5 Q 39 39.5 32 39.5 Q 25 39.5 25 35"
    fill="none" stroke="#3A1A00" stroke-width="3.6" stroke-linecap="round" opacity="0.85"/>
  <line x1="31" y1="18" x2="31" y2="44" stroke="#FFEFB0" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- Top-left highlight -->
  <ellipse cx="22" cy="20" rx="7" ry="4" fill="rgba(255,255,220,0.35)"/>
</g>
</svg>
