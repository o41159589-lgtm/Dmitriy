<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 148">
<defs>

  <!-- ===================== BOARD ===================== -->
  <radialGradient id="boardBg" cx="50%" cy="24%" r="85%">
    <stop offset="0%"  stop-color="#F2F9FF"/>
    <stop offset="45%" stop-color="#D8ECFF"/>
    <stop offset="100%" stop-color="#AFD6F5"/>
  </radialGradient>
  <linearGradient id="boardEdgeTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="boardEdgeBottom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1A3B66" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1A3B66" stop-opacity="0.28"/>
  </linearGradient>
  <linearGradient id="frameMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#FFFFFF"/>
    <stop offset="45%"  stop-color="#BFDDF7"/>
    <stop offset="55%"  stop-color="#8FBBE6"/>
    <stop offset="100%" stop-color="#4E80B8"/>
  </linearGradient>

  <!-- ===================== PEGS ===================== -->
  <radialGradient id="pegG" cx="33%" cy="26%" r="70%">
    <stop offset="0%"   stop-color="#FFFBD8"/>
    <stop offset="22%"  stop-color="#FFEB80"/>
    <stop offset="48%"  stop-color="#FFC61E"/>
    <stop offset="78%"  stop-color="#E89400"/>
    <stop offset="100%" stop-color="#9E5E00"/>
  </radialGradient>
  <radialGradient id="pegShine" cx="30%" cy="20%" r="42%">
    <stop offset="0%"  stop-color="rgba(255,255,245,0.95)"/>
    <stop offset="60%" stop-color="rgba(255,255,245,0.25)"/>
    <stop offset="100%" stop-color="rgba(255,255,245,0)"/>
  </radialGradient>
  <radialGradient id="pegRim" cx="50%" cy="85%" r="60%">
    <stop offset="0%"  stop-color="rgba(120,60,0,0.55)"/>
    <stop offset="100%" stop-color="rgba(120,60,0,0)"/>
  </radialGradient>
  <filter id="pegShadow" x="-60%" y="-60%" width="220%" height="240%">
    <feDropShadow dx="0" dy="1.4" stdDeviation="1.3" flood-color="#7A4A00" flood-opacity="0.45"/>
    <feDropShadow dx="0" dy="0.4" stdDeviation="0.4" flood-color="#7A4A00" flood-opacity="0.35"/>
  </filter>

  <!-- ===================== BALL ===================== -->
  <radialGradient id="ballG" cx="30%" cy="24%" r="72%">
    <stop offset="0%"   stop-color="#E4F6FF"/>
    <stop offset="18%"  stop-color="#9EC4FF"/>
    <stop offset="42%"  stop-color="#6656EE"/>
    <stop offset="72%"  stop-color="#4128C8"/>
    <stop offset="100%" stop-color="#190C86"/>
  </radialGradient>
  <radialGradient id="ballShine" cx="27%" cy="20%" r="46%">
    <stop offset="0%"  stop-color="rgba(255,255,255,0.9)"/>
    <stop offset="55%" stop-color="rgba(255,255,255,0.22)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
  </radialGradient>
  <radialGradient id="ballRim" cx="50%" cy="88%" r="65%">
    <stop offset="0%" stop-color="rgba(20,10,80,0.65)"/>
    <stop offset="100%" stop-color="rgba(20,10,80,0)"/>
  </radialGradient>
  <filter id="ballShadow" x="-80%" y="-80%" width="260%" height="300%">
    <feDropShadow dx="0" dy="2.2" stdDeviation="2.4" flood-color="#2C1A8C" flood-opacity="0.55"/>
    <feDropShadow dx="0" dy="0.6" stdDeviation="0.8" flood-color="#2C1A8C" flood-opacity="0.4"/>
  </filter>

  <filter id="boardShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="3.5" stdDeviation="4.5" flood-color="#0E2C55" flood-opacity="0.28"/>
    <feDropShadow dx="0" dy="1"   stdDeviation="1.2" flood-color="#0E2C55" flood-opacity="0.22"/>
  </filter>

  <!-- ===================== BUCKETS ===================== -->
  <filter id="bucketGlowPurple" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feColorMatrix in="b" type="matrix"
      values="0.56 0 0 0 0  0.31 0 0 0 0  0.94 0 0 0 0  0 0 0 1 0" result="c"/>
    <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bucketShadow" x="-50%" y="-50%" width="200%" height="220%">
    <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#0A1830" flood-opacity="0.35"/>
  </filter>

  <linearGradient id="bucketPurple" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#B383FF"/>
    <stop offset="30%" stop-color="#8B4CF2"/>
    <stop offset="70%" stop-color="#6A22C8"/>
    <stop offset="100%" stop-color="#440E8C"/>
  </linearGradient>
  <linearGradient id="bucketBlue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#8CB0FF"/>
    <stop offset="30%" stop-color="#5885F5"/>
    <stop offset="70%" stop-color="#2E5AD0"/>
    <stop offset="100%" stop-color="#173A96"/>
  </linearGradient>
  <linearGradient id="bucketGreen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#7EE8B0"/>
    <stop offset="30%" stop-color="#3FCB86"/>
    <stop offset="70%" stop-color="#189A5C"/>
    <stop offset="100%" stop-color="#0A6238"/>
  </linearGradient>
  <linearGradient id="bucketTopHi" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
  </linearGradient>
  <linearGradient id="bucketInnerShadow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
    <stop offset="30%" stop-color="rgba(0,0,0,0)"/>
  </linearGradient>

  <!-- peg + ball reusable symbols -->
  <g id="pegDef">
    <circle r="7.1" fill="url(#pegRim)"/>
    <circle r="7" fill="url(#pegG)"/>
    <circle r="7" fill="url(#pegShine)"/>
    <circle r="7" fill="none" stroke="#8A5200" stroke-opacity="0.45" stroke-width="0.6"/>
    <ellipse cx="-2.1" cy="-2.6" rx="2.1" ry="1.3" fill="rgba(255,255,255,0.85)" transform="rotate(-25 -2.1 -2.6)"/>
  </g>

</defs>

<!-- ===================== BOARD BASE ===================== -->
<rect x="4" y="4" width="132" height="140" rx="17" fill="url(#boardBg)" filter="url(#boardShadow)"/>
<rect x="4" y="4" width="132" height="140" rx="17" fill="none" stroke="url(#frameMetal)" stroke-width="2.2"/>
<rect x="6.3" y="6.3" width="127.4" height="60" rx="14" fill="url(#boardEdgeTop)" opacity="0.6"/>
<rect x="4" y="86" width="132" height="58" rx="17" fill="url(#boardEdgeBottom)"/>
<rect x="7.2" y="7.2" width="125.6" height="133.6" rx="13" fill="none" stroke="rgba(90,150,215,0.30)" stroke-width="1"/>
<rect x="9.6" y="9.6" width="120.8" height="128.8" rx="11" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="0.8"/>

<!-- subtle inner peg-lane guide lines for depth -->
<g stroke="rgba(70,130,195,0.14)" stroke-width="1">
  <line x1="18" y1="96" x2="10" y2="128"/>
  <line x1="33" y1="96" x2="27" y2="128"/>
  <line x1="52" y1="96" x2="48" y2="128"/>
  <line x1="70" y1="96" x2="70" y2="128"/>
  <line x1="88" y1="96" x2="92" y2="128"/>
  <line x1="107" y1="96" x2="113" y2="128"/>
  <line x1="122" y1="96" x2="130" y2="128"/>
</g>

<!-- ===================== PEG ROWS ===================== -->
<g filter="url(#pegShadow)">
  <!-- Row 1 -->
  <use href="#pegDef" x="40" y="22"/>
  <use href="#pegDef" x="70" y="22"/>
  <use href="#pegDef" x="100" y="22"/>
  <!-- Row 2 -->
  <use href="#pegDef" x="25" y="42"/>
  <use href="#pegDef" x="55" y="42"/>
  <use href="#pegDef" x="85" y="42"/>
  <use href="#pegDef" x="115" y="42"/>
  <!-- Row 3 -->
  <use href="#pegDef" x="40" y="62"/>
  <use href="#pegDef" x="70" y="62"/>
  <use href="#pegDef" x="100" y="62"/>
  <!-- Row 4 -->
  <use href="#pegDef" x="25" y="82"/>
  <use href="#pegDef" x="55" y="82"/>
  <use href="#pegDef" x="85" y="82"/>
  <use href="#pegDef" x="115" y="82"/>
</g>

<!-- ===================== BALL TRAIL ===================== -->
<ellipse cx="70" cy="74" rx="5.6" ry="8" fill="rgba(70,50,220,0.16)"/>
<ellipse cx="70" cy="60" rx="4.4" ry="6" fill="rgba(70,50,220,0.11)"/>
<ellipse cx="70" cy="50" rx="3.2" ry="4.2" fill="rgba(70,50,220,0.07)"/>
<ellipse cx="70" cy="43" rx="2" ry="2.6" fill="rgba(70,50,220,0.04)"/>

<!-- ===================== BALL ===================== -->
<g filter="url(#ballShadow)">
  <circle cx="70" cy="42" r="11.2" fill="url(#ballRim)"/>
  <circle cx="70" cy="42" r="11" fill="url(#ballG)"/>
  <circle cx="70" cy="42" r="11" fill="url(#ballShine)"/>
  <circle cx="70" cy="42" r="11" fill="none" stroke="#251880" stroke-opacity="0.4" stroke-width="0.7"/>
</g>
<ellipse cx="65.5" cy="37.5" rx="4.4" ry="3.1" fill="rgba(255,255,255,0.55)" transform="rotate(-28 65.5 37.5)"/>
<circle cx="64.6" cy="36.6" r="1.7" fill="rgba(255,255,255,0.85)"/>
<ellipse cx="73" cy="47" rx="4.5" ry="2.4" fill="rgba(20,10,80,0.28)" transform="rotate(20 73 47)"/>

<!-- ===================== BUCKET WELL SHADOW ===================== -->
<ellipse cx="65" cy="129" rx="63" ry="4.5" fill="rgba(8,18,45,0.30)"/>
<ellipse cx="65" cy="127.5" rx="60" ry="3" fill="rgba(8,18,45,0.18)"/>

<!-- ===================== BUCKETS ===================== -->
<g font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-weight="800" text-anchor="middle">

  <!-- 10x purple (left) -->
  <g filter="url(#bucketGlowPurple)">
    <rect x="4.5" y="98" width="22" height="30" rx="6.5" fill="url(#bucketPurple)"/>
  </g>
  <rect x="4.5" y="98" width="22" height="30" rx="6.5" fill="none" stroke="#33086C" stroke-width="1.1"/>
  <rect x="4.5" y="98" width="22" height="10" rx="6.5" fill="url(#bucketTopHi)"/>
  <rect x="4.5" y="98" width="22" height="30" rx="6.5" fill="url(#bucketInnerShadow)" opacity="0.5"/>
  <ellipse cx="15.5" cy="103.5" rx="8.6" ry="2.1" fill="rgba(20,0,50,0.35)"/>
  <text x="15.5" y="118.5" fill="white" font-size="9" stroke="rgba(30,0,60,0.4)" stroke-width="0.4">10x</text>

  <!-- 3x blue -->
  <rect x="28" y="103" width="19" height="25" rx="5.5" fill="url(#bucketBlue)" filter="url(#bucketShadow)"/>
  <rect x="28" y="103" width="19" height="9" rx="5.5" fill="url(#bucketTopHi)"/>
  <rect x="28" y="103" width="19" height="25" rx="5.5" fill="url(#bucketInnerShadow)" opacity="0.45"/>
  <ellipse cx="37.5" cy="107.8" rx="7.4" ry="1.8" fill="rgba(5,15,50,0.32)"/>
  <text x="37.5" y="120" fill="white" font-size="8.6" stroke="rgba(5,15,50,0.4)" stroke-width="0.35">3x</text>

  <!-- 1x green -->
  <rect x="47.5" y="106" width="17" height="22" rx="5" fill="url(#bucketGreen)" filter="url(#bucketShadow)"/>
  <rect x="47.5" y="106" width="17" height="8" rx="5" fill="url(#bucketTopHi)"/>
  <rect x="47.5" y="106" width="17" height="22" rx="5" fill="url(#bucketInnerShadow)" opacity="0.4"/>
  <ellipse cx="56" cy="110.3" rx="6.6" ry="1.6" fill="rgba(5,40,20,0.30)"/>
  <text x="56" y="121.5" fill="white" font-size="8.4" stroke="rgba(5,40,20,0.4)" stroke-width="0.3">1x</text>

  <!-- 1x green -->
  <rect x="65.5" y="106" width="17" height="22" rx="5" fill="url(#bucketGreen)" filter="url(#bucketShadow)"/>
  <rect x="65.5" y="106" width="17" height="8" rx="5" fill="url(#bucketTopHi)"/>
  <rect x="65.5" y="106" width="17" height="22" rx="5" fill="url(#bucketInnerShadow)" opacity="0.4"/>
  <ellipse cx="74" cy="110.3" rx="6.6" ry="1.6" fill="rgba(5,40,20,0.30)"/>
  <text x="74" y="121.5" fill="white" font-size="8.4" stroke="rgba(5,40,20,0.4)" stroke-width="0.3">1x</text>

  <!-- 3x blue -->
  <rect x="83" y="103" width="19" height="25" rx="5.5" fill="url(#bucketBlue)" filter="url(#bucketShadow)"/>
  <rect x="83" y="103" width="19" height="9" rx="5.5" fill="url(#bucketTopHi)"/>
  <rect x="83" y="103" width="19" height="25" rx="5.5" fill="url(#bucketInnerShadow)" opacity="0.45"/>
  <ellipse cx="92.5" cy="107.8" rx="7.4" ry="1.8" fill="rgba(5,15,50,0.32)"/>
  <text x="92.5" y="120" fill="white" font-size="8.6" stroke="rgba(5,15,50,0.4)" stroke-width="0.35">3x</text>

  <!-- 10x purple (right) -->
  <g filter="url(#bucketGlowPurple)">
    <rect x="103.5" y="98" width="22" height="30" rx="6.5" fill="url(#bucketPurple)"/>
  </g>
  <rect x="103.5" y="98" width="22" height="30" rx="6.5" fill="none" stroke="#33086C" stroke-width="1.1"/>
  <rect x="103.5" y="98" width="22" height="10" rx="6.5" fill="url(#bucketTopHi)"/>
  <rect x="103.5" y="98" width="22" height="30" rx="6.5" fill="url(#bucketInnerShadow)" opacity="0.5"/>
  <ellipse cx="114.5" cy="103.5" rx="8.6" ry="2.1" fill="rgba(20,0,50,0.35)"/>
  <text x="114.5" y="118.5" fill="white" font-size="9" stroke="rgba(30,0,60,0.4)" stroke-width="0.4">10x</text>

</g>

<!-- top glass highlight over whole board -->
<rect x="4" y="4" width="132" height="45" rx="17" fill="url(#boardEdgeTop)" opacity="0.35"/>

</svg>
