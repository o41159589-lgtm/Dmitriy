<rect x="81" y="42" width="36" height="36" rx="9" fill="url(#cellG)" stroke="#A8D0F0" stroke-width="1.5"/>
<!-- row 2 -->
<rect x="3"  y="81" width="36" height="36" rx="9" fill="url(#cellG)" stroke="#A8D0F0" stroke-width="1.5"/>
<rect x="42" y="81" width="36" height="36" rx="9" fill="url(#cellG)" stroke="#A8D0F0" stroke-width="1.5"/>
<rect x="81" y="81" width="36" height="36" rx="9" fill="url(#cellG)" stroke="#A8D0F0" stroke-width="1.5"/>

<!-- Gem macro (draw at any cx,cy, size s) -->
