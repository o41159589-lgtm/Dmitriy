<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<defs>
  <linearGradient id="gemG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7ADEFC"/>
    <stop offset="50%" stop-color="#28A8E0"/>
    <stop offset="100%" stop-color="#1060A0"/>
  </linearGradient>
  <radialGradient id="cellG" cx="30%" cy="30%" r="70%">
    <stop offset="0%" stop-color="white"/>
    <stop offset="100%" stop-color="#E8F4FF"/>
  </radialGradient>
  <filter id="gShadow"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="rgba(0,60,140,0.25)"/></filter>
  <filter id="bShadow"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="rgba(0,0,0,0.35)"/></filter>
</defs>

<!-- 3×3 cells -->
<!-- row 0 -->
<rect x="3"  y="3"  width="36" height="36" rx="9" fill="url(#cellG)" stroke="#A8D0F0" stroke-width="1.5"/>
<rect x="42" y="3"  width="36" height="36" rx="9" fill="url(#cellG)" stroke="#A8D0F0" stroke-width="1.5"/>
<rect x="81" y="3"  width="36" height="36" rx="9" fill="url(#cellG)" stroke="#A8D0F0" stroke-width="1.5"/>
