<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 125">
<defs>
  <filter id="cardShadow">
    <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(40,0,80,0.28)"/>
  </filter>
  <filter id="frontShadow">
    <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="rgba(40,0,80,0.22)"/>
  </filter>
  <linearGradient id="cardBackG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"  stop-color="#7040D8"/>
    <stop offset="100%" stop-color="#4020A0"/>
  </linearGradient>
</defs>

<!-- Back card (rotated -16deg) -->
<g transform="rotate(-16,60,68)" filter="url(#cardShadow)">
  <rect x="18" y="18" width="64" height="88" rx="9" fill="white" stroke="#D8C8F8" stroke-width="1.5"/>
  <!-- Pattern fill -->
  <rect x="22" y="22" width="56" height="80" rx="6" fill="url(#cardBackG)"/>
  <!-- Diamond lattice pattern -->
  <g fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1">
    <path d="M22,40 L50,22 L78,40 L50,58 Z"/>
    <path d="M22,70 L50,52 L78,70 L50,88 Z"/>
    <path d="M22,100 L50,82 L78,100"/>
  </g>
  <!-- Inner border -->
  <rect x="25" y="25" width="50" height="74" rx="4" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
</g>

<!-- Front card: Ace of Spades (+8deg) -->
<g transform="rotate(8,64,68)" filter="url(#frontShadow)">
  <rect x="36" y="14" width="64" height="88" rx="9" fill="white" stroke="#E0D8E8" stroke-width="1.2"/>
  <!-- Inner card border -->
  <rect x="39" y="17" width="58" height="82" rx="7" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
  <!-- Top-left rank + suit -->
  <text x="42" y="32" font-size="14" font-weight="900" fill="#1A1A2E" font-family="Georgia,Times,serif" letter-spacing="-0.5">A</text>
  <text x="42" y="46" font-size="13" fill="#1A1A2E" font-family="Arial">♠</text>
  <!-- Centre large spade -->
  <text x="68" y="76" text-anchor="middle" font-size="44" fill="#1A1A2E" font-family="Arial" filter="url(#frontShadow)">♠</text>
  <!-- Bottom-right (rotated 180) -->
  <g transform="rotate(180,84,91)">
    <text x="78" y="96" font-size="14" font-weight="900" fill="#1A1A2E" font-family="Georgia,Times,serif" letter-spacing="-0.5">A</text>
    <text x="78" y="110" font-size="13" fill="#1A1A2E" font-family="Arial">♠</text>
  </g>
  <!-- Card shine -->
  <path d="M 40 20 Q 46 16 55 16" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Decorative stars -->
<text x="4"  y="20" font-size="14" fill="rgba(90,40,200,0.60)" font-family="serif">★</text>
<text x="106" y="116" font-size="11" fill="rgba(90,40,200,0.50)" font-family="serif">★</text>
</svg>