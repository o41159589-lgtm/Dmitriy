<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<defs>
  <filter id="cardShadow"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(40,0,80,0.25)"/></filter>
</defs>

<!-- Back card (rotated) -->
<g transform="rotate(-14,60,65)" filter="url(#cardShadow)">
  <rect x="20" y="20" width="62" height="84" rx="8" fill="white" stroke="#E0D0F8" stroke-width="1.5"/>
  <!-- Card back pattern -->
  <rect x="24" y="24" width="54" height="76" rx="5" fill="#7040D0" opacity="0.85"/>
  <rect x="28" y="28" width="46" height="68" rx="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- Diamond pattern -->
  <path d="M36,48 L51,36 L66,48 L51,60 Z" fill="rgba(255,255,255,0.15)"/>
  <path d="M36,72 L51,60 L66,72 L51,84 Z" fill="rgba(255,255,255,0.15)"/>
</g>

<!-- Front card: Ace of Spades -->
<g transform="rotate(8,60,65)" filter="url(#cardShadow)">
  <rect x="34" y="16" width="62" height="84" rx="8" fill="white" stroke="#DDD" stroke-width="1.2"/>
  <!-- Top-left rank -->
  <text x="40" y="31" font-size="13" font-weight="900" fill="#1A1A2E" font-family="Georgia,serif">A</text>
  <!-- Spade symbol top -->
  <text x="39" y="44" font-size="11" fill="#1A1A2E" font-family="Arial">♠</text>
  <!-- Big centre spade -->
  <text x="65" y="72" font-size="40" text-anchor="middle" fill="#1A1A2E" font-family="Arial">♠</text>
  <!-- Bottom-right rank (rotated) -->
  <g transform="rotate(180,86,89)">
    <text x="80" y="94" font-size="13" font-weight="900" fill="#1A1A2E" font-family="Georgia,serif">A</text>
    <text x="79" y="107" font-size="11" fill="#1A1A2E" font-family="Arial">♠</text>
  </g>
</g>

<!-- Stars -->
<text x="5"  y="20" font-size="13" fill="rgba(100,40,200,0.55)" font-family="serif">★</text>
<text x="102" y="112" font-size="11" fill="rgba(100,40,200,0.45)" font-family="serif">★</text>
</svg>