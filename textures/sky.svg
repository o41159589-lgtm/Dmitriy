<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#50A8D8"/>
    <stop offset="25%" stop-color="#72BEE6"/>
    <stop offset="55%" stop-color="#96D2F0"/>
    <stop offset="80%" stop-color="#B8E2F8"/>
    <stop offset="100%" stop-color="#D0EEFA"/>
  </linearGradient>
  <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#FFF080"/>
    <stop offset="50%" stop-color="#FFD028"/>
    <stop offset="100%" stop-color="#E8A000"/>
  </radialGradient>
  <filter id="cBlur"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="sunGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="16" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cShadow"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="rgba(80,130,180,0.18)"/></filter>
</defs>
<rect width="390" height="844" fill="url(#skyG)"/>

<!-- Sun halo -->
<circle cx="284" cy="268" r="58" fill="rgba(255,220,40,0.14)" filter="url(#cBlur)"/>
<circle cx="284" cy="268" r="44" fill="rgba(255,220,40,0.10)"/>
<!-- Sun -->
<circle cx="284" cy="268" r="30" fill="url(#sunG)" filter="url(#sunGlow)" opacity="0.82"/>
<!-- Sun rays -->
<g stroke="#FFD028" stroke-linecap="round" opacity="0.48">
  <line x1="284" y1="226" x2="284" y2="213" stroke-width="3.5"/>
  <line x1="284" y1="310" x2="284" y2="323" stroke-width="3.5"/>
  <line x1="238" y1="268" x2="225" y2="268" stroke-width="3.5"/>
  <line x1="330" y1="268" x2="343" y2="268" stroke-width="3.5"/>
  <line x1="252" y1="236" x2="243" y2="227" stroke-width="2.8"/>
  <line x1="316" y1="300" x2="325" y2="309" stroke-width="2.8"/>
  <line x1="316" y1="236" x2="325" y2="227" stroke-width="2.8"/>
  <line x1="252" y1="300" x2="243" y2="309" stroke-width="2.8"/>
</g>

<!-- Cloud 1: top-right, largest -->
<g filter="url(#cShadow)" opacity="0.94">
  <ellipse cx="312" cy="75" rx="84" ry="42" fill="#ECF4FA"/>
  <ellipse cx="272" cy="48" rx="56" ry="54" fill="#F4F8FD"/>
  <ellipse cx="336" cy="53" rx="46" ry="44" fill="#EEF4FA"/>
  <ellipse cx="368" cy="67" rx="34" ry="30" fill="#E6EFF6"/>
  <!-- cloud shadow bottom -->
  <ellipse cx="312" cy="90" rx="62" ry="16" fill="rgba(140,180,210,0.25)" filter="url(#cBlur)"/>
</g>
<!-- Cloud 2: top-left -->
<g filter="url(#cShadow)" opacity="0.88">
  <ellipse cx="74" cy="126" rx="74" ry="36" fill="#ECF4FA"/>
  <ellipse cx="42" cy="102" rx="46" ry="44" fill="#F4F8FD"/>
  <ellipse cx="100" cy="106" rx="40" ry="38" fill="#EEF4FA"/>
  <ellipse cx="132" cy="118" rx="30" ry="26" fill="#E6EFF6"/>
  <ellipse cx="74" cy="143" rx="52" ry="14" fill="rgba(140,180,210,0.22)" filter="url(#cBlur)"/>
</g>
<!-- Cloud 3: mid-left -->
<g filter="url(#cShadow)" opacity="0.78">
  <ellipse cx="38" cy="392" rx="66" ry="32" fill="#ECF4FA"/>
  <ellipse cx="10" cy="370" rx="42" ry="40" fill="#F4F8FD"/>
  <ellipse cx="62" cy="374" rx="36" ry="34" fill="#EEF4FA"/>
  <ellipse cx="38" cy="408" rx="46" ry="14" fill="rgba(140,180,210,0.18)" filter="url(#cBlur)"/>
</g>
<!-- Cloud 4: mid-right small -->
<g filter="url(#cShadow)" opacity="0.74">
  <ellipse cx="354" cy="498" rx="54" ry="28" fill="#ECF4FA"/>
  <ellipse cx="322" cy="476" rx="36" ry="35" fill="#F4F8FD"/>
  <ellipse cx="372" cy="480" rx="30" ry="28" fill="#EEF4FA"/>
  <ellipse cx="354" cy="512" rx="38" ry="12" fill="rgba(140,180,210,0.15)" filter="url(#cBlur)"/>
</g>
<!-- Cloud 5: lower centre-right -->
<g filter="url(#cShadow)" opacity="0.68">
  <ellipse cx="192" cy="632" rx="82" ry="38" fill="#ECF4FA"/>
  <ellipse cx="152" cy="606" rx="52" ry="50" fill="#F4F8FD"/>
  <ellipse cx="216" cy="610" rx="44" ry="42" fill="#EEF4FA"/>
  <ellipse cx="250" cy="622" rx="32" ry="28" fill="#E6EFF6"/>
  <ellipse cx="192" cy="650" rx="60" ry="16" fill="rgba(140,180,210,0.14)" filter="url(#cBlur)"/>
</g>
<!-- Cloud 6: lower-left -->
<g filter="url(#cShadow)" opacity="0.60">
  <ellipse cx="82" cy="768" rx="70" ry="32" fill="#ECF4FA"/>
  <ellipse cx="52" cy="746" rx="44" ry="42" fill="#F4F8FD"/>
  <ellipse cx="108" cy="750" rx="38" ry="36" fill="#EEF4FA"/>
  <ellipse cx="82" cy="784" rx="50" ry="14" fill="rgba(140,180,210,0.12)" filter="url(#cBlur)"/>
</g>
</svg>