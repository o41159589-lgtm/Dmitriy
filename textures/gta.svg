<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 95">
<defs>
  <linearGradient id="carTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF7090"/>
    <stop offset="100%" stop-color="#E02848"/>
  </linearGradient>
  <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF3055"/>
    <stop offset="50%" stop-color="#D01830"/>
    <stop offset="100%" stop-color="#A01020"/>
  </linearGradient>
  <radialGradient id="wheelG" cx="38%" cy="32%" r="65%">
    <stop offset="0%" stop-color="#555568"/>
    <stop offset="60%" stop-color="#222234"/>
    <stop offset="100%" stop-color="#101018"/>
  </radialGradient>
  <radialGradient id="hubG" cx="35%" cy="32%" r="60%">
    <stop offset="0%" stop-color="#888898"/>
    <stop offset="100%" stop-color="#444450"/>
  </radialGradient>
  <filter id="carDrop"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="rgba(160,0,30,0.32)"/></filter>
  <filter id="speedBlur"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>

<!-- Speed lines -->
<g stroke="#FFB0C0" stroke-linecap="round" opacity="0.40">
  <line x1="2"  y1="41" x2="24" y2="41" stroke-width="2"/>
  <line x1="4"  y1="50" x2="20" y2="50" stroke-width="1.5"/>
  <line x1="6"  y1="33" x2="18" y2="33" stroke-width="1.5"/>
  <line x1="2"  y1="58" x2="15" y2="58" stroke-width="1.5"/>
  <line x1="8"  y1="26" x2="14" y2="26" stroke-width="1"/>
</g>

<!-- Ground shadow -->
<ellipse cx="74" cy="78" rx="44" ry="7" fill="rgba(160,0,30,0.18)" filter="url(#speedBlur)"/>

<!-- Car body group -->
<g filter="url(#carDrop)">
  <!-- Undercarriage / diffuser -->
  <rect x="24" y="64" width="88" height="6" rx="3" fill="#880020" opacity="0.6"/>
  <!-- Main body (wide lower) -->
  <rect x="22" y="52" width="90" height="20" rx="9" fill="url(#carBody)"/>
  <!-- Cabin (upper) -->
  <rect x="37" y="32" width="58" height="24" rx="9" fill="url(#carTop)"/>
  <!-- Windshield front -->
  <rect x="42" y="34" width="26" height="18" rx="5" fill="rgba(140,220,255,0.80)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <!-- Rear window -->
  <rect x="72" y="35" width="18" height="17" rx="4" fill="rgba(140,220,255,0.65)" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>
  <!-- Windshield reflection -->
  <line x1="44" y1="35" x2="47" y2="51" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Spoiler -->
  <rect x="90" y="27" width="20" height="5" rx="2.5" fill="#E02040"/>
  <rect x="92" y="30" width="7" height="6" rx="2" fill="#C01830"/>
  <rect x="103" y="30" width="7" height="6" rx="2" fill="#C01830"/>
  <!-- Front bumper -->
  <rect x="22" y="62" width="16" height="10" rx="3" fill="#B01028"/>
  <!-- Headlight -->
  <rect x="23" y="56" width="8" height="5" rx="2" fill="rgba(255,240,180,0.9)"/>
  <!-- Tail light -->
  <rect x="106" y="55" width="7" height="5" rx="2" fill="rgba(255,80,80,0.9)"/>
  <!-- Body highlight -->
  <path d="M 25,56 Q 74,51 110,55" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Vent slits -->
  <rect x="26" y="59" width="14" height="2.5" rx="1.2" fill="rgba(0,0,0,0.35)"/>
  <rect x="103" y="59" width="10" height="2.5" rx="1.2" fill="rgba(0,0,0,0.35)"/>
</g>

<!-- Front wheel -->
<g>
  <circle cx="44" cy="71" r="14" fill="#111118" stroke="#333340" stroke-width="2"/>
  <circle cx="44" cy="71" r="14" fill="url(#wheelG)"/>
  <!-- Tyre tread lines -->
  <circle cx="44" cy="71" r="14" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>
  <circle cx="44" cy="71" r="10" fill="url(#hubG)"/>
  <circle cx="44" cy="71" r="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Spokes -->
  <g stroke="rgba(200,200,210,0.55)" stroke-width="1.4">
    <line x1="44" y1="62" x2="44" y2="80"/>
    <line x1="35" y1="71" x2="53" y2="71"/>
    <line x1="37.7" y1="64.7" x2="50.3" y2="77.3"/>
    <line x1="50.3" y1="64.7" x2="37.7" y2="77.3"/>
  </g>
  <circle cx="44" cy="71" r="3.5" fill="#CCC" stroke="rgba(100,100,120,0.5)" stroke-width="0.8"/>
</g>
<!-- Rear wheel -->
<g>
  <circle cx="100" cy="71" r="14" fill="url(#wheelG)" stroke="#333340" stroke-width="2"/>
  <circle cx="100" cy="71" r="14" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>
  <circle cx="100" cy="71" r="10" fill="url(#hubG)"/>
  <circle cx="100" cy="71" r="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <g stroke="rgba(200,200,210,0.55)" stroke-width="1.4">
    <line x1="100" y1="62" x2="100" y2="80"/>
    <line x1="91" y1="71" x2="109" y2="71"/>
    <line x1="93.7" y1="64.7" x2="106.3" y2="77.3"/>
    <line x1="106.3" y1="64.7" x2="93.7" y2="77.3"/>
  </g>
  <circle cx="100" cy="71" r="3.5" fill="#CCC" stroke="rgba(100,100,120,0.5)" stroke-width="0.8"/>
</g>

<!-- Stars -->
<text x="116" y="22" font-size="14" fill="rgba(255,180,0,0.78)" font-family="serif">★</text>
<text x="10"  y="18" font-size="10" fill="rgba(255,180,0,0.55)" font-family="serif">★</text>
</svg>