<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115 168">
<defs>

  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#DCE6EE"/>
    <stop offset="100%" stop-color="#EEF2F4"/>
  </linearGradient>
  <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#8A9A6E"/>
    <stop offset="100%" stop-color="#6C7C52"/>
  </linearGradient>
  <linearGradient id="grassTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#9CAA7C"/>
    <stop offset="100%" stop-color="#8A9A6E"/>
  </linearGradient>

  <linearGradient id="stoneFace" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#B7A896"/>
    <stop offset="45%"  stop-color="#A69682"/>
    <stop offset="100%" stop-color="#8E7C68"/>
  </linearGradient>
  <linearGradient id="stoneSide" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#7C6C5A"/>
    <stop offset="100%" stop-color="#5E4F40"/>
  </linearGradient>
  <linearGradient id="stoneAO" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="rgba(0,0,0,0.16)"/>
    <stop offset="14%"  stop-color="rgba(0,0,0,0)"/>
    <stop offset="86%"  stop-color="rgba(0,0,0,0)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.22)"/>
  </linearGradient>
  <linearGradient id="stoneRoofBand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#6E5C48"/>
    <stop offset="100%" stop-color="#4C3E30"/>
  </linearGradient>

  <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="1.4"/>
  </filter>
  <filter id="softBlurSm" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="0.6"/>
  </filter>

  <filter id="towerShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
    <feOffset in="blur" dx="2" dy="4" result="offsetBlur"/>
    <feFlood flood-color="#2A2018" flood-opacity="0.30" result="color"/>
    <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <radialGradient id="doorDeep" cx="50%" cy="15%" r="100%">
    <stop offset="0%"  stop-color="#2A1B10"/>
    <stop offset="100%" stop-color="#150C06"/>
  </radialGradient>

  <radialGradient id="skyVignette" cx="50%" cy="35%" r="75%">
    <stop offset="0%"  stop-color="rgba(255,255,255,0)"/>
    <stop offset="100%" stop-color="rgba(60,70,80,0.10)"/>
  </radialGradient>
</defs>

