<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--card:#1e1e2e;--card2:#252538;
  --gold:#f5c542;--gold2:#e8a800;--red:#e63946;--green:#2dc653;--blue:#4cc9f0;--purple:#7b2fff;
  --text:#e8e8f0;--muted:#7070a0;--border:rgba(245,197,66,0.15);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;
  font-size:16px;min-height:100vh;padding:16px;}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid var(--border);
  border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(230,57,70,.15),transparent 70%);}
.header h1{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;color:var(--red);
  margin-bottom:4px;}
.header p{color:var(--muted);font-size:13px;}
.search-wrap{position:relative;margin-bottom:14px;}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px 16px;color:var(--text);font-family:'Rajdhani',sans-serif;
  font-size:15px;outline:none;}
.search-input:focus{border-color:var(--gold);}
.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.sbar{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px;text-align:center;}
.sbar-val{font-family:'Orbitron',monospace;font-size:16px;color:var(--gold);font-weight:700;}
.sbar-label{font-size:11px;color:var(--muted);margin-top:4px;}
.user-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s;}
.user-card:active{border-color:var(--gold);}
.user-card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.user-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--blue));
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.user-info{flex:1;}
.user-name{font-weight:700;font-size:15px;}
.user-id{font-size:11px;color:var(--muted);}
.user-bal{font-family:'Orbitron',monospace;color:var(--gold);font-size:16px;font-weight:700;}
.user-stats{display:flex;gap:12px;font-size:12px;color:var(--muted);}
.user-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;
  display:none;}
.user-card.expanded .user-actions{display:grid;}
.action-group{background:var(--bg3);border-radius:10px;padding:10px;}
.action-label{font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.action-row{display:flex;gap:6px;align-items:center;}
.action-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:7px 10px;color:var(--text);font-family:'Orbitron',monospace;font-size:13px;
  outline:none;width:0;text-align:center;}
.action-input:focus{border-color:var(--gold);}
.action-btn{padding:7px 12px;border:none;border-radius:8px;font-family:'Rajdhani',sans-serif;
  font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.btn-set{background:var(--gold);color:#000;}
.btn-add{background:var(--green);color:#000;}
.btn-sub{background:var(--red);color:#fff;}
.luck-btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.luck-btn{padding:5px 8px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;}
.luck-btn:active{background:var(--purple);color:#fff;border-color:var(--purple);}
.luck-custom{display:flex;gap:6px;align-items:center;margin-top:6px;}
.luck-val{font-family:'Orbitron',monospace;font-size:13px;padding:5px 8px;
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--text);outline:none;width:70px;text-align:center;}
.luck-apply{padding:5px 12px;background:var(--purple);color:#fff;border:none;
  border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;}
.luck-status{font-size:12px;margin-top:6px;}
.luck-status.honest{color:var(--green);}
.luck-status.rigged{color:var(--red);}

.toast{position:fixed;top:16px;left:16px;right:16px;background:var(--card2);
  border:1px solid var(--border);border-radius:12px;padding:12px 16px;
  font-size:14px;font-weight:600;z-index:500;text-align:center;
  transform:translateY(-80px);transition:transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.show{transform:translateY(0);}
.toast.ok{border-color:var(--green);color:var(--green);}
.toast.err{border-color:var(--red);color:var(--red);}
.loading{text-align:center;padding:48px;color:var(--muted);}
.loading-ico{font-size:48px;margin-bottom:12px;animation:spin 2s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="header">
  <h1>🛠 ADMIN PANEL</h1>
  <p>Управление пользователями Casino</p>
</div>

<div class="stats-bar">
  <div class="sbar"><div class="sbar-val" id="s-total">—</div><div class="sbar-label">Игроков</div></div>
  <div class="sbar"><div class="sbar-val" id="s-bal">—</div><div class="sbar-label">Монет всего</div></div>
  <div class="sbar"><div class="sbar-val" id="s-rigged">—</div><div class="sbar-label">Подкручено</div></div>
</div>

<div class="search-wrap">
  <input class="search-input" id="search" type="text" placeholder="🔍 Поиск по имени или ID..." oninput="filterUsers()">
</div>

<div id="users-list">
  <div class="loading"><div class="loading-ico">⚙️</div><p>Загрузка...</p></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
const ADMIN_KEY = tg?.initDataUnsafe?.user?.id?.toString() || '';

let allUsers = [];

function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

async function apiGet(path){
  const r=await fetch(path,{headers:{'X-Admin-Key':ADMIN_KEY}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
async function apiPost(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':ADMIN_KEY},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}

async function loadUsers(){
  try{
    allUsers = await apiGet('/api/admin/users');
    updateStats();
    renderUsers(allUsers);
  }catch(e){
    document.getElementById('users-list').innerHTML=
      '<div class="loading"><p style="color:var(--red)">Ошибка загрузки.<br>Нет доступа?</p></div>';
  }
}

function updateStats(){
  document.getElementById('s-total').textContent=allUsers.length;
  document.getElementById('s-bal').textContent=allUsers.reduce((s,u)=>s+u.balance,0);
  document.getElementById('s-rigged').textContent=allUsers.filter(u=>u.luck_pct>=0).length;
}

function filterUsers(){
  const q=document.getElementById('search').value.toLowerCase();
  const filtered=allUsers.filter(u=>
    u.first_name?.toLowerCase().includes(q)||
    u.username?.toLowerCase().includes(q)||
    String(u.user_id).includes(q)
  );
  renderUsers(filtered);
}

function renderUsers(users){
  const list=document.getElementById('users-list');
  if(!users.length){
    list.innerHTML='<div class="loading"><p>Пользователи не найдены</p></div>';
    return;
  }
  list.innerHTML=users.map(u=>userCard(u)).join('');
}

function userCard(u){
  const luckLabel = u.luck_pct<0
    ? '<span class="luck-status honest">✅ Честная игра</span>'
    : `<span class="luck-status rigged">⚠️ Шанс выиграть: ${u.luck_pct}%</span>`;
  const name = u.first_name||u.username||'Без имени';
  const initials = (name[0]||'?').toUpperCase();

  return `<div class="user-card" id="card-${u.user_id}" onclick="toggleCard(${u.user_id})">
    <div class="user-card-top">
      <div class="user-avatar">${initials}</div>
      <div class="user-info">
        <div class="user-name">${name}${u.username?' (@'+u.username+')':''}</div>
        <div class="user-id">ID: ${u.user_id}</div>
      </div>
      <div class="user-bal">${u.balance} 🪙</div>
    </div>
    <div class="user-stats">
      <span>🎲 ${u.spins} игр</span>
      <span>🏆 ${u.wins} побед</span>
      <span>📈 +${u.total_won}</span>
      <span>📉 -${u.total_lost}</span>
    </div>

    <div class="user-actions">
      <div class="action-group">
        <div class="action-label">💰 Баланс</div>
        <div class="action-row">
          <input class="action-input" id="bal-inp-${u.user_id}" type="number" value="${u.balance}" min="0">
          <button class="action-btn btn-set" onclick="setBalance(event,${u.user_id})">SET</button>
        </div>
        <div class="action-row" style="margin-top:6px">
          <input class="action-input" id="delta-inp-${u.user_id}" type="number" value="100" min="1">
          <button class="action-btn btn-add" onclick="addBalance(event,${u.user_id},1)">+</button>
          <button class="action-btn btn-sub" onclick="addBalance(event,${u.user_id},-1)">−</button>
        </div>
      </div>

      <div class="action-group">
        <div class="action-label">🎲 Подкрут шансов</div>
        ${luckLabel}
        <div class="luck-btns">
          <div class="luck-btn" onclick="setLuck(event,${u.user_id},-1)">Честно</div>
          <div class="luck-btn" onclick="setLuck(event,${u.user_id},0)">0%</div>
          <div class="luck-btn" onclick="setLuck(event,${u.user_id},25)">25%</div>
          <div class="luck-btn" onclick="setLuck(event,${u.user_id},50)">50%</div>
          <div class="luck-btn" onclick="setLuck(event,${u.user_id},100)">100%</div>
        </div>
        <div class="luck-custom">
          <input class="luck-val" id="luck-inp-${u.user_id}" type="number" min="0" max="100" placeholder="0–100">
          <button class="luck-apply" onclick="setLuckCustom(event,${u.user_id})">Задать</button>
        </div>
      </div>
    </div>
  </div>`;
}

function toggleCard(uid){
  const card=document.getElementById('card-'+uid);
  card.classList.toggle('expanded');
}

async function setBalance(e,uid){
  e.stopPropagation();
  const newBal=parseInt(document.getElementById('bal-inp-'+uid).value);
  const u=allUsers.find(x=>x.user_id===uid);
  if(isNaN(newBal)||newBal<0){toast('Неверное значение','err');return;}
  try{
    await apiPost('/api/admin/set_balance',{user_id:uid,balance:newBal,old_balance:u?.balance||0});
    if(u)u.balance=newBal;
    updateStats();
    toast(`✅ Баланс ${uid} → ${newBal}`,'ok');
    // Перерисовываем карточку
    document.getElementById('card-'+uid).outerHTML=userCard(u);
  }catch(err){toast('Ошибка','err');}
}

async function addBalance(e,uid,sign){
  e.stopPropagation();
  const delta=parseInt(document.getElementById('delta-inp-'+uid).value)||0;
  const u=allUsers.find(x=>x.user_id===uid);
  if(!u||delta<=0){toast('Введите сумму','err');return;}
  const newBal=Math.max(0,u.balance+sign*delta);
  try{
    await apiPost('/api/admin/set_balance',{user_id:uid,balance:newBal,old_balance:u.balance});
    u.balance=newBal;
    updateStats();
    toast(`${sign>0?'+':'-'}${delta} → баланс: ${newBal}`,'ok');
    document.getElementById('bal-inp-'+uid).value=newBal;
  }catch(err){toast('Ошибка','err');}
}

async function setLuck(e,uid,pct){
  e.stopPropagation();
  const u=allUsers.find(x=>x.user_id===uid);
  try{
    await apiPost('/api/admin/set_luck',{user_id:uid,luck:pct});
    if(u)u.luck_pct=pct;
    toast(pct<0?'✅ Честная игра':`🎲 Шанс выиграть: ${pct}%`,'ok');
    document.getElementById('card-'+uid).outerHTML=userCard(u);
  }catch(err){toast('Ошибка','err');}
}

async function setLuckCustom(e,uid){
  e.stopPropagation();
  const val=parseInt(document.getElementById('luck-inp-'+uid).value);
  if(isNaN(val)||val<0||val>100){toast('Значение 0–100','err');return;}
  await setLuck(e,uid,val);
}

loadUsers();
// Обновляем каждые 30 сек
setInterval(loadUsers,30000);
</script>
</body>
</html>
