@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{
  --bg:#06060F;--white:#FFF;--gray1:#E0E0E0;--gray2:#AAA;
  --green:#00FF88;--red:#FF3B55;--gold:#FFD600;--cyan:#00E5FF;
  --text:#F0EFFF;--muted:#52527A;--muted2:#7A7AAA;
  --card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.13);
  --fd:'Bebas Neue',sans-serif;--fu:'Exo 2',sans-serif;--fm:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--fu);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;background:rgba(6,6,15,.94);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.fp-back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:22px;cursor:pointer;font-weight:700;}
.fp-title{font-family:var(--fd);font-size:20px;color:var(--white);letter-spacing:1px;}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(255,214,0,.1);border:1px solid rgba(255,214,0,.25);border-radius:12px;padding:7px 12px;font-family:var(--fm);font-size:13px;font-weight:700;color:var(--gold);}
.toast{position:fixed;top:80px;left:14px;right:14px;z-index:500;background:rgba(6,6,15,.97);border:1px solid var(--border2);backdrop-filter:blur(20px);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-80px);opacity:0;transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{color:var(--green);border-color:rgba(0,255,136,.3);}
.toast.err{color:var(--red);border-color:rgba(255,59,85,.3);}
.toast.info{color:var(--cyan);border-color:rgba(0,229,255,.3);}
.page{padding:14px 14px 80px;}
.stag{font-family:var(--fm);font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;}
.setup-card.hidden{display:none;}
.bet-inp{background:rgba(0,0,0,.5);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;color:var(--white);font-family:var(--fm);font-size:18px;outline:none;text-align:center;width:100%;margin-bottom:10px;}
.bet-inp:focus{border-color:rgba(255,255,255,.3);}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.qb{padding:7px 12px;background:var(--card);border:1px solid var(--border2);border-radius:9px;font-size:11px;color:var(--gray1);font-weight:700;cursor:pointer;font-family:var(--fm);transition:all .12s;}
.qb:active{background:rgba(255,255,255,.1);color:var(--white);}
.bombs-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.bombs-val{font-family:var(--fd);font-size:24px;color:var(--red);}
.bombs-val span{font-size:13px;color:var(--muted2);font-family:var(--fu);}
input[type=range]{width:100%;-webkit-appearance:none;background:rgba(255,59,85,.18);border-radius:6px;height:7px;outline:none;cursor:pointer;margin-bottom:4px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(255,59,85,.5);cursor:pointer;border:2px solid rgba(255,255,255,.2);}
.bombs-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-family:var(--fm);margin-bottom:14px;}
.mp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
.mp{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;padding:7px 4px;text-align:center;}
.mp-k{font-size:9px;color:var(--muted2);font-family:var(--fm);}
.mp-v{font-family:var(--fm);font-size:12px;color:var(--white);font-weight:700;}
.start-btn{width:100%;padding:15px;background:var(--white);border:none;border-radius:14px;color:#000;font-family:var(--fd);font-size:20px;letter-spacing:.5px;cursor:pointer;box-shadow:0 4px 18px rgba(255,255,255,.12);transition:opacity .15s,transform .1s;}
.start-btn:active{transform:scale(.98);}
.start-btn:disabled{opacity:.4;cursor:not-allowed;}
.game-area{display:none;}
.game-area.on{display:block;}
.live-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.ls{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;}
.ls-l{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-family:var(--fm);}
.ls-v{font-family:var(--fm);font-size:15px;font-weight:700;}
.ctr-row{display:flex;gap:8px;margin-bottom:12px;}
.ctr{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 10px;text-align:center;}
.ctr-l{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;font-family:var(--fm);margin-bottom:3px;}
.ctr-v{font-family:var(--fm);font-size:18px;font-weight:900;}
.grid-wrap{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:20px;padding:12px;margin-bottom:12px;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.cell{aspect-ratio:1;border-radius:12px;border:1px solid rgba(255,255,255,.07);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s,transform .1s,background .15s;user-select:none;}
.cell::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 60%);pointer-events:none;}
.cell:not(.revealed,.bomb,.disabled):hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.07);transform:scale(1.04);}
.cell:not(.revealed,.bomb):active{transform:scale(.96);}
.cell.safe{border-color:rgba(0,255,136,.5);background:rgba(0,255,136,.1);cursor:default;animation:cpop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes cpop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.diamond{font-size:22px;animation:dspin .5s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 0 8px rgba(0,255,136,.8));}
@keyframes dspin{from{transform:scale(0) rotate(-180deg);}to{transform:scale(1) rotate(0);}}
.cell.bomb{border-color:rgba(255,59,85,.6);background:rgba(255,59,85,.18);cursor:default;animation:bshake .4s both;}
@keyframes bshake{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.bomb-ico{font-size:20px;filter:drop-shadow(0 0 8px rgba(255,59,85,.8));}
.cell.bomb-hidden{border-color:rgba(255,59,85,.15);background:rgba(255,59,85,.05);cursor:default;}
.cell.disabled{pointer-events:none;opacity:.7;}
.cashout-btn{width:100%;padding:15px;background:var(--green);border:none;border-radius:14px;color:#000;font-family:var(--fd);font-size:18px;letter-spacing:.5px;cursor:pointer;animation:glow 1.5s ease-in-out infinite;margin-bottom:10px;}
@keyframes glow{0%,100%{box-shadow:0 4px 18px rgba(0,255,136,.3);}50%{box-shadow:0 4px 28px rgba(0,255,136,.55),0 0 0 3px rgba(0,255,136,.1);}}
.cashout-btn:disabled{opacity:.4;cursor:not-allowed;animation:none;}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.act-btn{padding:12px;border-radius:12px;font-family:var(--fd);font-size:14px;cursor:pointer;border:1px solid var(--border2);background:var(--card);color:var(--gray1);transition:all .15s;}
.act-btn:active{background:rgba(255,255,255,.08);}
/* Result overlay */
.res-overlay{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);backdrop-filter:blur(24px);}
.res-overlay.show{display:flex;}
.res-card{background:rgba(8,8,18,.97);border:1px solid var(--border2);border-radius:24px;padding:28px 22px;text-align:center;max-width:300px;width:90%;animation:rpop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes rpop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.res-ico{font-size:64px;margin-bottom:12px;display:block;}
.res-title{font-family:var(--fd);font-size:26px;margin-bottom:6px;letter-spacing:1px;}
.res-title.win{color:var(--green);}.res-title.lose{color:var(--red);}
.res-sub{font-size:13px;color:var(--muted2);margin-bottom:6px;}
.res-amt{font-family:var(--fm);font-size:30px;font-weight:700;margin-bottom:18px;}
.res-amt.win{color:var(--green);}.res-amt.lose{color:var(--red);}
.res-close{width:100%;padding:13px;background:var(--white);border:none;border-radius:13px;color:#000;font-family:var(--fd);font-size:17px;cursor:pointer;}


/* ==============================================
   TOPLUCK SKY THEME — MINES
   Overrides all colours; keeps every layout rule
   ============================================== */
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap');

/* Colour palette */
:root {
  --bg: #C0E4F8;
  --bg2: #F4F8FF;
  --bg3: #E8F3FF;
  --card: rgba(255,255,255,0.90);
  --card-hover: rgba(255,255,255,0.97);
  --border: rgba(20,40,90,0.10);
  --border2: rgba(20,40,90,0.16);
  --white: #1A2040;
  --text: #1A2040;
  --muted: #7A8AAA;
  --muted2: #9AABCC;
  --gold: #B88000;
  --green: #1A9A50;
  --red: #D02840;
  --font-display: 'Caveat', cursive;
  --fd: 'Caveat', cursive;
  --fu: 'Nunito', sans-serif;
  --fm: 'Nunito', sans-serif;
}

/* Sky background */
html, body {
  background: linear-gradient(175deg,#60B2DC 0%,#80C4E8 28%,#9FD2F0 55%,#C0E4F8 100%) fixed;
  min-height: 100%;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url('../textures/sky.svg');
  background-size: 100% auto; background-position: top center; background-repeat: no-repeat;
}
.page { position: relative; z-index: 1; }

/* Topbar */
.topbar {
  background: rgba(255,255,255,0.93) !important;
  box-shadow: 0 2px 14px rgba(0,30,80,0.11) !important;
  border-bottom: 1px solid rgba(0,0,0,0.06) !important;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.fp-back {
  background: rgba(20,40,90,0.06) !important;
  border: 1.5px solid rgba(20,40,90,0.12) !important;
  color: #1A2040 !important;
}
.fp-title {
  font-family: 'Caveat', cursive ;font-style:normal!important;
  font-size: 23px !important; font-weight: 700 !important;
  color: #1A2040 !important; letter-spacing: 0 !important;
}
.bal-chip {
  background: rgba(255,255,255,0.96) !important;
  border: 2px solid #FFD028 !important;
  color: #A07800 !important;
  font-family: 'Nunito', sans-serif !important; font-weight: 800 !important;
}

/* Toast */
.toast {
  background: rgba(255,255,255,0.97) !important;
  border: 1.5px solid rgba(20,40,90,0.10) !important;
  color: #1A2040 !important;
  font-family: 'Nunito', sans-serif !important;
  box-shadow: 0 6px 24px rgba(0,30,80,0.15) !important;
}
.toast.ok  { color: #1A9A50 !important; border-color: rgba(26,154,80,0.30) !important; }
.toast.err { color: #D02840 !important; border-color: rgba(208,40,64,0.30) !important; }
.toast.info{ color: #1060A0 !important; border-color: rgba(16,96,160,0.22) !important; }

/* Setup card */
.setup-card {
  background: rgba(255,255,255,0.92) !important;
  border: 2px solid rgba(255,255,255,0.80) !important;
  border-radius: 22px !important;
  box-shadow: 0 5px 20px rgba(0,30,80,0.11) !important;
}
.stag { font-family: 'Caveat', cursive ;font-style:normal!important; color: #7A8AAA !important; letter-spacing: 0 !important; font-size: 19px !important; }
.bet-inp {
  background: rgba(255,255,255,0.88) !important;
  border: 1.5px solid rgba(20,40,90,0.13) !important;
  color: #1A2040 !important; font-family: 'Nunito', sans-serif !important; font-weight: 800 !important;
}
.bet-inp:focus { border-color: rgba(40,100,220,0.40) !important; }
.qb {
  background: rgba(255,255,255,0.85) !important;
  border: 1.5px solid rgba(20,40,90,0.12) !important;
  color: #1A2040 !important; font-family: 'Nunito', sans-serif !important; font-weight: 700 !important;
  border-radius: 10px !important;
}
.qb:hover { background: rgba(255,255,255,0.96) !important; border-color: rgba(20,40,90,0.22) !important; }

/* Bombs row */
.bombs-val { font-family: 'Caveat', cursive ;font-style:normal!important; color: #1A2040 !important; }
.bombs-labels span { color: #7A8AAA !important; font-family: 'Nunito', sans-serif !important; }
input[type=range] { background: rgba(20,40,90,0.12) !important; }
input[type=range]::-webkit-slider-thumb { background: #2848B0 !important; box-shadow: 0 2px 8px rgba(40,72,176,0.35) !important; }

/* Multipliers grid */
.mp-grid { gap: 8px !important; }
.mp {
  background: rgba(232,244,255,0.85) !important;
  border: 1.5px solid rgba(40,120,220,0.18) !important;
  border-radius: 12px !important;
}
.mp-k { color: #7A8AAA !important; font-family: 'Nunito', sans-serif !important; font-size: 9px !important; }
.mp-v { color: #1A2040 !important; font-family: 'Nunito', sans-serif !important; font-size: 13px !important; font-weight: 800 !important; }

/* START button — warm sky gradient, not dark */
.start-btn {
  background: linear-gradient(135deg, #4898E0 0%, #2060C0 100%) !important;
  border-radius: 18px !important; font-family: 'Caveat', cursive ;font-style:normal!important;
  font-size: 26px !important; font-weight: 700 !important; letter-spacing: 0 !important;
  box-shadow: 0 5px 18px rgba(40,80,200,0.30) !important; color: #fff !important;
}
.start-btn:active { transform: scale(.97) !important; }

/* Live stats */
.live-stats { gap: 8px !important; margin-bottom: 14px !important; }
.ls {
  background: rgba(255,255,255,0.88) !important;
  border: 1.5px solid rgba(20,40,90,0.10) !important;
  border-radius: 14px !important;
  box-shadow: 0 2px 8px rgba(0,30,80,0.07) !important;
  padding: 10px 8px !important;
}
.ls-l { color: #7A8AAA !important; font-family: 'Nunito', sans-serif !important; font-size: 10px !important; font-weight: 700 !important; text-transform: uppercase !important; letter-spacing: 0.5px !important; }
.ls-v { font-family: 'Nunito', sans-serif !important; font-size: 16px !important; font-weight: 800 !important; color: #1A2040 !important; }

/* Mine cells */
.cell {
  background: rgba(255,255,255,0.88) !important;
  border: 1.5px solid rgba(20,40,90,0.11) !important;
  border-radius: 14px !important;
  box-shadow: 0 2px 8px rgba(0,30,80,0.08), inset 0 1px 0 rgba(255,255,255,0.7) !important;
}
.cell:not(.safe):not(.bomb-hidden):not(.disabled):hover {
  background: rgba(255,255,255,0.98) !important;
  border-color: rgba(40,100,220,0.28) !important;
  transform: scale(1.06) !important;
  box-shadow: 0 4px 14px rgba(40,100,220,0.18) !important;
}
.safe {
  background: linear-gradient(135deg,#E0F5FF,#C4E8FF) !important;
  border-color: rgba(20,140,220,0.35) !important;
  box-shadow: 0 0 14px rgba(20,140,220,0.20), inset 0 1px 0 rgba(255,255,255,0.8) !important;
}
.bomb-hidden {
  background: linear-gradient(135deg,#FFE8EE,#FFC8D4) !important;
  border-color: rgba(208,40,64,0.30) !important;
  box-shadow: 0 0 14px rgba(208,40,64,0.18), inset 0 1px 0 rgba(255,255,255,0.6) !important;
}
.diamond { filter: drop-shadow(0 0 10px rgba(20,160,255,0.65)) !important; }
.bomb-ico { filter: drop-shadow(0 0 8px rgba(208,40,64,0.60)) !important; }

.cashout-btn {
  background: linear-gradient(135deg, #20C060 0%, #148040 100%) !important;
  border-radius: 18px !important; font-family: 'Caveat', cursive ;font-style:normal!important;
  font-size: 24px !important; font-weight: 700 !important; letter-spacing: 0 !important;
  box-shadow: 0 5px 18px rgba(20,140,60,0.32) !important; color: #fff !important;
}
.cashout-btn:disabled { opacity: .4 !important; }

/* Action row — second button */
.ctr-row .cashout-btn { width: 100% !important; }
.act-row button:last-child, .res-close, .again-btn, .result-back {
  background: rgba(255,255,255,0.92) !important;
  border: 2px solid rgba(20,40,90,0.14) !important;
  border-radius: 18px !important;
  color: #1A2040 !important;
  font-family: 'Caveat', cursive ;font-style:normal!important; font-size: 22px !important; font-weight: 700 !important;
  letter-spacing: 0 !important; cursor: pointer !important; width: 100% !important; padding: 13px !important;
  box-shadow: 0 2px 10px rgba(0,30,80,0.08) !important;
}

/* Game area card */
.game-area {
  background: rgba(255,255,255,0.92) !important;
  border: 2px solid rgba(255,255,255,0.80) !important;
  border-radius: 22px !important;
  box-shadow: 0 5px 20px rgba(0,30,80,0.11) !important;
}

.result-card {
  background: rgba(255,255,255,0.92) !important;
  border: 2px solid rgba(255,255,255,0.80) !important;
  border-radius: 22px !important;
  box-shadow: 0 5px 20px rgba(0,30,80,0.11) !important;
}
.res-title { font-family: 'Caveat', cursive ;font-style:normal!important; font-size: 40px !important; font-weight: 700 !important; letter-spacing: 0 !important; }
.res-sub   { color: #7A8AAA !important; font-family: 'Nunito', sans-serif !important; font-size: 13px !important; }
.res-amt   { font-family: 'Nunito', sans-serif !important; font-size: 32px !important; font-weight: 900 !important; }

/* Back link */
a[href*="main.html"] {
  display: block !important; text-decoration: none !important; text-align: center !important;
  margin-top: 10px !important; padding: 12px !important;
  background: rgba(255,255,255,0.85) !important;
  border: 1.5px solid rgba(20,40,90,0.12) !important; border-radius: 16px !important;
  color: #7A8AAA !important; font-family: 'Nunito', sans-serif !important;
  font-size: 13px !important; font-weight: 700 !important;
}


/* ── Result overlay & card (was dark) ── */
.res-overlay{background:rgba(20,40,90,0.45)!important;backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important;}

  font-family:'Caveat',cursive;font-style:normal!important;font-size:24px!important;font-weight:700!important;
  letter-spacing:0!important;font-style:normal!important;
  box-shadow:0 5px 18px rgba(40,80,200,0.30)!important;
}
/* Grid wrap (mine field background) */
.grid-wrap{
  background:rgba(232,244,255,0.85)!important;
  border:1.5px solid rgba(40,120,220,0.18)!important;
  border-radius:20px!important;
}
/* Multiplier pills */
.mp{background:rgba(232,244,255,0.85)!important;border:1.5px solid rgba(40,120,220,0.18)!important;}
.mp-k{color:#7A8AAA!important;}
.mp-v{color:#1A2040!important;font-weight:800!important;}

/* ── iOS font fix: labels use Nunito not Caveat ── */
.fp-title{font-family:'Nunito',sans-serif!important;font-size:16px!important;font-weight:900!important;letter-spacing:1px!important;text-transform:uppercase!important;font-style:normal!important;}
.stag{font-family:'Nunito',sans-serif!important;font-size:10px!important;font-weight:800!important;letter-spacing:1.5px!important;text-transform:uppercase!important;font-style:normal!important;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="topbar">
  <button class="fp-back" onclick="goBack()">‹</button>
  <div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">💣</span><span class="fp-title">МИНЫ</span></div>
  <div class="bal-chip"><img src="../textures/coin.svg" width="20" height="20" alt="" style="vertical-align:middle;margin-right:2px"> <span id="r-bal">—</span></div>
</div>
<div class="page">

  <!-- SETUP -->
  <div class="setup-card" id="setup-card">
    <div class="stag">// ставка</div>
    <input class="bet-inp" id="bet-inp" type="number" min="10" value="50" inputmode="numeric">
    <div class="qb-row">
      <div class="qb" onclick="setBet(10)">10</div><div class="qb" onclick="setBet(50)">50</div>
      <div class="qb" onclick="setBet(100)">100</div><div class="qb" onclick="setBet(250)">250</div>
      <div class="qb" onclick="setBet(500)">500</div><div class="qb" onclick="setBetMax()">MAX</div>
      <div class="qb" onclick="setBetHalf()">½</div>
    </div>
    <div class="stag">// количество бомб</div>
    <div class="bombs-row">
      <div style="font-size:13px;color:var(--muted2);font-family:var(--fm)">💣 Бомб:</div>
      <div class="bombs-val" id="bombs-display">3 <span>бомбы</span></div>
    </div>
    <input type="range" id="bombs-slider" min="1" max="24" value="3" oninput="onBombsChange(this.value)">
    <div class="bombs-labels"><span>1</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
    <div class="stag">// потенциальные множители</div>
    <div class="mp-grid" id="mp-grid"></div>
    <button class="start-btn" id="start-btn" onclick="startGame()">💎 НАЧАТЬ ИГРУ</button>
  </div>

  <!-- GAME -->
  <div class="game-area" id="game-area">
    <div class="live-stats">
      <div class="ls"><div class="ls-l">Ставка</div><div class="ls-v" style="color:var(--gold)" id="live-bet">—</div></div>
      <div class="ls"><div class="ls-l">Множитель</div><div class="ls-v" style="color:var(--green)" id="live-mult">×1.00</div></div>
      <div class="ls"><div class="ls-l">Выиграть</div><div class="ls-v" style="color:var(--white)" id="live-win">0 🪙</div></div>
    </div>
    <div class="ctr-row">
      <div class="ctr"><div class="ctr-l">Бомбы</div><div class="ctr-v" style="color:var(--red)" id="stat-bombs">3 💣</div></div>
      <div class="ctr"><div class="ctr-l">Алмазов осталось</div><div class="ctr-v" style="color:var(--cyan)" id="stat-gems">22 💎</div></div>
    </div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <button class="cashout-btn" id="cashout-btn" onclick="cashout()" disabled>
      💰 КЕШАУТ — <span id="cashout-lbl">0</span> 🪙
    </button>
    <div class="act-row">
      <button class="act-btn" onclick="newGame()">🔄 Новая игра</button>
      <button class="act-btn" onclick="goBack()">← Назад</button>
    </div>
  </div>

</div>

<!-- RESULT -->
<div class="res-overlay" id="res-overlay">
  <div class="res-card">
    <span class="res-ico" id="res-ico">💎</span>
    <div class="res-title" id="res-title">КЕШАУТ!</div>
    <div class="res-sub" id="res-sub">Ставка: 50 🪙 · ×2.0</div>
    <div class="res-amt" id="res-amt">+100 🪙</div>
    <button class="res-close" onclick="closeResult()">🎮 Играть снова</button>
    <a href="main.html?tab=games" style="display:block;margin-top:8px;color:rgba(255,255,255,.4);font-size:13px;text-decoration:none;text-align:center">← В меню игр</a>
  </div>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
const UID=tg?.initDataUnsafe?.user?.id||0;
let userData=null,gameActive=false,currentBet=50,currentBombs=3,revealed=[],currentMult=1,currentWin=0,maxMult=25;

function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className='toast '+t+' show';setTimeout(()=>el.classList.remove('show'),2800);}
async function get(url){return fetch(url).then(r=>r.json());}
async function post(url,d){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json());}
async function loadUser(){const u=await get(`/api/user/${UID}`).catch(()=>null);if(!u)return;if(TL_guardBanned(u))return;userData=u;document.getElementById('r-bal').textContent=u.balance??0;}
function setBet(v){document.getElementById('bet-inp').value=v;}
function setBetMax(){document.getElementById('bet-inp').value=userData?.balance||0;}
function setBetHalf(){document.getElementById('bet-inp').value=Math.max(10,Math.floor((parseInt(document.getElementById('bet-inp').value)||50)/2));}
function calcMult(k,bombs){const safe=25-bombs;if(k<=0)return 1;if(k>=safe)return maxMult;return Math.pow(maxMult,k/safe);}
function onBombsChange(v){
  currentBombs=parseInt(v);
  const pl=['бомба','бомбы','бомб'];
  const n=currentBombs;const w=n===1?pl[0]:n<5?pl[1]:pl[2];
  document.getElementById('bombs-display').innerHTML=`${n} <span>${w}</span>`;
  renderMpGrid();
}
function renderMpGrid(){
  const b=currentBombs,safe=25-b;
  const steps=[];
  if(safe<=8){for(let k=1;k<=safe;k++)steps.push(k);}
  else{for(let k=1;k<=7;k++)steps.push(k);steps.push(safe);}
  document.getElementById('mp-grid').innerHTML=steps.map((k,i)=>{
    const m=calcMult(k,b).toFixed(2),isLast=k===safe;
    return`<div class="mp" style="${isLast?'border-color:rgba(255,214,0,.3);':''}">
      <div class="mp-k">${k}💎${isLast?' 🏆':''}</div>
      <div class="mp-v" style="${isLast?'color:var(--gold);':''}">×${m}</div>
    </div>`;
  }).join('');
}
function buildGrid(){
  const g=document.getElementById('grid');g.innerHTML='';
  for(let i=0;i<25;i++){
    const c=document.createElement('div');c.className='cell';c.dataset.idx=i;c.onclick=()=>revealCell(i);
    c.innerHTML='<span style="opacity:.15;font-size:16px">?</span>';g.appendChild(c);
  }
}
function ce(idx){return document.querySelector(`.cell[data-idx="${idx}"]`);}

async function startGame(){
  const bet=parseInt(document.getElementById('bet-inp').value)||0;
  if(bet<10){toast('Минимум 10 🪙','err');return;}
  if(!userData||bet>userData.balance){toast('Недостаточно монет','err');return;}
  document.getElementById('start-btn').disabled=true;
  const res=await post('/api/mines/start',{user_id:UID,bet,bombs:currentBombs}).catch(()=>null);
  document.getElementById('start-btn').disabled=false;
  if(!res||res.error){toast(res?.error||'Ошибка','err');return;}
  currentBet=bet;currentMult=1;currentWin=0;revealed=[];gameActive=true;
  if(userData)userData.balance=res.new_balance;
  document.getElementById('r-bal').textContent=res.new_balance;
  document.getElementById('live-bet').textContent=bet;
  document.getElementById('live-mult').textContent='×1.00';
  document.getElementById('live-win').textContent='0 🪙';
  document.getElementById('cashout-btn').disabled=true;
  document.getElementById('cashout-lbl').textContent='0';
  document.getElementById('stat-bombs').textContent=currentBombs+' 💣';
  document.getElementById('stat-gems').textContent=(25-currentBombs)+' 💎';
  document.getElementById('setup-card').classList.add('hidden');
  document.getElementById('game-area').classList.add('on');
  buildGrid();
}

async function revealCell(idx){
  if(!gameActive)return;
  if(revealed.includes(idx))return;
  document.querySelectorAll('.cell').forEach(c=>c.classList.add('disabled'));
  const res=await post('/api/mines/reveal',{user_id:UID,cell:idx}).catch(()=>null);
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('disabled'));
  if(!res||res.error){toast(res?.error||'Ошибка','err');return;}
  if(res.is_bomb){
    gameActive=false;
    const c=ce(idx);c.className='cell bomb disabled';c.innerHTML='<span class="bomb-ico">💣</span>';
    setTimeout(()=>{
      (res.bomb_positions||[]).forEach(bi=>{
        if(bi===idx)return;const c2=ce(bi);if(!c2)return;
        c2.className='cell bomb-hidden disabled';c2.innerHTML='<span style="font-size:18px;opacity:.6">💣</span>';
      });
    },300);
    document.getElementById('cashout-btn').disabled=true;
    showResult(false,currentBet,currentMult,0);
  }else{
    revealed.push(idx);
    const c=ce(idx);c.className='cell safe disabled';c.innerHTML='<span class="diamond">💎</span>';
    currentMult=res.current_mult;currentWin=res.current_win;
    document.getElementById('live-mult').textContent='×'+currentMult.toFixed(2);
    document.getElementById('live-win').textContent=currentWin+' 🪙';
    document.getElementById('cashout-lbl').textContent=currentWin;
    document.getElementById('cashout-btn').disabled=false;
    document.getElementById('stat-gems').textContent=((25-currentBombs)-revealed.length)+' 💎';
    if(res.auto_cashout){
      gameActive=false;if(userData)userData.balance=res.new_balance;
      document.getElementById('r-bal').textContent=res.new_balance;
      showResult(true,currentBet,currentMult,currentWin);
    }
  }
}

async function cashout(){
  if(!gameActive||!revealed.length)return;
  document.getElementById('cashout-btn').disabled=true;
  const res=await post('/api/mines/cashout',{user_id:UID}).catch(()=>null);
  if(!res||res.error){toast(res?.error||'Ошибка','err');document.getElementById('cashout-btn').disabled=false;return;}
  gameActive=false;if(userData)userData.balance=res.new_balance;
  document.getElementById('r-bal').textContent=res.new_balance;
  showResult(true,currentBet,res.mult||currentMult,res.won||currentWin);
}

function showResult(won,bet,mult,amount){
  document.getElementById('res-ico').textContent=won?'💎':'💣';
  document.getElementById('res-title').textContent=won?'КЕШАУТ!':'ВЗРЫВ!';
  document.getElementById('res-title').className='res-title '+(won?'win':'lose');
  document.getElementById('res-sub').textContent=`Ставка: ${bet} 🪙 · ×${(mult||1).toFixed(2)}`;
  document.getElementById('res-amt').textContent=won?`+${amount} 🪙`:`-${bet} 🪙`;
  document.getElementById('res-amt').className='res-amt '+(won?'win':'lose');
  document.getElementById('res-overlay').classList.add('show');
}
function closeResult(){document.getElementById('res-overlay').classList.remove('show');newGame();loadUser();}
function newGame(){gameActive=false;document.getElementById('game-area').classList.remove('on');document.getElementById('setup-card').classList.remove('hidden');revealed=[];}
function goBack(){if(gameActive&&!confirm('Игра будет потеряна. Выйти?'))return;location.href='main.html?tab=games';}

(async()=>{
  const endpoints=['/api/admin/mines_max_mult','/api/mines/settings','/api/settings/mines'];
  for(const u of endpoints){try{const d=await get(u);const v=d?.max_mult??d?.mines_max_mult??d?.value;if(typeof v==='number'&&v>0){maxMult=v;break;}}catch{}}
  onBombsChange(3);loadUser();
  if(!UID)return;
  const status=await get(`/api/mines/status?uid=${UID}`).catch(()=>null);
  if(status?.active){
    currentBet=status.bet;currentBombs=status.bombs;currentMult=status.current_mult||1;currentWin=status.current_win||0;revealed=status.revealed||[];gameActive=true;
    document.getElementById('setup-card').classList.add('hidden');document.getElementById('game-area').classList.add('on');
    buildGrid();
    status.revealed.forEach(idx=>{const c=ce(idx);if(c){c.className='cell safe disabled';c.innerHTML='<span class="diamond">💎</span>';}});
    document.getElementById('live-bet').textContent=status.bet;
    document.getElementById('live-mult').textContent='×'+(status.current_mult||1).toFixed(2);
    document.getElementById('live-win').textContent=(status.current_win||0)+' 🪙';
    document.getElementById('cashout-lbl').textContent=status.current_win||0;
    document.getElementById('cashout-btn').disabled=!status.revealed?.length;
    onBombsChange(status.bombs);toast('Восстановлена активная игра!','info');
  }
})();
</script>
<script>(function(){let x=null;function c(){if(!x)x=new(window.AudioContext||window.webkitAudioContext)();return x;}function on(){try{return localStorage.getItem("topluck_sounds")==="1";}catch(e){return false;}}window.SND={play:function(t){if(!on())return;try{const ctx=c(),g=ctx.createGain(),o=ctx.createOscillator();g.connect(ctx.destination);o.connect(g);const s=ctx.currentTime;if(t==="win"){o.type="sine";[523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,s+i*.1));g.gain.setValueAtTime(.22,s);g.gain.exponentialRampToValueAtTime(.001,s+.75);o.start(s);o.stop(s+.75);}else if(t==="lose"||t==="bomb"){o.type="sawtooth";o.frequency.setValueAtTime(280,s);o.frequency.exponentialRampToValueAtTime(70,s+.5);g.gain.setValueAtTime(.22,s);g.gain.exponentialRampToValueAtTime(.001,s+.6);o.start(s);o.stop(s+.6);}else if(t==="coin"){o.type="sine";o.frequency.setValueAtTime(900,s);o.frequency.setValueAtTime(1200,s+.06);g.gain.setValueAtTime(.13,s);g.gain.exponentialRampToValueAtTime(.001,s+.22);o.start(s);o.stop(s+.22);}}catch(e){}}};})();</script>
</body>
</html>
