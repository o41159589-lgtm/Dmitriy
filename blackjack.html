<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Блэкджек — TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="shared.js"></script>
<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})()</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--text:#F2F2F2;--muted:#9B9B9B;--green:#4ADE80;--red:#FF6B7F;--gold:#FFC94D}
html,body{background:linear-gradient(175deg,#000000 0%,#050505 28%,#0A0A0A 55%,#0E0E0E 100%) fixed;color:var(--text);font-family:'Nunito',sans-serif;min-height:100%;overflow-x:hidden}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;background:rgba(14,14,14,0.97);box-shadow:0 2px 14px rgba(0,0,0,0.33)}
.fp-back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.13);display:flex;align-items:center;justify-content:center;color:#F2F2F2;font-size:22px;cursor:pointer;font-weight:700}
.fp-title{font-size:16px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(14,14,14,0.97);border:2px solid #FFD028;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:800;color:#FFC94D}
.toast{position:fixed;top:80px;left:14px;right:14px;z-index:500;background:rgba(14,14,14,0.97);border:1.5px solid rgba(255,255,255,0.11);box-shadow:0 6px 24px rgba(0,0,0,0.45);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-140%);opacity:0;transition:.3s}
.toast.show{transform:none;opacity:1}.toast.err{color:var(--red)}.toast.ok{color:var(--green)}
.page{position:relative;z-index:1;padding:12px 12px 40px;max-width:520px;margin:0 auto}

/* ── стол ── */
.table{position:relative;border-radius:30px;padding:14px 10px 16px;min-height:440px;overflow:hidden;
  border:3px solid rgba(255,255,255,.92);
  box-shadow:0 14px 34px rgba(0,40,110,.30),inset 0 0 0 7px #0a4a31,inset 0 0 0 9px rgba(255,214,102,.6);
  background:radial-gradient(120% 85% at 50% 38%,#27B079 0%,#14875D 48%,#0A5A3D 100%);
  transition:box-shadow .5s}
.table::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:repeating-radial-gradient(circle at 18% 28%,rgba(255,255,255,.035) 0 2px,transparent 2px 6px),
             radial-gradient(70% 50% at 50% 50%,rgba(255,255,255,.10),transparent 70%)}
.table.win{box-shadow:0 14px 34px rgba(0,40,110,.30),inset 0 0 0 7px #0a4a31,inset 0 0 0 9px #FFE066,0 0 40px rgba(255,214,60,.55)}
.table.lose{box-shadow:0 14px 34px rgba(0,40,110,.30),inset 0 0 0 7px #4a0a14,inset 0 0 0 9px rgba(255,90,100,.7)}
.zone{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.zhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.zl{font-size:11px;font-weight:900;letter-spacing:2.5px;color:rgba(255,255,255,.75);text-transform:uppercase}
.score{min-width:34px;height:26px;padding:0 9px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;
  background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.35);transition:.25s}
.score.bj{background:linear-gradient(180deg,#FFE05A,#FFB800);color:#3A2A00;border-color:#fff;box-shadow:0 0 14px rgba(255,200,40,.7)}
.score.bust{background:#D02840;border-color:#ffb3bd}
.score.pop{animation:scorePop .35s}
@keyframes scorePop{40%{transform:scale(1.25)}}
.hand{display:flex;justify-content:center;align-items:center;min-height:112px;padding:0 8px;--ov:6px}
.hand .card+.card{margin-left:var(--ov)}
.deck{position:absolute;top:44px;right:16px;width:76px;height:108px;z-index:1;pointer-events:none;opacity:.95}
.deck i{position:absolute;inset:0;border-radius:9px;border:2.5px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 3px,transparent 3px 8px),linear-gradient(135deg,#2b3f9e,#1a2570)}
.deck i:nth-child(2){transform:translate(-2px,-2px)}.deck i:nth-child(3){transform:translate(-4px,-4px)}
.mid{position:relative;z-index:2;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.rule{font-size:10px;font-weight:900;letter-spacing:3px;color:rgba(255,224,130,.75);text-transform:uppercase;text-align:center}
.rule span{display:block;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.45);margin-top:2px}
.chipbox{display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(6px);transition:.3s}
.chipbox.on{opacity:1;transform:none}
.chip{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#3A2A00;
  background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC400 55%,#C98A00);border:3px dashed rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.chipcap{font-size:12px;font-weight:800;color:rgba(255,255,255,.8);line-height:1.25}
.chipcap b{color:#FFE066}

/* ── карты ── */
.card{position:relative;width:76px;height:108px;flex:0 0 auto;perspective:700px;filter:drop-shadow(0 5px 7px rgba(0,0,0,.38))}
.inner{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:linear-gradient(160deg,#fff 0%,#F4F6FB 100%);border:1px solid rgba(20,30,70,.18);color:#1A1F36}
.front.red{color:#D8213B}
.back{transform:rotateY(180deg);border:3px solid #fff;border-radius:9px;
  background:radial-gradient(circle,#FFE066 0 6px,transparent 7px),repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 3px,transparent 3px 8px),repeating-linear-gradient(-45deg,rgba(255,255,255,.16) 0 3px,transparent 3px 8px),linear-gradient(135deg,#3248B8,#1A2570)}
.back::after{content:'';position:absolute;inset:4px;border:1.5px solid rgba(255,224,130,.7);border-radius:5px}
.idx{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;min-width:14px}
.idx b{font-size:15px;font-weight:900;letter-spacing:-1px;font-family:'Nunito',sans-serif}
.idx svg{margin-top:2px}
.idx.tl{left:3px;top:5px}.idx.br{right:3px;bottom:5px}
.idx.br svg{margin-top:0;margin-bottom:2px}
.idx b.rv{display:inline-block;transform:rotate(180deg)}
.pips{position:absolute;left:27px;right:27px;top:15px;bottom:15px}
.pip{position:absolute;transform:translate(-50%,-50%);line-height:0}
.pip.flip{transform:translate(-50%,-50%)}
.pip.big{transform:translate(-50%,-50%)}
.art{position:absolute;left:22px;right:22px;top:13px;bottom:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.art .fl{font-size:40px;font-weight:900;font-family:Georgia,'Times New Roman',serif;line-height:1}
.art .fs{line-height:0}

/* ── баннер результата на столе ── */
.banner{position:absolute;left:50%;top:50%;z-index:6;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;
  padding:14px 26px;border-radius:22px;color:#fff;backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.7);min-width:190px}
.banner.show{animation:bnr 2.8s cubic-bezier(.2,.9,.3,1.1) forwards}
@keyframes bnr{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(1)}}
.banner.win{background:linear-gradient(180deg,rgba(255,214,60,.95),rgba(230,150,0,.95));color:#3A2A00}
.banner.lose{background:linear-gradient(180deg,rgba(220,50,70,.95),rgba(150,20,40,.95))}
.banner.push{background:linear-gradient(180deg,rgba(80,140,230,.95),rgba(40,80,170,.95))}
.b-t{font-size:22px;font-weight:900;letter-spacing:1px}.b-s{font-size:12px;font-weight:800;opacity:.85;margin-top:2px}.b-a{font-size:20px;font-weight:900;margin-top:4px}
.coin{position:absolute;z-index:7;font-size:20px;pointer-events:none;animation:coinUp 1.4s ease-out forwards}
@keyframes coinUp{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),-170px) scale(1.1) rotate(300deg);opacity:0}}

/* ── управление ── */
.panel{background:rgba(14,14,14,0.96);border:2px solid rgba(255,255,255,.13);border-radius:22px;box-shadow:0 5px 20px rgba(0,0,0,0.33);padding:14px;margin-top:12px}
.stag{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.bet-inp{background:rgba(14,14,14,0.92);border:1.5px solid rgba(255,255,255,0.14);border-radius:12px;padding:10px 14px;color:#F2F2F2;font-family:inherit;font-weight:800;font-size:18px;outline:none;text-align:center;width:100%;margin-bottom:10px}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qb{padding:7px 12px;background:rgba(14,14,14,0.89);border:1.5px solid rgba(255,255,255,0.13);font-weight:700;font-size:11px;border-radius:10px;cursor:pointer}
.qb:active{background:rgba(255,255,255,0.11)}
.main-btn,.act-btn{font-family:inherit;font-weight:900;border:none;cursor:pointer;color:#fff;transition:transform .08s}
.main-btn{width:100%;padding:16px;font-size:20px;letter-spacing:.5px;border-radius:18px;background:linear-gradient(180deg,#46D98A,#1FA75C);border-bottom:4px solid #137A42;box-shadow:0 8px 20px rgba(20,150,80,.35)}
.main-btn:active{transform:translateY(3px);border-bottom-width:1px}
.rules{padding:12px 14px}
.rules summary{cursor:pointer;list-style:none;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.rules summary::-webkit-details-marker{display:none}
.rules ul{margin:10px 0 0 16px;font-size:13px;font-weight:700;line-height:1.7;color:var(--text)}
.acts{display:none;gap:10px;margin-top:12px}.acts.on{display:flex}
.act-btn{flex:1;padding:16px 6px;font-size:17px;border-radius:16px;border-bottom:4px solid rgba(0,0,0,.22)}
.act-btn:active{transform:translateY(3px);border-bottom-width:1px}
.act-btn:disabled{opacity:.45}
.btn-hit{background:linear-gradient(180deg,#46D98A,#1FA75C)}
.btn-stand{background:linear-gradient(180deg,#FF7A86,#FF6B7F)}
.btn-double{background:linear-gradient(180deg,#FFD84D,#F2A900);color:#3A2A00}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="topbar">
  <button class="fp-back" onclick="location.href='main.html?tab=games'">&#8249;</button>
  <div class="fp-title">&#x1F0CF; Блэкджек</div>
  <div class="bal-chip"><img src="textures/coin.svg" width="20" height="20" alt="" style="vertical-align:middle;margin-right:2px"> <span id="r-bal">&#8212;</span></div>
</div>
<div class="page">
  <div class="table" id="table">
    <div class="deck"><i></i><i></i><i></i></div>
    <div class="zone">
      <div class="zhead"><span class="zl">Дилер</span><span class="score" id="d-score" style="visibility:hidden">?</span></div>
      <div class="hand" id="d-cards"></div>
    </div>
    <div class="mid">
      <div class="chipbox" id="chipbox"><div class="chip" id="chip">0</div><div class="chipcap">Выигрыш<br><b id="chip-win">0</b> &#x1FA99;</div></div>
    </div>
    <div class="zone">
      <div class="hand" id="p-cards"></div>
      <div class="zhead" style="margin:8px 0 0"><span class="zl">Ты</span><span class="score" id="p-score" style="visibility:hidden">0</span></div>
    </div>
    <div class="banner" id="banner"><div class="b-t" id="b-t"></div><div class="b-s" id="b-s"></div><div class="b-a" id="b-a"></div></div>
  </div>

  <div class="acts" id="acts">
    <button class="act-btn btn-hit" id="b-hit" onclick="act('hit')">ЕЩЁ</button>
    <button class="act-btn btn-stand" id="b-stand" onclick="act('stand')">СТОП</button>
    <button class="act-btn btn-double" id="b-dbl" onclick="act('double')">x2</button>
  </div>

  <details class="panel rules" id="rules">
    <summary>ℹ️ Правила</summary>
    <ul id="rules-list"></ul>
  </details>

  <div class="panel" id="ctl">
    <div class="stag">// ставка</div>
    <input class="bet-inp" id="bet-inp" type="number" value="50" min="1" inputmode="numeric"/>
    <div class="qb-row">
      <div class="qb" onclick="sb(10)">10</div><div class="qb" onclick="sb(25)">25</div>
      <div class="qb" onclick="sb(50)">50</div><div class="qb" onclick="sb(100)">100</div>
      <div class="qb" onclick="sb(250)">250</div><div class="qb" onclick="hb()">&#xBD;</div>
      <div class="qb" onclick="db2()">x2</div><div class="qb" onclick="mb()">MAX</div>
    </div>
    <button class="main-btn" id="deal-btn" onclick="deal()">РАЗДАТЬ КАРТЫ</button>
  </div>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
if(!tg?.initDataUnsafe?.user?.id)window.location.replace('not_telegram.html');
const UID=tg?.initDataUnsafe?.user?.id||0;
TL_startBanPoll(UID);

let bal=0,bet=0,ph=[],dh=[],active=false,busy=false;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(m,t){const el=$('toast');el.textContent=m;el.className='toast '+(t||'info')+' show';setTimeout(()=>el.classList.remove('show'),2800);}
async function load(){const u=await fetch('/api/user/'+UID).then(r=>r.json()).catch(()=>null);if(!u)return;if(TL_guardBanned(u))return;bal=u.balance??0;upd();resumeGame();}
function upd(){$('r-bal').textContent=bal;}
function sb(v){$('bet-inp').value=v;}
function hb(){const v=+$('bet-inp').value||0;$('bet-inp').value=Math.max(1,Math.floor(v/2));}
function db2(){const v=+$('bet-inp').value||0;$('bet-inp').value=v*2;}
function mb(){$('bet-inp').value=bal;}

/* ── подсчёт очков (только для отображения; исход решает сервер) ── */
function cv(v){if('JQK'.includes(v))return 10;if(v==='A')return 11;return+v;}
function score(h){let s=0,a=0;for(const c of h){if(!c)continue;s+=cv(c.v);if(c.v==='A')a++;}while(s>21&&a>0){s-=10;a--;}return s;}
function isBJ(h){return h.length===2&&score(h)===21;}

/* ── масти: SVG вместо текстовых символов (нет «чёрных сердечек» и разного рендера шрифтов) ── */
const SK={};SK[String.fromCharCode(9824)]='s';SK[String.fromCharCode(9829)]='h';SK[String.fromCharCode(9830)]='d';SK[String.fromCharCode(9827)]='c';
const SP={
  s:'<path d="M12 1.500C12 1.500 3.500 8 3.500 13.300c0 2.700 2.100 4.600 4.500 4.600 1.300 0 2.400-.5 3.200-1.500-.2 2-.9 3.600-2.600 4.800h7.800c-1.700-1.200-2.400-2.800-2.600-4.800.8 1 1.900 1.500 3.200 1.500 2.400 0 4.500-1.900 4.500-4.600C20.500 8 12 1.500 12 1.500z"/>',
  h:'<path d="M12 21.500S2.500 15.300 2.500 8.800C2.500 5.600 4.900 3.500 7.600 3.500c1.800 0 3.400.9 4.400 2.400 1-1.500 2.600-2.400 4.400-2.400 2.700 0 5.100 2.100 5.100 5.300 0 6.500-9.500 12.700-9.500 12.700z"/>',
  d:'<path d="M12 1.500C14.600 6 17.600 9.200 21.500 12 17.600 14.800 14.600 18 12 22.500 9.400 18 6.400 14.800 2.500 12 6.400 9.200 9.400 6 12 1.500z"/>',
  c:'<circle cx="12" cy="7.300" r="4.600"/><circle cx="6.600" cy="14.200" r="4.600"/><circle cx="17.400" cy="14.200" r="4.600"/><path d="M10.600 13h2.800l1.900 9H8.700z"/>'
};
function suit(k,sz){return '<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'" fill="currentColor">'+SP[k]+'</svg>';}
const PL={'2':[[.5,0],[.5,1]],'3':[[.5,0],[.5,.5],[.5,1]],'4':[[0,0],[1,0],[0,1],[1,1]],'5':[[0,0],[1,0],[.5,.5],[0,1],[1,1]],
 '6':[[0,0],[1,0],[0,.5],[1,.5],[0,1],[1,1]],'7':[[0,0],[1,0],[.5,.25],[0,.5],[1,.5],[0,1],[1,1]],
 '8':[[0,0],[1,0],[.5,.25],[0,.5],[1,.5],[.5,.75],[0,1],[1,1]],
 '9':[[0,0],[1,0],[0,1/3],[1,1/3],[.5,.5],[0,2/3],[1,2/3],[0,1],[1,1]],
 '10':[[0,0],[1,0],[.5,1/6],[0,1/3],[1,1/3],[0,2/3],[1,2/3],[.5,5/6],[0,1],[1,1]]};
function frontHTML(c){
  const k=SK[c.s]||'s',v=c.v;
  let mid;
  if(v==='A')mid='<div class="pips"><div class="pip big" style="left:50%;top:50%">'+suit(k,46)+'</div></div>';
  else if('JQK'.includes(v))mid='<div class="art"><span class="fl">'+v+'</span><span class="fs">'+suit(k,26)+'</span></div>';
  else mid='<div class="pips">'+PL[v].map(p=>'<div class="pip'+(p[1]>.5?' flip':'')+'" style="left:'+(p[0]*100)+'%;top:'+(p[1]*100)+'%">'+suit(k,14)+'</div>').join('')+'</div>';
  // сверху: цифра, под ней масть. Снизу — зеркально: масть, под ней перевёрнутая цифра
  const top='<b>'+v+'</b>'+suit(k,12), bot=suit(k,12)+'<b class="rv">'+v+'</b>';
  return {cls:(k==='h'||k==='d')?'red':'',html:'<div class="idx tl">'+top+'</div>'+mid+'<div class="idx br">'+bot+'</div>'};
}
function makeCard(c,hidden){
  const el=document.createElement('div');el.className='card';
  el.innerHTML='<div class="inner"><div class="face front"></div><div class="face back"></div></div>';
  if(hidden){el.dataset.hidden='1';el.firstChild.style.transform='rotateY(180deg)';}
  else fillFront(el,c);
  return el;
}
function fillFront(el,c){const f=frontHTML(c),fr=el.querySelector('.front');fr.className='face front '+f.cls;fr.innerHTML=f.html;}

/* ── анимации ── */
function dealIn(el,delay){
  requestAnimationFrame(()=>{
    const d=document.querySelector('.deck').getBoundingClientRect(),r=el.getBoundingClientRect();
    el.animate([
      {transform:'translate('+(d.left-r.left)+'px,'+(d.top-r.top)+'px) rotate(16deg) scale(.7)',opacity:0},
      {opacity:1,offset:.18},
      {transform:'translate(0,0) rotate(0) scale(1)',opacity:1}
    ],{duration:520,delay:delay*1000,easing:'cubic-bezier(.2,.8,.25,1)',fill:'backwards'});
  });
}
function flipOpen(el,c){
  fillFront(el,c);delete el.dataset.hidden;
  const inner=el.firstChild;
  inner.animate([{transform:'rotateY(180deg)'},{transform:'rotateY(0deg)'}],{duration:600,easing:'cubic-bezier(.3,.7,.3,1)',fill:'forwards'})
    .finished.then(()=>{inner.style.transform='rotateY(0deg)';}).catch(()=>{inner.style.transform='rotateY(0deg)';});
}
function setOverlap(box){const n=box.children.length;box.style.setProperty('--ov',(n<=2?6:n===3?-4:n===4?-20:n===5?-30:-36)+'px');}

/* добавляем только новые карты — старые не перерисовываются, поэтому анимация не «моргает» */
function syncHand(box,cards,hideSecond,opt){
  opt=opt||{};
  cards.forEach((c,i)=>{
    const hid=hideSecond&&i===1,el=box.children[i];
    if(!el){const n=makeCard(c,hid);box.appendChild(n);setOverlap(box);if(!opt.instant)dealIn(n,(opt.delays&&opt.delays[i])||0);}
    else if(el.dataset.hidden==='1'&&!hid&&c)flipOpen(el,c);
  });
  while(box.children.length>cards.length)box.lastChild.remove();
  setOverlap(box);
}
function setScore(id,val,cls){
  const el=$(id);el.style.visibility='visible';
  if(el.textContent!=val){el.textContent=val;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
  el.className='score'+(cls?' '+cls:'');
}
function pScoreRender(){const s=score(ph);setScore('p-score',s,s>21?'bust':(isBJ(ph)||s===21)?'bj':'');}
function setChip(b){
  $('chip').textContent=b>=1000?(b/1000).toFixed(b%1000?1:0)+'k':b;
  $('chip-win').textContent=Math.floor(b*(isBJ(ph)?BJ_PAYS:2));
  $('chipbox').classList.toggle('on',b>0);
}
function mode(playing){
  $('acts').classList.toggle('on',playing);
  $('ctl').style.display=playing?'none':'';
}
async function clearTable(){
  const cards=[...document.querySelectorAll('#d-cards .card,#p-cards .card')];
  if(!cards.length)return;
  cards.forEach(c=>c.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-30px) scale(.85)'}],{duration:260,fill:'forwards'}));
  await sleep(270);
  $('d-cards').innerHTML='';$('p-cards').innerHTML='';
  $('d-score').style.visibility='hidden';$('p-score').style.visibility='hidden';
  $('table').classList.remove('win','lose');
}

async function bjApi(path,body){
  try{
    const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
    return await r.json();
  }catch(e){return {error:'Ошибка сервера'};}
}
let BJ_PAYS=2.2;
function payLabel(p){const x=p-1;return Math.abs(x-1.5)<.01?'3 к 2':Math.abs(x-1.2)<.01?'6 к 5':Math.abs(x-1)<.01?'1 к 1':('x'+p);}
function takeState(st){ph=st.player;dh=st.dealer;bet=st.bet;$('b-dbl').disabled=!st.can_double;
  if(st.pays){BJ_PAYS=st.pays;}}
function renderRules(r){
  if(!r)return;BJ_PAYS=r.pays;
  $('rules-list').innerHTML='<li>Блэкджек (21 с двух карт) платит <b>'+payLabel(r.pays)+'</b></li>'
   +'<li>Колод в игре: <b>'+r.decks+'</b></li>'
   +'<li>Дилер '+(r.h17?'<b>берёт</b> карту на мягких 17':'стоит на всех 17')+'</li>'
   +'<li>Удвоить можно на первых двух картах</li><li>Обычная победа платит 1 к 1</li>';
}

async function resumeGame(){
  const r=await bjApi('/api/blackjack/state');
  renderRules(r&&r.rules);
  if(!(r&&r.active))return;
  active=true;await clearTable();takeState(r.state);mode(true);
  syncHand($('p-cards'),ph,false,{instant:true});syncHand($('d-cards'),dh,true,{instant:true});
  pScoreRender();setScore('d-score','?');setChip(bet);
}
async function deal(){
  if(busy)return;
  const b=+$('bet-inp').value||0;
  if(b<1){toast('Введите ставку','err');return;}
  if(b>bal){toast('Недостаточно монет','err');return;}
  busy=true;$('deal-btn').disabled=true;
  const r=await bjApi('/api/blackjack/start',{bet:b});
  if(r.error){busy=false;$('deal-btn').disabled=false;toast(r.error,'err');return;}
  if(r.new_balance!=null){bal=r.new_balance;upd();}else if(!r.resume){bal-=b;upd();}
  await clearTable();
  active=!r.done;takeState(r.state);mode(!r.done);
  // раздача по очереди: игрок, дилер, игрок, дилер
  syncHand($('p-cards'),ph,false,{delays:[0,.36]});
  syncHand($('d-cards'),r.done?dh.slice(0,2):dh,true,{delays:[.18,.54]});   // добор дилера покажем позже, по одной карте
  setChip(bet);
  await sleep(1000);
  pScoreRender();setScore('d-score','?');
  if(r.done){await finishRound(r);}
  busy=false;$('deal-btn').disabled=false;
}
async function act(a){
  if(!active||busy)return;
  busy=true;
  const r=await bjApi('/api/blackjack/action',{action:a});
  if(r.error){busy=false;toast(r.error,'err');return;}
  takeState(r.state);
  syncHand($('p-cards'),ph,false);setChip(bet);
  await sleep(420);pScoreRender();
  if(r.done){active=false;mode(false);await finishRound(r);busy=false;return;}
  busy=false;
}

const OUT={
  bj:['БЛЭКДЖЕК!','','win'],
  win:['ПОБЕДА','','win'],
  push:['НИЧЬЯ','ставка возвращена','push'],
  lose:['ПРОИГРЫШ','','lose'],
  bust:['ПЕРЕБОР','слишком много очков','lose']
};
async function finishRound(r){
  const st=r.state,o=r.result;
  mode(false);$('deal-btn').disabled=true;
  // дилер открывает закрытую карту и добирает
  dh=st.dealer;
  syncHand($('d-cards'),dh.slice(0,2),false);
  setScore('d-score',score(dh.slice(0,2)),isBJ(dh.slice(0,2))?'bj':'');
  await sleep(700);
  for(let k=3;k<=dh.length;k++){
    syncHand($('d-cards'),dh.slice(0,k),false);
    await sleep(560);
    const s=score(dh.slice(0,k));setScore('d-score',s,s>21?'bust':'');
  }
  await sleep(250);
  const [title,sub0,cls]=OUT[o.outcome];
  let sub=sub0;
  if(o.outcome==='bj')sub='выплата '+payLabel(BJ_PAYS);
  if(o.outcome==='win')sub=st.ds>21?'дилер перебрал':st.ps+' против '+st.ds;
  if(o.outcome==='lose')sub=st.ps+' против '+st.ds;
  $('b-t').textContent=title;$('b-s').textContent=sub;
  $('b-a').textContent=o.outcome==='push'?'= '+st.bet+' 🪙':((o.profit>=0?'+':'')+o.profit+' 🪙');
  const bn=$('banner');bn.className='banner '+cls;void bn.offsetWidth;bn.classList.add('show');
  $('table').classList.add(cls==='win'?'win':cls==='lose'?'lose':'x');
  if(cls==='win')coins();
  if(r.new_balance!=null){bal=r.new_balance;upd();}
  $('chipbox').classList.remove('on');
  $('deal-btn').disabled=false;
}
function coins(){
  const t=$('table');
  for(let i=0;i<16;i++){
    const c=document.createElement('div');c.className='coin';c.textContent='🪙';
    c.style.left=(25+Math.random()*50)+'%';c.style.top='58%';
    c.style.setProperty('--dx',(Math.random()*160-80)+'px');c.style.animationDelay=(Math.random()*.35)+'s';
    t.appendChild(c);setTimeout(()=>c.remove(),1900);
  }
}
load();
</script>
