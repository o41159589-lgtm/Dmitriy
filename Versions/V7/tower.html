<style>

@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{
  --bg:#06060F;--white:#FFF;--gray1:#E0E0E0;--gray2:#AAA;
  --green:#00FF88;--red:#FF3B55;--gold:#FFD600;--cyan:#00E5FF;
  --text:#F0EFFF;--muted:#52527A;--muted2:#7A7AAA;
  --card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.13);
  --fd:'Bebas Neue',sans-serif;--fu:'Exo 2',sans-serif;--fm:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--fu);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;background:rgba(6,6,15,.94);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.fp-back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:22px;cursor:pointer;font-weight:700;}
.fp-title{font-family:var(--fd);font-size:20px;color:var(--white);letter-spacing:1px;}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(255,214,0,.1);border:1px solid rgba(255,214,0,.25);border-radius:12px;padding:7px 12px;font-family:var(--fm);font-size:13px;font-weight:700;color:var(--gold);}
.toast{position:fixed;top:80px;left:14px;right:14px;z-index:500;background:rgba(6,6,15,.97);border:1px solid var(--border2);backdrop-filter:blur(20px);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-80px);opacity:0;transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{color:var(--green);border-color:rgba(0,255,136,.3);}
.toast.err{color:var(--red);border-color:rgba(255,59,85,.3);}
.toast.info{color:var(--cyan);border-color:rgba(0,229,255,.3);}
.page{padding:12px 14px 24px;}
.stag{font-family:var(--fm);font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;}
.setup-card.hidden{display:none;}
.bet-inp{background:rgba(0,0,0,.5);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;color:var(--white);font-family:var(--fm);font-size:18px;outline:none;text-align:center;width:100%;margin-bottom:10px;}
.bet-inp:focus{border-color:rgba(255,255,255,.3);}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.qb{padding:7px 12px;background:var(--card);border:1px solid var(--border2);border-radius:9px;font-size:11px;color:var(--gray1);font-weight:700;cursor:pointer;font-family:var(--fm);transition:all .12s;}
.qb:active{background:rgba(255,255,255,.1);color:var(--white);}
.mp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:14px;}
.mp{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:9px;padding:6px 4px;text-align:center;}
.mp-k{font-size:9px;color:var(--muted2);font-family:var(--fm);}
.mp-v{font-family:var(--fm);font-size:11px;color:var(--white);font-weight:700;}
.start-btn{width:100%;padding:15px;background:var(--white);border:none;border-radius:14px;color:#000;font-family:var(--fd);font-size:20px;letter-spacing:.5px;cursor:pointer;box-shadow:0 4px 18px rgba(255,255,255,.12);transition:opacity .15s,transform .1s;}
.start-btn:active{transform:scale(.98);}
.start-btn:disabled{opacity:.4;cursor:not-allowed;}

/* GAME */
.game-area{display:none;}
.game-area.on{display:block;}
.live-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.ls{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;}
.ls-l{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-family:var(--fm);}
.ls-v{font-family:var(--fm);font-size:15px;font-weight:700;}
.tower-wrap{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;max-height:380px;overflow-y:auto;padding:2px;scroll-behavior:smooth;}
.tower-wrap::-webkit-scrollbar{width:3px;}
.tower-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
.floor{display:flex;gap:5px;align-items:center;transition:opacity .25s,filter .25s;}
.floor.past{opacity:.3;filter:grayscale(.6);}
.floor.future{opacity:.4;}
.floor.current{opacity:1;}
.fl-num{width:26px;font-family:var(--fm);font-size:10px;color:var(--muted2);text-align:center;flex-shrink:0;}
.floor.current .fl-num{color:var(--gold);font-weight:700;}
.fl-mult{width:38px;font-family:var(--fm);font-size:9px;color:var(--muted2);text-align:right;flex-shrink:0;}
.floor.current .fl-mult{color:var(--gold);}
.tcell{flex:1;height:50px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.tcell::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 60%);pointer-events:none;}
.floor.current .tcell{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06);}
.floor.current .tcell:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.1);transform:scale(1.04);}
.floor.current .tcell:active{transform:scale(.95);}
.tcell.disabled{cursor:default;pointer-events:none;}
.tcell.safe{border-color:rgba(0,255,136,.5);background:rgba(0,255,136,.1);animation:csafe .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes csafe{from{transform:scale(.8);}to{transform:scale(1);}}
.tcell.bomb{border-color:rgba(255,59,85,.6);background:rgba(255,59,85,.18);animation:cbomb .4s both;}
@keyframes cbomb{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.tcell.bomb-hidden{border-color:rgba(255,59,85,.15);background:rgba(255,59,85,.05);opacity:.5;cursor:default;}
.cashout-btn{width:100%;padding:15px;background:var(--green);border:none;border-radius:14px;color:#000;font-family:var(--fd);font-size:18px;cursor:pointer;animation:gpulse 1.5s ease-in-out infinite;margin-bottom:10px;}
@keyframes gpulse{0%,100%{box-shadow:0 4px 18px rgba(0,255,136,.3);}50%{box-shadow:0 4px 28px rgba(0,255,136,.55);}}
.cashout-btn:disabled{opacity:.4;cursor:not-allowed;animation:none;}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.act-btn{padding:12px;border-radius:12px;font-family:var(--fd);font-size:14px;cursor:pointer;border:1px solid var(--border2);background:var(--card);color:var(--gray1);transition:all .15s;}
.act-btn:active{background:rgba(255,255,255,.08);}

/* Result */
.res-overlay{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);backdrop-filter:blur(24px);}
.res-overlay.show{display:flex;}
.res-card{background:rgba(8,8,18,.97);border:1px solid var(--border2);border-radius:24px;padding:28px 22px;text-align:center;max-width:300px;width:90%;animation:rpop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes rpop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.res-ico{font-size:64px;margin-bottom:12px;display:block;}
.res-title{font-family:var(--fd);font-size:26px;margin-bottom:6px;letter-spacing:1px;}
.res-title.win{color:var(--green);}.res-title.lose{color:var(--red);}
.res-sub{font-size:13px;color:var(--muted2);margin-bottom:6px;}
.res-amt{font-family:var(--fm);font-size:30px;font-weight:700;margin-bottom:18px;}
.res-amt.win{color:var(--green);}.res-amt.lose{color:var(--red);}
.res-close{width:100%;padding:13px;background:var(--white);border:none;border-radius:13px;color:#000;font-family:var(--fd);font-size:17px;cursor:pointer;}


/* ==============================================
   TOPLUCK SKY THEME — TOWER
   ============================================== */
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap');

:root {
  --bg: #C0E4F8; --bg2: #F4F8FF; --bg3: #E8F3FF;
  --card: rgba(255,255,255,0.90); --card-hover: rgba(255,255,255,0.97);
  --border: rgba(20,40,90,0.10); --border2: rgba(20,40,90,0.16);
  --white: #1A2040; --text: #1A2040; --muted: #7A8AAA; --muted2: #9AABCC;
  --gold: #B88000; --green: #1A9A50; --red: #D02840;
  --font-display: 'Caveat','Comic Sans MS',cursive; --fd: 'Caveat','Comic Sans MS',cursive;
  --fu: 'Nunito',sans-serif; --fm: 'Nunito',sans-serif;
}
html,body {
  background: linear-gradient(175deg,#60B2DC 0%,#80C4E8 28%,#9FD2F0 55%,#C0E4F8 100%) fixed;
  min-height: 100%;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url('../textures/sky.svg');
  background-size: 100% auto; background-position: top center; background-repeat: no-repeat;
}
.page { position: relative; z-index: 1; }

/* Topbar */
.topbar {
  background: rgba(255,255,255,0.93) !important;
  box-shadow: 0 2px 14px rgba(0,30,80,0.11) !important;
  border-bottom: 1px solid rgba(0,0,0,0.06) !important;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.fp-back { background: rgba(20,40,90,0.06) !important; border: 1.5px solid rgba(20,40,90,0.12) !important; color: #1A2040 !important; }
.fp-title { font-family: 'Caveat','Comic Sans MS',cursive ;font-style:normal!important; font-size: 23px !important; font-weight: 700 !important; color: #1A2040 !important; letter-spacing: 0 !important; }
.bal-chip { background: rgba(255,255,255,0.96) !important; border: 2px solid #FFD028 !important; color: #A07800 !important; font-family: 'Nunito',sans-serif !important; font-weight: 800 !important; }

/* Toast */
.toast { background: rgba(255,255,255,0.97) !important; border: 1.5px solid rgba(20,40,90,0.10) !important; color: #1A2040 !important; font-family: 'Nunito',sans-serif !important; box-shadow: 0 6px 24px rgba(0,30,80,0.15) !important; }
.toast.ok  { color: #1A9A50 !important; border-color: rgba(26,154,80,0.30) !important; }
.toast.err { color: #D02840 !important; border-color: rgba(208,40,64,0.30) !important; }

/* Cards */
.setup-card, .game-area, .result-card {
  background: rgba(255,255,255,0.92) !important;
  border: 2px solid rgba(255,255,255,0.80) !important;
  border-radius: 22px !important;
  box-shadow: 0 5px 20px rgba(0,30,80,0.11) !important;
}
.stag { font-family: 'Caveat','Comic Sans MS',cursive ;font-style:normal!important; color: #7A8AAA !important; letter-spacing: 0 !important; font-size: 19px !important; }
.bet-inp { background: rgba(255,255,255,0.88) !important; border: 1.5px solid rgba(20,40,90,0.13) !important; color: #1A2040 !important; font-family: 'Nunito',sans-serif !important; font-weight: 800 !important; }
.bet-inp:focus { border-color: rgba(40,100,220,0.40) !important; }
.qb { background: rgba(255,255,255,0.85) !important; border: 1.5px solid rgba(20,40,90,0.12) !important; color: #1A2040 !important; font-family: 'Nunito',sans-serif !important; font-weight: 700 !important; border-radius: 10px !important; }

/* Multipliers */
.mp-grid { gap: 8px !important; }
.mp { background: rgba(232,244,255,0.85) !important; border: 1.5px solid rgba(40,120,220,0.18) !important; border-radius: 12px !important; }
.mp-k { color: #7A8AAA !important; font-family: 'Nunito',sans-serif !important; }
.mp-v { color: #1A2040 !important; font-family: 'Nunito',sans-serif !important; font-weight: 800 !important; }

/* Start button — blue gradient */
.start-btn {
  background: linear-gradient(135deg,#4898E0 0%,#2060C0 100%) !important;
  border-radius: 18px !important; font-family: 'Caveat','Comic Sans MS',cursive ;font-style:normal!important;
  font-size: 26px !important; font-weight: 700 !important; letter-spacing: 0 !important;
  box-shadow: 0 5px 18px rgba(40,80,200,0.30) !important; color: #fff !important;
}
.start-btn:active { transform: scale(.97) !important; }

/* Live stats */
.live-stats { gap: 8px !important; margin-bottom: 14px !important; }
.ls { background: rgba(255,255,255,0.88) !important; border: 1.5px solid rgba(20,40,90,0.10) !important; border-radius: 14px !important; box-shadow: 0 2px 8px rgba(0,30,80,0.07) !important; padding: 10px 8px !important; }
.ls-l { color: #7A8AAA !important; font-family: 'Nunito',sans-serif !important; font-size: 10px !important; font-weight: 700 !important; text-transform: uppercase !important; letter-spacing: 0.5px !important; }
.ls-v { font-family: 'Nunito',sans-serif !important; font-size: 16px !important; font-weight: 800 !important; color: #1A2040 !important; }

/* Tower cells */
.tcell {
  background: rgba(255,255,255,0.88) !important;
  border: 1.5px solid rgba(20,40,90,0.11) !important;
  border-radius: 14px !important;
  box-shadow: 0 2px 8px rgba(0,30,80,0.08), inset 0 1px 0 rgba(255,255,255,0.7) !important;
}
.tcell:not(.safe):not(.bomb-hidden):not(.disabled):hover {
  background: rgba(255,255,255,0.98) !important;
  border-color: rgba(40,100,220,0.28) !important;
  transform: scale(1.06) !important;
  box-shadow: 0 4px 14px rgba(40,100,220,0.18) !important;
}
/* Active floor glow */
.floor.active .tcell:not(.safe):not(.bomb-hidden) {
  border-color: rgba(255,210,40,0.70) !important;
  box-shadow: 0 0 0 2px rgba(255,210,40,0.45), 0 3px 10px rgba(0,30,80,0.10) !important;
}
.safe { background: linear-gradient(135deg,#E0F5FF,#C4E8FF) !important; border-color: rgba(20,140,220,0.35) !important; box-shadow: 0 0 14px rgba(20,140,220,0.20) !important; }
.bomb-hidden { background: linear-gradient(135deg,#FFE8EE,#FFC8D4) !important; border-color: rgba(208,40,64,0.30) !important; }
/* Floor labels */
.fl-num  { color: #7A8AAA !important; font-family: 'Nunito',sans-serif !important; font-size: 11px !important; font-weight: 700 !important; }
.fl-mult { color: #1A9A50 !important; font-family: 'Caveat','Comic Sans MS',cursive ;font-style:normal!important; font-size: 18px !important; font-weight: 700 !important; }
.floor.future .tcell { opacity: 0.40 !important; }

/* Cashout */
.cashout-btn {
  background: linear-gradient(135deg,#20C060 0%,#148040 100%) !important;
  border-radius: 18px !important; font-family: 'Caveat','Comic Sans MS',cursive ;font-style:normal!important;
  font-size: 24px !important; font-weight: 700 !important; letter-spacing: 0 !important;
  box-shadow: 0 5px 18px rgba(20,140,60,0.32) !important; color: #fff !important;
}
.cashout-btn:disabled { opacity: .4 !important; }

/* Giveup + result buttons — white cards */
.again-btn, .act-row > button:not(.cashout-btn), .res-close {
  background: rgba(255,255,255,0.92) !important;
  border: 2px solid rgba(20,40,90,0.14) !important; border-radius: 18px !important;
  color: #1A2040 !important; font-family: 'Caveat','Comic Sans MS',cursive ;font-style:normal!important;
  font-size: 22px !important; font-weight: 700 !important; letter-spacing: 0 !important;
  box-shadow: 0 2px 10px rgba(0,30,80,0.08) !important;
}
/* Result */
.res-title { font-family: 'Caveat','Comic Sans MS',cursive ;font-style:normal!important; font-size: 40px !important; font-weight: 700 !important; letter-spacing: 0 !important; }
.res-sub   { color: #7A8AAA !important; font-family: 'Nunito',sans-serif !important; }
.res-amt   { font-family: 'Nunito',sans-serif !important; font-size: 32px !important; font-weight: 900 !important; }
/* Back link */
a[href*="main.html"] {
  display: block !important; text-decoration: none !important; text-align: center !important;
  margin-top: 10px !important; padding: 12px !important;
  background: rgba(255,255,255,0.85) !important;
  border: 1.5px solid rgba(20,40,90,0.12) !important; border-radius: 16px !important;
  color: #7A8AAA !important; font-family: 'Nunito',sans-serif !important;
  font-size: 13px !important; font-weight: 700 !important;
}


/* ── Result overlay & card (was dark) ── */
.res-overlay{background:rgba(20,40,90,0.45)!important;backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important;}
.res-card{
  background:rgba(248,252,255,0.98)!important;
  border:2px solid rgba(255,255,255,0.90)!important;
  border-radius:26px!important;
  box-shadow:0 8px 40px rgba(0,30,80,0.22)!important;
}
.res-title{font-family:'Caveat',cursive;font-style:normal!important;font-size:42px!important;font-weight:700!important;letter-spacing:0!important;font-style:normal!important;}
.res-title.win{color:#1A9A50!important;} .res-title.lose{color:#D02840!important;}
.res-sub{color:#7A8AAA!important;font-family:'Nunito',sans-serif!important;font-size:13px!important;}
.res-amt{font-family:'Nunito',sans-serif!important;font-size:32px!important;font-weight:900!important;color:#1A2040!important;}
.res-close,.again-btn{
  background:linear-gradient(135deg,#4898E0,#2060C0)!important;
  border:none!important;border-radius:18px!important;color:#fff!important;
  font-family:'Caveat',cursive;font-style:normal!important;font-size:24px!important;font-weight:700!important;
  letter-spacing:0!important;font-style:normal!important;
  box-shadow:0 5px 18px rgba(40,80,200,0.30)!important;
}
/* Tower floor grid wrap */
.floors-wrap,.tower-grid{
  background:rgba(232,244,255,0.80)!important;
  border:1.5px solid rgba(40,120,220,0.16)!important;
  border-radius:20px!important;padding:12px!important;
}
.mp{background:rgba(232,244,255,0.85)!important;border:1.5px solid rgba(40,120,220,0.18)!important;}

/* ── iOS font fix: labels use Nunito not Caveat ── */
.fp-title{font-family:'Nunito',sans-serif!important;font-size:16px!important;font-weight:900!important;letter-spacing:1px!important;text-transform:uppercase!important;font-style:normal!important;}
.stag{font-family:'Nunito',sans-serif!important;font-size:10px!important;font-weight:800!important;letter-spacing:1.5px!important;text-transform:uppercase!important;font-style:normal!important;}
</style>

<body>
<div class="toast" id="toast"></div>
<div class="topbar">
  <button class="fp-back" onclick="goBack()">‹</button>
  <div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">🗼</span><span class="fp-title">БАШНЯ</span></div>
  <div class="bal-chip"><img src="../textures/coin.svg" width="20" height="20" alt="" style="vertical-align:middle;margin-right:2px"> <span id="r-bal">—</span></div>
</div>
<div class="page">

  <!-- SETUP -->
  <div class="setup-card" id="setup-card">
    <div class="stag">// ставка</div>
    <input class="bet-inp" id="bet-inp" type="number" min="10" value="50" inputmode="numeric">
    <div class="qb-row">
      <div class="qb" onclick="sb(10)">10</div><div class="qb" onclick="sb(25)">25</div>
      <div class="qb" onclick="sb(50)">50</div><div class="qb" onclick="sb(100)">100</div>
      <div class="qb" onclick="sbAll()">MAX</div><div class="qb" onclick="sbHalf()">½</div>
    </div>
    <div class="stag">// множители по этажам</div>
    <div class="mp-grid" id="mp-grid"></div>
    <button class="start-btn" id="start-btn" onclick="startGame()">🗼 НАЧАТЬ ИГРУ</button>
  </div>

  <!-- GAME -->
  <div class="game-area" id="game-area">
    <div class="live-stats">
      <div class="ls"><div class="ls-l">Ставка</div><div class="ls-v" style="color:var(--gold)" id="live-bet">—</div></div>
      <div class="ls"><div class="ls-l">Этаж</div><div class="ls-v" style="color:var(--white)" id="live-floor">1/10</div></div>
      <div class="ls"><div class="ls-l">Выиграть</div><div class="ls-v" style="color:var(--green)" id="live-win">0 🪙</div></div>
    </div>
    <div class="tower-wrap" id="tower"></div>
    <button class="cashout-btn" id="cashout-btn" onclick="cashout()" disabled>
      💰 КЕШАУТ — <span id="cashout-lbl">0</span> 🪙
    </button>
    <div class="act-row">
      <button class="act-btn" onclick="newGame()">🔄 Новая игра</button>
      <button class="act-btn" onclick="goBack()">← Назад</button>
    </div>
  </div>

</div>

<!-- RESULT -->
<div class="res-overlay" id="res-overlay">
  <div class="res-card">
    <span class="res-ico" id="res-ico">🏆</span>
    <div class="res-title win" id="res-title">КЕШАУТ!</div>
    <div class="res-sub" id="res-sub">Этаж 5 · ×2.49</div>
    <div class="res-amt win" id="res-amt">+124 🪙</div>
    <button class="res-close" onclick="closeResult()">🔄 Играть снова</button>
    <a href="main.html?tab=games" style="display:block;margin-top:8px;color:rgba(255,255,255,.4);font-size:13px;text-decoration:none;text-align:center">← В меню игр</a>
  </div>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
const UID=tg?.initDataUnsafe?.user?.id||0;
const CELLS=3,MAX_FLOORS=10,HOUSE=0.97;

function floorMult(f){if(f<=0)return 1;const raw=1+f*.28-f*(f-1)*.01;return parseFloat((HOUSE*Math.max(1,raw)).toFixed(2));}

let userData=null,currentBet=0,currentFloor=0,gameActive=false,pending=false,builtFloors=0;

function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className='toast '+t+' show';setTimeout(()=>el.classList.remove('show'),2800);}
async function get(url){return fetch(url).then(r=>r.json());}
async function post(url,d){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json());}
async function loadUser(){const u=await get(`/api/user/${UID}`).catch(()=>null);if(!u)return;userData=u;document.getElementById('r-bal').textContent=u.balance??0;}
function sb(v){document.getElementById('bet-inp').value=v;}
function sbAll(){if(userData)sb(userData.balance);}
function sbHalf(){if(userData)sb(Math.floor((userData.balance||0)/2));}

function buildMpGrid(){
  const g=document.getElementById('mp-grid');g.innerHTML='';
  for(let f=1;f<=MAX_FLOORS;f++){
    const d=document.createElement('div');d.className='mp';
    d.innerHTML=`<div class="mp-k">Эт. ${f}</div><div class="mp-v">×${floorMult(f).toFixed(2)}</div>`;
    g.appendChild(d);
  }
}

function ensureFloors(upto){
  const cont=document.getElementById('tower');
  const need=Math.min(upto+3,MAX_FLOORS);
  if(builtFloors===0)cont.innerHTML='';
  for(let f=builtFloors+1;f<=need;f++){
    const row=document.createElement('div');row.className='floor future';row.id=`fr-${f}`;
    const num=document.createElement('div');num.className='fl-num';num.textContent=f;row.appendChild(num);
    for(let c=0;c<CELLS;c++){
      const cell=document.createElement('div');cell.className='tcell disabled';cell.id=`tc-${f}-${c}`;
      cell.innerHTML='<span style="opacity:.12;font-size:14px">?</span>';cell.onclick=()=>pickCell(f,c);
      row.appendChild(cell);
    }
    const mult=document.createElement('div');mult.className='fl-mult';mult.textContent='×'+floorMult(f).toFixed(2);
    row.appendChild(mult);cont.appendChild(row);
  }
  builtFloors=Math.max(builtFloors,need);
  // Sort desc
  const rows=[...cont.querySelectorAll('.floor')];
  rows.sort((a,b)=>parseInt(b.id.split('-')[1])-parseInt(a.id.split('-')[1]));
  cont.innerHTML='';rows.forEach(r=>cont.appendChild(r));
}

function activateFloor(f){
  ensureFloors(f);
  for(let i=1;i<=builtFloors;i++){
    const row=document.getElementById(`fr-${i}`);if(!row)continue;
    row.className='floor '+(i<f?'past':i===f?'current':'future');
    for(let c=0;c<CELLS;c++){
      const cell=document.getElementById(`tc-${i}-${c}`);if(!cell)continue;
      if(i===f){cell.classList.remove('disabled');cell.style.pointerEvents='';}
      else{cell.classList.add('disabled');cell.style.pointerEvents='none';}
    }
  }
  const row=document.getElementById(`fr-${f}`);
  if(row)setTimeout(()=>row.scrollIntoView({behavior:'smooth',block:'center'}),100);
  document.getElementById('live-floor').textContent=`${f}/${MAX_FLOORS}`;
  document.getElementById('cashout-btn').disabled=f<=1;
}

async function startGame(){
  const bet=parseInt(document.getElementById('bet-inp').value)||0;
  if(bet<10){toast('Минимум 10 🪙','err');return;}
  if(!userData||bet>userData.balance){toast('Недостаточно монет','err');return;}
  document.getElementById('start-btn').disabled=true;
  const res=await post('/api/tower/start',{user_id:UID,bet}).catch(()=>null);
  document.getElementById('start-btn').disabled=false;
  if(!res||res.error){toast(res?.error||'Ошибка','err');return;}
  currentBet=bet;currentFloor=1;gameActive=true;builtFloors=0;
  if(userData)userData.balance=res.new_balance;
  document.getElementById('r-bal').textContent=res.new_balance;
  document.getElementById('live-bet').textContent=bet;
  document.getElementById('live-win').textContent='0 🪙';
  document.getElementById('cashout-lbl').textContent='0';
  document.getElementById('cashout-btn').disabled=true;
  document.getElementById('setup-card').classList.add('hidden');
  document.getElementById('game-area').classList.add('on');
  activateFloor(1);
}

async function pickCell(floor,ci){
  if(!gameActive||pending||floor!==currentFloor)return;
  pending=true;
  for(let c=0;c<CELLS;c++){const el=document.getElementById(`tc-${floor}-${c}`);if(el)el.style.pointerEvents='none';}
  const res=await post('/api/tower/step',{user_id:UID,floor,cell:ci}).catch(()=>null);
  pending=false;
  if(!res||res.error){
    toast(res?.error||'Ошибка','err');
    for(let c=0;c<CELLS;c++){const el=document.getElementById(`tc-${floor}-${c}`);if(el)el.style.pointerEvents='';}
    return;
  }
  const chosen=document.getElementById(`tc-${floor}-${ci}`);
  let bombIdx=res.bomb_cell;
  if(bombIdx===-1&&!res.is_bomb){const others=[0,1,2].filter(c=>c!==ci);bombIdx=others[Math.floor(Math.random()*others.length)];}
  if(res.is_bomb){
    chosen.className='tcell bomb disabled';chosen.innerHTML='💣';
    setTimeout(()=>{
      for(let c=0;c<CELLS;c++){
        if(c===ci)continue;
        const el=document.getElementById(`tc-${floor}-${c}`);if(!el)continue;
        if(c===bombIdx){el.className='tcell bomb disabled';el.innerHTML='💣';el.style.opacity='.65';}
        else{el.className='tcell safe disabled';el.innerHTML='💎';}
      }
    },300);
    gameActive=false;
    setTimeout(()=>showResult(false,currentBet,floorMult(floor-1)||1,0,floor),600);
  }else{
    chosen.className='tcell safe disabled';chosen.innerHTML='💎';
    for(let c=0;c<CELLS;c++){
      if(c===ci)continue;
      const el=document.getElementById(`tc-${floor}-${c}`);if(!el)continue;
      if(c===bombIdx){el.className='tcell bomb-hidden disabled';el.innerHTML='💣';el.style.opacity='.35';}
      else{el.className='tcell disabled';el.style.opacity='.3';el.innerHTML='<span style="font-size:14px;opacity:.3">—</span>';}
    }
    document.getElementById('live-win').textContent=res.current_win+' 🪙';
    document.getElementById('cashout-lbl').textContent=res.current_win;
    if(res.reached_top){
      gameActive=false;if(userData)userData.balance=res.new_balance;document.getElementById('r-bal').textContent=res.new_balance;
      setTimeout(()=>showResult(true,currentBet,res.mult,res.current_win,floor,true),600);
    }else{
      currentFloor=floor+1;setTimeout(()=>activateFloor(currentFloor),350);
      document.getElementById('cashout-btn').disabled=false;
    }
  }
}

async function cashout(){
  if(!gameActive||pending)return;
  document.getElementById('cashout-btn').disabled=true;
  const res=await post('/api/tower/cashout',{user_id:UID}).catch(()=>null);
  if(!res||res.error){toast(res?.error||'Ошибка','err');document.getElementById('cashout-btn').disabled=false;return;}
  gameActive=false;if(userData)userData.balance=res.new_balance;document.getElementById('r-bal').textContent=res.new_balance;
  showResult(true,currentBet,res.mult,res.won,currentFloor-1);
}

function showResult(won,bet,mult,amount,floor,top=false){
  document.getElementById('res-ico').textContent=won?'🏆':'💥';
  document.getElementById('res-title').textContent=won?(top?'БАШНЯ ПОКОРЕНА!':'КЕШАУТ!'):'ВЗРЫВ!';
  document.getElementById('res-title').className='res-title '+(won?'win':'lose');
  document.getElementById('res-sub').textContent=`Этаж ${floor} · ×${parseFloat(mult||1).toFixed(2)}`;
  document.getElementById('res-amt').textContent=won?`+${amount} 🪙`:`-${bet} 🪙`;
  document.getElementById('res-amt').className='res-amt '+(won?'win':'lose');
  document.getElementById('res-overlay').classList.add('show');
}
function closeResult(){document.getElementById('res-overlay').classList.remove('show');newGame();}
function newGame(){gameActive=false;currentFloor=1;builtFloors=0;document.getElementById('game-area').classList.remove('on');document.getElementById('setup-card').classList.remove('hidden');loadUser();}
function goBack(){if(gameActive&&currentFloor>1)cashout().then(()=>location.href='main.html?tab=games');else location.href='main.html?tab=games';}

buildMpGrid();loadUser();
</script>
<script>(function(){let x=null;function c(){if(!x)x=new(window.AudioContext||window.webkitAudioContext)();return x;}function on(){try{return localStorage.getItem("topluck_sounds")==="1";}catch(e){return false;}}window.SND={play:function(t){if(!on())return;try{const ctx=c(),g=ctx.createGain(),o=ctx.createOscillator();g.connect(ctx.destination);o.connect(g);const s=ctx.currentTime;if(t==="win"){o.type="sine";[523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,s+i*.1));g.gain.setValueAtTime(.22,s);g.gain.exponentialRampToValueAtTime(.001,s+.75);o.start(s);o.stop(s+.75);}else if(t==="lose"){o.type="sawtooth";o.frequency.setValueAtTime(280,s);o.frequency.exponentialRampToValueAtTime(70,s+.5);g.gain.setValueAtTime(.2,s);g.gain.exponentialRampToValueAtTime(.001,s+.6);o.start(s);o.stop(s+.6);}else if(t==="step"||t==="coin"){o.type="sine";o.frequency.setValueAtTime(900,s);g.gain.setValueAtTime(.12,s);g.gain.exponentialRampToValueAtTime(.001,s+.18);o.start(s);o.stop(s+.18);}else if(t==="bomb"){o.type="sawtooth";o.frequency.setValueAtTime(120,s);o.frequency.exponentialRampToValueAtTime(20,s+.6);g.gain.setValueAtTime(.28,s);g.gain.exponentialRampToValueAtTime(.001,s+.7);o.start(s);o.stop(s+.7);}}catch(e){}}};})();</script>
</body>
</html>
