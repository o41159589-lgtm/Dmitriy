<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})()</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{
  --bg:#06060F;--white:#FFF;--gray1:#E0E0E0;--gray2:#AAA;
  --green:#00FF88;--red:#FF3B55;--gold:#FFD600;--cyan:#00E5FF;
  --text:#F0EFFF;--muted:#52527A;--muted2:#7A7AAA;
  --card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.13);
  --fd:'Bebas Neue',sans-serif;--fu:'Exo 2',sans-serif;--fm:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--fu);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;background:rgba(6,6,15,.94);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.fp-back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:22px;cursor:pointer;font-weight:700;}
.fp-title{font-family:var(--fd);font-size:20px;color:var(--white);letter-spacing:2px;}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(255,214,0,.1);border:1px solid rgba(255,214,0,.25);border-radius:12px;padding:7px 12px;font-family:var(--fm);font-size:13px;font-weight:700;color:var(--gold);}
.toast{position:fixed;top:80px;left:14px;right:14px;z-index:500;background:rgba(6,6,15,.97);border:1px solid var(--border2);backdrop-filter:blur(20px);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-80px);opacity:0;transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{color:var(--green);border-color:rgba(0,255,136,.3);}
.toast.err{color:var(--red);border-color:rgba(255,59,85,.3);}
.toast.info{color:var(--cyan);border-color:rgba(0,229,255,.3);}

/* Hero */
.hero{margin:14px;background:rgba(0,0,0,.4);border:1px solid var(--border2);border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.hero-top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;}
.pot-box{flex:1;background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.pot-val{font-family:var(--fm);font-size:20px;font-weight:700;color:var(--gold);}
.pot-lbl{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;font-family:var(--fm);margin-bottom:2px;}
.status-badge{background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:6px 12px;font-family:var(--fm);font-size:11px;color:var(--gray2);white-space:nowrap;}

/* Winner spotlight */
.winner-spot{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
.ws-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:all .2s;}
.ws-lbl{font-family:var(--fm);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.ws-name{font-size:14px;font-weight:700;}
.ws-pct{font-family:var(--fm);font-size:22px;font-weight:700;color:var(--gray1);}

/* Wheel */
.wheel-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
#gc{display:block;border-radius:50%;}
/* Gold pointer — same as European */
.g-ptr{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:22px solid var(--gold);filter:drop-shadow(0 0 8px rgba(255,214,0,.9));z-index:10;}

/* Timer */
.timer-wrap{width:100%;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;}
.timer-bar{height:100%;background:linear-gradient(90deg,var(--gray2),var(--white));border-radius:2px;transition:width .5s linear;box-shadow:0 0 6px rgba(255,255,255,.4);}

/* Page content */
.page{padding:0 14px 40px;}
.bets-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;}
.bets-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.stag{font-family:var(--fm);font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;}
.pcnt{background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:4px 10px;font-family:var(--fm);font-size:11px;color:var(--gray2);}
.gp{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.gp:last-child{border-bottom:none;}
.gp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.gp-name{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gp-bar-row{width:100%;height:2px;background:rgba(255,255,255,.05);border-radius:1px;margin-top:3px;}
.gp-bar{height:100%;border-radius:1px;transition:width .5s;opacity:.6;}
.gp-bet{font-family:var(--fm);font-size:13px;color:var(--gold);font-weight:700;}
.gp-pct{font-size:10px;color:var(--muted2);font-family:var(--fm);margin-top:1px;text-align:right;}
.your-badge{display:inline-flex;align-items:center;gap:5px;margin-top:10px;background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:5px 12px;font-family:var(--fm);font-size:11px;color:var(--gray2);}

/* Bet card */
.bet-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;}
.bet-inp{background:rgba(0,0,0,.5);border:1px solid var(--border2);border-radius:12px;padding:10px 12px;color:var(--white);font-family:var(--fm);font-size:18px;outline:none;text-align:center;width:100%;margin-bottom:10px;}
.bet-inp:focus{border-color:rgba(255,255,255,.3);}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.qb{padding:7px 12px;background:var(--card);border:1px solid var(--border2);border-radius:9px;font-size:11px;color:var(--gray1);font-weight:700;cursor:pointer;font-family:var(--fm);transition:all .12s;}
.qb:active{background:rgba(255,255,255,.1);color:var(--white);}
.bet-btn{width:100%;padding:16px;background:var(--white);border:none;border-radius:14px;color:#000;font-family:var(--fd);font-size:22px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 20px rgba(255,255,255,.12);transition:opacity .15s,transform .1s;}
.bet-btn:active{transform:scale(.98);}
.bet-btn:disabled{opacity:.35;cursor:not-allowed;}

/* Rules */
.rules-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.rules-head{padding:10px 14px;font-family:var(--fm);font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.05);}
.rule-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);}
.rule-row:last-child{border-bottom:none;}
.rule-l{font-size:13px;color:var(--muted2);}
.rule-r{font-family:var(--fm);font-size:12px;font-weight:700;color:var(--text);}
</style>
</head>

<div class="hero">
  <div class="hero-top">

  <div class="bets-card">

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
const UID=tg?.initDataUnsafe?.user?.id||0;

// Desaturated palette — matches dark/grey theme
const COLORS=['#9B5DFF','#00E5FF','#FF2D6B','#FFD600','#00FF88','#FF8C00','#00BFFF','#FF69B4','#7CFC00','#FF4500'];
function ha(hex,a){const r=parseInt(hex.slice(1,3),16)||128,g=parseInt(hex.slice(3,5),16)||128,b=parseInt(hex.slice(5,7),16)||128;return`rgba(${r},${g},${b},${a})`;}

let userData=null,gtaLobbyId=null,pollTimer=null,timerInterval=null,gtaDeadline=0;
let spinAnim=null,angleOff=0,lastStatus=null;

function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className='toast '+t+' show';setTimeout(()=>el.classList.remove('show'),2800);}
async function get(url){return fetch(url).then(r=>r.json());}
async function post(url,d){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json());}
async function loadUser(){const u=await get(`/api/user/${UID}`).catch(()=>null);if(!u)return;userData=u;document.getElementById('r-bal').textContent=u.balance??0;}
async function initUser(){
  if(!UID)return;
  try{
    if(localStorage.getItem('__tl_dev_uid__'))userData=await get(`/api/user/${UID}`).catch(()=>null);
    else{const o=tg.initDataUnsafe.user;userData=await post('/api/ensure_user',{user_id:UID,username:o?.username||'',first_name:o?.first_name||''});}
  }catch(e){userData=await get(`/api/user/${UID}`).catch(()=>null);}
  if(userData)document.getElementById('r-bal').textContent=userData.balance??0;
}
function sgb(v){document.getElementById('gta-inp').value=v;}
function sgbAll(){document.getElementById('gta-inp').value=userData?.balance||0;}

// ── DRAW WHEEL ──
function drawPointer(){} // pointer is a CSS element now, no need to draw

function drawWheel(players,total,winId,off){
  const canvas=document.getElementById('gc');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,cx=W/2,cy=W/2,r=W/2-6;
  ctx.clearRect(0,0,W,W);
  // Base
  ctx.beginPath();ctx.arc(cx,cy,r+5,0,Math.PI*2);ctx.fillStyle='#080812';ctx.fill();

  if(!players.length){
    ctx.fillStyle='#0D0C1A';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    // Empty spokes
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4+(off||0);
      ctx.save();ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(r*.18),cy+Math.sin(a)*(r*.18));
      ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke();ctx.restore();
    }
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.font='12px Exo 2,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Нет ставок',cx,cy);
    drawHub(ctx,cx,cy,r);return;
  }

  let a=-Math.PI/2+(off||0);
  players.forEach((p,i)=>{
    const sl=p.amount/total*Math.PI*2;
    const isW=winId&&String(p.uid)===String(winId);
    const color=COLORS[i%COLORS.length];
    const grad=ctx.createRadialGradient(cx,cy,r*.1,cx,cy,r);
    grad.addColorStop(0,ha(color,.95));grad.addColorStop(1,ha(color,.55));
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+sl);ctx.closePath();ctx.fill();
    // Divider
    ctx.save();ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke();ctx.restore();
    // Winner highlight
    if(isW){
      ctx.save();ctx.globalAlpha=.22;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+sl);ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2.5;ctx.shadowColor='rgba(255,255,255,.7)';ctx.shadowBlur=18;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r-1,a,a+sl);ctx.closePath();ctx.stroke();ctx.restore();
    }
    // Pct label
    if(sl>0.25){
      const ma=a+sl/2;
      ctx.save();ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 11px JetBrains Mono,monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=4;
      ctx.fillText(Math.round(p.amount/total*100)+'%',cx+Math.cos(ma)*(r*.62),cy+Math.sin(ma)*(r*.62));
      ctx.restore();
    }
    a+=sl;
  });

  // Shine overlay
  const shine=ctx.createRadialGradient(cx-r*.18,cy-r*.18,r*.03,cx,cy,r);
  shine.addColorStop(0,'rgba(255,255,255,.1)');shine.addColorStop(.5,'rgba(255,255,255,.02)');shine.addColorStop(1,'rgba(0,0,0,.15)');
  ctx.fillStyle=shine;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  // Gold ring
  ctx.strokeStyle='rgba(255,214,0,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  drawHub(ctx,cx,cy,r);
}

function drawHub(ctx,cx,cy,r){
  const hr=r*.14;
  const hg=ctx.createRadialGradient(cx,cy,0,cx,cy,hr);
  hg.addColorStop(0,'#444');hg.addColorStop(.6,'#1A1A1A');hg.addColorStop(1,'#0A0A0A');
  ctx.beginPath();ctx.arc(cx,cy,hr,0,Math.PI*2);ctx.fillStyle=hg;ctx.fill();
  ctx.strokeStyle='rgba(255,214,0,.35)';ctx.lineWidth=1;ctx.stroke();
  // Simple star/dot in center instead of emoji
  ctx.fillStyle='rgba(255,214,0,0.6)';ctx.beginPath();ctx.arc(cx,cy,hr*.25,0,Math.PI*2);ctx.fill();
}

function sectorAtPointer(players,total,off){
  if(!players||!players.length)return null;
  const ao=typeof off!=='undefined'?off:angleOff;
  const ptr=((-Math.PI/2-ao)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  let a=0;
  for(const p of players){const sl=p.amount/total*Math.PI*2;if(ptr>=a&&ptr<a+sl)return p;a+=sl;}
  return players[players.length-1];
}

function updateWinnerSpot(players,total,off){
  const nameEl=document.getElementById('ws-name'),pctEl=document.getElementById('ws-pct'),dotEl=document.getElementById('ws-dot');
  if(!players||!players.length){if(nameEl)nameEl.textContent='Ждём ставок...';if(pctEl)pctEl.textContent='—';if(dotEl)dotEl.style.background='#555';return;}
  const found=sectorAtPointer(players,total,off);
  if(!found)return;
  const pct=Math.round(found.amount/total*100);
  const color=COLORS[players.indexOf(found)%COLORS.length];
  if(nameEl)nameEl.textContent=found.name||'Игрок';
  if(pctEl)pctEl.textContent=pct+'%';
  if(dotEl){dotEl.style.background=color;dotEl.style.boxShadow='0 0 8px '+color;}
}

function startFree(players,total){
  if(spinAnim){cancelAnimationFrame(spinAnim);spinAnim=null;}
  const SPEED=0.45;
  function frame(){angleOff=(angleOff+SPEED)%(Math.PI*2);drawWheel(players,total,null,angleOff);updateWinnerSpot(players,total,angleOff);spinAnim=requestAnimationFrame(frame);}
  spinAnim=requestAnimationFrame(frame);
}

function calcFinalAngle(players,total,winId){
  // Find where winner sector sits in wheel-local coords
  // Wheel draws sector i starting at: drawAngle + i_start_angle - PI/2
  // Pointer is at top = -PI/2 in world coords
  // For sector center to be at pointer: drawAngle + sector_mid - PI/2 = -PI/2 (mod 2PI)
  // => drawAngle = -sector_mid (mod 2PI)
  let a=0;
  for(const p of players){
    const sl=p.amount/total*Math.PI*2;
    if(String(p.uid)===String(winId)){
      const seed=(parseInt(String(winId).slice(-4))||1234)%1000;
      const frac=(seed/1000)*.7+.15;
      const sectorMid=a+sl*frac;
      // We need: angleOff + sectorMid - PI/2 = -PI/2  => angleOff = -sectorMid
      return((-Math.PI/2-sectorMid)%(Math.PI*2)+Math.PI*4)%(Math.PI*2);
    }
    a+=sl;
  }
  return 0;
}

function spinAndStop(players,total,finalAngle,onDone){
  if(spinAnim){cancelAnimationFrame(spinAnim);spinAnim=null;}
  const START=angleOff,PI2=Math.PI*2;
  const delta=((finalAngle-START)%PI2+PI2)%PI2;
  const safeDelta=delta<.3?delta+PI2:delta;
  const TARGET=START+12*PI2+safeDelta;
  const DUR=6200,t0=performance.now();
  function ease(t){return 1-Math.pow(1-t,5);}
  function frame(now){
    const t=Math.min((now-t0)/DUR,1);
    angleOff=START+(TARGET-START)*ease(t);
    drawWheel(players,total,null,angleOff);
    updateWinnerSpot(players,total,angleOff);
    if(t<1){spinAnim=requestAnimationFrame(frame);}
    else{angleOff=TARGET%PI2;spinAnim=null;drawWheel(players,total,null,angleOff);updateWinnerSpot(players,total,angleOff);if(onDone)onDone();}
  }
  spinAnim=requestAnimationFrame(frame);
}

function renderPlayers(players,total,winId){
  const pl=document.getElementById('gta-players');
  document.getElementById('player-count').textContent=players.length+' игрок'+(players.length===1?'':'ов');
  if(!players.length){pl.innerHTML='<div style="color:var(--muted);text-align:center;padding:14px;font-size:13px">Ждём ставок...</div>';document.getElementById('your-chance').textContent='—';return;}
  const sorted=[...players].sort((a,b)=>b.amount-a.amount);
  let yp=0;
  pl.innerHTML=sorted.map(p=>{
    const pct=Math.round(p.amount/total*100);
    const you=p.uid==UID,isWin=winId&&p.uid==winId;
    const color=COLORS[players.indexOf(p)%COLORS.length];
    if(you)yp=pct;
    return`<div class="gp">
      <div class="gp-dot" style="background:${color}"></div>
      <div style="flex:1;min-width:0">
        <div class="gp-name">${p.name||'Игрок'}${you?' <span style="color:var(--muted);font-size:11px">(вы)</span>':''}${isWin?' 🏆':''}</div>
        <div class="gp-bar-row"><div class="gp-bar" style="width:${Math.max(3,pct)}%;background:${color}"></div></div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="gp-bet">${p.amount} 🪙</div>
        <div class="gp-pct">${pct}%</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('your-chance').textContent=yp?yp+'%':'—';
}

function startPoll(){clearTimeout(pollTimer);pollTimer=null;doPoll();}
async function doPoll(){
  try{
    if(!gtaLobbyId){const d=await get('/api/gta/lobby');if(d?.lobby){gtaLobbyId=d.lobby.id;renderGta(d.lobby,d.bets);}else drawWheel([],1,null,0);}
    else{const d=await get(`/api/gta/status/${gtaLobbyId}`);if(!d||d.error){gtaLobbyId=null;drawWheel([],1,null,0);}else{renderGta(d.lobby,d.bets);if(d.lobby.status==='done')return;}}
  }catch(e){}
  pollTimer=setTimeout(doPoll,2000);
}

async function placeGtaBet(){
  const amount=parseInt(document.getElementById('gta-inp').value)||0;
  if(amount<1){toast('Введите ставку!','err');return;}
  await loadUser();
  if(amount>(userData?.balance||0)){toast('Недостаточно монет!','err');return;}
  document.getElementById('gta-btn').disabled=true;
  const res=await post('/api/gta/bet',{user_id:UID,amount}).catch(()=>null);
  document.getElementById('gta-btn').disabled=false;
  if(!res||res.error){toast(res?.error||'Ошибка','err');return;}
  toast(`Ставка ${amount} 🪙 принята!`,'ok');
  if(userData)userData.balance=res.new_balance;
  document.getElementById('r-bal').textContent=res.new_balance??0;
  gtaLobbyId=res.lobby_id;
  if(res.deadline)gtaDeadline=res.deadline*1000;
  clearTimeout(pollTimer);doPoll();
}

function renderGta(lobby,bets){
  document.getElementById('gta-pot').textContent=lobby.pot||0;
  const byUser={};
  bets.forEach(b=>{
    const safe=(b.player_name||`ID${b.user_id}`).replace(/</g,'&lt;');
    if(!byUser[b.user_id])byUser[b.user_id]={uid:b.user_id,name:safe,amount:0};
    byUser[b.user_id].amount+=b.amount;
  });
  const players=Object.values(byUser);
  const total=players.reduce((s,p)=>s+p.amount,0)||1;
  const prevStatus=lastStatus,changed=prevStatus!==lobby.status;
  lastStatus=lobby.status;
  const st=document.getElementById('gta-status'),tw=document.getElementById('t-wrap');

  if(lobby.status==='done'){
    if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
    tw.style.display='none';
    if(changed||(!spinAnim&&prevStatus==='spinning')){
      if(spinAnim){cancelAnimationFrame(spinAnim);spinAnim=null;}
      st.textContent='🎡 Определяем...';
      const fa=calcFinalAngle(players,total,lobby.winner_id);
      spinAndStop(players,total,fa,()=>{
        drawWheel(players,total,lobby.winner_id,angleOff);
        const winPlayer=players.find(p=>String(p.uid)===String(lobby.winner_id));
        const winName=winPlayer?winPlayer.name:'Победитель';
        const isYou=String(lobby.winner_id)===String(UID);
        st.textContent='🏆 '+(isYou?'Вы победили!':winName+' победил!');
        renderPlayers(players,total,lobby.winner_id);
        loadUser();
        let cnt=5;
        const iv=setInterval(()=>{cnt--;st.textContent=`🔄 Перезапуск ${cnt}с`;
          if(cnt<=0){clearInterval(iv);gtaLobbyId=null;lastStatus=null;angleOff=0;clearTimeout(pollTimer);doPoll();}
        },1000);
      });
    }
    return;
  }
  if(lobby.status==='spinning'){
    if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
    tw.style.display='none';st.textContent='🎡 Крутится!';
    if(!spinAnim)startFree(players,total);
    renderPlayers(players,total,null);return;
  }
  if(spinAnim){cancelAnimationFrame(spinAnim);spinAnim=null;angleOff=0;}
  drawWheel(players,total,null,0);updateWinnerSpot(players,total,0);
  renderPlayers(players,total,null);
  if(players.length>=2){
    tw.style.display='block';
    const deadline=(lobby.deadline&&lobby.deadline>Date.now()/1000)?lobby.deadline*1000:(gtaDeadline||Date.now()+15000);
    if(changed||!timerInterval){
      if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
      const tStart=Date.now(),tTotal=Math.max(1000,deadline-tStart);
      timerInterval=setInterval(()=>{
        const now=Date.now(),rem=Math.max(0,Math.ceil((deadline-now)/1000));
        const pct=Math.max(0,Math.min(100,(1-(now-tStart)/tTotal)*100));
        document.getElementById('t-bar').style.width=pct+'%';
        st.textContent=`⏳ ${rem} сек`;
        if(rem<=0){clearInterval(timerInterval);timerInterval=null;}
      },200);
    }
  }else{
    tw.style.display='none';
    if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
    st.textContent=`👥 ${players.length}/2 игроков`;
  }
}

initUser();drawWheel([],1,null,0);startPoll();
</script>
