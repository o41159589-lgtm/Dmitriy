<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TopLuck</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;}
</style>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script src="shared.js" defer></script>
</head>
<body>
<div id="eyes-loading"></div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  // ── DEV IMPERSONATION (original logic preserved) ──
  (function(){
    try{
      const _devUid=localStorage.getItem('__tl_dev_uid__');
      if(!_devUid)return;
      const _uid=parseInt(_devUid);if(!_uid)return;
      const tg=window.Telegram?.WebApp;if(!tg)return;
      if(!tg.initDataUnsafe)tg.initDataUnsafe={};
      if(!tg.initDataUnsafe.user)tg.initDataUnsafe.user={};
      tg.initDataUnsafe.user.id=_uid;
    }catch(_){}
  })();

  const tgApp=window.Telegram?.WebApp;
  if(tgApp){
    tgApp.setBackgroundColor?.('#000000');
    tgApp.setHeaderColor?.('#000000');
    tgApp.expand();
    tgApp.ready();
  }

  const eyesEl=document.getElementById('eyes-loading');
  if(eyesEl && typeof TL_mountEyesLoader==='function'){
    TL_mountEyesLoader(eyesEl,{width:200,height:120,eyeR:30,pupilR:12,pupilColor:'#000',dotColor:'#FFD400'});
  }

  const _tgUser=tgApp?.initDataUnsafe?.user;
  const _hasRealInitData=tgApp?.initData&&tgApp.initData.length>0;
  if(_hasRealInitData){
    try{localStorage.removeItem('__tl_dev_uid__');localStorage.removeItem('__tl_dev_debug__');}catch(_){}
  }
  if(!_tgUser||!_tgUser.id) window.location.replace('not_telegram.html');
  try{if(_tgUser?.id)sessionStorage.setItem('__tl_uid__',String(_tgUser.id));}catch(_){}

  // Show the loop briefly, then hand off to main.html
  setTimeout(()=>{ window.location.href='main.html'; }, 900);
});
</script>
</body>
</html>
