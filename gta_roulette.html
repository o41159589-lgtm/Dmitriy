<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ГТА Рулетка — TopLuck</title>

<script src="shared.js"></script>
<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})()</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--text:#F2F2F2;--muted:#9B9B9B;--green:#4ADE80;--red:#FF6B7F;--gold:#FFC94D}
html,body{background:linear-gradient(175deg,#000000 0%,#050505 28%,#0A0A0A 55%,#0E0E0E 100%) fixed;color:var(--text);font-family:'Nunito',sans-serif;min-height:100%;overflow-x:hidden}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;background:rgba(14,14,14,0.97);box-shadow:0 2px 14px rgba(0,0,0,0.33)}
.fp-back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.13);display:flex;align-items:center;justify-content:center;color:#F2F2F2;font-size:22px;cursor:pointer;font-weight:700}
.fp-title{font-size:16px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(14,14,14,0.97);border:2px solid #FFD028;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:800;color:#FFC94D}
.toast{position:fixed;top:80px;left:14px;right:14px;z-index:500;background:rgba(14,14,14,0.97);border:1.5px solid rgba(255,255,255,0.11);box-shadow:0 6px 24px rgba(0,0,0,0.45);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-140%);opacity:0;transition:.3s}
.toast.show{transform:none;opacity:1}.toast.ok{color:var(--green)}.toast.err{color:var(--red)}
.page{position:relative;z-index:1;padding:12px 14px 30px;max-width:520px;margin:0 auto}

/* ── HERO ── */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:16px 16px 18px;margin-bottom:12px;color:#fff;
  border:3px solid rgba(255,255,255,.13);box-shadow:0 14px 34px rgba(0,0,0,0.70);
  background:radial-gradient(110% 80% at 50% 0%,#2B2B2B 0%,#141414 45%,#050505 100%)}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 15% 20%,rgba(255,208,40,.16),transparent 38%),radial-gradient(circle at 85% 70%,rgba(120,90,255,.22),transparent 42%)}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.pot-box{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);border-radius:16px;padding:8px 14px}
.pot-ico{font-size:24px}
.pot-lbl{font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.6)}
.pot-val{font-size:24px;font-weight:900;line-height:1.1;color:#FFD84D;text-shadow:0 2px 14px rgba(255,200,40,.45)}
.pot-val.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.12)}}
.status-badge{font-size:12px;font-weight:900;padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);white-space:nowrap}

.wheel-stage{position:relative;width:min(76vw,300px);aspect-ratio:1;margin:14px auto 12px}
.ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.06),0 0 46px rgba(255,200,40,.28),0 18px 40px rgba(0,0,0,.45)}
#gc{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;transform-origin:50% 50%;will-change:transform}
.g-ptr{position:absolute;left:50%;top:-12px;width:30px;height:38px;margin-left:-15px;z-index:5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.g-ptr::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#FFF3B0,#FFC400 55%,#E09A00);clip-path:polygon(50% 100%,0 20%,15% 0,85% 0,100% 20%)}
.hub{position:absolute;left:50%;top:50%;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:4;
  background:radial-gradient(circle at 35% 30%,#FFF3B0 0%,#FFC400 38%,#B87A00 100%);box-shadow:0 0 0 5px #0E1330,0 6px 16px rgba(0,0,0,.5)}
.hub::after{content:'🎲';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,5.5vw,22px)}

.winner-spot{position:relative;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 14px}
.ws-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.ws-lbl{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.55)}
.ws-name{font-size:15px;font-weight:800;max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-pct{font-size:22px;font-weight:900;color:#FFD84D}
.timer-wrap{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:12px}
.timer-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,#FFD84D,#FF8A2E);transition:width .2s linear}
.cf{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;z-index:9;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),420px) rotate(720deg);opacity:0}}

/* ── карточки ── */
.bets-card,.bet-card,.rules-card{background:rgba(14,14,14,0.96);border:2px solid rgba(255,255,255,.13);border-radius:22px;box-shadow:0 5px 20px rgba(0,0,0,0.33);padding:14px;margin-bottom:12px}
.bets-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stag{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.pcnt{font-size:11px;font-weight:800;color:#7DB8FF;background:rgba(32,96,176,.1);border-radius:99px;padding:4px 10px}
.gp{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;margin-bottom:6px;border:1.5px solid transparent;transition:.2s}
.gp.you{background:rgba(255,208,40,.14);border-color:rgba(255,196,0,.5)}
.gp.win{background:rgba(26,154,80,.12);border-color:rgba(26,154,80,.45)}
.gp-av{width:36px;height:36px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.gp-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp-bar-row{height:6px;border-radius:99px;background:rgba(255,255,255,0.09);margin-top:5px;overflow:hidden}
.gp-bar{height:100%;border-radius:99px;transition:width .5s}
.gp-bet{font-size:13px;font-weight:900}.gp-pct{font-size:11px;font-weight:800;color:var(--muted)}
.your-badge{margin-top:8px;text-align:center;font-size:12px;font-weight:800;color:var(--muted);background:rgba(255,255,255,0.06);border-radius:12px;padding:8px}
.bet-inp{background:rgba(14,14,14,0.92);border:1.5px solid rgba(255,255,255,0.14);border-radius:12px;padding:10px 14px;color:#F2F2F2;font-family:inherit;font-weight:800;font-size:18px;outline:none;text-align:center;width:100%;margin-bottom:10px}
.bet-inp:focus{border-color:rgba(40,100,220,.4)}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qb{padding:7px 12px;background:rgba(14,14,14,0.89);border:1.5px solid rgba(255,255,255,0.13);font-weight:700;font-size:11px;border-radius:10px;cursor:pointer}
.qb:active{background:rgba(255,255,255,0.11)}
.bet-btn{width:100%;padding:16px;font-family:inherit;font-size:20px;font-weight:900;letter-spacing:.5px;border-radius:18px;border:none;color:#3A2A00;cursor:pointer;
  background:linear-gradient(180deg,#FFE05A 0%,#FFB800 100%);border-bottom:4px solid #C98A00;box-shadow:0 8px 20px rgba(230,160,0,.4);transition:transform .08s}
.bet-btn:active{transform:translateY(3px);border-bottom-width:1px}.bet-btn:disabled{opacity:.6}
.rules-card summary{cursor:pointer;list-style:none;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.rules-card summary::-webkit-details-marker{display:none}
.rule-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:13px;font-weight:700}
.rule-row:last-child{border:0}.rule-l{color:var(--muted)}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="topbar">
  <button class="fp-back" onclick="location.href='main.html?tab=games'">‹</button>
  <div class="fp-title">GTA рулетка</div>
  <div class="bal-chip"><img src="textures/coin.svg" width="20" height="20" alt="" style="vertical-align:middle;margin-right:2px"> <span id="r-bal">—</span></div>
</div>

<div class="page">
  <section class="hero">
    <div class="hero-top">
      <div class="pot-box"><span class="pot-ico">💰</span><div><div class="pot-lbl">банк</div><div class="pot-val"><span id="gta-pot">0</span> 🪙</div></div></div>
      <div class="status-badge" id="gta-status">Ждём…</div>

    <div class="wheel-stage">
      <div class="g-ptr"></div>

      <div class="hub"></div>
    </div>
    <div class="winner-spot">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <div class="ws-dot" id="ws-dot" style="background:#555"></div>
        <div style="min-width:0"><div class="ws-lbl">побеждает</div><div class="ws-name" id="ws-name">Ждём ставок…</div></div>
      </div>
      <div class="ws-pct" id="ws-pct">—</div>
    </div>
    <div class="timer-wrap" id="t-wrap" style="display:none"><div class="timer-bar" id="t-bar" style="width:100%"></div></div>
  </section>

  <div class="bet-card">
    <div class="stag" style="margin-bottom:10px">// ваша ставка</div>

    <div class="qb-row">
      <div class="qb" onclick="sgb(10)">10</div><div class="qb" onclick="sgb(50)">50</div>
      <div class="qb" onclick="sgb(100)">100</div><div class="qb" onclick="sgb(250)">250</div>
      <div class="qb" onclick="sgb(500)">500</div><div class="qb" onclick="sgbAll()">MAX</div>
    </div>
    <button class="bet-btn" id="gta-btn" onclick="placeGtaBet()">🎲 ПОСТАВИТЬ</button>
  </div>

  <div class="bets-card">
    <div class="bets-hd"><span class="stag">🎲 ставки</span><div class="pcnt" id="player-count">0 игроков</div></div>
    <div id="gta-players"><div style="color:var(--muted);text-align:center;padding:14px;font-size:13px">Ждём ставок…</div></div>
    <div class="your-badge">Твой шанс: <span id="your-chance" style="color:#F2F2F2">—</span></div>
  </div>

  <details class="rules-card">
    <summary>📋 правила</summary>
    <div class="rule-row" style="margin-top:8px"><span class="rule-l">Мин. игроков</span><span>2</span></div>
    <div class="rule-row"><span class="rule-l">Комиссия</span><span>3–8%</span></div>
    <div class="rule-row"><span class="rule-l">Отсчёт</span><span>15 сек</span></div>
    <div class="rule-row"><span class="rule-l">Шанс победы</span><span>= доля ставки</span></div>
  </details>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
const UID=tg?.initDataUnsafe?.user?.id||0;
TL_startBanPoll(UID);

// Яркая насыщенная палитра. Цвет игрока = порядок его первой ставки в раунде, поэтому он не меняется.
const COLORS=['#FF2D55','#1E90FF','#FFC400','#00E676','#B400FF','#FF6D00','#00E5FF','#FF3DAE','#8BFF1A','#536DFE','#FFE600','#FF5252'];
function lighten(hex,amt){const n=h=>Math.min(255,Math.round(parseInt(h,16)+(255-parseInt(h,16))*amt));
  return `rgb(${n(hex.slice(1,3))},${n(hex.slice(3,5))},${n(hex.slice(5,7))})`;}
function ha(hex,a){const r=parseInt(hex.slice(1,3),16)||128,g=parseInt(hex.slice(3,5),16)||128,b=parseInt(hex.slice(5,7),16)||128;return`rgba(${r},${g},${b},${a})`;}

let userData=null,gtaLobbyId=null,pollTimer=null,timerInterval=null,gtaDeadline=0;
let spinAnim=null,angleOff=0,lastStatus=null;

function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className='toast '+t+' show';setTimeout(()=>el.classList.remove('show'),2800);}
async function get(url){return fetch(url).then(r=>r.json());}
async function post(url,d){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json());}
async function loadUser(){const u=await get(`/api/user/${UID}`).catch(()=>null);if(!u)return;if(TL_guardBanned(u))return;userData=u;document.getElementById('r-bal').textContent=u.balance??0;}
async function initUser(){
  if(!UID)return;
  try{
    if(localStorage.getItem('__tl_dev_uid__'))userData=await get(`/api/user/${UID}`).catch(()=>null);
    else{const o=tg.initDataUnsafe.user;userData=await post('/api/ensure_user',{user_id:UID,username:o?.username||'',first_name:o?.first_name||''});}
  }catch(e){userData=await get(`/api/user/${UID}`).catch(()=>null);}
  if(userData)document.getElementById('r-bal').textContent=userData.balance??0;
}
function sgb(v){document.getElementById('gta-inp').value=v;}
function sgbAll(){document.getElementById('gta-inp').value=userData?.balance||0;}

// ── DRAW WHEEL ──
function drawPointer(){}
// Колесо рисуется ОДИН раз (в статике) и дальше только вращается CSS-transform'ом — плавно и без нагрузки на CPU.
function rot(a){const c=document.getElementById('gc');if(c)c.style.transform='rotate('+a+'rad)';}
function drawHub(){}
function drawWheel(players,total,winId,off){
  const canvas=document.getElementById('gc');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,cx=W/2,cy=W/2,r=W/2-W*.035,k=W/300;
  ctx.clearRect(0,0,W,W);
  // подложка колеса
  ctx.beginPath();ctx.arc(cx,cy,r+W*.02,0,Math.PI*2);ctx.fillStyle='#0E1330';ctx.fill();
  if(!players.length){
    const g=ctx.createRadialGradient(cx,cy,r*.1,cx,cy,r);g.addColorStop(0,'#2A3270');g.addColorStop(1,'#151B47');
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    for(let i=0;i<12;i++){const a=i*Math.PI/6;ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1.5*k;
      ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r*.2,cy+Math.sin(a)*r*.2);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke();}
    ctx.fillStyle='rgba(255,255,255,.45)';ctx.font='800 '+Math.round(15*k)+"px Nunito,sans-serif";
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Ждём ставки',cx,cy+r*.42);
    studs(ctx,cx,cy,r,k);return;
  }
  let a=-Math.PI/2;
  players.forEach((p,i)=>{
    const sl=p.amount/total*Math.PI*2;
    const isW=winId&&String(p.uid)===String(winId);
    const color=COLORS[i%COLORS.length];
    const grad=ctx.createRadialGradient(cx,cy,r*.15,cx,cy,r);
    grad.addColorStop(0,lighten(color,.38));grad.addColorStop(.55,color);grad.addColorStop(1,color);
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+sl);ctx.closePath();ctx.fill();
    if(players.length>1){ctx.strokeStyle='rgba(10,14,40,.55)';ctx.lineWidth=2.5*k;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke();}
    if(isW){
      ctx.save();ctx.globalAlpha=.3;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+sl);ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=4*k;ctx.shadowColor='#fff';ctx.shadowBlur=22*k;
      ctx.beginPath();ctx.arc(cx,cy,r-2*k,a,a+sl);ctx.stroke();ctx.restore();
    }
    if(sl>0.28){
      const ma=a+sl/2;
      ctx.save();ctx.translate(cx+Math.cos(ma)*r*.66,cy+Math.sin(ma)*r*.66);ctx.rotate(ma+Math.PI/2);
      ctx.fillStyle='#fff';ctx.font='900 '+Math.round(17*k)+"px Nunito,sans-serif";
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=5*k;
      ctx.fillText(Math.round(p.amount/total*100)+'%',0,0);ctx.restore();
    }
    a+=sl;
  });
  // стеклянный блик
  const sh=ctx.createRadialGradient(cx-r*.3,cy-r*.35,r*.05,cx,cy,r);
  sh.addColorStop(0,'rgba(255,255,255,.28)');sh.addColorStop(.5,'rgba(255,255,255,.04)');sh.addColorStop(1,'rgba(0,0,0,.06)');
  ctx.fillStyle=sh;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  studs(ctx,cx,cy,r,k);
}
function studs(ctx,cx,cy,r,k){
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='#FFD028';ctx.lineWidth=5*k;ctx.stroke();
  for(let i=0;i<24;i++){const a=i*Math.PI/12;
    ctx.beginPath();ctx.arc(cx+Math.cos(a)*(r+1*k),cy+Math.sin(a)*(r+1*k),2.4*k,0,Math.PI*2);
    ctx.fillStyle=i%2?'#FFF3B0':'#FFC400';ctx.fill();}
}

function sectorAtPointer(players,total,off){
  if(!players||!players.length)return null;
  const ao=typeof off!=='undefined'?off:angleOff;
  const ptr=((-Math.PI/2-ao)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  let a=0;
  for(const p of players){const sl=p.amount/total*Math.PI*2;if(ptr>=a&&ptr<a+sl)return p;a+=sl;}
  return players[players.length-1];
}

function updateWinnerSpot(players,total,off){
  const nameEl=document.getElementById('ws-name'),pctEl=document.getElementById('ws-pct'),dotEl=document.getElementById('ws-dot');
  if(!players||!players.length){if(nameEl)nameEl.textContent='Ждём ставок...';if(pctEl)pctEl.textContent='—';if(dotEl)dotEl.style.background='#555';return;}
  const found=sectorAtPointer(players,total,off);
  if(!found)return;
  const pct=Math.round(found.amount/total*100);
  const color=COLORS[players.indexOf(found)%COLORS.length];
  if(nameEl)nameEl.textContent=found.name||'Игрок';
  if(pctEl)pctEl.textContent=pct+'%';
  if(dotEl){dotEl.style.background=color;dotEl.style.boxShadow='0 0 8px '+color;}
}

function startFree(players,total){
  if(spinAnim){cancelAnimationFrame(spinAnim);spinAnim=null;}
  const SPEED=0.45;
  drawWheel(players,total,null,0);
  function frame(){angleOff=(angleOff+SPEED)%(Math.PI*2);rot(angleOff);updateWinnerSpot(players,total,angleOff);spinAnim=requestAnimationFrame(frame);}
  spinAnim=requestAnimationFrame(frame);
}

function calcFinalAngle(players,total,winId){
  // Find where winner sector sits in wheel-local coords
  // Wheel draws sector i starting at: drawAngle + i_start_angle - PI/2
  // Pointer is at top = -PI/2 in world coords
  // For sector center to be at pointer: drawAngle + sector_mid - PI/2 = -PI/2 (mod 2PI)
  // => drawAngle = -sector_mid (mod 2PI)
  let a=0;
  for(const p of players){
    const sl=p.amount/total*Math.PI*2;
    if(String(p.uid)===String(winId)){
      const seed=(parseInt(String(winId).slice(-4))||1234)%1000;
      const frac=(seed/1000)*.7+.15;
      const sectorMid=a+sl*frac;
      // We need: angleOff + sectorMid - PI/2 = -PI/2  => angleOff = -sectorMid
      return((-Math.PI/2-sectorMid)%(Math.PI*2)+Math.PI*4)%(Math.PI*2);
    }
    a+=sl;
  }
  return 0;
}

function spinAndStop(players,total,finalAngle,onDone){
  if(spinAnim){cancelAnimationFrame(spinAnim);spinAnim=null;}
  drawWheel(players,total,null,0);rot(angleOff);
  const START=angleOff,PI2=Math.PI*2;
  const delta=((finalAngle-START)%PI2+PI2)%PI2;
  const safeDelta=delta<.3?delta+PI2:delta;
  const TARGET=START+12*PI2+safeDelta;
  const DUR=6200,t0=performance.now();
  const ease=t=>1-Math.pow(1-t,5);
  const angleAt=t=>START+(TARGET-START)*ease(t);
  const wheel=document.getElementById('gc');
  let anim=null,finished=false;
  if(wheel.animate){                     // вращение на композиторе: прокрутка страницы его не ломает
    const fr=[];for(let i=0;i<=140;i++)fr.push({transform:'rotate('+angleAt(i/140)+'rad)'});
    anim=wheel.animate(fr,{duration:DUR,easing:'linear',fill:'forwards'});
  }
  function finish(){
    if(finished)return;finished=true;
    if(spinAnim){cancelAnimationFrame(spinAnim);spinAnim=null;}
    angleOff=TARGET%PI2;rot(angleOff);
    if(anim){try{anim.cancel();}catch(e){}}
    updateWinnerSpot(players,total,angleOff);if(onDone)onDone();
  }
  function frame(){
    if(finished)return;
    const el=(anim&&anim.currentTime!=null)?Number(anim.currentTime):performance.now()-t0;
    const t=Math.min(el/DUR,1);
    angleOff=angleAt(t);
    if(!anim)rot(angleOff);
    updateWinnerSpot(players,total,angleOff);
    if(t<1){spinAnim=requestAnimationFrame(frame);return;}
    finish();
  }
  spinAnim=requestAnimationFrame(frame);
  if(anim)anim.finished.then(finish).catch(()=>{});
}

function renderPlayers(players,total,winId){
  const pl=document.getElementById('gta-players');
  document.getElementById('player-count').textContent=players.length+' игрок'+(players.length===1?'':'ов');
  if(!players.length){pl.innerHTML='<div style="color:var(--muted);text-align:center;padding:14px;font-size:13px">Ждём ставок...</div>';document.getElementById('your-chance').textContent='—';return;}
  const sorted=[...players].sort((a,b)=>b.amount-a.amount);
  let yp=0;
  pl.innerHTML=sorted.map(p=>{
    const pct=Math.round(p.amount/total*100);
    const you=p.uid==UID,isWin=winId&&p.uid==winId;
    const color=COLORS[players.indexOf(p)%COLORS.length];
    if(you)yp=pct;
    return`<div class="gp${you?' you':''}${isWin?' win':''}">
      <div class="gp-av" style="background:${color}">${(p.name||'?').trim().charAt(0).toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div class="gp-name">${p.name||'Игрок'}${you?' <span style="color:var(--muted);font-size:11px">(вы)</span>':''}${isWin?' 🏆':''}</div>
        <div class="gp-bar-row"><div class="gp-bar" style="width:${Math.max(3,pct)}%;background:${color}"></div></div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="gp-bet">${p.amount} 🪙</div>
        <div class="gp-pct">${pct}%</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('your-chance').textContent=yp?yp+'%':'—';
}

function startPoll(){clearTimeout(pollTimer);pollTimer=null;doPoll();}
async function doPoll(){
  try{
    if(!gtaLobbyId){const d=await get('/api/gta/lobby');if(d?.lobby){gtaLobbyId=d.lobby.id;renderGta(d.lobby,d.bets);}else drawWheel([],1,null,0);}
    else{const d=await get(`/api/gta/status/${gtaLobbyId}`);if(!d||d.error){gtaLobbyId=null;drawWheel([],1,null,0);}else{renderGta(d.lobby,d.bets);if(d.lobby.status==='done')return;}}
  }catch(e){}
  pollTimer=setTimeout(doPoll,2000);
}

async function placeGtaBet(){
  const amount=parseInt(document.getElementById('gta-inp').value)||0;
  if(amount<1){toast('Введите ставку!','err');return;}
  await loadUser();
  if(amount>(userData?.balance||0)){toast('Недостаточно монет!','err');return;}
  document.getElementById('gta-btn').disabled=true;
  const res=await post('/api/gta/bet',{user_id:UID,amount}).catch(()=>null);
  document.getElementById('gta-btn').disabled=false;
  if(!res||res.error){toast(res?.error||'Ошибка','err');return;}
  toast(`Ставка ${amount} 🪙 принята!`,'ok');
  if(userData)userData.balance=res.new_balance;
  document.getElementById('r-bal').textContent=res.new_balance??0;
  gtaLobbyId=res.lobby_id;
  if(res.deadline)gtaDeadline=res.deadline*1000;
  clearTimeout(pollTimer);doPoll();
}

function renderGta(lobby,bets){
  animPot(lobby.pot||0);
  const byUser=new Map();
  [...bets].sort((x,y)=>(x.id||0)-(y.id||0)).forEach(b=>{
    const safe=(b.player_name||`ID${b.user_id}`).replace(/</g,'&lt;');
    if(!byUser.has(b.user_id))byUser.set(b.user_id,{uid:b.user_id,name:safe,amount:0});
    byUser.get(b.user_id).amount+=b.amount;
  });
  const players=[...byUser.values()];
  const total=players.reduce((s,p)=>s+p.amount,0)||1;
  const prevStatus=lastStatus,changed=prevStatus!==lobby.status;
  lastStatus=lobby.status;
  const st=document.getElementById('gta-status'),tw=document.getElementById('t-wrap');

  if(lobby.status==='done'){
    if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
    tw.style.display='none';
    if(changed||(!spinAnim&&prevStatus==='spinning')){
      if(spinAnim){cancelAnimationFrame(spinAnim);spinAnim=null;}
      st.textContent='🎡 Определяем...';
      const fa=calcFinalAngle(players,total,lobby.winner_id);
      spinAndStop(players,total,fa,()=>{
        drawWheel(players,total,lobby.winner_id,0);
        const winPlayer=players.find(p=>String(p.uid)===String(lobby.winner_id));
        const winName=winPlayer?winPlayer.name:'Победитель';
        const isYou=String(lobby.winner_id)===String(UID);
        st.textContent='🏆 '+(isYou?'Вы победили!':winName+' победил!');
        if(isYou)confetti();
        renderPlayers(players,total,lobby.winner_id);
        loadUser();
        let cnt=5;
        const iv=setInterval(()=>{cnt--;st.textContent=`🔄 Перезапуск ${cnt}с`;
          if(cnt<=0){clearInterval(iv);gtaLobbyId=null;lastStatus=null;angleOff=0;clearTimeout(pollTimer);doPoll();}
        },1000);
      });
    }
    return;
  }
  if(lobby.status==='spinning'){
    if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
    tw.style.display='none';st.textContent='🎡 Крутится!';
    if(!spinAnim)startFree(players,total);
    renderPlayers(players,total,null);return;
  }
  if(spinAnim){cancelAnimationFrame(spinAnim);spinAnim=null;}
  angleOff=0;rot(0);drawWheel(players,total,null,0);updateWinnerSpot(players,total,0);
  renderPlayers(players,total,null);
  if(players.length>=2){
    tw.style.display='block';
    const deadline=(lobby.deadline&&lobby.deadline>Date.now()/1000)?lobby.deadline*1000:(gtaDeadline||Date.now()+15000);
    if(changed||!timerInterval){
      if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
      const tStart=Date.now(),tTotal=Math.max(1000,deadline-tStart);
      timerInterval=setInterval(()=>{
        const now=Date.now(),rem=Math.max(0,Math.ceil((deadline-now)/1000));
        const pct=Math.max(0,Math.min(100,(1-(now-tStart)/tTotal)*100));
        document.getElementById('t-bar').style.width=pct+'%';
        st.textContent=`⏳ ${rem} сек`;
        if(rem<=0){clearInterval(timerInterval);timerInterval=null;}
      },200);
    }
  }else{
    tw.style.display='none';
    if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
    st.textContent=`👥 ${players.length}/2 игроков`;
  }
}

let potShown=0,potAnim=null;
function animPot(v){
  const el=document.getElementById('gta-pot');if(v===potShown)return;
  const from=potShown,t0=performance.now();potShown=v;cancelAnimationFrame(potAnim);
  (function step(n){const t=Math.min(1,(n-t0)/600);el.textContent=Math.round(from+(v-from)*(1-Math.pow(1-t,3)));
    if(t<1)potAnim=requestAnimationFrame(step);})(t0);
  el.parentElement.classList.remove('bump');void el.offsetWidth;el.parentElement.classList.add('bump');
}
function confetti(){
  const host=document.querySelector('.hero');if(!host)return;
  for(let i=0;i<46;i++){const d=document.createElement('i');d.className='cf';
    d.style.left=Math.random()*100+'%';d.style.background=COLORS[i%COLORS.length];
    d.style.animationDelay=(Math.random()*.5)+'s';d.style.setProperty('--dx',(Math.random()*120-60)+'px');
    host.appendChild(d);setTimeout(()=>d.remove(),3200);}
}
initUser();drawWheel([],1,null,0);startPoll();
