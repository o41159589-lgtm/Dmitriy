<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--bg:#0A0A0A;--bg2:#111;--bg3:#1A1A1A;--white:#FFF;--gray1:#E0E0E0;--gray2:#AAA;--gray3:#555;--green:#22C55E;--red:#EF4444;--gold:#F59E0B;--blue:#3B82F6;--purple:#8B5CF6;--cyan:#06B6D4;--text:#F0F0F0;--muted:#777;--muted2:#999;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.12);--font-display:'Bebas Neue',sans-serif;--font-ui:'Exo 2',sans-serif;--font-mono:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}
.lbg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 55% 35% at 50% 0%,rgba(255,255,255,.02) 0%,transparent 60%);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;position:sticky;top:0;z-index:50;background:rgba(10,10,10,.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.fp-back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:22px;cursor:pointer;font-weight:700;}
.fp-title{font-family:var(--font-display);font-size:20px;color:var(--white);letter-spacing:1px;}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);border-radius:12px;padding:7px 12px;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--gold);}
.toast{position:fixed;top:14px;left:14px;right:14px;z-index:500;background:rgba(20,20,20,.97);border:1px solid var(--border2);backdrop-filter:blur(20px);border-radius:16px;padding:13px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-80px);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.toast.show{transform:translateY(0);}
.toast.ok{color:var(--green);border-color:rgba(34,197,94,.3);}
.toast.err{color:var(--red);border-color:rgba(239,68,68,.3);}
.toast.info{color:var(--gray1);border-color:var(--border2);}
.page-wrap{padding:12px 14px 32px;}
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;}
.sc-lbl{font-family:var(--font-mono);font-size:10px;color:var(--muted2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.bet-inp{background:rgba(0,0,0,.45);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;color:var(--white);font-family:var(--font-mono);font-size:18px;flex:1;outline:none;text-align:center;width:100%;}
.bet-inp:focus{border-color:rgba(255,255,255,.3);}
.bet-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;}
.qb{padding:7px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;font-size:11px;color:var(--gray2);font-weight:700;cursor:pointer;font-family:var(--font-mono);transition:all .12s;}
.qb:active{background:rgba(255,255,255,.12);color:var(--white);}
.main-btn{width:100%;padding:15px;background:var(--white);border:none;border-radius:14px;color:#000;font-family:var(--font-display);font-size:20px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 20px rgba(255,255,255,.12);transition:opacity .15s,transform .1s;}
.main-btn:active{transform:scale(.98);opacity:.9;}
.main-btn:disabled{opacity:.3;cursor:not-allowed;}
.cashout-btn{background:var(--green);color:#000;box-shadow:0 4px 20px rgba(34,197,94,.3);animation:cashPulse 1.4s ease-in-out infinite;}
@keyframes cashPulse{0%,100%{box-shadow:0 4px 20px rgba(34,197,94,.3);}50%{box-shadow:0 4px 28px rgba(34,197,94,.6),0 0 0 3px rgba(34,197,94,.1);}}
.live-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.ls{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;}
.ls-l{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-family:var(--font-mono);}
.ls-v{font-family:var(--font-mono);font-size:15px;font-weight:700;}
.result-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.85);backdrop-filter:blur(24px);display:none;align-items:center;justify-content:center;}
.result-ov.show{display:flex;}

.r-amount.win{color:var(--green);}

/* STATUS + TIMER */

/* SECTION */

/* PLAYERS */
.gp-row{display:flex;align-items:center;gap:10px;padding:9px 12px;

  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* BET ROW */
.bet-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.bet-lbl{color:var(--muted2);font-size:13px;white-space:nowrap;font-weight:600;
  font-family:var(--font-mono);}
.bet-inp{flex:1;background:rgba(0,0,0,.45);border:1px solid var(--border2);
  border-radius:12px;padding:10px 12px;color:var(--white);
  font-family:var(--font-mono);font-size:16px;outline:none;text-align:center;width:0;}
.bet-inp:focus{border-color:rgba(255,255,255,.3);}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.qb{flex:1;min-width:44px;padding:8px 4px;background:var(--card);
  border:1px solid var(--border);border-radius:9px;font-size:11px;

  font-family:var(--font-mono);transition:all .15s;}
.qb:active{background:rgba(255,255,255,.1);color:var(--white);}
.gta-bet-btn{width:100%;padding:15px;background:var(--purple);border:none;
  border-radius:14px;color:#fff;font-family:var(--font-display);
  font-size:20px;letter-spacing:1px;cursor:pointer;
  box-shadow:0 4px 20px rgba(139,92,246,.35);transition:opacity .15s,transform .1s;}
.gta-bet-btn:active{transform:scale(.98);opacity:.9;}
.gta-bet-btn:disabled{opacity:.3;cursor:not-allowed;}

/* RULES CARD */
.info-row{display:flex;align-items:center;justify-content:space-between;

.info-row:last-child{border-bottom:none;}

.info-r{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--text);}

  border-bottom:1px solid var(--border);}

.card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;margin-bottom:12px;position:relative;}

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
const UID = tg?.initDataUnsafe?.user?.id || 0;
const GTA_COLORS = [
  '#FF2D55', // vivid red/pink
  '#00FF94', // neon green
  '#00C8FF', // electric blue
  '#FFD700', // bright gold
  '#BF5FFF', // vivid purple
  '#FF6B00', // bright orange
  '#00FFD1', // cyan
  '#FF3CAC', // hot pink
  '#AAFF00', // lime
  '#FF4757', // coral red
];
// Helper: hex color → rgba string. alpha is 0–1
function hexAlpha(hex, alpha){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

let userData = null;
let gtaLobbyId = null;
let gtaPollTimer = null;
let gtaTimerInterval = null;
let gtaDeadline = 0;
let gtaSpinAnim = null;
let gtaAngleOffset = 0;
let lastLobbyStatus = null;

// ── TOAST ──
function toast(m,t='info'){
  const el=document.getElementById('toast');
  el.textContent=m;el.className='toast '+t;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}

// ── API ──
async function get(url){const r=await fetch(url);return r.json();}
async function post(url,d){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  return r.json();
}

async function loadUser(){
  if(!UID)return;
  userData = await get(`/api/user/${UID}`).catch(()=>null);
  if(userData) document.getElementById('r-bal').textContent = userData.balance??0;
}

async function initUser(){
  if(!UID)return;
  const _isDevMode = !!localStorage.getItem('__tl_dev_uid__');
  try {
    if(_isDevMode){
      // Dev-режим: только читаем, не перезаписываем имя/username администратора
      userData = await get(`/api/user/${UID}`).catch(()=>null);
    } else {
      const tgObj = window.Telegram?.WebApp;
      const username   = tgObj?.initDataUnsafe?.user?.username || '';
      const first_name = tgObj?.initDataUnsafe?.user?.first_name || '';
      userData = await post('/api/ensure_user',{user_id:UID,username,first_name});
    }
  } catch(e) {
    userData = await get(`/api/user/${UID}`).catch(()=>null);
  }
  if(userData) document.getElementById('r-bal').textContent = userData.balance??0;
}

// ── BET ──
function sgb(v){document.getElementById('gta-inp').value=v;}
function sgbAll(){document.getElementById('gta-inp').value=userData?.balance||0;}

// ── WHEEL DRAW ──
function drawPointer(ctx,cx,cy,r){
  const tipY=cy-r+1, baseY=tipY-20, hw=12;
  ctx.save();
  ctx.shadowColor='rgba(255,255,255,0.9)';ctx.shadowBlur=16;
  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.moveTo(cx,tipY);ctx.lineTo(cx-hw,baseY);ctx.lineTo(cx+hw,baseY);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
}

function drawGtaWheel(players, total, winnerId, off){
  const canvas=document.getElementById('gta-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,r=W/2-8;
  ctx.clearRect(0,0,W,H);

  // Dark background with subtle glow
  ctx.save();
  ctx.shadowColor='rgba(120,60,255,0.4)';ctx.shadowBlur=30;
  ctx.fillStyle='#06060f';
  ctx.beginPath();ctx.arc(cx,cy,r+6,0,Math.PI*2);ctx.fill();
  ctx.restore();

  if(!players.length){
    // Empty wheel: draw decorative ring
    const emptyGrad = ctx.createConicalGradient ? null : null;
    ctx.fillStyle='#12122a';
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    // Colored ring segments for empty state
    const emptyColors=['#FF2D5544','#00FF9444','#00C8FF44','#FFD70044','#BF5FFF44','#FF6B0044'];
    for(let i=0;i<6;i++){
      const sa=i*(Math.PI*2/6)-Math.PI/2;
      const ea=sa+Math.PI*2/6;
      ctx.save();
      ctx.fillStyle=emptyColors[i];
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle='rgba(100,100,160,0.6)';ctx.font='bold 13px Rajdhani,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Нет ставок',cx,cy);
    drawPointer(ctx,cx,cy,r);return;
  }

  const angleOff = off||0;
  let a=-Math.PI/2+angleOff;
  players.forEach((p,i)=>{
    const sl=p.amount/total*Math.PI*2;
    const isW=winnerId&&String(p.uid)===String(winnerId);
    const color=GTA_COLORS[i%GTA_COLORS.length];

    // Main sector fill with gradient
    const grad = ctx.createRadialGradient(cx,cy,r*0.1,cx,cy,r);
    grad.addColorStop(0, color+'cc');
    grad.addColorStop(1, color+'88');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+sl);ctx.closePath();ctx.fill();

    // Bright sector border (divider)
    ctx.save();
    ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke();
    ctx.restore();

    // Outer arc glow for each sector
    ctx.save();
    ctx.strokeStyle=color;ctx.lineWidth=3;
    ctx.shadowColor=color;ctx.shadowBlur=12;
    ctx.globalAlpha=0.7;
    ctx.beginPath();ctx.arc(cx,cy,r-1,a,a+sl);ctx.stroke();
    ctx.restore();

    // Winner highlight
    if(isW){
      ctx.save();ctx.globalAlpha=0.28;ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+sl);ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle='#ffffff';ctx.lineWidth=3;
      ctx.shadowColor='rgba(255,255,255,0.9)';ctx.shadowBlur=20;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r-2,a,a+sl);ctx.closePath();ctx.stroke();
      ctx.restore();
    }

    // Percentage label
    if(sl>0.22){
      const ma=a+sl/2;
      ctx.save();
      ctx.fillStyle='#ffffff';
      ctx.font='bold 12px Rajdhani,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=6;
      ctx.fillText(Math.round(p.amount/total*100)+'%',cx+Math.cos(ma)*(r*0.63),cy+Math.sin(ma)*(r*0.63));
      ctx.restore();
    }
    a+=sl;
  });

  // Inner glow overlay
  const shine=ctx.createRadialGradient(cx-r*0.25,cy-r*0.25,r*0.05,cx,cy,r);
  shine.addColorStop(0,'rgba(255,255,255,0.14)');
  shine.addColorStop(0.4,'rgba(255,255,255,0.03)');
  shine.addColorStop(1,'rgba(0,0,0,0.25)');
  ctx.fillStyle=shine;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();

  // Outer gold ring
  ctx.save();
  ctx.strokeStyle='rgba(245,197,66,0.6)';ctx.lineWidth=2.5;
  ctx.shadowColor='rgba(245,197,66,0.4)';ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  ctx.restore();

  // Center hub
  const cR=r*0.18;
  const hubG=ctx.createRadialGradient(cx-cR*0.4,cy-cR*0.4,cR*0.1,cx,cy,cR);
  hubG.addColorStop(0,'#6060a0');hubG.addColorStop(0.6,'#1a1a30');hubG.addColorStop(1,'#08080f');
  ctx.fillStyle=hubG;ctx.beginPath();ctx.arc(cx,cy,cR,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(245,197,66,0.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,cR,0,Math.PI*2);ctx.stroke();
  ctx.font=`${Math.round(cR*1.1)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🎰',cx,cy+1);

  drawPointer(ctx,cx,cy,r);
}

function calcWinnerAngle(players, total, winnerId){
  let a=0;
  for(let i=0;i<players.length;i++){
    const sl=players[i].amount/total*Math.PI*2;
    if(String(players[i].uid)===String(winnerId)){
      const seed=(parseInt(String(winnerId).slice(-4))||1234)%1000;
      const frac=(seed/1000)*0.7+0.15;
      const target=a+sl*frac;
      return ((-target)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    }
    a+=sl;
  }
  return 0;
}

function startFreeSpinning(players, total){
  if(gtaSpinAnim){cancelAnimationFrame(gtaSpinAnim);gtaSpinAnim=null;}
  // Extremely fast — ~5 rotations/sec, hard to follow
  const SPEED=0.52;
  function frame(){
    gtaAngleOffset=(gtaAngleOffset+SPEED)%(Math.PI*2);
    drawGtaWheel(players,total,null,gtaAngleOffset);
    gtaSpinAnim=requestAnimationFrame(frame);
  }
  gtaSpinAnim=requestAnimationFrame(frame);
}

function spinAndStop(players, total, finalAngle, onDone){
  if(gtaSpinAnim){cancelAnimationFrame(gtaSpinAnim);gtaSpinAnim=null;}
  const START=gtaAngleOffset;
  const EXTRA=12*Math.PI*2; // 12 full rotations — starts blazing, ends at target
  const delta=((finalAngle-START)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  const safeDelta=delta<0.3?delta+Math.PI*2:delta;
  const TARGET=START+EXTRA+safeDelta;
  const DURATION=6000;
  const t0=performance.now();
  // Quintic ease-out: very fast at start, progressively slows to a halt
  function ease(t){ return 1-Math.pow(1-t,5); }
  function frame(now){
    const t=Math.min((now-t0)/DURATION,1);
    gtaAngleOffset=START+(TARGET-START)*ease(t);
    if(t<1){
      drawGtaWheel(players,total,null,gtaAngleOffset);
      gtaSpinAnim=requestAnimationFrame(frame);
    } else {
      gtaAngleOffset=TARGET%(Math.PI*2);
      drawGtaWheel(players,total,null,gtaAngleOffset);
      gtaSpinAnim=null;
      if(onDone)onDone();
    }
  }
  gtaSpinAnim=requestAnimationFrame(frame);
}

function renderPlayers(players, total, winnerId){
  const pl=document.getElementById('gta-players');
  if(!players.length){
    pl.innerHTML='<div style="color:var(--muted);text-align:center;padding:16px;font-size:13px">Ждём ставок...</div>';
    document.getElementById('your-chance').textContent='—';
    return;
  }
  const sorted=[...players].sort((a,b)=>b.amount-a.amount);
  let yourPct = 0;
  pl.innerHTML=sorted.map(p=>{
    const pct=Math.round(p.amount/total*100);
    const barW=Math.max(4,pct);
    const you=p.uid==UID;
    const isWinner=winnerId&&p.uid==winnerId;
    const color=GTA_COLORS[players.indexOf(p)%GTA_COLORS.length];
    if(you) yourPct=pct;
    const borderStyle=isWinner?'border-color:var(--gold);background:rgba(245,197,66,.08);':you?`border-color:${hexAlpha(color,0.2)};`:'';
    return `<div class="gp-row" style="${borderStyle}">
      <div class="gp-dot" style="background:${color};box-shadow:0 0 8px ${hexAlpha(color,0.53)}"></div>
      <div class="gp-name">${p.name}${you?' <span style="color:var(--muted);font-size:11px">(вы)</span>':''}${isWinner?' 🏆':''}</div>
      <div class="gp-right">
        <div class="gp-bet">${p.amount} 🪙</div>
        <div class="gp-pct" style="color:${color}">${pct}% шанс</div>
      </div>
    </div>
    <div style="height:3px;background:var(--bg);border-radius:2px;margin:-2px 14px 6px;overflow:hidden">
      <div style="height:100%;width:${barW}%;background:${color};border-radius:2px;opacity:.6;transition:width .5s"></div>
    </div>`;
  }).join('');
  document.getElementById('your-chance').textContent = yourPct ? yourPct+'%' : '—';
}

// ── GTA POLL ──
function startGtaPoll(){
  clearTimeout(gtaPollTimer);gtaPollTimer=null;
  pollGta();
}

async function pollGta(){
  try {
    if(!gtaLobbyId){
      const d=await get('/api/gta/lobby');
      if(d&&d.lobby){gtaLobbyId=d.lobby.id;renderGta(d.lobby,d.bets);}
      else{drawGtaWheel([],1,null,0);}
    } else {
      const d=await get(`/api/gta/status/${gtaLobbyId}`);
      if(!d||d.error){gtaLobbyId=null;drawGtaWheel([],1,null,0);}
      else{
        renderGta(d.lobby,d.bets);
        if(d.lobby.status==='done')return;
      }
    }
  }catch(e){}
  gtaPollTimer=setTimeout(pollGta,2000);
}

async function placeGtaBet(){
  const amount=parseInt(document.getElementById('gta-inp').value)||0;
  if(amount<1){toast('Введите ставку!','err');return;}
  await loadUser();
  if(amount>(userData?.balance||0)){toast('Недостаточно монет!','err');return;}
  document.getElementById('gta-btn').disabled=true;
  const res=await post('/api/gta/bet',{user_id:UID,amount}).catch(()=>null);
  document.getElementById('gta-btn').disabled=false;
  if(!res||res.error){toast(res?.error||'Ошибка','err');return;}
  toast(`Ставка ${amount} монет принята!`,'ok');
  if(userData)userData.balance=res.new_balance;
  document.getElementById('r-bal').textContent=res.new_balance??0;
  gtaLobbyId=res.lobby_id;
  if(res.deadline)gtaDeadline=res.deadline*1000;
  if(gtaTimerInterval){clearInterval(gtaTimerInterval);gtaTimerInterval=null;}
  clearTimeout(gtaPollTimer);gtaPollTimer=null;
  pollGta();
}

function renderGta(lobby, bets){
  document.getElementById('gta-pot').textContent=lobby.pot||0;
  const byUser={};
  bets.forEach(b=>{
    const safeName=(b.player_name||`ID${b.user_id}`)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(!byUser[b.user_id])byUser[b.user_id]={uid:b.user_id,name:safeName,amount:0};
    byUser[b.user_id].amount+=b.amount;
  });
  const players=Object.values(byUser);
  const total=players.reduce((s,p)=>s+p.amount,0)||1;
  const prevStatus=lastLobbyStatus;
  const statusChanged=prevStatus!==lobby.status;
  lastLobbyStatus=lobby.status;
  const st=document.getElementById('gta-status');
  const tw=document.getElementById('t-wrap');

  if(lobby.status==='done'){
    if(gtaTimerInterval){clearInterval(gtaTimerInterval);gtaTimerInterval=null;}
    tw.style.display='none';
    if(statusChanged||(!gtaSpinAnim&&prevStatus==='spinning')){
      if(gtaSpinAnim){cancelAnimationFrame(gtaSpinAnim);gtaSpinAnim=null;}
      st.textContent='🎰 Определяем победителя...';
      const finalAngle=calcWinnerAngle(players,total,lobby.winner_id);
      spinAndStop(players,total,finalAngle,()=>{
        drawGtaWheel(players,total,lobby.winner_id,gtaAngleOffset);
        st.innerHTML='🏆 Победитель определён! Перезапуск через <b id="rc">5</b> сек...';
        renderPlayers(players,total,lobby.winner_id);
        loadUser();
        let cnt=5;
        const iv=setInterval(()=>{
          cnt--;
          const el=document.getElementById('rc');
          if(el)el.textContent=cnt;
          if(cnt<=0){
            clearInterval(iv);
            gtaLobbyId=null;lastLobbyStatus=null;gtaAngleOffset=0;
            clearTimeout(gtaPollTimer);gtaPollTimer=null;
            pollGta();
          }
        },1000);
      });
    }
    return;
  }

  if(lobby.status==='spinning'){
    if(gtaTimerInterval){clearInterval(gtaTimerInterval);gtaTimerInterval=null;}
    tw.style.display='none';
    st.textContent='🎰 Колесо крутится!';
    if(!gtaSpinAnim)startFreeSpinning(players,total);
    renderPlayers(players,total,null);
    return;
  }

  if(gtaSpinAnim){cancelAnimationFrame(gtaSpinAnim);gtaSpinAnim=null;gtaAngleOffset=0;}
  drawGtaWheel(players,total,null,0);
  renderPlayers(players,total,null);

  if(players.length>=2){
    tw.style.display='block';
    const deadline=(lobby.deadline&&lobby.deadline>Date.now()/1000)
      ?lobby.deadline*1000:(gtaDeadline||Date.now()+15000);
    if(statusChanged||!gtaTimerInterval){
      if(gtaTimerInterval){clearInterval(gtaTimerInterval);gtaTimerInterval=null;}
      // Capture deadline at interval start so it stays fixed
      const timerDeadline = deadline;
      const timerStart = Date.now();
      const timerTotal = Math.max(1000, timerDeadline - timerStart); // total duration ms
      gtaTimerInterval=setInterval(()=>{
        const now=Date.now();
        const rem=Math.max(0,Math.ceil((timerDeadline-now)/1000));
        // pct goes from 100 → 0 as time passes (progress = time remaining / total)
        const elapsed = now - timerStart;
        const pct = Math.max(0, Math.min(100, (1 - elapsed/timerTotal)*100));
        document.getElementById('t-bar').style.width=pct+'%';
        st.textContent=`⏳ Розыгрыш через ${rem} сек...`;
        if(rem<=0){clearInterval(gtaTimerInterval);gtaTimerInterval=null;}
      },200);
    }
  } else {
    tw.style.display='none';
    if(gtaTimerInterval){clearInterval(gtaTimerInterval);gtaTimerInterval=null;}
    st.textContent=`👥 Ждём ещё игроков (${players.length}/2)`;
  }
}

// Init
initUser();
drawGtaWheel([],1,null,0);
startGtaPoll();
</script>
<script>
// ── SOUND ENGINE (shared, reads localStorage topluck_sounds) ──
(function(){
  let _ctx=null;
  function _c(){ if(!_ctx) _ctx=new (window.AudioContext||window.webkitAudioContext)(); return _ctx; }
  function _on(){ try{return localStorage.getItem("topluck_sounds")==="1";}catch(e){return false;} }
  window.SND={
    play:function(type){
      if(!_on()) return;
      try{
        const ctx=_c(),g=ctx.createGain(),o=ctx.createOscillator();
        g.connect(ctx.destination); o.connect(g);
        const t=ctx.currentTime;
        if(type==="win"){
          o.type="sine";
          [523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.1));
          g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.001,t+.75);
          o.start(t); o.stop(t+.75);
        } else if(type==="lose"){
          o.type="sawtooth";
          o.frequency.setValueAtTime(280,t); o.frequency.exponentialRampToValueAtTime(70,t+.45);
          g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.5);
          o.start(t); o.stop(t+.5);
        } else if(type==="tick"){
          o.type="sine"; o.frequency.setValueAtTime(660,t);
          g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+.07);
          o.start(t); o.stop(t+.07);
        } else if(type==="coin"){
          o.type="sine";
          o.frequency.setValueAtTime(900,t); o.frequency.setValueAtTime(1200,t+.06);
          g.gain.setValueAtTime(.14,t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
          o.start(t); o.stop(t+.22);
        } else if(type==="step"){
          o.type="sine"; o.frequency.setValueAtTime(440+200*(Math.random()),t);
          g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.18);
          o.start(t); o.stop(t+.18);
        } else if(type==="bomb"){
          o.type="sawtooth";
          o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(20,t+.6);
          g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.7);
          // Add noise-like crackle via second oscillator
          const o2=ctx.createOscillator(),g2=ctx.createGain();
          o2.connect(g2); g2.connect(ctx.destination);
          o2.type="square"; o2.frequency.setValueAtTime(60,t);
          g2.gain.setValueAtTime(.2,t); g2.gain.exponentialRampToValueAtTime(.001,t+.5);
          o2.start(t); o2.stop(t+.5);
          o.start(t); o.stop(t+.7);
        } else if(type==="spin"){
          // Spinning wheel sound - rising frequency
          o.type="sine";
          o.frequency.setValueAtTime(200,t); o.frequency.linearRampToValueAtTime(600,t+1.5);
          g.gain.setValueAtTime(.1,t); g.gain.linearRampToValueAtTime(.05,t+1.4);
          g.gain.exponentialRampToValueAtTime(.001,t+2);
          o.start(t); o.stop(t+2);
        } else if(type==="bet"){
          o.type="sine"; o.frequency.setValueAtTime(523,t);
          g.gain.setValueAtTime(.1,t); g.gain.exponentialRampToValueAtTime(.001,t+.15);
          o.start(t); o.stop(t+.15);
        }
      }catch(e){}
    }
  };
})();

</script>
