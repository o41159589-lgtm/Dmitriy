<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GTA Рулетка — TopLuck</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>(function(){try{var d=localStorage.getItem("__tl_dev_uid__");if(!d)return;var u=parseInt(d);if(!u)return;var t=window.Telegram&&window.Telegram.WebApp;if(!t)return;if(!t.initDataUnsafe)t.initDataUnsafe={};if(!t.initDataUnsafe.user)t.initDataUnsafe.user={};t.initDataUnsafe.user.id=u;}catch(e){}})()</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{
  --bg:#05050E;--bg2:#0A091A;--bg3:#120F28;
  --white:#FFF;--gray1:#E0E0E0;--gray2:#AAA;
  --green:#00FF88;--red:#FF3B55;--gold:#FFD600;
  --purple:#9B5DFF;--purple2:#C084FC;--cyan:#00E5FF;--pink:#FF2D6B;
  --text:#F0EFFF;--muted:#52527A;--muted2:#7A7AAA;
  --card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --font-d:'Bebas Neue',sans-serif;--font-ui:'Exo 2',sans-serif;--font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse 65% 45% at 50% -5%,rgba(155,93,255,.1) 0%,transparent 55%),
             radial-gradient(ellipse 40% 30% at 0% 100%,rgba(0,229,255,.05) 0%,transparent 60%);}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;background:rgba(5,5,14,.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.08);}
.fp-back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:22px;cursor:pointer;font-weight:700;}
.fp-title{font-family:var(--font-d);font-size:20px;color:var(--white);letter-spacing:2px;}
.bal-chip{display:flex;align-items:center;gap:5px;background:rgba(255,214,0,.1);border:1px solid rgba(255,214,0,.25);border-radius:12px;padding:7px 12px;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--gold);}

/* TOAST */
.toast{position:fixed;top:80px;left:14px;right:14px;z-index:500;background:rgba(10,9,26,.97);border:1px solid var(--border2);backdrop-filter:blur(20px);border-radius:16px;padding:13px 18px;font-size:14px;font-weight:700;text-align:center;transform:translateY(-120px);opacity:0;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{color:var(--green);border-color:rgba(0,255,136,.3);}
.toast.err{color:var(--red);border-color:rgba(255,59,85,.3);}
.toast.info{color:var(--cyan);border-color:rgba(0,229,255,.3);}

/* HERO */
.gta-hero{
  background:linear-gradient(180deg,#08061A 0%,#100D28 60%,#08061A 100%);
  margin:14px;border-radius:24px;
  border:1px solid rgba(155,93,255,.18);
  padding:16px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  position:relative;overflow:hidden;
  box-shadow:0 0 40px rgba(155,93,255,.07),inset 0 0 60px rgba(0,0,0,.3);
}
.gta-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 50% 10%,rgba(155,93,255,.07) 0%,transparent 65%);}
/* Animated corner accents */
.gta-hero::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(155,93,255,.6),rgba(0,229,255,.4),transparent);}

/* POT DISPLAY */
.pot-display{
  display:flex;align-items:center;gap:10px;width:100%;
  background:rgba(155,93,255,.08);border:1px solid rgba(155,93,255,.2);
  border-radius:16px;padding:12px 16px;
}
.pot-ico{font-size:24px;}
.pot-info{flex:1;}
.pot-lbl{font-family:var(--font-mono);font-size:9px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;}
.pot-val{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--gold);}
.gta-status-badge{
  background:rgba(155,93,255,.15);border:1px solid rgba(155,93,255,.3);
  border-radius:10px;padding:5px 12px;
  font-family:var(--font-mono);font-size:11px;color:var(--purple2);
  letter-spacing:.5px;
}

/* WINNER SPOTLIGHT */
.winner-spot{
  width:100%;background:rgba(0,0,0,.3);
  border:1px solid rgba(155,93,255,.15);
  border-radius:14px;padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
}
.ws-left{display:flex;align-items:center;gap:10px;}
.ws-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:background .15s;}
.ws-text{}
.ws-lbl{font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;}
.ws-name{font-size:15px;font-weight:700;color:var(--text);transition:color .15s;}
.ws-pct{font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--purple2);}

/* WHEEL */
.wheel-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.wheel-outer-ring{
  position:absolute;border-radius:50%;
  animation:ring-pulse 2.5s ease-in-out infinite;
}
@keyframes ring-pulse{0%,100%{opacity:.4}50%{opacity:.8}}
#gta-canvas{display:block;border-radius:50%;}

/* TIMER */
.timer-wrap{width:100%;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;}
.timer-bar{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:2px;transition:width .5s linear;box-shadow:0 0 8px rgba(155,93,255,.5);}

/* PLAYERS */
.page-wrap{padding:0 14px 40px;}
.bets-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:12px;}
.bets-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.bets-title{font-family:var(--font-mono);font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;}
.player-count{background:rgba(155,93,255,.1);border:1px solid rgba(155,93,255,.2);border-radius:8px;padding:4px 10px;font-family:var(--font-mono);font-size:12px;color:var(--purple2);}

.gp{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.gp:last-child{border-bottom:none;}
.gp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.gp-name{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gp-right{text-align:right;flex-shrink:0;}
.gp-bet{font-family:var(--font-mono);font-size:13px;color:var(--gold);font-weight:700;}
.gp-pct{font-size:10px;color:var(--muted2);font-family:var(--font-mono);margin-top:1px;}
.gp-bar-row{width:100%;height:2px;background:rgba(255,255,255,.05);border-radius:1px;margin-top:4px;}
.gp-bar{height:100%;border-radius:1px;transition:width .5s ease;opacity:.65;}

.your-badge{
  display:inline-flex;align-items:center;gap:5px;margin-top:10px;
  background:rgba(155,93,255,.08);border:1px solid rgba(155,93,255,.18);
  border-radius:10px;padding:5px 12px;
  font-family:var(--font-mono);font-size:11px;color:rgba(192,132,252,.85);
}

/* BET CARD */
.bet-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:12px;}
.section-tag{font-family:var(--font-mono);font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.bet-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.bet-lbl{color:var(--muted2);font-size:12px;white-space:nowrap;font-weight:600;font-family:var(--font-mono);}
.bet-inp{flex:1;background:rgba(0,0,0,.5);border:1px solid var(--border2);border-radius:12px;padding:10px 12px;color:var(--white);font-family:var(--font-mono);font-size:18px;outline:none;text-align:center;width:0;}
.bet-inp:focus{border-color:rgba(155,93,255,.5);}
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.qb{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:9px;padding:7px 12px;color:var(--gray2);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-mono);transition:all .12s;}
.qb:active{background:rgba(155,93,255,.2);border-color:rgba(155,93,255,.4);color:var(--white);}
.bet-btn{
  width:100%;padding:17px;
  background:linear-gradient(135deg,#9B5DFF,#7B3DDF);
  border:none;border-radius:16px;color:#fff;
  font-family:var(--font-d);font-size:22px;letter-spacing:2px;cursor:pointer;
  box-shadow:0 4px 24px rgba(155,93,255,.35),inset 0 1px 0 rgba(255,255,255,.2);
  transition:opacity .15s,transform .1s;
}
.bet-btn:active{transform:scale(.98);}
.bet-btn:disabled{opacity:.35;cursor:not-allowed;}

/* RULES */
.rules-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:12px;}
.rules-head{padding:12px 16px;font-family:var(--font-mono);font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06);}
.rule-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.04);}
.rule-row:last-child{border-bottom:none;}
.rule-l{font-size:13px;color:var(--muted2);}
.rule-r{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--text);}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="toast" id="toast"></div>

<div class="topbar">
  <button class="fp-back" onclick="location.href='main.html?tab=games'">‹</button>
  <div class="fp-title">🏎 GTA РУЛЕТКА</div>
  <div class="bal-chip">🪙 <span id="r-bal">—</span></div>
</div>

<!-- HERO -->
<div class="gta-hero">

  <!-- Pot + status row -->
  <div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;">
    <div class="pot-display" style="flex:1">
      <div class="pot-ico">💰</div>
      <div class="pot-info">
        <div class="pot-lbl">банк</div>
        <div class="pot-val"><span id="gta-pot">0</span> 🪙</div>
      </div>
    </div>
    <div class="gta-status-badge" id="gta-status">Ждём...</div>
  </div>

  <!-- Winner spotlight -->
  <div class="winner-spot" id="winner-spot">
    <div class="ws-left">
      <div class="ws-dot" id="ws-dot" style="background:var(--purple);box-shadow:0 0 8px var(--purple)"></div>
      <div class="ws-text">
        <div class="ws-lbl">Стрелка на</div>
        <div class="ws-name" id="ws-name">Ожидаем ставок...</div>
      </div>
    </div>
    <div class="ws-pct" id="ws-pct">—</div>
  </div>

  <!-- Wheel -->
  <div class="wheel-wrap" id="wheel-wrap">
    <canvas id="gta-canvas" width="230" height="230"></canvas>
  </div>

  <!-- Timer -->
  <div class="timer-wrap" id="t-wrap" style="display:none;width:100%">
    <div class="timer-bar" id="t-bar" style="width:100%"></div>
  </div>

</div>

<div class="page-wrap">

  <!-- Players -->
  <div class="bets-card">
    <div class="bets-header">
      <span class="bets-title">🎲 Ставки</span>
      <div class="player-count" id="player-count">0 игроков</div>
    </div>
    <div id="gta-players">
      <div style="color:var(--muted);text-align:center;padding:16px;font-size:13px">Ждём ставок...</div>
    </div>
    <div class="your-badge">Твой шанс: <span id="your-chance" style="color:var(--purple2);font-weight:700;margin-left:4px">—</span></div>
  </div>

  <!-- Bet -->
  <div class="bet-card">
    <div class="section-tag">// ваша ставка</div>
    <div class="bet-row">
      <span class="bet-lbl">🪙</span>
      <input class="bet-inp" id="gta-inp" type="number" min="1" value="10" inputmode="numeric">
    </div>
    <div class="qb-row">
      <div class="qb" onclick="sgb(10)">10</div>
      <div class="qb" onclick="sgb(50)">50</div>
      <div class="qb" onclick="sgb(100)">100</div>
      <div class="qb" onclick="sgb(250)">250</div>
      <div class="qb" onclick="sgb(500)">500</div>
      <div class="qb" onclick="sgbAll()">MAX</div>
    </div>
    <button class="bet-btn" id="gta-btn" onclick="placeGtaBet()">🎲 ПОСТАВИТЬ</button>
  </div>

  <!-- Rules -->
  <div class="rules-card">
    <div class="rules-head">📋 Правила</div>
    <div class="rule-row"><span class="rule-l">Минимум игроков</span><span class="rule-r">2</span></div>
    <div class="rule-row"><span class="rule-l">Комиссия</span><span class="rule-r">3–8%</span></div>
    <div class="rule-row"><span class="rule-l">Обратный отсчёт</span><span class="rule-r">15 сек</span></div>
    <div class="rule-row"><span class="rule-l">Ваш шанс</span><span class="rule-r">Пропорционален ставке</span></div>
  </div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
if(tg?.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>location.href='main.html?tab=games');}
const UID=tg?.initDataUnsafe?.user?.id||0;

const GTA_COLORS=['#FF2D55','#00FF94','#00C8FF','#FFD700','#BF5FFF','#FF6B00','#00FFD1','#FF3CAC','#AAFF00','#FF8C00'];
function hexAlpha(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

let userData=null,gtaLobbyId=null,gtaPollTimer=null,gtaTimerInterval=null,gtaDeadline=0;
let gtaSpinAnim=null,gtaAngleOffset=0,lastLobbyStatus=null;

function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className='toast '+t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800);}
async function get(url){const r=await fetch(url);return r.json();}
async function post(url,d){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return r.json();}

async function loadUser(){if(!UID)return;userData=await get(`/api/user/${UID}`).catch(()=>null);if(userData)document.getElementById('r-bal').textContent=userData.balance??0;}
async function initUser(){
  if(!UID)return;
  const _dev=!!localStorage.getItem('__tl_dev_uid__');
  try{
    if(_dev){userData=await get(`/api/user/${UID}`).catch(()=>null);}
    else{const tgO=window.Telegram?.WebApp;userData=await post('/api/ensure_user',{user_id:UID,username:tgO?.initDataUnsafe?.user?.username||'',first_name:tgO?.initDataUnsafe?.user?.first_name||''});}
  }catch(e){userData=await get(`/api/user/${UID}`).catch(()=>null);}
  if(userData)document.getElementById('r-bal').textContent=userData.balance??0;
}

function sgb(v){document.getElementById('gta-inp').value=v;}
function sgbAll(){document.getElementById('gta-inp').value=userData?.balance||0;}

// ── WHEEL DRAW ──
function drawPointer(ctx,cx,cy,r){
  const tipY=cy-r+1,baseY=tipY-20,hw=11;
  ctx.save();
  ctx.shadowColor='rgba(255,255,255,.9)';ctx.shadowBlur=18;
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.moveTo(cx,tipY);ctx.lineTo(cx-hw,baseY);ctx.lineTo(cx+hw,baseY);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
}

function drawGtaWheel(players,total,winnerId,off){
  const canvas=document.getElementById('gta-canvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,r=W/2-8;
  ctx.clearRect(0,0,W,H);

  // Dark bg with glow
  ctx.save();ctx.shadowColor='rgba(155,93,255,.5)';ctx.shadowBlur=35;
  ctx.fillStyle='#07051A';ctx.beginPath();ctx.arc(cx,cy,r+6,0,Math.PI*2);ctx.fill();ctx.restore();

  if(!players.length){
    // Empty decorative wheel
    const emptyC=['#9B5DFF33','#00E5FF33','#FF2D6B33','#FFD60033','#00FF8833','#FF6B0033'];
    ctx.fillStyle='#0D0B20';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    for(let i=0;i<6;i++){
      const sa=i*(Math.PI*2/6)-Math.PI/2,ea=sa+Math.PI*2/6;
      ctx.save();ctx.fillStyle=emptyC[i];
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    // Inner ring
    ctx.strokeStyle='rgba(155,93,255,.25)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,r*.55,0,Math.PI*2);ctx.stroke();
    // Waiting text
    ctx.fillStyle='rgba(155,93,255,.5)';ctx.font='bold 12px Exo 2,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Нет ставок',cx,cy);
    drawPointer(ctx,cx,cy,r);return;
  }

  let a=-Math.PI/2+(off||0);
  players.forEach((p,i)=>{
    const sl=p.amount/total*Math.PI*2;
    const isW=winnerId&&String(p.uid)===String(winnerId);
    const color=GTA_COLORS[i%GTA_COLORS.length];

    // Sector fill with gradient
    const grad=ctx.createRadialGradient(cx,cy,r*.08,cx,cy,r);
    grad.addColorStop(0,hexAlpha(color,.9));grad.addColorStop(1,hexAlpha(color,.55));
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+sl);ctx.closePath();ctx.fill();

    // Divider line
    ctx.save();ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke();ctx.restore();

    // Outer arc glow
    ctx.save();ctx.strokeStyle=color;ctx.lineWidth=3;ctx.shadowColor=color;ctx.shadowBlur=10;ctx.globalAlpha=.65;
    ctx.beginPath();ctx.arc(cx,cy,r-1,a,a+sl);ctx.stroke();ctx.restore();

    // Winner highlight
    if(isW){
      ctx.save();ctx.globalAlpha=.25;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+sl);ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.shadowColor='rgba(255,255,255,.9)';ctx.shadowBlur=22;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r-2,a,a+sl);ctx.closePath();ctx.stroke();
      ctx.restore();
    }

    // Pct label
    if(sl>0.2){
      const ma=a+sl/2;
      ctx.save();ctx.fillStyle='#fff';ctx.font='bold 11px JetBrains Mono,monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=5;
      ctx.fillText(Math.round(p.amount/total*100)+'%',cx+Math.cos(ma)*(r*.62),cy+Math.sin(ma)*(r*.62));
      ctx.restore();
    }
    a+=sl;
  });

  // Inner glow overlay
  const shine=ctx.createRadialGradient(cx-r*.2,cy-r*.2,r*.04,cx,cy,r);
  shine.addColorStop(0,'rgba(255,255,255,.12)');shine.addColorStop(.4,'rgba(255,255,255,.02)');shine.addColorStop(1,'rgba(0,0,0,.2)');
  ctx.fillStyle=shine;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();

  // Gold outer ring
  ctx.save();ctx.strokeStyle='rgba(255,214,0,.5)';ctx.lineWidth=2.5;ctx.shadowColor='rgba(255,214,0,.35)';ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.restore();

  // Hub
  const cR=r*.17;
  const hubG=ctx.createRadialGradient(cx-cR*.35,cy-cR*.35,cR*.08,cx,cy,cR);
  hubG.addColorStop(0,'#6B4FDD');hubG.addColorStop(.6,'#221650');hubG.addColorStop(1,'#0A0720');
  ctx.fillStyle=hubG;ctx.beginPath();ctx.arc(cx,cy,cR,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(155,93,255,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,cR,0,Math.PI*2);ctx.stroke();
  ctx.font=`${Math.round(cR*1.2)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🎰',cx,cy+1);

  drawPointer(ctx,cx,cy,r);
}

function calcWinnerAngle(players,total,winnerId){
  let a=0;
  for(const p of players){
    const sl=p.amount/total*Math.PI*2;
    if(String(p.uid)===String(winnerId)){
      const seed=(parseInt(String(winnerId).slice(-4))||1234)%1000;
      const frac=(seed/1000)*.7+.15;
      return((-( a+sl*frac))%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    }
    a+=sl;
  }
  return 0;
}

function startFreeSpinning(players,total){
  if(gtaSpinAnim){cancelAnimationFrame(gtaSpinAnim);gtaSpinAnim=null;}
  const SPEED=0.5;
  function frame(){gtaAngleOffset=(gtaAngleOffset+SPEED)%(Math.PI*2);drawGtaWheel(players,total,null,gtaAngleOffset);gtaSpinAnim=requestAnimationFrame(frame);}
  gtaSpinAnim=requestAnimationFrame(frame);
}

function spinAndStop(players,total,finalAngle,onDone){
  if(gtaSpinAnim){cancelAnimationFrame(gtaSpinAnim);gtaSpinAnim=null;}
  const START=gtaAngleOffset;
  const EXTRA=12*Math.PI*2;
  const delta=((finalAngle-START)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  const safeDelta=delta<.3?delta+Math.PI*2:delta;
  const TARGET=START+EXTRA+safeDelta;
  const DURATION=6200;const t0=performance.now();
  function ease(t){return 1-Math.pow(1-t,5);}
  function frame(now){
    const t=Math.min((now-t0)/DURATION,1);
    gtaAngleOffset=START+(TARGET-START)*ease(t);
    if(t<1){drawGtaWheel(players,total,null,gtaAngleOffset);updateWinnerSpot(players,total,gtaAngleOffset);gtaSpinAnim=requestAnimationFrame(frame);}
    else{gtaAngleOffset=TARGET%(Math.PI*2);drawGtaWheel(players,total,null,gtaAngleOffset);gtaSpinAnim=null;if(onDone)onDone();}
  }
  gtaSpinAnim=requestAnimationFrame(frame);
}

function updateWinnerSpot(players,total,angleOffset){
  const nameEl=document.getElementById('ws-name'),pctEl=document.getElementById('ws-pct'),dotEl=document.getElementById('ws-dot');
  if(!players||!players.length){if(nameEl)nameEl.textContent='Ожидаем ставок...';if(pctEl)pctEl.textContent='—';return;}
  const ao=(typeof angleOffset!=='undefined')?angleOffset:gtaAngleOffset;
  const ptrInWheel=((-Math.PI/2-ao)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  let a=0,found=null;
  for(const p of players){const sl=p.amount/total*Math.PI*2;if(ptrInWheel>=a&&ptrInWheel<a+sl){found=p;break;}a+=sl;}
  if(!found)found=players[players.length-1];
  const pct=Math.round(found.amount/total*100);
  if(nameEl)nameEl.textContent=found.name||'Игрок';
  if(pctEl)pctEl.textContent=pct+'%';
  if(dotEl){dotEl.style.background=found.color||'var(--purple)';dotEl.style.boxShadow='0 0 10px '+(found.color||'var(--purple)');}
}

function renderPlayers(players,total,winnerId){
  updateWinnerSpot(players,total,gtaAngleOffset);
  const pl=document.getElementById('gta-players');
  document.getElementById('player-count').textContent=players.length+' игрок'+(players.length===1?'':'ов');
  if(!players.length){
    pl.innerHTML='<div style="color:var(--muted);text-align:center;padding:16px;font-size:13px">Ждём ставок...</div>';
    document.getElementById('your-chance').textContent='—';return;
  }
  const sorted=[...players].sort((a,b)=>b.amount-a.amount);
  let yourPct=0;
  pl.innerHTML=sorted.map(p=>{
    const pct=Math.round(p.amount/total*100);
    const barW=Math.max(3,pct);
    const you=p.uid==UID,isWinner=winnerId&&p.uid==winnerId;
    const color=GTA_COLORS[players.indexOf(p)%GTA_COLORS.length];
    if(you)yourPct=pct;
    return `<div class="gp">
      <div class="gp-dot" style="background:${color};box-shadow:0 0 8px ${hexAlpha(color,.5)}"></div>
      <div>
        <div class="gp-name">${p.name||'Игрок'}${you?' <span style="color:var(--muted);font-size:11px">(вы)</span>':''}${isWinner?' 🏆':''}</div>
        <div class="gp-bar-row"><div class="gp-bar" style="width:${barW}%;background:${color}"></div></div>
      </div>
      <div class="gp-right">
        <div class="gp-bet">${p.amount} 🪙</div>
        <div class="gp-pct" style="color:${color}">${pct}%</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('your-chance').textContent=yourPct?yourPct+'%':'—';
}

function startGtaPoll(){clearTimeout(gtaPollTimer);gtaPollTimer=null;pollGta();}
async function pollGta(){
  try{
    if(!gtaLobbyId){const d=await get('/api/gta/lobby');if(d?.lobby){gtaLobbyId=d.lobby.id;renderGta(d.lobby,d.bets);}else drawGtaWheel([],1,null,0);}
    else{const d=await get(`/api/gta/status/${gtaLobbyId}`);if(!d||d.error){gtaLobbyId=null;drawGtaWheel([],1,null,0);}else{renderGta(d.lobby,d.bets);if(d.lobby.status==='done')return;}}
  }catch(e){}
  gtaPollTimer=setTimeout(pollGta,2000);
}

async function placeGtaBet(){
  const amount=parseInt(document.getElementById('gta-inp').value)||0;
  if(amount<1){toast('Введите ставку!','err');return;}
  await loadUser();
  if(amount>(userData?.balance||0)){toast('Недостаточно монет!','err');return;}
  document.getElementById('gta-btn').disabled=true;
  const res=await post('/api/gta/bet',{user_id:UID,amount}).catch(()=>null);
  document.getElementById('gta-btn').disabled=false;
  if(!res||res.error){toast(res?.error||'Ошибка','err');return;}
  toast(`Ставка ${amount} 🪙 принята!`,'ok');
  if(userData)userData.balance=res.new_balance;
  document.getElementById('r-bal').textContent=res.new_balance??0;
  gtaLobbyId=res.lobby_id;
  if(res.deadline)gtaDeadline=res.deadline*1000;
  clearTimeout(gtaPollTimer);gtaPollTimer=null;
  pollGta();
}

function renderGta(lobby,bets){
  document.getElementById('gta-pot').textContent=lobby.pot||0;
  const byUser={};
  bets.forEach(b=>{
    const safe=(b.player_name||`ID${b.user_id}`).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(!byUser[b.user_id])byUser[b.user_id]={uid:b.user_id,name:safe,amount:0};
    byUser[b.user_id].amount+=b.amount;
  });
  const players=Object.values(byUser);
  const total=players.reduce((s,p)=>s+p.amount,0)||1;
  const prevStatus=lastLobbyStatus,statusChanged=prevStatus!==lobby.status;
  lastLobbyStatus=lobby.status;
  const st=document.getElementById('gta-status'),tw=document.getElementById('t-wrap');

  if(lobby.status==='done'){
    if(gtaTimerInterval){clearInterval(gtaTimerInterval);gtaTimerInterval=null;}
    tw.style.display='none';
    if(statusChanged||(!gtaSpinAnim&&prevStatus==='spinning')){
      if(gtaSpinAnim){cancelAnimationFrame(gtaSpinAnim);gtaSpinAnim=null;}
      st.textContent='🎰 Определяем...';
      const finalAngle=calcWinnerAngle(players,total,lobby.winner_id);
      spinAndStop(players,total,finalAngle,()=>{
        drawGtaWheel(players,total,lobby.winner_id,gtaAngleOffset);
        st.textContent='🏆 Победитель!';
        renderPlayers(players,total,lobby.winner_id);
        loadUser();
        let cnt=5;
        const el=setInterval(()=>{
          cnt--;st.textContent=`🔄 Перезапуск через ${cnt}с`;
          if(cnt<=0){clearInterval(el);gtaLobbyId=null;lastLobbyStatus=null;gtaAngleOffset=0;clearTimeout(gtaPollTimer);gtaPollTimer=null;pollGta();}
        },1000);
      });
    }
    return;
  }
  if(lobby.status==='spinning'){
    if(gtaTimerInterval){clearInterval(gtaTimerInterval);gtaTimerInterval=null;}
    tw.style.display='none';st.textContent='🎰 Крутится!';
    if(!gtaSpinAnim)startFreeSpinning(players,total);
    renderPlayers(players,total,null);return;
  }
  if(gtaSpinAnim){cancelAnimationFrame(gtaSpinAnim);gtaSpinAnim=null;gtaAngleOffset=0;}
  drawGtaWheel(players,total,null,0);
  renderPlayers(players,total,null);
  if(players.length>=2){
    tw.style.display='block';
    const deadline=(lobby.deadline&&lobby.deadline>Date.now()/1000)?lobby.deadline*1000:(gtaDeadline||Date.now()+15000);
    if(statusChanged||!gtaTimerInterval){
      if(gtaTimerInterval){clearInterval(gtaTimerInterval);gtaTimerInterval=null;}
      const timerDeadline=deadline,timerStart=Date.now(),timerTotal=Math.max(1000,timerDeadline-timerStart);
      gtaTimerInterval=setInterval(()=>{
        const now=Date.now(),rem=Math.max(0,Math.ceil((timerDeadline-now)/1000));
        const pct=Math.max(0,Math.min(100,(1-(now-timerStart)/timerTotal)*100));
        document.getElementById('t-bar').style.width=pct+'%';
        st.textContent=`⏳ ${rem} сек`;
        if(rem<=0){clearInterval(gtaTimerInterval);gtaTimerInterval=null;}
      },200);
    }
  }else{
    tw.style.display='none';
    if(gtaTimerInterval){clearInterval(gtaTimerInterval);gtaTimerInterval=null;}
    st.textContent=`👥 ${players.length}/2 игроков`;
  }
}

initUser();
drawGtaWheel([],1,null,0);
startGtaPoll();
</script>
